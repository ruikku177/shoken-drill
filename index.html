{c:1,s:"経済・金融・財政の常識",n:1,d:"-",b:1,o:["先行系列", "一致系列"],a:[2],q:"内閣府が毎月公表している景気動向指数において、有効求人倍率は( 先行系列 ・ 一致系列 )の1つである。",e:"補足: 有効求人倍率は一致系列。先行系列は新規求人数（有効求人倍率と紛らわしい）、遅行系列は完全失業率。「新規＝先行、有効＝一致」で区別する。本編12章に同じ論点の○×問題あり。"},
{c:1,s:"経済・金融・財政の常識",n:2,d:"-",b:1,o:["毎月", "3ヵ月に1度"],a:[2],q:"「企業短期経済観測調査(日銀短観)」は、日本銀行が( 毎月 ・ 3ヵ月に1度 )公表している。",e:"補足: 日銀短観は四半期ごと（3ヵ月に1度）。「毎月」に変えるのが定番のひっかけ。"},
{c:1,s:"経済・金融・財政の常識",n:3,d:"-",b:1,o:["家計貯蓄を可処分所得", "可処分所得を家計貯蓄"],a:[1],q:"「家計貯蓄率」は、( 家計貯蓄を可処分所得 ・ 可処分所得を家計貯蓄 )で除して求められる。",e:"補足: 家計貯蓄率＝家計貯蓄 ÷ 可処分所得。「〜率」は割合なので、分子が小さいほう（貯蓄）と覚える。分母分子を逆にするひっかけが頻出。"},
{c:1,s:"経済・金融・財政の常識",n:4,d:"-",b:1,o:["労働力人口を完全失業者数", "完全失業者数を労働力人口"],a:[2],q:"完全失業率は、( 労働力人口を完全失業者数 ・ 完全失業者数を労働力人口 )で除して求められる。",e:"補足: 完全失業率＝完全失業者数 ÷ 労働力人口。問3と同じく分母分子の入れ替えがひっかけ。なお労働力人口比率は「15歳以上人口に占める労働力人口」の割合で、こちらも分母分子を逆にして出される。"},
{c:1,s:"経済・金融・財政の常識",n:5,d:"-",b:1,o:["仕事が見つからない人", "求人が見つからない企業"],a:[1],q:"有効求人倍率が1を下回るということは、( 仕事が見つからない人 ・ 求人が見つからない企業 )が多いということを意味する。",e:"補足: 有効求人倍率＝求人数÷求職者数。1を下回る＝求人より求職者が多い＝仕事が見つからない人が多い（不況）。1を上回れば人手不足。"},
{c:1,s:"経済・金融・財政の常識",n:6,d:"-",b:1,o:["内閣府", "日本銀行"],a:[2],q:"国内企業物価指数[CGPI]は( 内閣府 ・ 日本銀行 )から発表される。",e:"補足: 企業物価指数（CGPI）＝日本銀行。問7の消費者物価指数（総務省）とセットで、発表元の入れ替えがひっかけ。景気動向指数は内閣府。"},
{c:1,s:"経済・金融・財政の常識",n:7,d:"-",b:1,o:["総務省", "内閣府"],a:[1],q:"消費者物価指数[CPI]は( 総務省 ・ 内閣府 )から発表される。",e:"補足: 消費者物価指数（CPI）＝総務省。問6と対で「企業＝日銀、消費者＝総務省」と覚える。"},
{c:1,s:"経済・金融・財政の常識",n:8,d:"-",b:1,o:["経常収支", "金融収支"],a:[1],q:"国際収支統計において、( 経常収支 ・ 金融収支 )は、貿易・サービス収支、第一次所得収支及び第二次所得収支を合計して求められる。",e:"補足: 経常収支＝貿易・サービス収支＋第一次所得収支＋第二次所得収支。金融収支は直接投資・証券投資などの資産負債の増減を表す別物。本編12章にも同じ合計式の○×問題がある。"},
{c:1,s:"経済・金融・財政の常識",n:9,d:"-",b:1,o:["国や金融機関", "民間非金融部門"],a:[2],q:"マネーストックとは、国内の( 国や金融機関 ・ 民間非金融部門 )が保有する通貨量のことである。",e:"補足: マネーストックは民間非金融部門（一般法人・個人・地方公共団体等）が保有する通貨量。国や金融機関が保有する分は含まないという除外が最大のポイント。"},
{c:1,s:"経済・金融・財政の常識",n:10,d:"-",b:1,o:["上昇", "下落"],a:[2],q:"インフレが起こると、一般的に通貨の価値は( 上昇 ・ 下落 )する。",e:"補足: インフレ＝物の値段が上がる＝同じ金額で買えるものが減る＝通貨の価値は下落。デフレはその逆。"},
{c:1,s:"経済・金融・財政の常識",n:11,d:"-",b:1,o:["3%", "7%"],a:[1],q:"物価上昇率が2%の状況で年5%の金利で資金を借り入れた場合、実質金利は年( 3% ・ 7% )となる。",e:"補足: 実質金利＝名目金利－物価上昇率＝5%－2%＝3%。足して7%にするのがひっかけ。"},
{c:1,s:"経済・金融・財政の常識",n:12,d:"-",b:1,o:["名目GDP", "実質GDP"],a:[1],q:"マーシャルのkとは、貨幣の量であるマネーストックを( 名目GDP ・ 実質GDP )で除したものである。",e:"補足: マーシャルのk＝マネーストック ÷ 名目GDP。実質GDPに変えるのがひっかけ。経済規模に対して通貨がどれだけ出回っているかの指標。"},
{c:1,s:"経済・金融・財政の常識",n:13,d:"-",b:1,o:["短資会社", "証券金融会社"],a:[1],q:"( 短資会社 ・ 証券金融会社 )は、短期金融市場における金融機関相互の資金取引の仲介業務を行っている。",e:"補足: 短期金融市場（コール市場）の仲介＝短資会社。証券金融会社は信用取引の決済に必要な資金・証券を証券会社に貸し付ける会社で、まったく別物（本編13章・9章参照）。"},
{c:1,s:"経済・金融・財政の常識",n:14,d:"-",b:1,o:["都市銀行", "信託銀行"],a:[2],q:"コール市場における資金の最大の貸し手は( 都市銀行 ・ 信託銀行 )であり、取引量が多いのは翌日物である。",e:"補足: コール市場の最大の貸し手は信託銀行、最大の借り手が都市銀行。貸し手と借り手を入れ替えるのがひっかけ。"},
{c:1,s:"経済・金融・財政の常識",n:15,d:"-",b:1,o:["インターバンク市場", "オープン市場"],a:[1],q:"短期金融市場のうち、( インターバンク市場 ・ オープン市場 )は、金融機関相互の資金運用や資金調達の場として利用されており、非金融機関は参加できない市場である。",e:"補足: インターバンク市場＝金融機関だけが参加（コール市場・手形市場）。オープン市場＝一般事業法人も参加できる（CD・CP・国庫短期証券など）。参加者の範囲で区別する。"},
{c:1,s:"経済・金融・財政の常識",n:16,d:"-",b:1,o:["売りオペ", "買いオペ"],a:[2],q:"日本銀行がオープン市場で行う公開市場操作で( 売りオペ ・ 買いオペ )が行われると、民間金融機関の資金量が増加し、金利は低下する。",e:"補足: 買いオペ＝日銀が債券等を買う＝市場にお金が出ていく＝資金量増加・金利低下（金融緩和）。売りオペはその逆。「日銀が買う→お金が出る」と向きで覚える。"},
{c:1,s:"経済・金融・財政の常識",n:17,d:"-",b:1,o:["30日", "60日"],a:[1],q:"参議院が衆議院の可決した予算案を受け取ってから( 30日 ・ 60日 )以内に議決しない場合、予算は自然成立する。",e:"補足: 予算は30日で自然成立（衆議院の優越）。法律案の60日と混同させるのがひっかけ。"},
{c:1,s:"経済・金融・財政の常識",n:18,d:"-",b:1,o:["補正予算", "暫定予算"],a:[2],q:"予算成立までの期間の必要経費だけを計上した予算を( 補正予算 ・ 暫定予算 )という。",e:"補足: 暫定予算＝本予算が成立するまでのつなぎ。補正予算＝本予算成立後に内容を変更するもの。「つなぎ＝暫定、後から修正＝補正」。"},
{c:1,s:"経済・金融・財政の常識",n:19,d:"-",b:1,o:["公共事業関係費", "社会保障関係費"],a:[2],q:"基礎的財政収支対象経費で最も金額の大きな経費は、( 公共事業関係費 ・ 社会保障関係費 )である。",e:"補足: 最大は社会保障関係費。順に ①社会保障関係費 ②地方交付税交付金等 ③防衛関係費 ④公共事業関係費 ⑤文教及び科学振興費。本編12章の五肢選択（歳出の大小比較）と同じ論点。"},
{c:1,s:"経済・金融・財政の常識",n:20,d:"-",b:1,o:["公共事業", "公共事業以外"],a:[2],q:"赤字国債は、( 公共事業 ・ 公共事業以外 )の経常経費の財源確保のために発行する。",e:"補足: 赤字国債（特例国債）＝公共事業以外の経常経費のための国債で、特例法が必要。公共事業のためのものは建設国債（財政法4条）。本編9章問10・11と同じ論点。"},
{c:2,s:"会社法",n:1,d:"-",b:1,o:["合名会社", "合同会社"],a:[2],q:"会社法で定める会社の形態のうち、( 合名会社 ・ 合同会社 )の社員は、すべて有限責任社員である。",e:"補足: 合同会社は全員が有限責任社員。合名会社は全員が無限責任社員、合資会社は無限責任社員と有限責任社員の混合。「合名＝無限、合同＝有限」で区別する。"},
{c:2,s:"会社法",n:2,d:"-",b:1,o:["3億円", "5億円"],a:[2],q:"会社法で定める大会社は、資本金の額が( 3億円 ・ 5億円 )以上、又は負債総額が200億円以上の会社である。",e:"補足: 大会社＝資本金5億円以上、または負債総額200億円以上。数字を3億円に変えるのがひっかけ。「または」であって両方を満たす必要はない点も出る。"},
{c:2,s:"会社法",n:3,d:"-",b:1,o:["発起設立", "募集設立"],a:[1],q:"発行する株式の全部を発起人だけで引き受けて、株式会社を設立することを( 発起設立 ・ 募集設立 )という。",e:"補足: 発起設立＝発起人だけで全株引受け。募集設立＝発起人以外からも株主を募集する。定義の入れ替えがひっかけ。"},
{c:2,s:"会社法",n:4,d:"-",b:1,o:["1年", "2年"],a:[2],q:"株式会社の設立の無効は、当該株式会社の株主又は取締役が、その設立登記の日から( 1年 ・ 2年 )以内に裁判所へ訴えることによって主張することができる。",e:"補足: 設立無効の訴えは設立登記の日から2年以内。1年に変えるのがひっかけ。"},
{c:2,s:"会社法",n:5,d:"-",b:1,o:["優先株", "劣後株"],a:[1],q:"種類株式発行会社において、ある種類の株式にまず一定率の配当を支払い、残った剰余金から他の株式に配当するような場合、前者の種類株式を( 優先株 ・ 劣後株 )という。",e:"補足: 先に配当を受けるのが優先株、後回しなのが劣後株（後配株）。標準的な普通株を挟んで上下の関係になる。"},
{c:2,s:"会社法",n:6,d:"-",b:1,o:["自益権", "共益権"],a:[2],q:"株主総会で株主が行使できる議決権は、株主の権利のうち( 自益権 ・ 共益権 )に属する。",e:"補足: 共益権＝会社の経営に参加する権利（議決権・代表訴訟提起権など）。自益権＝会社から経済的利益を受ける権利（剰余金配当請求権・残余財産分配請求権など）。「自分の財布に入る＝自益権」で区別する。"},
{c:2,s:"会社法",n:7,d:"-",b:1,o:["単独株主権", "少数株主権"],a:[2],q:"一定割合以上の議決権を持った株主だけが行使できる権利を( 単独株主権 ・ 少数株主権 )という。",e:"補足: 少数株主権＝一定割合以上の持株が必要な権利（帳簿閲覧権など）。単独株主権＝1株でも行使できる権利（議決権・代表訴訟提起権など）。名前と要件が逆に感じるので注意。"},
{c:2,s:"会社法",n:8,d:"-",b:1,o:["3%", "5%"],a:[2],q:"金融会社が、ある会社の株式の( 3% ・ 5% )超を持つことは、独占禁止法で原則として禁止されている。",e:"補足: 独占禁止法により、金融会社の株式保有は原則5%超が禁止（保険会社は10%）。金商法の大量保有報告書（5%超で報告義務、本編6章）と数字は同じだが、こちらは「禁止」であって報告義務ではない点に注意。"},
{c:2,s:"会社法",n:9,d:"-",b:1,o:["1%", "3%"],a:[1],q:"取締役会のある公開会社の場合、株主総会への議案提出は、議決権総数の( 1% ・ 3% )以上又は300個以上の議決権を引き続き6ヵ月以上持っている株主が行うことができる。",e:"補足: 株主提案権＝議決権の1%以上または300個以上を6ヵ月以上継続保有。3%は帳簿閲覧権などの別の少数株主権の要件なので、混同させるひっかけ。"},
{c:2,s:"会社法",n:10,d:"-",b:1,o:["3分の2", "4分の3"],a:[1],q:"株主総会の特別決議においては、定款に別段の定めがない限り、議決権総数の過半数にあたる株式を持つ株主が出席し、出席株主の議決権の( 3分の2 ・ 4分の3 )以上の賛成を得ることが求められる。",e:"補足: 特別決議＝定足数（議決権の過半数）＋出席株主の議決権の3分の2以上の賛成。普通決議は出席株主の過半数。4分の3に変えるのがひっかけ。"},
{c:2,s:"会社法",n:11,d:"-",b:1,o:["1人", "3人"],a:[2],q:"取締役会設置会社には、取締役は( 1人 ・ 3人 )以上必要である。",e:"補足: 取締役会設置会社は取締役3人以上が必要。取締役会を置かない会社なら1人でもよい。「会議体だから3人以上」と考える。"},
{c:2,s:"会社法",n:12,d:"-",b:1,o:["2年", "4年"],a:[1],q:"公開会社において、取締役の任期は、原則として( 2年 ・ 4年 )以内とされている。",e:"補足: 取締役の任期は原則2年以内（非公開会社は定款で最長10年まで伸長可）。監査役は4年なので、4年に変えるのがひっかけ。"},
{c:2,s:"会社法",n:13,d:"-",b:1,o:["取締役会", "株主総会"],a:[1],q:"取締役会設置会社において、代表取締役の選定及び解職は、( 取締役会 ・ 株主総会 )の決議事項である。",e:"補足: 代表取締役の選定・解職は取締役会の決議事項。取締役そのものの選任・解任は株主総会（普通決議）。「取締役を選ぶのは株主総会、その中から代表を選ぶのは取締役会」と段階で覚える。本編1章の五肢選択と同じ論点。"},
{c:2,s:"会社法",n:14,d:"-",b:1,o:["議決権の過半数", "株主全員"],a:[2],q:"取締役が任務を怠って会社に損害を加えたときは、当該損害に対して賠償責任を負うものとされているが、原則として( 議決権の過半数 ・ 株主全員 )の同意を得た場合には、この責任を免除することができる。",e:"補足: 取締役の会社に対する責任の全部免除には株主全員の同意が必要。過半数では足りない。一部免除なら株主総会の特別決議等で可能。"},
{c:2,s:"会社法",n:15,d:"-",b:1,o:["普通決議", "特別決議"],a:[1],q:"取締役会設置会社において、監査役の選任は、株主総会の( 普通決議 ・ 特別決議 )事項である。",e:"補足: 監査役の選任は普通決議だが、解任は特別決議。選任と解任で決議要件が違うのがポイント（取締役は選任・解任とも普通決議）。"},
{c:2,s:"会社法",n:16,d:"-",b:1,o:["普通決議", "特別決議"],a:[2],q:"取締役会設置会社において、定款の変更は、原則として株主総会の( 普通決議 ・ 特別決議 )事項である。",e:"補足: 定款変更は特別決議。会社の根本規則を変えるため。本編1章問91（特別決議事項を選ぶ五肢選択）と同じ論点。"},
{c:2,s:"会社法",n:17,d:"-",b:1,o:["2分の1", "4分の1"],a:[2],q:"株式会社は、配当などを剰余金から支出するたびに、その10分の1以上を利益準備金として、資本準備金との合計が資本金の( 2分の1 ・ 4分の1 )に達するまで積み立てなければならない。",e:"補足: 配当額の10分の1を、資本準備金と合わせて資本金の4分の1に達するまで積立て。「10分の1ずつ、4分の1まで」の2つの数字をセットで覚える。"},
{c:2,s:"会社法",n:18,d:"-",b:1,o:["監査役", "会社債権者"],a:[2],q:"分配可能額がないのに行われた配当は無効であり、( 監査役 ・ 会社債権者 )は、株主に対してこれを会社へ返還するよう要求できる。",e:"補足: 違法配当の返還を請求できるのは会社債権者。会社財産が不当に流出すると、債権者の回収原資が減るため。"},
{c:2,s:"会社法",n:19,d:"-",b:1,o:["10分の1", "4分の1"],a:[2],q:"会社設立にあたって発行する株式数は、原則として定款に定めた発行可能株式総数の( 10分の1 ・ 4分の1 )以上であればよいとされている。",e:"補足: 設立時発行株式は発行可能株式総数の4分の1以上（公開会社の場合）。問17の「資本金の4分の1」と数字は同じだが別の話なので混同しないこと。"},
{c:2,s:"会社法",n:20,d:"-",b:1,o:["普通決議", "特別決議"],a:[2],q:"組織の再編において株式会社が新設分割をする場合や、合併や倒産、定款に定めた存続期間の満了以外に解散をする場合には、株主総会の( 普通決議 ・ 特別決議 )による承認が必要となる。",e:"補足: 合併・会社分割・株式交換・株式移転・事業譲渡・解散などの組織再編は特別決議。問16の定款変更と同じグループとして覚える。"},
{c:3,s:"株式業務",n:1,d:"-",b:1,o:["発行市場", "流通市場"],a:[1],q:"資金調達を目的として有価証券が発行され、これらの有価証券が発行者から直接または仲介者を通じて投資者に第一次取得される市場を( 発行市場 ・ 流通市場 )という。",e:"補足: 第一次取得＝発行市場。既発行の証券が投資者間を転々流通するのが流通市場。本編13章問6・7がまさにこの2つを入れ替えたひっかけ。"},
{c:3,s:"株式業務",n:2,d:"-",b:1,o:["日本証券業協会", "証券取引等監視委員会"],a:[2],q:"( 日本証券業協会 ・ 証券取引等監視委員会 )は、証券業界の自主規制機関に含まれない。",e:"補足: 証券取引等監視委員会は監督官庁側であり、自主規制機関ではない。自主規制機関は①各金融商品取引所 ②日本証券業協会 ③投資信託協会の3つ。本編13章問13と同じ論点。"},
{c:3,s:"株式業務",n:3,d:"-",b:1,o:["日本証券業協会", "証券取引等監視委員会"],a:[2],q:"インサイダー取引や金融商品取引業者等による損失保証や損失補てん等の公正を損なう行為についての強制調査権が付与されている機関は、(日本証券業協会 ・ 証券取引等監視委員会 )である。",e:"補足: 強制調査権を持つのは証券取引等監視委員会。問2と対で、自主規制機関と監督官庁の役割の違いを問うている。"},
{c:3,s:"株式業務",n:4,d:"-",b:1,o:["自己の計算", "顧客の計算"],a:[2],q:"株式の売買の取次ぎとは、顧客からの売買注文を、( 自己の計算・顧客の計算 )において金融商品取引業者の名で行う取引である。",e:"補足: 取次ぎ＝顧客の計算（顧客のお金）で、証券会社の名前で売買。自己の計算で行えば自己取引になる。「誰のお金か／誰の名前か」の2軸で整理する。本編3章問2と同じ論点。"},
{c:3,s:"株式業務",n:5,d:"-",b:1,o:["発表日", "価格決定日"],a:[2],q:"安定操作期間とは、一般に募集又は売出しの( 発表日 ・ 価格決定日 )の翌日から申込最終日までをいう。",e:"補足: 安定操作期間＝価格決定日の翌日から申込最終日まで。本編3章問3の「ファイナンス期間（発表日の翌日〜払込日）」と紛らわしいので、対で覚える。"},
{c:3,s:"株式業務",n:6,d:"-",b:1,o:["約定日時", "手数料の金額"],a:[2],q:"注文伝票には、( 約定日時 ・ 手数料の金額 )は記載しなくてもよい。",e:"補足: 手数料の金額は契約締結時交付書面の記載事項で、注文伝票には不要。注文伝票には自己・委託の別、顧客名、銘柄、売買の別、数量、指値・成行の別、受注日時、約定日時、約定価格などを記載する。本編3章問46・47と同じ論点。"},
{c:3,s:"株式業務",n:7,d:"-",b:1,o:["成立した場合に限り", "成立したかどうかに関わらず"],a:[1],q:"金融商品取引業者が顧客から株式の売買注文を受託した時は、当該注文に係る売買が( 成立した場合に限り ・ 成立したかどうかに関わらず )、遅滞なく、契約締結時交付書面を顧客に交付しなければならない。",e:"補足: 契約締結時交付書面は売買が成立した場合に遅滞なく交付。一方、注文伝票は成立の有無にかかわらず必ず作成する。この2つを入れ替えるのが定番のひっかけ（本編3章問10・12）。"},
{c:3,s:"株式業務",n:8,d:"-",b:1,o:["指値又は成行の別", "営業所名"],a:[2],q:"契約締結時交付書面には( 指値又は成行の別 ・ 営業所名 )を記載しなければならない。",e:"補足: 指値・成行の別は注文伝票の記載事項。契約締結時交付書面には営業所の名称や手数料額などを記載する。問6と併せて、2つの書類の記載事項を仕分けできるようにしておく。"},
{c:3,s:"株式業務",n:9,d:"-",b:1,o:["月", "火"],a:[1],q:"上場株式の普通取引において、木曜日に売買が成立した場合には、翌週の( 月 ・ 火 )曜日[祝日は含まれていない]に決済を行うこととされている。",e:"補足: 普通取引の受渡しは約定日から起算して3営業日目。木（1日目）→金（2日目）→翌月（3日目）で月曜日。土日は数えない。本編3章問14は金曜約定のケース（→翌火曜）。"},
{c:3,s:"株式業務",n:10,d:"-",b:1,o:["信用取引", "発行日決済取引"],a:[2],q:"金融商品取引所の売買立会による内国株式に係る売買の種類は、決済日の違いにより、普通取引、当日決済取引、( 信用取引 ・ 発行日決済取引 )の3種類に区分される。",e:"補足: 決済日による区分は普通取引・当日決済取引・発行日決済取引の3種類。信用取引は決済日ではなく決済方法による区分なのでここには入らない。本編3章問16と同じ論点。"},
{c:3,s:"株式業務",n:11,d:"-",b:1,o:["1億円", "10億円"],a:[1],q:"東京証券取引所において立会外バスケット取引によって株式を売買する場合は、15銘柄以上で構成され、かつ、総額( 1億円 ・ 10億円 )以上のポートフォリオに限られる。",e:"補足: 立会外バスケット取引＝15銘柄以上かつ1億円以上。数字を10億円や5,000万円に変えるのがひっかけ（本編3章問20）。"},
{c:3,s:"株式業務",n:12,d:"-",b:1,o:["当日決済取引", "発行日決済取引"],a:[1],q:"国内委託取引による外国証券の売買の種類は、決済日の違いにより、普通取引、( 当日決済取引 ・ 発行日決済取引 )の2種類に区分される。",e:"補足: 外国証券の国内委託取引は普通取引と当日決済取引の2種類。問10の内国株式（3種類）と数と中身が違うので、対比して覚える。"},
{c:3,s:"株式業務",n:13,d:"-",b:1,o:["10分の1", "100分の1"],a:[1],q:"株式ミニ投資とは、1売買単位の( 10分の1 ・ 100分の1 )単位の株式の持分を取引単位とし、単元未満株のまま、機動的に売買できる制度である。",e:"補足: 株式ミニ投資は1売買単位の10分の1単位。毎月一定金額を買い付ける株式累積投資（るいとう）との違いが最頻出（本編3章問31・33）。"},
{c:3,s:"株式業務",n:14,d:"-",b:1,o:["4営業日", "5営業日"],a:[1],q:"株式ミニ投資の受渡日は、顧客から注文を受けた日から起算して( 4 ・ 5 )営業日目の日とされている。",e:"補足: 株式ミニ投資の受渡しは4営業日目。通常の普通取引（3営業日目、問9）より1日遅い点がポイント。"},
{c:3,s:"株式業務",n:15,d:"-",b:1,o:["競争入札", "ブックビルディング"],a:[2],q:"上場予定会社の財政状態や経営成績などから算定した公開価格の仮条件を投資家に提示し、投資家の需要調査等を行って公開価格を決定する方法を( 競争入札 ・ ブックビルディング )方式という。",e:"補足: 需要状況をもとに決めるのがブックビルディング方式（現在の主流）。競争入札方式は公開株式数の50%以上を入札にかける方式。本編3章問37・38がこの2つの入れ替え。"},
{c:3,s:"株式業務",n:16,d:"-",b:1,o:["1,200円", "1,800円"],a:[2],q:"1:5の株式分割を行う上場銘柄U社株式の権利付相場は15,000円であった。権利落ち後の値段が3,360円になったとすれば、権利付相場の15,000円に対して( 1,200円 ・ 1,800円 )値上がりしたことになる。",e:"権利落ち後（15,000円）÷分割比率（5）=3,000円 （3,360円−3,000円）× 5 ＝ 1,800円 補足: 理論上の権利落相場（15,000円÷5＝3,000円）と実際の値段（3,360円）を比べ、その差を分割前の水準に戻すため分割比率5倍する。本編3章問48は同じ考え方の値下がりのケース。"},
{c:3,s:"株式業務",n:17,d:"-",b:1,o:["1株当たり当期純利益", "1株当たり純資産"],a:[1],q:"PERは、株価を( 1株当たり当期純利益 ・ 1株当たり純資産 )で除して求められる。",e:"補足: PER（株価収益率）＝株価 ÷ 1株当たり当期純利益。問18のPBRと分母を入れ替えるのが定番（本編3章問39・40）。「E＝Earnings＝利益」で覚える。"},
{c:3,s:"株式業務",n:18,d:"-",b:1,o:["1株当たり当期純利益", "1株当たり純資産"],a:[2],q:"PBRは、株価を( 1株当たり当期純利益 ・ 1株当たり純資産 )で除して求められる。",e:"補足: PBR（株価純資産倍率）＝株価 ÷ 1株当たり純資産。「B＝Book value＝純資産」。PBR1倍＝株価と解散価値が同水準。"},
{c:3,s:"株式業務",n:19,d:"-",b:1,o:["42.5倍", "62.5倍"],a:[2],q:"資本金200億円(発行済株式総数5,000万株)、税引後当期純利益35億円、減価償却費25億円、株価7,500円のZ社(年1回決算)の株価キャッシュ・フロー倍率[PCFR]は( 42.5 ・ 62.5 )倍である。",e:"1株当たりキャッシュ・フロー ＝ キャッシュ・フロー(税引後純利益＋減価償却費) ÷ 発行済株式総数 ＝ (35億 ＋ 25億) ÷ 0.5億 ＝ 120円 株価キャッシュ・フロー倍率 ＝ 株価 ÷ 1株当たりキャッシュ・フロー ＝ 7,500円 ÷ 120円 ＝ 62.5倍 補足: キャッシュ・フローは「税引後当期純利益＋減価償却費」で求める。資本金200億円は使わないダミーの数字。本編3章問51と同じ形式。"},
{c:3,s:"株式業務",n:20,d:"-",b:1,o:["23.6倍", "26.4倍"],a:[2],q:"資本金150億円、時価総額4,500億円、利益剰余金250億円、保有現預金(短期有価証券を含む)80億円、有利子負債3,500億円、税引後当期純利益120億円、税金60億円、支払利息75億円、減価償却費45億円、となっている甲社のEV／EBITDA倍率は( )倍である。",e:"EV＝4,500億円(時価総額)＋(3,500億円(有利子負債)−80億円(保有現預金))＝7,920億円 EBITDA＝(120億円(税引後当期純利益)＋60億円(税金))＋75億円(支払利息)＋45億円(減価償却費)＝300億円 EV／EBITDA倍率 ＝ 7,920億円 ÷ 300億円 ＝ 26.4倍 補足: EV＝時価総額＋有利子負債－現預金。EBITDA＝税引前利益（＝税引後利益＋税金）＋支払利息＋減価償却費。「約26年で買収コストを回収できる」という意味になる。資本金・利益剰余金は使わないダミー。本編3章問52と同じ論点。"},
{c:4,s:"債券業務①",n:1,d:"-",b:1,o:["強い", "弱い"],a:[2],q:"一般に債券は、金利が低下すると債券価格は上昇するが、インフレに( 強い ・ 弱い )。",e:"補足: 債券は金利低下には強い（価格上昇）が、インフレには弱い。インフレになると金利が上がり債券価格が下がるうえ、受け取る利子の実質価値も目減りするため。本編9章問39と同じ論点。"},
{c:4,s:"債券業務①",n:2,d:"-",b:1,o:["短期国債", "長期国債"],a:[2],q:"国債のうち、他の国内債の利回りの指標となる中心的銘柄は( 短期国債 ・ 長期国債 )である。",e:"補足: 指標銘柄は長期国債（10年利付国債）。発行量が最も多く、発行・流通の両市場で中心的な存在。本編9章問2と同じ論点。"},
{c:4,s:"債券業務①",n:3,d:"-",b:1,o:["2年", "3年"],a:[1],q:"現在、中期国債は( 2年 ・ 3年 )と5年の2種類が発行されている。",e:"補足: 中期国債は2年と5年の2種類。1年や3年に変えるのがひっかけ（本編9章問5・6）。1年以下は国庫短期証券、10年が長期、20年以上が超長期。"},
{c:4,s:"債券業務①",n:4,d:"-",b:1,o:["法人のみ", "法人及び個人"],a:[2],q:"国庫短期証券は、国債の償還の平準化を図り円滑な借換えを実現すること、並びに国の一般会計等の一時的な資金不足を補うために発行されるものであり、( 法人のみ ・ 法人及び個人 )が取得できる。",e:"補足: 国庫短期証券（TDB）は法人・個人のどちらも取得できる。割引方式で発行され、償還期間は2か月・3か月・6か月・1年。本編9章問8参照。"},
{c:4,s:"債券業務①",n:5,d:"-",b:1,o:["1回", "2回"],a:[2],q:"個人向け国債の利払いは、固定金利型・変動金利型のいずれも年( 1回 ・ 2回 )行われる。",e:"補足: 個人向け国債の利払いは固定型・変動型とも年2回。年1回に変えるのが定番のひっかけ（本編9章問9）。"},
{c:4,s:"債券業務①",n:6,d:"-",b:1,o:["建設国債", "赤字国債"],a:[1],q:"国債のうち、財政法4条但書に基づき発行されるものは( 建設国債 ・ 赤字国債 )と呼ばれる。",e:"補足: 財政法4条＝建設国債（公共事業のため）。赤字国債（特例国債）は特例法が必要。本編9章問10・11、小テスト①問20と同じ論点。"},
{c:4,s:"債券業務①",n:7,d:"-",b:1,o:["赤字国債", "借換国債"],a:[1],q:"国債のうち、特例公債法に基づき発行されるものは( 赤字国債 ・ 借換国債 )と呼ばれる。",e:"補足: 特例公債法＝赤字国債。借換国債は国債整理基金特別会計法に基づくもので、既発国債の償還財源を調達するために発行される。3つの根拠法と名前をセットで覚える。"},
{c:4,s:"債券業務①",n:8,d:"-",b:1,o:["円貨建て", "外貨建て"],a:[1],q:"日本国内において、国際機関や外国の法人等が( 円貨建て ・ 外貨建て )で発行する債券をサムライ債という。",e:"補足: サムライ債＝非居住者が日本国内で円貨建てで発行する債券。外貨建てだとショーグン債になる。本編9章問19と同じ論点。"},
{c:4,s:"債券業務①",n:9,d:"-",b:1,o:["定時償還", "任意償還"],a:[2],q:"債券の期中償還には2種類あり、発行者の都合で随時償還を行うものを( 定時償還 ・ 任意償還 )という。",e:"補足: 任意償還＝発行者の都合で随時。定時償還＝発行時に時期と金額が決まっている。本編9章問22参照。"},
{c:4,s:"債券業務①",n:10,d:"-",b:1,o:["上昇", "下落"],a:[2],q:"利率と残存期間が一定である利付債の場合、債券利回りの上昇は債券価格の( 上昇 ・ 下落 )を意味する。",e:"補足: 利回りと価格は逆方向に動く。利回り上昇＝価格下落＝市況悪化。この関係が債券計算のすべての土台になる（本編9章問23）。"},
{c:4,s:"債券業務①",n:11,d:"-",b:1,o:["銀行及び信託銀行", "金融商品取引業者"],a:[1],q:"社債管理者になることができるのは、( 銀行及び信託銀行 ・ 金融商品取引業者 )である。",e:"補足: 社債管理者になれるのは銀行・信託銀行・担保付社債信託法の免許会社で、証券会社（金融商品取引業者）はなれない。本編9章問25、6章問47と同じ論点で頻出。"},
{c:4,s:"債券業務①",n:12,d:"-",b:1,o:["2営業日目", "3営業日目"],a:[1],q:"取引所市場で取引される上場国債の受渡日[決済日]は、原則として売買成立の日[約定日]から起算して( 2営業日目 ・ 3営業日目 )の日とされている。",e:"補足: 上場国債は2営業日目。株式の普通取引は3営業日目（小テスト③問9）なので、混同させるひっかけが頻出。本編9章問33参照。"},
{c:4,s:"債券業務①",n:13,d:"-",b:1,o:["短期債から長期債", "長期債から短期債"],a:[1],q:"債券の売買手法において、一般的に金利が低下すると予想する場合は、( 短期債から長期債 ・ 長期債から短期債 )への入れ替えが有利である。",e:"補足: 金利低下＝価格上昇。値動きの幅は長期債のほうが大きいので、短期債から長期債へ乗り換えると値上がり益が大きくなる。本編9章問42と同じ論点。"},
{c:4,s:"債券業務①",n:14,d:"-",b:1,o:["ラダー型", "ダンベル型"],a:[1],q:"短期から長期までの債券を各年度に均等に保有するよう入替売買する手法を( ラダー型 ・ ダンベル型 )のポートフォリオという。",e:"補足: ラダー型＝各年限に均等（はしご状）。ダンベル型（バーベル型）＝短期債と長期債の両端だけ。本編9章問45がこの2つの入れ替え。"},
{c:4,s:"債券業務①",n:15,d:"-",b:1,o:["委託現先", "自己現先"],a:[2],q:"現先取引において、金融商品取引業者が売方又は買方となる取引を( 委託現先 ・ 自己現先 )取引という。",e:"補足: 証券会社自身が当事者になるのが自己現先、仲介役に回るのが委託現先。本編9章問47と同じ論点。"},
{c:4,s:"債券業務①",n:16,d:"-",b:1,o:["最終利回り", "所有期間利回り"],a:[1],q:"市場に流通している既発債を市場価格で買付け、中途売却せずに償還期限まで保有した場合の利回りを、( 最終利回り ・ 所有期間利回り )という。",e:"補足: 既発債＋償還まで保有＝最終利回り。既発債＋中途売却＝所有期間利回り。新発債＋償還まで＝応募者利回り。利子だけに着目＝直接利回り。4つの利回りの定義の入れ替えが最頻出（本編9章問59・60・68）。"},
{c:4,s:"債券業務①",n:17,d:"-",b:1,o:["2.48%", "2.55%"],a:[2],q:"利率1.5%、購入価格(額面100円につき)98円、残存年数2年の利付国債を購入した場合、最終利回りは( 2.48% ・ 2.55% )となる。",e:"{1.5円 + (100円−98円) ÷ 2年} ÷ 98円 ×100 ＝ 2.55% 補足: 最終利回り＝｛利率＋(償還価格－購入価格)÷残存年数｝÷購入価格×100。分母を額面100円にすると2.5%になり誤答（選択肢1の2.48%は分母を101円などにした場合の値）。分母は必ず購入価格。"},
{c:4,s:"債券業務①",n:18,d:"-",b:1,o:["▲0.79%", "0.69%"],a:[1],q:"利率1.2%、残存期間8年の利付国債を101円で買付けたが、金利が急上昇したため2年後に97円で売却した。この場合の所有期間利回りは( ▲0.79% ・ 0.69% )となる。",e:"{1.2円 + (97円−101円) ÷ 2年} ÷ 101円 ×100 ＝ ▲0.79% 補足: 所有期間利回りは償還価格ではなく売却価格を使い、残存期間ではなく所有期間（2年）で割る。残存期間8年で割ると誤答になる。本編9章問69と同じ形式。"},
{c:4,s:"債券業務①",n:19,d:"-",b:1,o:["25日", "26日"],a:[2],q:"Aさんが次の条件で利付国債を購入した場合、支払うべき経過利子を計算する際に使用する経過日数は( 25日 ・ 26日 )となる。 前回の利払日:××年9月20日／約定日:××年10月15日／受渡日:××年10月16日",e:"計算期間(9/21〜10/16) → 26日間 補足: 経過日数は直前の利払日の翌日から受渡日まで。起点を利払日当日にしたり、終点を約定日にしたりすると1日ずれる。土日祝も日数に数える。本編9章問72と同じ論点。"},
{c:4,s:"債券業務①",n:20,d:"-",b:1,o:["2,034,900円", "2,048,100円"],a:[1],q:"額面200万円の利付債券を単価102円で売却した場合の受渡代金は( 2,034,900円 ・ 2,048,100円 )となる。 経過利子は1,500円、委託手数料は額面100円につき30銭とする。[消費税10%相当額を考慮すること]",e:"①本体・・・204万円 ②経過利子・・1,500円 ③手数料・・・6,600円(2万口分) 20,000口×0.3×1.1 売却 − 手数料 (①+②)−③ ＝ 2,034,900円 補足: 売りなので手数料を差し引く（買いなら足す）。この符号の違いが最大のひっかけ。経過利子は売り・買いどちらでも売方が受け取る側なので加算。本編9章問74は買いのケース。"},
{c:5,s:"債券業務②・取引所定款",n:1,d:"-",b:1,o:["1種類", "2種類"],a:[1],q:"上場されている転換社債型新株予約権付社債[以下「転換社債」という]は、1銘柄につき( 1種類 ・ 2種類 )の券種を発行することができる。",e:"補足: 上場転換社債は1銘柄につき1種類の券種。"},
{c:5,s:"債券業務②・取引所定款",n:2,d:"-",b:1,o:["株式に転換", "額面で払い戻し"],a:[2],q:"転換請求期間内に転換請求されなかった転換社債は、償還日に( 株式に転換 ・ 額面で払い戻し )される。",e:"補足: 転換しなければ社債のまま満期を迎え、額面で払い戻し。「自動的に株式になる」としたら誤り。本編9章問54と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:3,d:"-",b:1,o:["株式の時価", "転換価額"],a:[2],q:"転換社債の転換により得られる計算上の株数は、転換社債の額面金額を( 株式の時価 ・ 転換価額 )で除すことによって求めることができる。",e:"補足: 取得株数＝額面金額 ÷ 転換価額。株式の時価で割るのがひっかけ。端数は切り捨てられるか現金で精算される。本編9章問56・64と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:4,d:"-",b:1,o:["12.2%", "▲7.27%"],a:[2],q:"転換価額450円、転換社債の時価102円、転換の対象となる株式の時価495円である場合、パリティ乖離率は( 12.2% ・ ▲7.27% )となる。",e:"パリティ価格＝495円÷450円×100円＝110円 パリティ乖離率＝(102円－110円)÷110円 ×100＝( ▲7.27 )% 補足: パリティ価格＝株価÷転換価額×100。乖離率の分母はパリティ価格（転換社債の時価ではない）。マイナスなので転換社債が割安＝株式に転換して売るほうが有利（問5）。本編9章問65と同じ形式。"},
{c:5,s:"債券業務②・取引所定款",n:5,d:"-",b:1,o:["転換社債のまま", "株式に転換して"],a:[2],q:"一般に、転換社債においてパリティ価格が転換社債の時価を上回るマイナス乖離の場合、( 転換社債のまま ・ 株式に転換して )売却した方が有利となる。",e:"補足: パリティ価格＞転換社債価格（マイナス乖離）＝株式のほうが価値が高い＝株式に転換して売却が有利。プラス乖離ならその逆で社債のまま売る。本編9章問58と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:6,d:"-",b:1,o:["下落", "上昇"],a:[2],q:"クレジットスプレッドが縮小する場合、一般的に転換社債の価格は( 下落 ・ 上昇 )する。",e:"補足: クレジットスプレッド縮小＝発行体の信用力改善＝転換社債価格は上昇。価格上昇要因は「金利低下・スプレッド縮小・株価上昇・ボラティリティ上昇」の4点セット（本編9章問66）。"},
{c:5,s:"債券業務②・取引所定款",n:7,d:"-",b:1,o:["含まれる", "含まれない"],a:[2],q:"取引所に上場される有価証券には、小切手や約束手形が( 含まれる ・ 含まれない )。",e:"補足: 小切手・約束手形は金融商品取引法上の有価証券ではないため上場対象外。国内CDも同様。本編6章問3、4章問7と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:8,d:"-",b:1,o:["国債証券", "地方債証券"],a:[1],q:"( 国債証券 ・ 地方債証券 )については、発行者からの上場申請がなくても上場することができる。",e:"補足: 申請不要の例外は国債証券だけ。地方債・外国国債・外国地方債・転換社債はいずれも発行者の申請が必要。本編4章問10〜12・23と同じ論点で頻出。"},
{c:5,s:"債券業務②・取引所定款",n:9,d:"-",b:1,o:["いずれか1項目", "すべて"],a:[2],q:"株券の上場審査においては、株主数、時価総額、事業継続年数、純資産の額、単元株式数、株式の譲渡制限など所定の審査基準の( いずれか1項目 ・ すべて )が形式基準に適合するものを対象としている。",e:"補足: 上場審査の形式要件はすべて満たす必要がある。問10の上場廃止（いずれか1つで廃止）と逆なので、対で覚える。本編4章問13参照。"},
{c:5,s:"債券業務②・取引所定款",n:10,d:"-",b:1,o:["すべて", "いずれか1項目"],a:[2],q:"上場されている銘柄が、上場廃止基準の( すべて ・ いずれか1項目 )に該当すれば、その上場が廃止される。",e:"補足: 上場廃止はいずれか1つ該当すれば廃止。問9と「すべて／いずれか」が逆になる点が最大のひっかけ。本編4章問26参照。"},
{c:5,s:"債券業務②・取引所定款",n:11,d:"-",b:1,o:["監理銘柄", "整理銘柄"],a:[2],q:"上場株券の上場廃止が決定された場合には、取引所は上場廃止日の前日までの間、( 監理銘柄 ・ 整理銘柄 )に指定して、その株券の売買取引を行わせることができる。",e:"補足: 廃止が決定＝整理銘柄。廃止基準に該当するおそれがある段階＝監理銘柄。「おそれ＝監理、決定＝整理」。本編4章問18・19がこの入れ替え。"},
{c:5,s:"債券業務②・取引所定款",n:12,d:"-",b:1,o:["発行者のみ", "発行者及び上場申請銘柄"],a:[2],q:"上場された転換社債の上場廃止基準には、( 発行者のみ ・ 発行者及び上場申請銘柄 )に対する基準がある。",e:"補足: 転換社債の基準は発行者に対する基準と上場申請銘柄に対する基準の2本立て。本編4章問24と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:13,d:"-",b:1,o:["上場審査基準に基づき", "上場審査を行わずに"],a:[1],q:"東京証券取引所は、転換社債型新株予約権付社債券(転換社債)の上場に際し、その発行者の発行する株券が上場されていれば、その転換社債の( 上場審査基準に基づき ・ 上場審査を行わずに )上場を決定する。",e:"補足: 株券が上場されていても、それは「発行者に対する基準」を満たすだけ。転換社債そのものの上場審査は別途必要。本編4章問25と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:14,d:"-",b:1,o:["廃止", "維持"],a:[1],q:"上場株券が上場廃止になった場合、その株券を発行する会社の上場転換社債は、上場が( 廃止 ・ 維持 )される。",e:"補足: 親となる株券が上場廃止になれば、その会社の転換社債も上場廃止。本編4章問27と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:15,d:"-",b:1,o:["前営業日", "2日前の日"],a:[1],q:"取引所における株券の普通取引において、配当金交付株主確定期日の( 前営業日 ・ 2日前の日 )から配当落ちとして売買が行われる。",e:"補足: 権利確定日の前営業日から配当落ち・権利落ち。本編4章問30と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:16,d:"-",b:1,o:["成行→指値", "指値→成行"],a:[1],q:"売買立会による売買では、( 成行→指値 ・ 指値→成行 )の順に売買が成立する。",e:"補足: 成行が指値に優先する。値段を問わない注文のほうが先に成立する。本編4章問34・46と同じ論点。"},
{c:5,s:"債券業務②・取引所定款",n:17,d:"-",b:1,o:["低い値段", "高い値段"],a:[1],q:"ザラ場における価格優先の原則では、売呼値においては( 低い値段 ・ 高い値段 )の売呼値が優先する。",e:"補足: 価格優先の原則は売りは安いほうが優先、買いは高いほうが優先。売り手は安く出すほど売れやすいと考えると自然。本編4章問35・36参照。"},
{c:5,s:"債券業務②・取引所定款",n:18,d:"-",b:1,o:["板寄せ", "ザラバ方式"],a:[1],q:"売買立会の始値を定める場合には、( 板寄せ ・ ザラバ方式 )により価格が決定される。",e:"補足: 始値・終値を決めるのが板寄せ、その間の継続売買がザラ場方式。本編4章問37・38がこの入れ替え。"},
{c:5,s:"債券業務②・取引所定款",n:19,d:"-",b:1,o:["債券価格によって区分されている", "1円である"],a:[2],q:"債券[転換社債などを除く]の制限値幅は、原則として( 債券価格によって区分されている ・ 1円である )。",e:"補足: 債券の呼値の制限値幅は原則1円。ただし売買の状況に異常があると認める場合等には取引所が変更できる（「いかなる場合も変更しない」は誤り。本編4章問39）。"},
{c:5,s:"債券業務②・取引所定款",n:20,d:"-",b:1,o:["取引参加者のみ", "取引参加者と顧客"],a:[2],q:"取引所の定める「受託契約準則」を順守すべき義務があるのは( 取引参加者のみ ・ 取引参加者と顧客 )である。",e:"補足: 受託契約準則は顧客にも遵守義務がある。「証券会社だけが守るもの」としたら誤り。本編4章問43と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:1,d:"-",b:1,o:["50%", "70%"],a:[1],q:"証券投資信託とは、投資信託財産の総額の( 50% ・ 70% )を超える額を有価証券に対する投資として運用することを目的とした投資信託をいう。",e:"補足: 証券投資信託＝2分の1（50%）超を有価証券で運用。問15の不動産投資法人（70%以上）と数字を入れ替えるのがひっかけ。本編10章問4と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:2,d:"-",b:1,o:["解約請求ができない", "配当を行わない"],a:[1],q:"クローズド期間とは、信託約款で定めた( 解約請求ができない ・ 配当を行わない )期間のことをいう。",e:"補足: クローズド期間＝解約請求ができない期間。「配当を行わない期間」とするのが定番のひっかけ。本編10章問7と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:3,d:"-",b:1,o:["公社債投資信託", "株式投資信託"],a:[1],q:"( 公社債投資信託 ・ 株式投資信託 )は株式を一切組み入れることができない投資信託である。",e:"補足: 公社債投資信託は約款上、株式を一切組み入れられない。株式投資信託は「組み入れることができる」と約款にあれば、実際に組み入れていなくても株式投資信託。本編10章問12・13と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:4,d:"-",b:1,o:["マザーファンド", "ファンドオブファンズ"],a:[1],q:"その受益権を投資信託委託会社自らが運用の指図を行う他の投資信託に取得させることを目的とする投資信託を、( マザーファンド ・ ファンドオブファンズ )という。",e:"補足: マザーファンド＝ベビーファンドから資金を集めて実際に運用する親ファンド。ファンド・オブ・ファンズは他社を含む複数の投資信託に投資するもの。本編10章問16参照。"},
{c:6,s:"投資信託・付随業務",n:5,d:"-",b:1,o:["金融商品取引業者", "信託会社等"],a:[2],q:"委託者指図型投資信託の受益証券を発行するためには、あらかじめ内閣総理大臣に届け出た投資信託約款の内容に基づき、( 金融商品取引業者 ・ 信託会社等 )との間で投資信託契約を締結しなければならない。",e:"補足: 投資信託契約は委託者（投資信託委託会社）と受託者（信託会社等）の二者間で締結。受益者は契約当事者ではない。本編10章問22と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:6,d:"-",b:1,o:["委託会社", "受託会社"],a:[1],q:"証券投資信託において、投資信託財産の運用報告書は( 委託会社 ・ 受託会社 )が作成する。",e:"補足: 目論見書・運用報告書の作成は委託会社の業務。受託会社は財産の保管・管理を担当。本編10章問31・92と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:7,d:"-",b:1,o:["投資信託委託会社", "受託会社"],a:[2],q:"投資信託財産は、すべて( 投資信託委託会社 ・ 受託会社 )の名義となる。",e:"補足: 財産の名義人は受託会社（信託銀行等）。運用の指図は委託会社だが、名義と保管は受託会社という役割分担。本編10章問33と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:8,d:"-",b:1,o:["受益者", "委託者"],a:[2],q:"証券投資信託において、信託財産に組み入れた有価証券に係る議決権の行使は受託者が行うが、その指図は( 受益者 ・ 委託者 )が行う。",e:"補足: 議決権の行使は受託者、指図は委託者。受益者（投資家）ではない点がひっかけ。本編10章問45と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:9,d:"-",b:1,o:["個別企業", "マクロ経済"],a:[2],q:"アクティブ運用の投資手法のうち、トップダウン・アプローチとは、( 個別企業 ・ マクロ経済 )に対する調査及び分析に基づいてポートフォリオを組成する手法をいう。",e:"補足: トップダウン＝マクロ経済から入る。ボトムアップ＝個別企業の積み上げ。本編10章問40・93と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:10,d:"-",b:1,o:["バリュー株運用", "グロース株運用"],a:[2],q:"アクティブ運用における運用スタイルのうち、将来における企業の成長性を重視して株式の銘柄選択を行うスタイルを、( バリュー株運用 ・ グロース株運用 )という。",e:"補足: 成長性重視＝グロース株運用。割安性重視＝バリュー株運用。本編10章問41・42と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:11,d:"-",b:1,o:["から4営業日目", "の翌営業日"],a:[2],q:"MMFや正午過ぎに受け付けたMRFに係る換金代金の支払日は、換金申込受付日( から4営業日目 ・ の翌営業日 )とされている。",e:"補足: MMF・MRFの換金代金は翌営業日払い。当日中に資金化したい場合のためにキャッシング業務（問18・19）がある。"},
{c:6,s:"投資信託・付随業務",n:12,d:"-",b:1,o:["普通分配金", "元本払戻金"],a:[1],q:"追加型株式投資信託の収益分配金のうち、課税対象となるのは( 普通分配金 ・ 元本払戻金 )である。",e:"補足: 課税されるのは普通分配金。元本払戻金（特別分配金）は自分の元本が戻ってきただけなので非課税。本編10章問59と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:13,d:"-",b:1,o:["9,000円", "9,500円"],a:[1],q:"個人が次の追加型株式投資信託に係る収益の分配を受け取った場合、決算後の個別元本の額は( 9,000円 ・ 9,500円 )となる。 （条件）分配落前の基準価額 12,000円、収益分配金 3,000円、決算前の個別元本9,500円",e:"・12,000円 − 3,000円 ＝ 9,000円（分配落ち後の基準価額） ・9,500円 − 9,000円 ＝ 500円（元本払戻金） ・9,500円 − 500円 ＝ 9,000円（決算後の個別元本） ※ 決算後の個別元本は、決算前の個別元本から元本払戻金を控除して求める。 補足: 分配落ち後の基準価額（9,000円）が個別元本（9,500円）を下回った差額500円が元本払戻金となり、その分だけ個別元本が切り下がる。本編10章問60と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:14,d:"-",b:1,o:["執行役員と同数", "執行役員の数＋1"],a:[2],q:"投資法人の監督役員は投資主総会で選任されるが、その人数は( 執行役員と同数 ・ 執行役員の数＋1 )以上の人数でなければならない。",e:"補足: 監督役員は執行役員の数＋1以上。監督する側が多数になるようにして牽制を効かせる仕組み。本編10章問75と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:15,d:"-",b:1,o:["50%", "70%"],a:[2],q:"ファンドの運用資産の( 50% ・ 70% )以上を不動産等で運用するものであれば、不動産投資法人として取引所に上場することができる。",e:"補足: 上場不動産投資法人（J-REIT）は運用資産の70%以上が不動産等。問1の証券投資信託（50%超）と数字を入れ替えるのがひっかけ。本編10章問79と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:16,d:"-",b:1,o:["第一種金融商品取引業者のみ", "第一種金融商品取引業者及び投資運用業者"],a:[2],q:"付随業務は( 第一種金融商品取引業者のみ ・ 第一種金融商品取引業者及び投資運用業者 )が行える。",e:"補足: 付随業務は第一種金融商品取引業者だけでなく投資運用業者も行える。しかも届出や承認は不要。本編8章問1・4と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:17,d:"-",b:1,o:["有価証券を担保する金銭の貸付け", "有価証券の元受け"],a:[1],q:"( 有価証券を担保する金銭の貸付け ・ 有価証券の元受け )は、付随業務に該当する。",e:"補足: 有価証券の元引受けは本来の業務（金融商品取引業そのもの）であって付随業務ではない。PTS運営業務も同じく本業側。本編8章問18と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:18,d:"-",b:1,o:["500万円", "1,000万円"],a:[1],q:"付随業務であるキャッシング業務に係る貸付限度額は、( 500万円 ・ 1,000万円 )とされている。",e:"補足: キャッシングの貸付限度額は、MRF残高から計算した返還可能金額と500万円のいずれか少ない額が基準。本編8章問6と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:19,d:"-",b:1,o:["翌営業日", "翌営業日の前日"],a:[2],q:"キャッシング業務の貸付利息は、解約請求日から( 翌営業日 ・ 翌営業日の前日 )までの分配金手取額となる。",e:"補足: 貸付利息は解約請求日から翌営業日の前日まで。「翌営業日まで」とするのが1日ずらすひっかけ。本編8章問7と同じ論点。"},
{c:6,s:"投資信託・付随業務",n:20,d:"-",b:1,o:["一定の金額で", "一定の株数を"],a:[1],q:"株式累積投資とは、特定の銘柄を定期的に( 一定の金額で ・ 一定の株数を )買い付ける制度をいう。",e:"補足: 株式累積投資（るいとう）は毎月一定金額を買い付ける（ドル・コスト平均法）。一定株数ではない。任意のときに単元未満株を機動的に売買する株式ミニ投資との違いが最頻出。本編8章問11・12と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:1,d:"-",b:1,o:["媒介", "代理"],a:[2],q:"委託者の計算で委託者の名前で有価証券の売買等を行うことを引き受けることを、( 媒介 ・ 代理 )という。",e:"補足: 代理＝委託者の計算・委託者の名で行う。取次ぎ＝委託者の計算・自己（証券会社）の名で行う。媒介＝他人間の取引の成立に尽力するだけ。「誰の計算か／誰の名前か」で3つを仕分ける。本編6章問123と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:2,d:"-",b:1,o:["買取引受け", "残額引受け"],a:[1],q:"有価証券の募集・売出しに際し、その有価証券を取得させることを目的として、その有価証券の全部又は一部を取得する契約を結ぶことを( 買取引受け ・ 残額引受け )という。",e:"補足: 買取引受け＝先に全部または一部を取得する。残額引受け＝売れ残りが出たらそれを取得する。どちらも「引受け」に含まれる点が本編6章問7のひっかけ。"},
{c:8,s:"金融商品取引法・販売法",n:3,d:"-",b:1,o:["新たに発行される", "すでに発行された"],a:[2],q:"有価証券の売出しとは、( 新たに発行される ・ すでに発行された )有価証券の取得の申込みの勧誘のうち、第一項有価証券においては、勧誘対象者が50名以上である場合のことをいう。",e:"補足: 売出し＝すでに発行された証券の勧誘。新規発行なら「募集」。50名以上という数字は募集・売出しに共通なので、そこではなく「新規か既発か」で判断する。本編6章問9と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:4,d:"-",b:1,o:["登録", "認可"],a:[2],q:"金融商品取引業者が私設取引システム運営業務を行う場合には、内閣総理大臣の( 登録 ・ 認可 )が必要である。",e:"補足: PTS運営業務は認可。金融商品取引業そのものは登録。規制の強さは「認可＞登録＞届出」。本編6章問11、13章問9と同じ論点で頻出。"},
{c:8,s:"金融商品取引法・販売法",n:5,d:"-",b:1,o:["登録", "免許"],a:[1],q:"金融商品取引業者は、内閣総理大臣の( 登録 ・ 免許 )を受けた者でなければ、行うことができない。",e:"補足: 金融商品取引業は登録制。免許なのは金融商品取引所（取引所そのもの）と証券金融会社。問4の認可（PTS）と併せて3つを仕分ける。本編6章問13と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:6,d:"-",b:1,o:["5年", "10年"],a:[1],q:"外務員の登録を取消され、その取消の日から( 5年 ・ 10年 )を経過しない者は、外務員として登録ができない。",e:"補足: 登録取消しから5年は再登録できない（欠格事由）。なお登録の取消しとは別に「2年以内の職務停止」の処分もある（本編6章問19）。数字が複数出てくるので混同注意。"},
{c:8,s:"金融商品取引法・販売法",n:7,d:"-",b:1,o:["リスク情報", "手数料に関する事項"],a:[1],q:"公告における( リスク情報 ・ 手数料に関する事項 )については、当該広告で使用される最も大きな文字・数字と著しく異ならない大きさで表示しなければならない。",e:"補足: 文字サイズの規制がかかるのはリスク情報。都合の良い部分だけ大きく、リスクを小さく書くのを防ぐための規定。本編6章問29と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:8,d:"-",b:1,o:["いる", "いない"],a:[1],q:"有価証券の売買その他の取引等について、顧客が金融商品取引業者に損失補てんを要求したり、金融商品取引業者との間でその約束をしたりする行為は、禁止されて( いる ・ いない )。",e:"補足: 損失補てんは顧客側の要求・約束も禁止され、顧客も刑事罰の対象になりうる。「業者だけが罰せられる」としたら誤り。本編6章問26・28と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:9,d:"-",b:1,o:["契約締結前交付書面の交付義務", "断定的判断の提供の禁止"],a:[1],q:"特定投資家との間で取引を行う場合は、( 契約締結前交付書面の交付義務 ・ 断定的判断の提供の禁止 )は適用されない。",e:"補足: 特定投資家に適用除外となるのは情報格差を埋めるための規制（契約締結前交付書面など）。損失補てんの禁止や断定的判断の提供の禁止といった市場の公正を守る規制は適用除外にならない。この線引きが最重要（本編6章問44・45）。"},
{c:8,s:"金融商品取引法・販売法",n:10,d:"-",b:1,o:["含まれない", "含まれる"],a:[2],q:"有価証券の売買に関し、投資家の判断に重大な影響を及ぼす重要な事項について、故意や過失の有無を問わず誤解を生じさせる表示を行うことは禁止されているが、特に必要な表示を欠く不作為は、これに( 含まれない ・ 含まれる )。",e:"補足: 「誤解を生ぜしめる表示」には、積極的な表現だけでなく必要な表示を欠く不作為も含まれる。故意・過失を問わない点も併せて押さえる。本編6章問53・55と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:11,d:"-",b:1,o:["低い価格", "高い価格"],a:[2],q:"金融商品取引業者は、顧客から有価証券の売付けの委託を受けて、その委託売買を成立させる前に自己の計算において、当該有価証券と同一の銘柄の売買を成立させることを目的として、その顧客の委託価格と同一又はそれよりも( 低い価格 ・ 高い価格 )で売付けをする行為は禁止されている。",e:"補足: フロントランニングの禁止。顧客の売り注文に先回りするなら、より高い価格で売れば自分が先に売れてしまう。顧客の買い注文なら「同一またはより低い価格で買付け」が禁止（本編6章問59）。売り／買いで向きが逆になるので注意。"},
{c:8,s:"金融商品取引法・販売法",n:12,d:"-",b:1,o:["に届出を行う", "の登録を受ける"],a:[2],q:"所定の金融機関以外の者は、内閣総理大臣( に届出を行う ・ の登録を受ける )ことで金融商品仲介業ができる。",e:"補足: 金融商品仲介業は登録制。法人・個人を問わず登録を受けられる。本編6章問67と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:13,d:"-",b:1,o:["1,000万円", "5,000万円"],a:[1],q:"投資者保護基金の補償限度額は、顧客1人当たり( 1,000万円 ・ 5,000万円 )とされている。",e:"補足: 補償限度額は1人当たり1,000万円。預金保険と同じ数字。適格機関投資家は補償対象外である点も併せて出る。本編6章問70と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:14,d:"-",b:1,o:["金融商品取引清算機関", "証券金融会社"],a:[2],q:"信用取引の決済に必要な金銭又は有価証券を、その金融商品取引所が開設する取引所金融商品市場の決済機構を利用して貸し付ける業務を行う会社を( 金融商品取引清算機関 ・ 証券金融会社 )という。",e:"補足: 貸付けを行うのが証券金融会社（内閣総理大臣の免許）。清算機関は金融商品債務引受業を行う会社（日本証券クリアリング機構）。本編6章問75がこの入れ替え。"},
{c:8,s:"金融商品取引法・販売法",n:15,d:"-",b:1,o:["仮装取引", "馴合取引"],a:[1],q:"上場有価証券等の売買などについて、取引状況に関し他人に誤解を生じさせる目的をもって、権利の移転、金銭の授受等を目的としない取引を行うことを( 仮装取引 ・ 馴合取引 )という。",e:"補足: 仮装取引＝権利移転を伴わない見せかけの取引（自分1人で完結）。馴合取引＝あらかじめ他人と通謀して同時期・同価格で売買する。相手がいるかどうかで区別する。本編6章問79と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:16,d:"-",b:1,o:["6ヵ月", "1年"],a:[2],q:"以前、上場会社等の役員等であった者は、退職して当該会社の役員等でなくなってから( 6ヵ月 ・ 1年 )以内は、当該会社の会社関係者に該当する。",e:"補足: 退職後1年以内は会社関係者。問20の短期売買差益返還請求（6ヵ月）と数字を入れ替えるのがひっかけ。本編6章問124と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:17,d:"-",b:1,o:["当たる", "当たらない"],a:[1],q:"上場会社の業務を執行する機関が、株式分割の実施を決定し、公表したが、その分割を中止した場合には、その中止の決定は内部者取引の重要事項に( 当たる ・ 当たらない )。",e:"補足: いったん決定したことを「行わない」と決定したことも重要事実に当たる。中止だから関係ない、としたら誤り。本編6章問87・125と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:18,d:"-",b:1,o:["12時間", "24時間"],a:[1],q:"上場会社の業務に関する重要事実は、当該重要事実が日刊紙を販売する新聞社又は放送機関等の2つ以上の報道機関に対して公開され、かつ、公開された時から( 12時間 ・ 24時間 )経過すれば公表されたと認められる。",e:"補足: 2つ以上の報道機関へ公開＋12時間経過で「公表」。6時間や24時間に変えるのがひっかけ。本編6章問91と同じ論点。"},
{c:8,s:"金融商品取引法・販売法",n:19,d:"-",b:1,o:["5", "10"],a:[2],q:"内部取引の規制に係る上場会社の主要株主とは、総株主の議決権の100分の( 5 ・ 10 )以上の議決権を所有する株主をいう。",e:"補足: 主要株主＝議決権の100分の10以上。大量保有報告書の5%（本編6章問114）と数字を入れ替えるのがひっかけ。順位（上位10位）ではなく割合で決まる点も出る（本編6章問90）。"},
{c:8,s:"金融商品取引法・販売法",n:20,d:"-",b:1,o:["6ヵ月", "1年"],a:[1],q:"上場会社等の役員又は主要株主が、自己の計算においてその買付け又は売付けをした後( 6ヵ月 ・ 1年 )以内に売付け又は買付けをして利益を得たときは、当該上場会社はその者に対し、得た利益の返還を請求することができる。",e:"補足: 短期売買差益の返還請求は6ヵ月以内。問16の会社関係者（1年）と対で、6ヵ月と1年を入れ替えるのが定番。本編6章問94（難易度A）と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:1,d:"-",b:1,o:["本籍地", "資産の状況"],a:[2],q:"協会員が備え付けなければならない顧客カードの記載事項に( 本籍地 ・ 資産の状況 )がある。",e:"補足: 顧客カードの記載事項は、氏名・住所・生年月日・職業・投資目的・資産の状況・投資経験の有無・取引の種類など。本籍地と家族構成は含まれない。本編5章問86と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:2,d:"-",b:1,o:["一切行ってはならない", "過度にならないように適切な管理を行う"],a:[2],q:"協会員は、有価証券の売買に関連し、顧客の資金又は有価証券の借入につき行う保証、あっせん等の便宜の供与については、( 一切行ってはならない ・ 過度にならないように適切な管理を行う )。",e:"補足: 便宜の供与は禁止行為ではなく、過度にならないよう適切に管理するもの。「一切禁止」と言い切る選択肢は誤り、というパターン。本編5章問14と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:3,d:"-",b:1,o:["行われた後、速やかに", "行われるまでに"],a:[2],q:"協会員は、上場会社等の役員等に該当する顧客については、上場会社等の特定有価証券等に係る売買等が( 行われた後、速やかに ・ 行われるまでに )内部者登録カードを備え付けなければならない。",e:"補足: 内部者登録カードは売買が行われるまでに備え付ける。事後では意味がないため。本編5章問15・16がこの入れ替え。"},
{c:9,s:"協会定款・財務諸表",n:4,d:"-",b:1,o:["役職名及び所属部署", "資産の状況"],a:[2],q:"協会員が備え付けなければならない内部者登録カードの記載事項に( 役職名及び所属部署 ・ 資産の状況 )は含まれない。",e:"補足: 内部者登録カードには氏名・住所・生年月日・会社名／役職名／所属部署・上場会社等の名称及び銘柄コードを記載。資産の状況は顧客カード側の項目。問1と対で、2つのカードの記載事項を仕分ける（本編5章問86・87）。"},
{c:9,s:"協会定款・財務諸表",n:5,d:"-",b:1,o:["あらかじめ顧客の承諾を得ていれば可能である", "禁止されている"],a:[2],q:"協会員の従業員が有価証券の取引について、顧客と損益をともにすることを約束して勧誘し、または実行することは( あらかじめ顧客の承諾を得ていれば可能である ・ 禁止されている )。",e:"補足: 顧客と損益をともにすることは、顧客の承諾があっても禁止。「承諾があればOK」は誤り（名義貸与、自己が相手方となる売買なども同様）。本編5章問24と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:6,d:"-",b:1,o:["信用取引", "信用取引及び有価証券関連デリバティブ取引"],a:[1],q:"二種外務員は、所属会員の一種外務員の同行がある場合には、( 信用取引 ・ 信用取引及び有価証券関連デリバティブ取引 )に係る職務を行うことができる。",e:"補足: 同行があればできるのは信用取引・発行日決済取引まで。有価証券関連デリバティブ取引は一種外務員が同行しても不可。この線引きが最頻出（本編5章問39・40）。"},
{c:9,s:"協会定款・財務諸表",n:7,d:"-",b:1,o:["3", "5"],a:[2],q:"協会員は、外務員の登録を受けている者については、( 3 ・ 5 )年目毎の外務員資格更新研修とは別に、毎年外務員の資質の向上のための社内研修を受講させる必要がある。",e:"補足: 資格更新研修は5年目ごと、社内研修は毎年。未受講だと資格の効力停止、さらに180日経過で資格取消し。数字が3つ出るので整理して覚える（本編5章問43〜45）。"},
{c:9,s:"協会定款・財務諸表",n:8,d:"-",b:1,o:["単純な寄託契約", "混蔵寄託契約"],a:[1],q:"協会員が顧客から有価証券の寄託を受ける際に、その有価証券を顧客ごとに個別に保管することになっている寄託は( 単純な寄託契約 ・ 混蔵寄託契約 )による寄託である。",e:"補足: 単純な寄託契約＝顧客ごとに個別保管。混蔵寄託契約＝複数の顧客の分をまとめて保管。ほかに委任契約・質権者・消費寄託契約による寄託もある（本編5章問46）。"},
{c:9,s:"協会定款・財務諸表",n:9,d:"-",b:1,o:["営業部門", "検査、管理等の担当部門"],a:[2],q:"照合通知書は、協会員の( 営業部門 ・ 検査、管理等の担当部門 )が作成することになっており、顧客から照合通知書の記載内容について照会があったときは、その作成者が受け付け、遅滞なく回答を行わなければならない。",e:"補足: 照合通知書は検査・監査・管理の担当部門が作成する。営業部門が作ると牽制が効かないため。本編5章問56と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:10,d:"-",b:1,o:["直接手渡し", "郵送"],a:[2],q:"協会員は、契約締結時交付書面を交付する時は、原則として当該顧客に( 直接手渡し ・ 郵送 )する必要がある。",e:"補足: 原則は郵送（顧客との連絡を確保するため）。ただし店頭で直接交付すれば改めて郵送する必要はない。照合通知書も同じ扱い。本編5章問57〜59と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:11,d:"-",b:1,o:["合理的な社内時価", "当該外国株券の前日の終値"],a:[1],q:"協会員が顧客との間で外国株券の国内店頭取引を行う際には、( 合理的な社内時価 ・ 当該外国株券の前日の終値 )を基準とした適正価格により取引を行わなければならない。",e:"補足: 基準は社内時価（合理的な方法で算出された時価）。「本国市場の前日終値」とするのがひっかけ。本編5章問77と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:12,d:"-",b:1,o:["必要がある", "必要はない"],a:[1],q:"協会員は、外国投資信託証券が選別基準に適合しなくなった場合、顧客から買戻しの取次ぎや解約の取次ぎの注文があったときは、これに応じる( 必要がある ・ 必要はない )。",e:"補足: 選別基準を満たさなくなっても、既に保有している顧客の買戻し・解約の取次ぎには応じなければならない。新規勧誘ができなくなるだけ。本編5章問79と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:13,d:"-",b:1,o:["営業部門", "管理部門"],a:[2],q:"協会員は、その役職員が法人関係情報を取得した場合、当該情報を( 営業部門 ・ 管理部門 )に報告するなど、法人関係情報を取得した際の手続きに関する社内規則を定めなければならない。",e:"補足: 法人関係情報の報告先は管理部門。営業部門に流すとインサイダー取引につながるため、むしろ物理的に隔離する。本編5章問82、6章にも同趣旨あり。"},
{c:9,s:"協会定款・財務諸表",n:14,d:"-",b:1,o:["含まれる", "含まれない"],a:[1],q:"生産過程の途中にある原材料や仕掛品は、棚卸資産に( 含まれる ・ 含まれない )。",e:"補足: 棚卸資産には製品・商品だけでなく仕掛品・原材料も含まれる。本編2章問7と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:15,d:"-",b:1,o:["流動負債", "固定負債"],a:[2],q:"貸借対照表において、退職給付に係る負債は( 流動負債 ・ 固定負債 )に分類される。",e:"補足: 退職給付に係る負債は固定負債。支払いが1年以内に来ないため。流動負債は支払手形・買掛金・短期借入金など。本編2章問9・10と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:16,d:"-",b:1,o:["販売費及び一般管理費", "営業外費用"],a:[2],q:"損益計算書において、支払利息は( 販売費及び一般管理費 ・ 営業外費用 )に分類される。",e:"補足: 支払利息は本業以外（財務活動）の費用なので営業外費用。受取利息・受取配当金は営業外収益。本編2章問15・16と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:17,d:"-",b:1,o:["40%", "60%"],a:[2],q:"貸借対照表が下記の内容である場合、自己資本比率は( 40% ・ 60% )となる。 流動資産5,500、固定資産9,500、流動負債2,000、固定負債4,000（単位：百万円）",e:"自己資本比率 = 9,000 ÷ {5,500＋9,500(又は2,000＋4,000＋9,000)} × 100 補足: まず自己資本を逆算する。総資産＝5,500＋9,500＝15,000、負債＝2,000＋4,000＝6,000 なので 自己資本＝15,000－6,000＝9,000。自己資本比率＝9,000÷15,000×100＝60%。自己資本が問題文に直接書かれていない点がポイント。本編2章問41・42と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:18,d:"-",b:1,o:["22%", "45%"],a:[2],q:"損益計算書における当期純利益が600億円である。当期の中間配当が120億円、期末配当が150億円である場合、配当性向は( 22% ・ 45% )となる。",e:"（120+150）÷ 600 × 100 = 45% 補足: 配当性向＝配当金（年額）÷当期純利益×100。年額なので中間配当と期末配当を足す。分母を経常利益にしたり、中間配当を忘れたりするのがひっかけ。本編2章問25・47と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:19,d:"-",b:1,o:["6.5回", "15.3回"],a:[1],q:"総資本は8,000万円である。当期の売上高が52,000万円である場合、総資本回転率は( 6.5回 ・ 15.3回 )となる。",e:"52,000 ÷ 8,000 = 6.5回 補足: 総資本回転率＝売上高÷総資本。分母分子を逆にすると誤答。なお総資本回転期間（月）＝12÷回転率。本編2章問43・44と同じ論点。"},
{c:9,s:"協会定款・財務諸表",n:20,d:"-",b:1,o:["32,727万円", "40,000万円"],a:[2],q:"損益計算書から求めたデータが下記の内容である場合、損益分岐点売上高は( 32,727万円 ・ 40,000万円 )となる。 売上高52,000、変動費28,600、固定費18,000[単位：万円]",e:"18,000 ÷ 0.45 = 40,000万円 補足: 損益分岐点売上高＝固定費÷(1－変動費÷売上高)。変動費率＝28,600÷52,000＝0.55 なので限界利益率＝1－0.55＝0.45。この0.45を出せるかが勝負。本編2章問51と同じ論点。"},
{c:10,s:"証券税制・信用取引",n:1,d:"-",b:1,o:["申告分離課税", "源泉分離課税"],a:[1],q:"所得税における分離課税には「申告分離課税」と「源泉分離課税」の2種類があるが、「株式等の譲渡に係る所得」は( 申告分離課税 ・ 源泉分離課税 )となっている。",e:"補足: 株式等の譲渡所得は申告分離課税。ただし源泉徴収選択口座（問4）を使えば申告不要にできる。"},
{c:10,s:"証券税制・信用取引",n:2,d:"-",b:1,o:["総合課税", "申告分離課税"],a:[1],q:"( 総合課税 ・ 申告分離課税 )を選択した上場株式等に係る配当所得は、配当控除の適用が可能である。",e:"補足: 配当控除が使えるのは総合課税を選んだ場合だけ。申告分離課税を選ぶと配当控除は使えない代わりに、上場株式等の譲渡損失と損益通算できる。"},
{c:10,s:"証券税制・信用取引",n:3,d:"-",b:1,o:["35,000円", "50,000円"],a:[1],q:"本年分の所得状況が下記の内容であった場合、所得税の配当控除の額は( 35,000円 ・ 50,000円 )となる。 ※課税所得金額等1,030万円、うち 配当所得の金額50万円",e:"配当控除の額 = 30万円 × 5% + 20万円 × 10% = 35,000円 補足: 配当控除は課税所得1,000万円が境目。1,000万円を超える部分は5%、1,000万円以下の部分は10%。この例では配当所得50万円のうち、1,000万円を超える30万円分が5%、残り20万円が10%。全額に10%を掛けると誤答（50,000円）。"},
{c:10,s:"証券税制・信用取引",n:4,d:"-",b:1,o:["簡易申告口座", "源泉徴収選択口座"],a:[2],q:"金融商品取引業者において特定口座を設定し、( 簡易申告口座 ・ 源泉徴収選択口座 )の届出を行えば、年間の損益計算は金融商品取引業者が行い、確定申告も不要となる。",e:"補足: 源泉徴収選択口座なら確定申告不要。簡易申告口座は年間取引報告書はもらえるが、確定申告は自分で行う必要がある。"},
{c:10,s:"証券税制・信用取引",n:5,d:"-",b:1,o:["利子所得", "配当所得"],a:[1],q:"公社債投資信託の収益分配金は( 利子所得 ・ 配当所得 )とされる。",e:"補足: 公社債投資信託の分配金は利子所得。株式投資信託の分配金は配当所得。中身が債券か株式かで所得区分が変わる。"},
{c:10,s:"証券税制・信用取引",n:6,d:"-",b:1,o:["225,000円", "600,000円"],a:[1],q:"下記の上場株式を取得し、売却した。本年分の株式等に係る譲渡所得の金額は( 225,000円 ・ 600,000円 )となる。 【6月取得】350円/株で1,000株、【7月取得】200円/株で2,000株、【8月売却】400円/株で1,500株",e:"平均取得単価 = (350円×1,000株)＋(200円×2,000株) ÷ 3,000株 = 250円 譲渡所得 = (400円－250円) × 1,500株 = 225,000円 補足: 譲渡所得は総平均法に準ずる方法で平均取得単価を出してから計算する。先に買った分から売った（先入先出）と考えると誤答になる。"},
{c:10,s:"証券税制・信用取引",n:7,d:"-",b:1,o:["制度信用取引銘柄", "貸借銘柄"],a:[2],q:"証券金融会社から金銭や有価証券を貸し付けてもらうことができる銘柄で、制度信用銘柄の中から取引所が選定した銘柄を( 制度信用取引銘柄 ・ 貸借銘柄 )という。",e:"補足: 貸借銘柄＝制度信用銘柄のうち、さらに証券金融会社から株券も借りられる銘柄。制度信用銘柄の中の一部という包含関係。売り建てができるのは貸借銘柄。"},
{c:10,s:"証券税制・信用取引",n:8,d:"-",b:1,o:["認可", "免許"],a:[2],q:"証券金融会社は、内閣総理大臣の( 認可 ・ 免許 )を受けて、金融商品取引業者に対し信用取引の決済に必要な金銭又は有価証券を、その取引所の決済機構を利用して貸し付ける業務を営む。",e:"補足: 証券金融会社は免許。証券会社は登録、PTS業務は認可。「登録・認可・免許」の3つを主体ごとに整理する（本編13章問15と同じ論点）。"},
{c:10,s:"証券税制・信用取引",n:9,d:"-",b:1,o:["発注", "決済"],a:[1],q:"信用取引には、制度信用取引と一般信用取引があり、顧客は信用取引による売買を( 発注 ・ 決済 )する際に、いずれかの方法を選択する必要がある。",e:"補足: どちらの信用取引にするかは発注時に選ぶ。あとから決済時に選び直すことはできない。"},
{c:10,s:"証券税制・信用取引",n:10,d:"-",b:1,o:["制度信用取引", "一般信用取引"],a:[1],q:"弁済期限を6ヵ月と定めているのは( 制度信用取引 ・ 一般信用取引 )である。",e:"補足: 制度信用取引は6ヵ月と決まっている。一般信用取引は証券会社と顧客の間で自由に決められる（無期限のものもある）。"},
{c:10,s:"証券税制・信用取引",n:11,d:"-",b:1,o:["日歩", "逆日歩"],a:[2],q:"証券金融会社が、貸株超過銘柄の不足する株数を他から調達したときの品貸料を一般に( 日歩 ・ 逆日歩 )といい、金融商品取引業者は、売顧客から徴収し、買顧客に支払う。",e:"補足: 逆日歩（品貸料）は株不足のときに発生し、売り方が払って買い方が受け取る。売り建てしている人にとっては想定外のコストになる。"},
{c:10,s:"証券税制・信用取引",n:12,d:"-",b:1,o:["金利", "品貸料"],a:[1],q:"信用取引において、買付代金を借りた顧客から( 金利 ・ 品貸料 )を徴収する。",e:"補足: 買い方はお金を借りるので金利を払う。売り方は株を借りるので貸株料を払い、株不足なら逆日歩も払う（問11・13）。「買い＝金利、売り＝貸株料」で整理する。"},
{c:10,s:"証券税制・信用取引",n:13,d:"-",b:1,o:["買方", "金融商品取引業者"],a:[2],q:"信用取引貸株料は、売方が株券の借入れに伴う費用として( 買方 ・ 金融商品取引業者 )に支払うものである。",e:"補足: 貸株料の支払先は金融商品取引業者（証券会社）。買方に払う逆日歩（問11）と支払先が違うので混同注意。"},
{c:10,s:"証券税制・信用取引",n:14,d:"-",b:1,o:["買顧客から徴収され売顧客に支払われる", "売顧客から徴収され買顧客に支払われる"],a:[2],q:"配当落調整額が発生する場合は、( 買顧客から徴収され売顧客に支払われる ・ 売顧客から徴収され買顧客に支払われる )。",e:"補足: 配当落調整額は売方が払って買方が受け取る。買方は本来なら配当をもらえた立場なので、その分を補填してもらう、と考えると向きを間違えない。"},
{c:10,s:"証券税制・信用取引",n:15,d:"-",b:1,o:["20%", "30%"],a:[2],q:"金融商品取引業者は、信用取引による売買が成立したときは、売買成立日から起算して3営業日目の日の正午までの業者が指定する日時までに約定価額の( 20% ・ 30% )以上の委託保証金を顧客から徴収しなければならない。",e:"補足: 委託保証金率は約定価額の30%以上（かつ最低30万円）。20%は追証が発生する最低維持率（問20）なので、2つの数字を混同させるのがひっかけ。"},
{c:10,s:"証券税制・信用取引",n:16,d:"-",b:1,o:["全部", "一部のみ"],a:[1],q:"委託保証金は現金の差入を原則とするが、( 全額 ・ 一部のみ )を有価証券で代用することができる。",e:"補足: 委託保証金は全額を有価証券で代用できる（一部に限られない）。ただし代用有価証券は時価そのままではなく代用掛目を掛けて評価される（問19・20）。なお教材では本文が「全額」、選択肢が「全部」と表記が揺れています。"},
{c:10,s:"証券税制・信用取引",n:17,d:"-",b:1,o:["ができる。", "はできない。"],a:[2],q:"顧客は、制度信用取引に係る建株の相場の変動により生じた計算上の利益相当額の委託保証金を引き出すこと( ができる ・ はできない )。",e:"補足: 計算上の利益（評価益）は引き出せない。決済して確定するまでは使えない。逆に評価損が出れば追証の対象になる（問20）。"},
{c:10,s:"証券税制・信用取引",n:18,d:"-",b:1,o:["禁止されている", "禁止されていない"],a:[1],q:"東京証券取引所の規定により、新株予約権証券についての信用取引は、( 禁止されている ・ 禁止されていない )。",e:"補足: 新株予約権証券の信用取引は禁止。"},
{c:10,s:"証券税制・信用取引",n:19,d:"-",b:1,o:["1,000万円", "1,500万円"],a:[1],q:"制度信用取引における約定建株(価額)が6,000万円、委託保証金として現金1,000万円と時価2,500万円の代用有価証券X[代用掛目は80%]を差し入れた。その後、建株に500万円の評価損が発生し、代用有価証券Xの時価も2,000万円まで値下がりした時、新規の建株可能額は( 1,000万円 ・ 1,500万円 )となる。",e:"必要委託保証金＝6,000万円×30%＝1,800万円 保証金残額＝1,000万円＋2,000万円×80%－500万円(建株評価損)＝2,100万円 ∴ 新規の建株可能額＝( 2,100万円－1,800万円 )÷30%＝( 1,000 )万円 補足: 手順は①既存建株に必要な保証金を出す ②値下がり後の時価に掛目を掛け、評価損を引いて保証金残額を出す ③余った分を保証金率30%で割り戻す。代用有価証券は値下がり後の2,000万円に掛目80%を掛ける点に注意。"},
{c:10,s:"証券税制・信用取引",n:20,d:"-",b:1,o:["30万円", "60万円"],a:[2],q:"制度信用取引にてA社株式を1株800円で10,000株買建て、委託保証金として現金100万円と時価180万円の株券を代用有価証券として差し入れた。その後、代用有価証券の時価が150万円に値下がりしたとき、建株の評価損が( 30万円 ・ 60万円 )を超えると追加保証金が必要となる。 (注) 委託保証金徴収率:30%、代用掛目:80%",e:"最低維持委託保証金＝800円×10,000円×20%＝160万円 [追証ライン] 委託保証金残額＝100万円＋150万円×80%＝220万円 ∴ 220万円－160万円＝( 60 )万円を超える評価損が発生した場合 [A社株が740円未満の時]に追証発生。 補足: 追証のラインは20%（新規建てに必要な30%とは別の数字）。余裕額220万－160万＝60万円を超える評価損が出ると追証。問15の30%と混同しないこと。なお教材の式の「10,000円」は10,000株の誤植です。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:1,d:"-",b:1,o:["行われる", "行われない"],a:[2],q:"金利スワップは、取引者Aと取引者Bが同一通貨間で異なる種類の金利を交換する取引であり、元本の交換は( 行われる ・ 行われない )。",e:"補足: 金利スワップは元本の交換を行わない（想定元本を基準に金利部分だけ交換）。元本も交換するのは通貨スワップ（問3）。ここが2つの違い。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:2,d:"-",b:1,o:["フロア", "キャップ"],a:[2],q:"将来の市場金利の上昇に備えるヘッジ取引として、金利デリバティブの( フロア ・ キャップ )を利用する。",e:"補足: キャップ＝金利の上限を設定＝金利上昇に備える。フロア＝下限を設定＝金利低下に備える。「キャップ＝ふた＝上限」でイメージする。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:3,d:"-",b:1,o:["同一通貨間", "異なる通貨間"],a:[2],q:"通貨スワップは、取引者Aと取引者Bが( 同一通貨間 ・ 異なる通貨間 )でキャッシュ・フロー[元本及び金利]を、予め合意した為替レートで交換する取引である。",e:"補足: 通貨スワップは異なる通貨間で、元本も金利も交換する。同一通貨で金利だけ交換するのが金利スワップ（問1）。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:4,d:"-",b:1,o:["バイヤーからセラー", "セラーからバイヤー"],a:[2],q:"クレジット・デフォルト・スワップは、クレジット・イベントが発生したとき、その損失に相当する金額をプロテクションの( バイヤーからセラー ・ セラーからバイヤー )に支払う取引である。",e:"補足: CDSはプロテクション（保険）の買い手が保険料を払い、事故が起きたら売り手から支払いを受ける。損失補填の流れはセラー→バイヤー。保険と同じ構造で考える。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:5,d:"-",b:1,o:["冷夏", "猛暑"],a:[2],q:"天候デリバティブは、異常気象や天候不順などを原因とする利益の減少リスクをヘッジするための商品であり、一定の観測期間における累積CDDが大きくなれば、夏期であれば( 冷夏 ・ 猛暑 )となる。",e:"補足: CDD（Cooling Degree Days＝冷房が必要な度合い）が大きい＝猛暑。冷房度日と考えれば向きを間違えない。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:6,d:"-",b:1,o:["している場合に限り", "していなくても"],a:[2],q:"地震オプションは、実際に損害が発生( している場合に限り ・ していなくても )決済金が支払われる。",e:"補足: 地震オプションは実損の有無にかかわらず、あらかじめ決めた震度等の条件を満たせば支払われる。実損を査定する損害保険との違い。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:7,d:"-",b:1,o:["値下がり", "値上がり"],a:[1],q:"売りヘッジとは、現物の( 値下がり ・ 値上がり )に備えたヘッジのことである。",e:"補足: 現物を持っている人は値下がりが怖いので、先物を売っておく＝売りヘッジ。これから買う予定の人は値上がりが怖いので買いヘッジ。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:8,d:"-",b:1,o:["アービトラージ", "スペキュレーション"],a:[1],q:"先物と現物又は先物と先物の間の価格関係の「歪み」を利用して利益を狙う取引を( アービトラージ ・ スペキュレーション )取引という。",e:"補足: アービトラージ＝裁定取引（価格の歪みを利用、理論上ほぼリスクなし）。スペキュレーション＝投機（相場観で張る）。ヘッジ・裁定・投機の3分類で整理する。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:9,d:"-",b:1,o:["投機利益獲得の機会", "リスク回避の手段"],a:[2],q:"先物市場は、ヘッジャーに対しては( 投機利益獲得の機会 ・ リスク回避の手段 )を提供している。",e:"補足: ヘッジャーにとっての先物市場はリスク回避の手段。問10のスペキュレーターと対になっている。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:10,d:"-",b:1,o:["投機利益獲得の機会", "裁定利益獲得の機会"],a:[1],q:"先物市場は、スペキュレーターに対しては( 投機利益獲得の機会 ・ 裁定利益獲得の機会 )を提供している。",e:"補足: スペキュレーターには投機利益獲得の機会。裁定利益はアービトラージャーのもの（問8）。3者の役割を取り違えさせるのがひっかけ。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:11,d:"-",b:1,o:["インターマーケットスプレッド", "カレンダースプレッド"],a:[2],q:"先物取引において、同一商品で限月の異なる先物の価格差が一定の水準近辺で動くことを利用した取引を、( インターマーケットスプレッド ・ カレンダースプレッド )取引という。",e:"補足: カレンダースプレッド＝同一商品で限月違い（＝時間軸なのでカレンダー）。インターマーケットスプレッドは異なる市場・商品間のスプレッド。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:12,d:"-",b:1,o:["第2金曜日", "第2金曜日の前営業日"],a:[2],q:"指数先物取引の取引最終日は、各限月の( 第2金曜日 ・ 第2金曜日の前営業日 )である。",e:"補足: 取引最終日は第2金曜日の前営業日。第2金曜日そのものはSQ日（特別清算指数の算出日）。1日ずらすのがひっかけ。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:13,d:"-",b:1,o:["取引最終日", "取引最終日の翌営業日"],a:[2],q:"TOPIX先物、日経225先物ともに、新限月の取引開始日は直近の限月の( 取引最終日 ・ 取引最終日の翌営業日 )である。",e:"補足: 新限月は直近限月の取引最終日の翌営業日から。問12と同じく「翌営業日」がつくかどうかを問う形。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:14,d:"-",b:1,o:["1,000", "10,000"],a:[1],q:"日経225先物の取引単位は、日経平均株価の数値に( 1,000 ・ 10,000 )を乗じて得た額である。",e:"補足: 日経225先物（ラージ）の取引単位は日経平均×1,000倍。問20の計算でもこの1,000倍を使う。なおミニは100倍。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:15,d:"-",b:1,o:["10円", "100円"],a:[1],q:"日経225先物の呼値の単位は( 10円 ・100円 )である。",e:"補足: 日経225先物（ラージ）の呼値の単位は10円。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:16,d:"-",b:1,o:["3%", "6%"],a:[2],q:"長期国債先物取引の対象商品は、取引単位が額面1億円、利率年( 3% ・ 6% )、償還期間10年の長期国債標準物である。",e:"補足: 長期国債標準物は利率年6%・償還期間10年・額面1億円の架空の債券。実在する銘柄ではなく標準化された商品である点がポイント。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:17,d:"-",b:1,o:["サーキットブレーカー", "ギブアップ"],a:[2],q:"先物取引において、注文の執行業務とポジション・証拠金の管理などの清算業務を異なった取引参加者に依頼することができる制度を( サーキットブレーカー ・ ギブアップ )制度という。",e:"補足: ギブアップ制度＝執行と清算を別の業者に分ける仕組み。サーキットブレーカーは相場が急変したときに取引を一時中断する制度で、まったく別物。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:18,d:"-",b:1,o:["差金決済のみ", "差金決済及び受渡決済"],a:[2],q:"長期国債先物取引[ミニ取引を除く]の決済方法は、( 差金決済のみ ・ 差金決済及び受渡決済 )である。",e:"補足: 長期国債先物は差金決済と受渡決済の両方がある（現物の国債が存在するため）。株価指数先物は現物がないので差金決済のみ。この違いがひっかけ。"},
{c:11,s:"特定店頭デリバティブ・先物取引",n:19,d:"-",b:1,o:["19,880円", "20,120円"],a:[1],q:"日経平均株価が20,000円で、日経平均株価の配当利回りが2%(年率)、短期金利が0.5%のとき、146日後に満期の来る日経225先物の理論価格は( 19,880円 ・ 20,120円 )である。",e:"20,000円×{ 1+( 0.005－0.02 ) × } ＝ 19,880円 補足: 理論価格＝現物価格×{1＋(短期金利－配当利回り)×日数/365}。ここでは 20,000×{1＋(0.005－0.02)×146/365}＝20,000×(1－0.006)＝19,880円。金利より配当利回りが高いと理論価格は現物を下回る。なお教材の式は日数按分の分数（146/365）が印刷されておらず空白になっています。"},

const MUST_TITLES={"1": "経済・金融・財政の常識", "2": "会社法", "3": "株式業務", "4": "債券業務①", "5": "債券業務②・取引所定款", "6": "投資信託・付随業務", "8": "金融商品取引法・販売法", "9": "協会定款・財務諸表", "10": "証券税制・信用取引", "11": "特定店頭デリバティブ・先物取引"};
/* ===== 問題データ ここまで ===== */

const KEY="gaimuin-drill-v2", OLD="gaimuin-drill-v1", BANKKEY="gaimuin-bank";

/* 出題する問題集。"main"＝本編、"must"＝別冊の必須問題集。
   必須問題バンクが空のうちは MUSTQ が空配列になり、切り替えボタンも出ない。
   解答記録は qid() で必須側に "m" を付けて分けているので、
   切り替えても互いの要復習リスト・まちがい履歴は混ざらない。 */
const MUSTQ=(typeof Q_MUST!=="undefined")?Q_MUST:[];
const HAS_MUST=MUSTQ.length>0;
function bankPref(){try{return localStorage.getItem(BANKKEY)}catch(e){return null}}
let bank=(HAS_MUST&&bankPref()==="must")?"must":"main";
let Q=bank==="must"?MUSTQ:Q_ALL;
let S=load(), filt={ch:[],dif:[],only:"all",type:"all"}, size=10, order="mix", openSet=false, askReset=false;

/* 章と難易度は問題データから自動で作る。章が増えたら勝手に選択肢も増える。
   章の名前は CHAPTER_TITLES（章見出しそのもの）を使う。無ければ、節（q.s）を
   つなげた名前にフォールバックする（節が多い章だと長くなるので最後の手段）。 */
function bankTitles(){
  const t=bank==="must"?(typeof MUST_TITLES!=="undefined"?MUST_TITLES:{})
                       :(typeof CHAPTER_TITLES!=="undefined"?CHAPTER_TITLES:{});
  return t||{};
}
function chapterList(){const t=bankTitles();
  return [...new Set(Q.map(q=>q.c))].sort((a,b)=>a-b).map(c=>({
    c, name:t[c]||[...new Set(Q.filter(q=>q.c===c).map(q=>q.s))].join("・"),
    n:Q.filter(q=>q.c===c).length}));}
function diffList(){return [...new Set(Q.map(q=>q.d))].sort().map(d=>({
  d, n:Q.filter(q=>q.d===d).length}));}
let CHAPTERS=chapterList(), DIFFS=diffList();

/* 問題集を切り替える。条件はいったん全解除する（章番号の意味が変わるため） */
function setBank(b){
  if(bank===b)return;
  bank=b; Q=(b==="must")?MUSTQ:Q_ALL;
  CHAPTERS=chapterList(); DIFFS=diffList();
  filt={ch:[],dif:[],only:"all",type:"all"}; openSet=false; askReset=false;
  try{localStorage.setItem(BANKKEY,b)}catch(e){}
  view="home"; render();
}
let sess=[],idx=0,hit=0,miss=[],cleared=[],picked=null,run=0,best=0,marks=[],states=[],picks=[];
/* 選択肢つきの問題かどうか。o（選択肢）を持っていればそう。 */
function isMC(q){return Array.isArray(q.o)}
/* 選択肢の数で呼び分ける。小テストは2択、問題集は五肢選択。 */
function mcLabel(q){return q.o.length===5?"五肢選択":q.o.length+"択"}
/* 章の呼び方。必須問題集は「章」ではなく小テストの通し番号。 */
function chLabel(c){return bank==="must"?"小テスト"+c:c+"章"}
function ansText(q){return isMC(q)?q.a.join("・"):(q.a?"○":"×")}

/* AIに質問するとき用に、問題・答え・解説をひとかたまりの文章にする */
function aiText(q){
  const L=[];
  L.push("証券外務員一種試験の勉強中です。以下の問題がよくわからないので、なぜこの答えになるのか、わかりやすく解説してください。");
  L.push("");
  L.push(`【問題】（${bank==="must"?"必須問題集 ":""}${chLabel(q.c)} ${q.s} 問${q.n}・${isMC(q)?mcLabel(q):"○×問題"}）`);
  L.push(q.q);
  if(q.t&&q.t.length){L.push("");q.t.forEach(r=>L.push(r.join("｜")))}
  if(isMC(q)){L.push("");L.push("【選択肢】");q.o.forEach((t,i)=>L.push(`${i+1}. ${t}`))}
  L.push("");
  L.push(`【正解】${ansText(q)}`);
  L.push("");
  L.push("【問題集の解説】");
  L.push(q.e);
  return L.join("\n");
}
function copyAI(q,btn){
  const t=aiText(q);
  const done=()=>{const old=btn.textContent;btn.textContent="コピーしました！";
    setTimeout(()=>{btn.textContent=old},1500)};
  const fallback=()=>{
    try{
      const ta=document.createElement("textarea");ta.value=t;
      ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    }catch(e){}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(fallback);
  }else fallback();
}

let view="home";
const app=document.getElementById("app");

/* 記録: {seen, wrong, last}。要復習 = last===0。正解すれば外れる。 */
function load(){
  try{
    const cur=JSON.parse(localStorage.getItem(KEY));
    if(cur)return cur;
    const old=JSON.parse(localStorage.getItem(OLD));
    if(old){ /* 旧バージョンの記録から引き継ぐ */
      const m={};
      Object.keys(old).forEach(k=>{const r=old[k];
        m[k]={seen:r.seen||0,wrong:r.wrong||0,last:(r.box>0?1:(r.seen?0:1))}});
      return m;
    }
  }catch(e){}
  return {};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* 必須問題集の問題は b:1 を持つので "m6-49" になる。本編は今までどおり "6-49" のまま
   （接頭辞を付けないので、これまでの解答記録がそのまま生きる）。 */
function qid(q){return (q.b?"m":"")+q.c+"-"+q.n}
/* いま開いている問題集の記録だけ消す。もう一方の問題集の履歴は残す */
function resetBank(){
  const mine=new Set(Q.map(qid));
  Object.keys(S).forEach(k=>{if(mine.has(k))delete S[k]});
  save();
}
function rec(q){return S[qid(q)]}
function todo(q){const r=rec(q);return !!(r&&r.last===0)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function qtable(q){
  if(!q.t||!q.t.length)return "";
  return `<table class="qtb"><tbody>${q.t.map(row=>
    `<tr>${row.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function stateOf(q){const r=rec(q);
  if(!r)return{k:"new",t:"はじめて"};
  if(r.last===0)return{k:"todo",t:r.wrong>1?"要復習 "+r.wrong+"回目":"要復習"};
  if(r.wrong>0)return{k:"clear",t:"クリア済み"};
  return{k:"ok",t:"正解ずみ"}}

/* 章・難易度・形式でしぼった範囲。ホームの数字はこれを母数にする。
   「対象」（要復習だけ等）は3つの数字のどれを引くかの指定なので、ここには含めない。
   含めると「要復習だけ」を選んだとき要復習以外が0になり、数字が意味を失う。 */
function scopePool(){return Q.filter(q=>{
  if(filt.ch.length&&filt.ch.indexOf(q.c)<0)return false;
  if(filt.dif.length&&filt.dif.indexOf(q.d)<0)return false;
  if(filt.type==="mc"&&!isMC(q))return false;
  if(filt.type==="ox"&&isMC(q))return false;
  return true;
})}
function pool(){return scopePool().filter(q=>{
  const r=rec(q);
  if(filt.only==="todo"&&!todo(q))return false;
  if(filt.only==="past"&&!(r&&r.wrong>0))return false;
  if(filt.only==="unseen"&&r)return false;
  return true;
})}
/* 範囲・難易度・形式のボタンに出す件数は、他の条件を効かせたうえで数える。
   自分自身の軸（例えば難易度ボタンなら難易度）だけは外す。
   これをしないと「1章に絞ったのに難易度の内訳が全章のまま」になる。 */
function facetPool(exclude){return Q.filter(q=>{
  if(exclude!=="ch"&&filt.ch.length&&filt.ch.indexOf(q.c)<0)return false;
  if(exclude!=="dif"&&filt.dif.length&&filt.dif.indexOf(q.d)<0)return false;
  if(exclude!=="type"){
    if(filt.type==="mc"&&!isMC(q))return false;
    if(filt.type==="ox"&&isMC(q))return false;
  }
  return true;
})}
const TY2={ox:"○×",mc:"五肢選択"};
function scopeLabel(){
  const p=[sumCh()];
  if(filt.dif.length)p.push(sumDif());
  if(filt.type!=="all")p.push(TY2[filt.type]);
  return p.join(" ・ ");
}

function tally(list){let td=0,seen=0,fresh=0,past=0,tries=0,wrongs=0;
  list.forEach(q=>{const r=rec(q);
    if(!r){fresh++;return}
    seen++;tries+=r.seen;wrongs+=r.wrong;
    if(r.wrong>0)past++;
    if(r.last===0)td++});
  return{todo:td,seen,fresh,past,tries,wrongs,total:list.length,
    rate:tries?Math.round((tries-wrongs)/tries*100):null}}

function todoList(){return scopePool().filter(todo)
  .sort((a,b)=>rec(b).wrong-rec(a).wrong||a.c-b.c||a.n-b.n)}
function clearedList(){return scopePool().filter(q=>{const r=rec(q);return r&&r.wrong>0&&r.last===1})
  .sort((a,b)=>rec(b).wrong-rec(a).wrong||a.c-b.c||a.n-b.n)}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const p=pool(), n=Math.min(size,p.length);
  if(!n){view="home";openSet=true;render();return}
  let pick;
  if(order==="rand"){
    pick=shuffle(p.slice()).slice(0,n);
  }else{
    const A=shuffle(p.filter(todo));
    const B=shuffle(p.filter(q=>!rec(q)));
    const C=shuffle(p.filter(q=>{const r=rec(q);return r&&r.last===1&&r.wrong>0}));
    const D=shuffle(p.filter(q=>{const r=rec(q);return r&&r.wrong===0}));
    const cap=Math.max(1,Math.ceil(n*0.6));
    pick=A.slice(0,cap);
    const take=a=>{if(pick.length<n)pick=pick.concat(a.slice(0,n-pick.length))};
    take(B); take(A.slice(cap)); take(C); take(D);
    pick=shuffle(pick);
  }
  sess=pick;states=sess.map(stateOf);
  idx=0;hit=0;miss=[];cleared=[];picked=null;run=0;best=0;marks=[];picks=[];
  view="quiz";render();
}
function answer(v){
  if(picked!==null)return;
  const q=sess[idx],was=states[idx]&&states[idx].k;
  const ok=isMC(q)
    ? (v.length===q.a.length&&v.every(x=>q.a.indexOf(x)>=0))
    : ((v===1)===(q.a===1));
  picked=v;marks[idx]=ok?(was==="todo"?"cl":"ok"):"ng";
  if(ok){hit++;run++;best=Math.max(best,run);if(was==="todo")cleared.push(q)}
  else{miss.push(q);run=0}
  const k=qid(q),r=S[k]||{seen:0,wrong:0,last:1};
  r.seen++;r.last=ok?1:0;if(!ok)r.wrong++;
  S[k]=r;save();render();
}
function next(){picked=null;picks=[];idx++;if(idx>=sess.length)view="done";render()}

function h(str){const t=document.createElement("template");t.innerHTML=str.trim();return t.content.firstElementChild}
/* 画面が変わったときだけ先頭へ。同じ画面の描き直し（条件のタップ、解答の判定）では
   見ている位置をそのまま保つ。 */
let lastScreen=null;
function render(){
  const screen=view==="quiz"?"quiz-"+idx:view;
  const y=window.scrollY;
  app.innerHTML="";
  view==="home"?home():view==="quiz"?quiz():view==="log"?log():result();
  if(screen!==lastScreen)window.scrollTo(0,0);
  else window.scrollTo(0,y);
  lastScreen=screen;
}
function card(q,badge,done){
  const r=rec(q);
  const el=h(`<div class="item${done?" done":""}">
    <div class="rowtop">
      <span class="tg">${chLabel(q.c)} ${q.s} 問${q.n}${q.d!=="-"?" ・ "+q.d:""}${isMC(q)?" ・ "+mcLabel(q):""}</span>
      ${badge||(r&&r.wrong?`<span class="cnt">${r.wrong}回まちがえた</span>`:"")}
    </div>
    <p class="qt">${esc(q.q)}</p>
    ${qtable(q)}
    ${isMC(q)?`<p class="qt" style="color:var(--tx2)">${q.o.map((t,i)=>`${i+1}. ${esc(t)}`).join("　")}</p>`:""}
    <p class="an"><b>正しくは ${ansText(q)}</b>　${q.x?`<span class="sup">補足</span>`:""}${esc(q.e)}</p>
  </div>`);
  const cp=h(`<button class="copyai mini" type="button">AIに質問（コピー）</button>`);
  cp.addEventListener("click",()=>copyAI(q,cp));
  el.appendChild(cp);
  return el;
}

const ON={all:"全部から",todo:"要復習だけ",past:"つまずいた問題",unseen:"未着手だけ"};
const TY={all:"",ox:"○×だけ ・ ",mc:"五肢選択だけ ・ "};
function sumCh(){
  if(!filt.ch.length)return "すべての章";
  if(filt.ch.length<=3)return filt.ch.slice().sort((a,b)=>a-b).map(chLabel).join("・");
  return filt.ch.length+"章を選択";
}
function sumDif(){
  if(!filt.dif.length)return "難易度すべて";
  return "難易度 "+filt.dif.slice().sort().join("・");
}

/* ---------- home ---------- */
function bankName(){return bank==="must"?"必須問題集":"全問題"}
function home(){
  app.appendChild(h(`<header class="top"><h1>証券外務員問題集</h1><span class="stamp">${Q.length}問</span></header>`));
  const body=h(`<div class="grow"></div>`);
  /* 別冊の必須問題集がある場合だけ切り替えを出す。無ければ今までどおりの見た目 */
  if(HAS_MUST){
    const sw=h(`<div class="banksw"></div>`);
    [["main","全問題",Q_ALL.length],["must","必須問題集",MUSTQ.length]].forEach(([b,label,n])=>{
      const on=bank===b;
      const btn=h(`<button class="bk${on?" on":""}" type="button" aria-pressed="${on}">${label}<i>${n}問</i></button>`);
      if(!on)btn.addEventListener("click",()=>setBank(b));
      sw.appendChild(btn);
    });
    body.appendChild(sw);
  }
  const sp=scopePool(), t=tally(sp), pc=n=>t.total?n/t.total*100:0;
  body.appendChild(h(`<div class="scope"><span>${scopeLabel()}</span><b>${t.total}問</b></div>`));
  body.appendChild(h(`<div class="tiles">
    <div class="tile bad"><b>${t.todo}</b><span>要復習</span></div>
    <div class="tile good"><b>${t.seen-t.todo}</b><span>解けた</span></div>
    <div class="tile"><b>${t.fresh}</b><span>未着手</span></div>
  </div>`));
  body.appendChild(h(`<div class="track" role="img" aria-label="要復習${t.todo}問、解けた${t.seen-t.todo}問、未着手${t.fresh}問">
    <i class="g1" style="width:${pc(t.seen-t.todo)}%"></i><i class="g2" style="width:${pc(t.todo)}%"></i></div>`));
  body.appendChild(h(`<div class="note"><span>${t.past?"苦手 "+t.past+"問":"苦手 なし"}</span>
    <span>${t.rate!==null?"この範囲で "+t.tries+"回 ・ 正答率 "+t.rate+"％":"まだ解いていません"}</span></div>`));

  const p=pool();
  const bar=h(`<button class="setbar" type="button" aria-expanded="${openSet}">
    <span class="cur"><em>出題する条件</em>${TY[filt.type]||""}${sumCh()} ・ ${sumDif()} ・ ${ON[filt.only]} ・ ${size===999?"全部":size+"問"}</span>
    <span class="arw">${openSet?"閉じる":"変える"}</span></button>`);
  bar.addEventListener("click",()=>{openSet=!openSet;render()});
  body.appendChild(bar);

  if(openSet){
    const panel=h(`<div class="panel"></div>`);
    const grp=(label,key,opts)=>{
      const g=h(`<div class="grp"><span>${label}</span><div class="opts"></div></div>`);
      const box=g.querySelector(".opts");
      opts.forEach(([v,txt,dis])=>{
        const b=h(`<button class="opt" type="button" aria-pressed="${filt[key]===v}" ${dis?"disabled":""}>${txt}</button>`);
        if(!dis)b.addEventListener("click",()=>{filt[key]=v;render()});
        box.appendChild(b);
      });
      return g;
    };
    /* 複数選べる。なにも選ばなければ「すべて」 */
    const multi=(label,key,hint,opts)=>{
      const g=h(`<div class="grp"><span>${label}<i>${hint}</i></span><div class="opts"></div></div>`);
      const box=g.querySelector(".opts");
      const all=h(`<button class="opt" type="button" aria-pressed="${!filt[key].length}">すべて</button>`);
      all.addEventListener("click",()=>{filt[key]=[];render()});
      box.appendChild(all);
      opts.forEach(([v,txt,cnt])=>{
        const on=filt[key].indexOf(v)>=0;
        const b=h(`<button class="opt" type="button" aria-pressed="${on}">${txt}<i>${cnt}</i></button>`);
        b.addEventListener("click",()=>{
          const i=filt[key].indexOf(v);
          if(i>=0)filt[key].splice(i,1);else filt[key].push(v);
          render();
        });
        box.appendChild(b);
      });
      return g;
    };
    const chPool=facetPool("ch"), difPool=facetPool("dif"), typePool=facetPool("type");
    panel.appendChild(multi("範囲","ch","複数えらべます",
      CHAPTERS.map(x=>[x.c,`${chLabel(x.c)} ${x.name}`,chPool.filter(q=>q.c===x.c).length])));
    /* 難易度が1種類しかない教材（小テストなど）では、絞り込みの意味がないので出さない */
    if(DIFFS.length>1)panel.appendChild(multi("難易度","dif","複数えらべます",
      DIFFS.map(x=>[x.d,x.d,difPool.filter(q=>q.d===x.d).length])));
    /* 形式も、○×と選択肢問題が混ざっているときだけ出す */
    if(Q.some(isMC)&&Q.some(q=>!isMC(q))){
      const nMC=typePool.filter(isMC).length, nOX=typePool.length-nMC;
      panel.appendChild(grp("形式","type",[
        ["all","すべて"],["ox",`○× ${nOX}`],["mc",`五肢選択 ${nMC}`]]));
    }
    panel.appendChild(grp("対象","only",[
      ["all","全部"],["todo",`要復習${t.todo?" "+t.todo:""}`,!t.todo],
      ["past",`つまずいた${t.past?" "+t.past:""}`,!t.past],["unseen","未着手",!t.fresh]]));
    const og=h(`<div class="grp"><span>出題順</span><div class="opts"></div></div>`);
    [["mix","要復習を優先"],["rand","完全ランダム"]].forEach(([v,txt])=>{
      const b=h(`<button class="opt" type="button" aria-pressed="${order===v}">${txt}</button>`);
      b.addEventListener("click",()=>{order=v;render()});
      og.querySelector(".opts").appendChild(b);
    });
    panel.appendChild(og);
    const sg=h(`<div class="grp"><span>出題数</span><div class="opts"></div></div>`);
    [10,20,50,999].forEach(v=>{
      const b=h(`<button class="opt" type="button" aria-pressed="${size===v}">${v===999?"全部":v+"問"}</button>`);
      b.addEventListener("click",()=>{size=v;render()});
      sg.querySelector(".opts").appendChild(b);
    });
    panel.appendChild(sg);
    body.appendChild(panel);
  }
  app.appendChild(body);

  const dock=h(`<div class="dock"></div>`);
  const go=h(`<button class="cta" type="button" ${p.length?"":"disabled"}>${p.length?Math.min(size,p.length)+"問 はじめる":"該当する問題がありません"}</button>`);
  go.addEventListener("click",start);
  dock.appendChild(go);
  const lg=h(`<button class="ghost" type="button" ${t.todo||t.past?"":"disabled"}>復習リスト${t.todo?"（要復習 "+t.todo+"問）":""}</button>`);
  if(t.todo||t.past)lg.addEventListener("click",()=>{view="log";render()});
  dock.appendChild(lg);
  if(askReset){
    const g=tally(Q);  /* 消えるのは全範囲なので、絞り込みに関係なく全体の数字を出す */
    const other=HAS_MUST?(bank==="must"?"全問題":"必須問題集"):"";
    const dg=h(`<div class="danger">
      <p>${HAS_MUST?`<b>${bankName()}</b>の記録を`:"いままでの記録を"}<b>すべて</b>消します。絞り込みに関係なく全範囲が対象です。<br>
      要復習 ${g.todo}問、つまずいた記録 ${g.past}問、${g.tries}回ぶんの解答履歴が消えて、最初の状態に戻ります。
      ${other?`<br>${other}の記録は消えません。`:""}</p>
      <div class="row"></div></div>`);
    const yes=h(`<button class="yes" type="button">消す</button>`);
    yes.addEventListener("click",()=>{resetBank();askReset=false;render()});
    const no=h(`<button class="no" type="button">やめる</button>`);
    no.addEventListener("click",()=>{askReset=false;render()});
    dg.querySelector(".row").appendChild(yes);dg.querySelector(".row").appendChild(no);
    dock.appendChild(dg);
  }else{
    const tip=h(`<div class="tip"><span>間違えた問題は要復習に入り、次に正解すると外れます。<br>
      <em>${Q.length}問 ・ ${typeof BUILT!=="undefined"?BUILT:""} 更新</em></span></div>`);
    const rs=h(`<button class="linky" type="button" ${t.seen?"":"disabled"}>記録を消す</button>`);
    if(t.seen)rs.addEventListener("click",()=>{askReset=true;render()});
    tip.appendChild(rs);
    dock.appendChild(tip);
  }
  app.appendChild(dock);
}

/* ---------- 復習リスト ---------- */
function log(){
  const td=todoList(),cl=clearedList();
  app.appendChild(h(`<header class="top"><h1>復習リスト</h1><span class="stamp">要復習 ${td.length}問</span></header>`));
  const body=h(`<div class="grow"></div>`);
  body.appendChild(h(`<div class="scope"><span>${scopeLabel()}</span><b>${scopePool().length}問から</b></div>`));
  if(td.length){
    const box=h(`<div class="list"><h2>要復習 ${td.length}問 ・ 次に正解すれば外れます</h2></div>`);
    td.forEach(q=>box.appendChild(card(q)));
    body.appendChild(box);
  }else{
    body.appendChild(h(`<p class="empty">要復習はゼロ。いま解けない問題はありません。</p>`));
  }
  if(cl.length){
    const box=h(`<div class="list"><h2 class="win">クリア済み ${cl.length}問 ・ つまずいて解き直した</h2></div>`);
    cl.forEach(q=>box.appendChild(card(q,`<span class="done-badge">クリア</span>`,true)));
    body.appendChild(box);
  }
  app.appendChild(body);

  const dock=h(`<div class="dock"></div>`);
  if(td.length){
    const go=h(`<button class="cta" type="button">要復習の${td.length}問を解く</button>`);
    go.addEventListener("click",()=>{filt={ch:[],dif:[],only:"todo",type:"all"};size=999;order="mix";start()});
    dock.appendChild(go);
  }
  const back=h(`<button class="ghost" type="button">戻る</button>`);
  back.addEventListener("click",()=>{view="home";render()});
  dock.appendChild(back);
  app.appendChild(dock);
}

/* ---------- quiz ---------- */
function quiz(){
  const q=sess[idx],st=states[idx]||{k:"new",t:"はじめて"};
  const head=h(`<header class="top"><h1>${idx+1} / ${sess.length}</h1></header>`);
  const quit=h(`<button class="quit" type="button">やめる</button>`);
  quit.addEventListener("click",()=>{view="home";picked=null;render()});
  head.appendChild(quit);
  app.appendChild(head);

  const segs=h(`<div class="segs"></div>`);
  for(let i=0;i<sess.length;i++)segs.appendChild(h(`<i class="${marks[i]||(i===idx?"at":"")}"></i>`));
  app.appendChild(segs);

  const tags=h(`<div class="tags"></div>`);
  tags.appendChild(h(`<span class="tg">${chLabel(q.c)} ${q.s} 問${q.n}</span>`));
  if(q.d!=="-")tags.appendChild(h(`<span class="tg">難易度 ${q.d}</span>`));
  if(isMC(q))tags.appendChild(h(`<span class="tg good">${mcLabel(q)}</span>`));
  if(st.k==="todo")tags.appendChild(h(`<span class="tg hot">${st.t}</span>`));
  else if(st.k==="clear")tags.appendChild(h(`<span class="tg good">クリア済み</span>`));
  if(run>=3)tags.appendChild(h(`<span class="tg run">連続 ${run}</span>`));
  app.appendChild(tags);

  const body=h(`<div class="grow"></div>`);
  body.appendChild(h(`<div class="qcard">${esc(q.q)}${qtable(q)}</div>`));

  if(isMC(q)){
    const need=q.a.length;
    const list=h(`<div class="opts5"></div>`);
    q.o.forEach((txt,i)=>{
      const no=i+1, on=picks.indexOf(no)>=0;
      let cls="op", mk="";
      if(picked!==null){
        const right=q.a.indexOf(no)>=0, chose=picked.indexOf(no)>=0;
        if(right){cls+=" hit";mk=`<span class="mk">正</span>`}
        else if(chose){cls+=" miss";mk=`<span class="mk">誤</span>`}
      }
      const b=h(`<button class="${cls}" type="button" aria-pressed="${on}"${picked!==null?" disabled":""}><span class="no">${no}</span><span>${esc(txt)}</span>${mk}</button>`);
      if(picked===null)b.addEventListener("click",()=>{
        const k=picks.indexOf(no);
        if(k>=0)picks.splice(k,1);else picks.push(no);
        render();
      });
      list.appendChild(b);
    });
    body.appendChild(list);
    if(picked===null)body.appendChild(h(`<div class="pickinfo"><span>${need}つ選んでください</span><span>選択中 <b>${picks.length}</b> / ${need}</span></div>`));
  }
  app.appendChild(body);

  const dock=h(`<div class="dock"></div>`);
  if(picked===null){
    if(isMC(q)){
      const need=q.a.length, ready=picks.length===need;
      const go=h(`<button class="cta" type="button"${ready?"":" disabled"}>${ready?"決定":"あと"+(need-picks.length)+"つ選ぶ"}</button>`);
      if(ready)go.addEventListener("click",()=>answer(picks.slice().sort((a,b)=>a-b)));
      dock.appendChild(go);
    }else{
      const m=h(`<div class="btns"></div>`);
      [[1,"○","正しい"],[0,"×","誤り"]].forEach(([v,g,l])=>{
        const b=h(`<button class="b" type="button" aria-label="${l}"><span class="g">${g}</span><span class="l">${l}</span></button>`);
        b.addEventListener("click",()=>answer(v));
        m.appendChild(b);
      });
      dock.appendChild(m);
    }
  }else{
    const ok=isMC(q)
      ? (picked.length===q.a.length&&picked.every(x=>q.a.indexOf(x)>=0))
      : ((picked===1)===(q.a===1));
    const win=ok&&st.k==="todo";
    const said=win?"クリア！":ok?"正解":"不正解";
    const mine=isMC(q)?(picked.length?picked.join("・"):"なし"):(picked?"○":"×");
    const sub=win?"要復習から外しました　残り "+tally(Q).todo+"問"
      :ok?`答えは ${ansText(q)}`
      :`あなたの答え ${mine} ／ 正しくは ${ansText(q)} ・ 要復習に入れました`;
    const fb=h(`<div class="fb ${ok?"ok":"ng"}${win?" win":""}">
      <div class="head"><span class="glyph">${ok?"○":"×"}</span>
        <span><span class="said">${said}</span><span class="truth">${sub}</span></span></div>
      <p class="exp">${q.x?`<span class="sup">補足</span>`:""}${esc(q.e)}</p>
    </div>`);
    const cp=h(`<button class="copyai" type="button">AIに質問（コピー）</button>`);
    cp.addEventListener("click",()=>copyAI(q,cp));
    fb.appendChild(cp);
    dock.appendChild(fb);
    const c=h(`<button class="cta${win?"":" plain"}" type="button">${idx+1<sess.length?"つづける":"結果を見る"}</button>`);
    c.addEventListener("click",next);
    dock.appendChild(c);
  }
  app.appendChild(dock);
}

/* ---------- result ---------- */
function result(){
  const pct=Math.round(hit/sess.length*100);
  app.appendChild(h(`<header class="top"><h1>結果</h1><span class="stamp">${sess.length}問</span></header>`));
  const body=h(`<div class="grow"></div>`);
  body.appendChild(h(`<div class="score"><b>${hit}<i> / ${sess.length}</i></b>
    <span>正答率 ${pct}％ ・ 最大連続 ${best}問</span></div>`));

  if(cleared.length){
    const box=h(`<div class="list"><h2 class="win">クリア ${cleared.length}問 ・ 要復習から外れました</h2></div>`);
    cleared.forEach(q=>box.appendChild(card(q,`<span class="done-badge">クリア</span>`,true)));
    body.appendChild(box);
  }
  if(miss.length){
    const box=h(`<div class="list"><h2>要復習に入れた ${miss.length}問</h2></div>`);
    miss.forEach(q=>box.appendChild(card(q)));
    body.appendChild(box);
  }
  if(!cleared.length&&!miss.length)body.appendChild(h(`<p class="empty">全問正解。要復習はそのままです。</p>`));
  app.appendChild(body);

  const dock=h(`<div class="dock"></div>`);
  const t=tally(Q);
  dock.appendChild(h(`<div class="note"><span>要復習 ${t.todo}問</span><span>通算正答率 ${t.rate}％</span></div>`));
  const pair=h(`<div class="pair"></div>`);
  const again=h(`<button class="cta" type="button">もう一度</button>`);
  again.addEventListener("click",start);
  const back=h(`<button class="ghost" type="button">ホームへ</button>`);
  back.addEventListener("click",()=>{view="home";render()});
  pair.appendChild(again);pair.appendChild(back);
  dock.appendChild(pair);
  app.appendChild(dock);
}

render();
</script>
</body>
</html>
