{c:6,s:"金融商品取引業者",n:23,d:"C",a:0,q:"金融商品取引業者等は、当該金融商品取引業者等に所属する外務員の負った債務について直接履行する責任を負う必要はない。",e:"金融商品取引業者等は、所属する外務員の負った債務について直接履行する責任を負う"},
{c:6,s:"金融商品取引業者",n:24,d:"B",a:0,q:"金融商品取引業者等は、金融商品取引法に違反する悪質な行為を外務員が行った場合、その行為が代理権の範囲外であれば、その監督責任を免れることができる。",e:"代理権の範囲外であることを理由として、その監督責任を免れることはできない（レジュメP144「証券会社は言い訳できない」）"},
{c:6,s:"金融商品取引業者",n:25,d:"B",x:1,a:1,q:"金融商品取引業者等は、外務員の行った営業行為について責任を負うが、相手方である顧客に悪意があるときには金融商品取引業者等の責任は免責される。",e:"顧客が外務員の行為が権限外であることを知っていた（悪意）場合の免責規定（レジュメP144。例：退職した元職員だと客観的に分かっていた場合など）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:26,d:"C",a:0,q:"金融商品取引業者等が広告等を行う場合、広告等には当該金融商品取引業者等の商号や名称、氏名などを表示しなければならないが、当該金融商品取引業者等の登録番号は表示する必要はない。",e:"金融商品取引業者等の登録番号も表示しなければならない"},
{c:6,s:"金融商品取引業者等の行為規制",n:27,d:"C",x:1,a:1,q:"広告規制の対象となる広告等は、郵便、信書便、ファクシミリ、電子メール又はビラ・パンフレットの配布等の多数の者に対して同様の内容で行う情報の提供であれば、その範囲に含まれる。",e:"広告規制の対象となる媒体の範囲（多数の者への同一内容の情報提供）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:28,d:"B",a:0,q:"広告等の表示事項には、手数料等、元本の損失のおそれがあることや元本を上回る損失が生じるおそれがある旨があるが、その理由等については特に義務付けられていない。",e:"手数料等、元本損失のおそれがあることや元本を上回る損失が生じるおそれがある旨や、その原因となる指標やその理由についても表示しなければならない"},
{c:6,s:"金融商品取引業者等の行為規制",n:29,d:"B",x:1,a:1,q:"広告等におけるリスク情報については、当該広告で使用される最も大きな文字・数字と著しく異ならない大きさで表示しなければならない。",e:"リスク表示の文字サイズ規制（強調表示との著しい大小差を禁止）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:30,d:"B",a:0,q:"金融商品取引業者等は、金融商品取引契約を締結しようとするときは、あらかじめ、すべての顧客に対して契約締結前交付書面を交付しなければならない。",e:"顧客が特定投資家である場合は、契約締結前交付書面の交付義務の対象から除かれる"},
{c:6,s:"金融商品取引業者等の行為規制",n:31,d:"B",x:1,a:1,q:"契約締結前交付書面の記載事項として、手数料や報酬に関する事項が含まれる。",e:"契約締結前交付書面の記載事項の1つ（手数料等）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:32,d:"A",x:1,a:1,q:"金融商品取引所に上場されている有価証券の売買等（デリバティブ取引・信用取引等を除く。）については、金融商品取引契約の締結前1年以内にその顧客に対して上場有価証券等書面を交付していれば、契約締結前交付書面を交付する必要はない。",e:"上場有価証券等書面による契約締結前交付書面の省略規定（締結前1年以内の交付が条件）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:33,d:"B",x:1,a:1,q:"契約締結前交付書面にクーリング・オフの規定の適用の有無について記載する際は、枠の中に12ポイント以上の大きさの文字・数字を用いて明瞭・正確に記載することが義務付けられている。",e:"クーリング・オフ適用の有無の記載方法（12ポイント以上の文字・数字、枠内表示）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:34,d:"B",a:0,q:"金融商品取引業者等は、金融商品取引契約が成立したときは、遅滞なく、内閣府令で定めるところにより、必ず契約締結時交付書面を作成し、これを顧客に交付しなければならない。",e:"その金融商品取引契約の内容その他の事情を勘案し、書面を交付しなくても公益又は投資者保護のため支障を生ずることがないと認められるものは、この限りではない"},
{c:6,s:"金融商品取引業者等の行為規制",n:35,d:"B",x:1,a:1,q:"契約締結時の書面交付義務に違反した場合には、行政処分の対象になるほか、違反行為者と金融商品取引業者等の両方が処罰の対象になる。",e:"契約締結時交付書面の交付義務違反に対する行政処分・両罰規定。"},
{c:6,s:"金融商品取引業者等の行為規制",n:36,d:"A",x:1,a:1,q:"個人向けの店頭デリバティブ取引の勧誘にあたっては、不招請勧誘及び再勧誘が禁止されている。",e:"個人向け店頭デリバティブ取引特有の厳格な勧誘規制（不招請勧誘・再勧誘の禁止）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:37,d:"C",x:1,a:1,q:"金融商品取引業者等又はその役員若しくは使用人は個人向けの店頭デリバティブ取引について、金融商品取引契約を締結しない旨の意思を表示した者に対して、当該契約の勧誘を継続してはならない。",e:"再勧誘の禁止（問36と同じ規制の一部）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:38,d:"B",a:0,q:"金融商品取引業者等は、最良執行方針等を定めれば、顧客の注文を受ける際に最良執行方針等を記載した書面を顧客（特定投資家を除く。）に交付する必要はない。",e:"最良執行方針等を定めた上で、顧客の注文を受ける際にあらかじめ顧客（特定投資家を除く）に対し最良執行方針等を記載した書面を交付する必要がある"},
{c:6,s:"金融商品取引業者等の行為規制",n:39,d:"C",a:0,q:"金融商品取引業者等は、顧客から預託を受けた有価証券について、自己の固有財産として管理しなければならない。",e:"顧客から預託を受けた有価証券は、自己の固有財産と分別して管理しなければならない"},
{c:6,s:"金融商品取引業者等の行為規制",n:40,d:"C",a:0,q:"金融商品取引業者等は、返還すべき金銭を、顧客分別金として取引所に届け出なければならない。",e:"顧客分別金として、信託会社等に信託しなければならない（「取引所に届け出る」のではない）"},
{c:6,s:"金融商品取引業者等の行為規制",n:41,d:"B",a:0,q:"金融商品取引業者等が顧客の損失を補填するため、財産上の利益を提供する行為は、顧客からの要求があった場合のみ認められている。",e:"顧客からの要求があった場合も禁止されている（損失補填は原則として全面的に禁止）"},
{c:6,s:"金融商品取引業者等の行為規制",n:42,d:"B",a:0,q:"金融商品取引業者等が、有価証券の売買等について顧客に損失が生ずることとなり、又はあらかじめ定めた額の利益が生じないこととなった場合には、これを補填し又は補足するために財産上の利益を提供する旨を、当該顧客に対しあらかじめ申込み又は約束する行為は、実際に利益を提供しなければ禁止の対象とならない。",e:"損失補填を実行しなくても、損失発生前の補填等の申込みや約束をすること自体が禁止されている"},
{c:6,s:"金融商品取引業者等の行為規制",n:43,d:"C",x:1,a:1,q:"有価証券の売買その他の取引等について生じた顧客の損失を補填し、又は利益を追加するため、当該顧客に対し、財産上の利益を提供する行為は、金融商品取引業者等が第三者を通じて行った場合でも禁止の対象となる。",e:"第三者を介した損失補填も禁止の対象（脱法的な間接補填も規制）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:44,d:"B",a:0,q:"金融商品取引業者等が、特定投資家との間で取引を行う場合は、すべての行為規制は適用除外とされている。",e:"特定投資家との間で取引を行う場合でも、損失補填の禁止や断定的判断の提供の禁止といった市場の公正確保を目的とする行為規制は適用除外とはならない（レジュメP149「覚・必ず」：情報格差の是正を目的とする規制は適用除外だが、損失補填・断定的判断提供等の禁止は適用除外不可）"},
{c:6,s:"金融商品取引業者等の行為規制",n:45,d:"B",x:1,a:1,q:"金融商品取引業者等が、特定投資家との間で取引を行う場合は、契約締結前書面を交付する必要はないとされている。",e:"契約締結前交付書面・最良執行方針等記載書面の事前交付義務は、情報格差是正を目的とする規制として特定投資家には適用除外となる（問30・問44参照、レジュメP149）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:46,d:"C",a:0,q:"金融商品取引業者等は、内閣総理大臣に届け出ることにより、自己の名義をもって、他人に金融商品取引業を営ませることができる。",e:"このような規定はなく、自己の名義をもって、他人に金融商品取引業を営ませる名義貸しは禁止されている"},
{c:6,s:"金融商品取引業者等の行為規制",n:47,d:"B",a:0,q:"有価証券関連業務を行う金融商品取引業者は、社債管理者、社債管理補助者又は担保付社債信託契約の受託会社になることができる。",e:"有価証券関連業務を行う金融商品取引業者は、社債管理者、社債管理補助者又は担保付社債信託契約の受託会社になることができない"},
{c:6,s:"金融商品取引業者等の行為規制",n:48,d:"B",x:1,a:1,q:"金融商品取引業者が、引受けに関する自己の取引上の地位を維持し又は有利ならしめるため、著しく不適当と認められる数量、価格その他の条件により有価証券の引受けを行うことは禁じられている。",e:"引受けに関する不適当な条件による取引の禁止。"},
{c:6,s:"金融商品取引業者等の行為規制",n:49,d:"B",a:0,q:"有価証券の引受人となった金融商品取引業者は、その有価証券を売却する場合において、引受人となった日から3か月を経過する日までは、その買主に対し買付代金を貸し付けてはならないものとされている。",e:"「3か月」ではなく「6か月」を経過するまでは、買付代金を貸し付けてはならない"},
{c:6,s:"金融商品取引業者等の行為規制",n:50,d:"C",a:0,q:"不特定多数の投資者から委任を受けて一括して売買等の発注を行う投資顧問業者ないし投資グループ等から注文を受ける場合は、相手が専門的な知識を有していることから、当該不特定多数の投資者の意思を確認する必要はない。",e:"このような場合であっても、あらかじめその投資者の意思を確認しなければならない"},
{c:6,s:"金融商品取引業者等の行為規制",n:51,d:"C",a:0,q:"金融商品取引業者等又はその役職員が、顧客に断定的判断を提供して勧誘することの禁止規定は、当該顧客の有価証券の買付けに係る勧誘についてのみ適用され、当該顧客の有価証券の売付けに係る勧誘については適用されない。",e:"断定的判断を提供して勧誘することの禁止規定は、有価証券の買付けに係る勧誘及び売付けに係る勧誘の両方について適用される"},
{c:6,s:"金融商品取引業者等の行為規制",n:52,d:"B",a:0,q:"断定的判断を提供した業者は、それによって顧客が被った損害を賠償する責任を負うこととなっている。",e:"「必ず」とか「きっと」といった断定的な表現を使って勧誘すること自体が違法行為となる（結果的に的中して顧客の利益につながったとしても違法）のであり、問題文のような損害賠償責任の規定ではない"},
{c:6,s:"金融商品取引業者等の行為規制",n:53,d:"C",a:0,q:"「誤解を生ぜしめる表示」とは、積極的に誤解を生じさせるような表現がこれにあたり、特に必要な表示を欠くような場合はこれに含まれない。",e:"「誤解を生ぜしめる表示」には、積極的な表現だけでなく、特に必要な表示を欠く不作為も含まれる"},
{c:6,s:"金融商品取引業者等の行為規制",n:54,d:"C",a:0,q:"虚偽表示行為等は禁止されているが、この「表示」には、口頭、文書及び図画が該当し、放送や映画等による表示は含まれない。",e:"禁止される表示方法には、口頭、文書及び図画だけでなく、放送や映画等による表示も含まれる（問41参照）"},
{c:6,s:"金融商品取引業者等の行為規制",n:55,d:"B",x:1,a:1,q:"金融商品取引契約の締結又はその勧誘に関し、虚偽の表示をし、又は投資家の投資判断に重大な影響を及ぼす重要な事項について誤解を生ぜしめるような表示をすることは禁じられているが、これは表示行為自体を禁止しており、故意・過失の有無を問わないとされている。",e:"虚偽表示・誤解を生ぜしめる表示の禁止は結果責任的な規制で、故意・過失を問わない（問37参照）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:56,d:"B",x:1,a:1,q:"金融商品取引につき、顧客に対して特別の利益を提供することを約して勧誘することは禁止されているが、公開株を優先的に割り当てる等の行為は特別の利益提供に該当する。",e:"公開株の優先割当てや、不当に安い値段での有価証券販売の特約などが特別の利益提供にあたる（問19・57参照）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:57,d:"B",a:0,q:"金融商品取引業者等又はその役職員は、金融商品取引につき、顧客若しくはその指定した者に対して特別の利益を提供することを約束して勧誘してはならないが、特別の利益には社会通念上サービスと考えられるものも含まれる。",e:"特別の利益には、社会通念上サービスと考えられるものは含まれない"},
{c:6,s:"金融商品取引業者等の行為規制",n:58,d:"B",a:0,q:"金融商品取引業者等又はその役職員が、特定かつ少数の銘柄の有価証券又はデリバティブ取引を不特定かつ多数の顧客に対し、その売買等を一定期間継続して一斉かつ過度に勧誘し、公正な価格形成を損なうおそれがある行為をすることは、その銘柄が現にその金融商品取引業者等が保有している有価証券である場合を除き、禁止されている。",e:"その銘柄が現にその金融商品取引業者等が保有している有価証券である場合は、除外されるのではなく特に厳しく禁止されている"},
{c:6,s:"金融商品取引業者等の行為規制",n:59,d:"B",x:1,a:1,q:"金融商品取引業者等は、顧客から有価証券の買付けの委託を受けて、その委託売買を成立させる前に自己の計算において、当該有価証券と同一の銘柄の売買を成立させることを目的として、その顧客の委託価格と同一又はそれよりも低い価格で買付けをする行為は禁止されている。",e:"この行為は、金融商品取引業者の注文が顧客注文の前（front）を走っているとの意味で、フロントランニングといわれる（問21・61参照）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:60,d:"B",x:1,a:1,q:"金融商品取引業者等又はその役職員が、主観的な目的の有無を問わず、特定の銘柄の有価証券等について、実勢を反映しない作為的相場が形成されることと知りながら、売買取引の受託等を行うことは禁止されている。",e:"相場操縦的な受託行為の禁止。"},
{c:6,s:"金融商品取引業者等の行為規制",n:61,d:"C",a:0,q:"金融商品取引業者等の役職員が、自己の職務上の地位を利用して、顧客の有価証券の売買等に係る注文の動向その他職務上知り得た特別な情報に基づいて有価証券の売買等を行うことは、投機的利益を得る目的がなければ禁止されない。",e:"投機的利益を得る目的がなくても禁止されている（問21参照）"},
{c:6,s:"金融商品取引業者等の行為規制",n:62,d:"B",a:0,q:"金融商品取引業者等は、自己又はその取締役若しくは執行役との間における取引を行うことを内容とした運用、いわゆる自己取引を行うことは善管注意義務に反するため、いかなる場合も禁止されている。",e:"自己取引を行う行為は、原則禁止だが、一定の例外がある"},
{c:6,s:"金融商品取引業者等の行為規制",n:63,d:"B",x:1,a:1,q:"金融商品取引業者等は、運用財産相互間において取引を行うことを内容とした運用を行うことは、投資者の不利益とならない場合など一定の場合を除き禁止されている。",e:"運用財産間取引は原則禁止だが、投資者保護が確保され、もしくは取引の公正を害するものではなく、又は金融商品取引業の信用を失墜させるおそれがないと内閣府令で定めるものは除外される。"},
{c:6,s:"金融商品取引業者等の行為規制",n:64,d:"B",x:1,a:1,q:"金融商品取引業者等は、投資信託契約を結び当該信託財産を運用する場合、特定の運用財産については、権利者のために運用を行う権限の全部又は一部を他の金融商品取引業者等に委託することができる。",e:"運用権限の再委託（10章の投資信託委託会社の再委託規定と同系統）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:65,d:"B",x:1,a:1,q:"銀行は、金融商品仲介行為を行うことができる。",e:"銀行は金融商品仲介業者（金融商品仲介業）として登録を受け、金融商品仲介行為を行うことができる。"},
{c:6,s:"金融商品取引業者等の行為規制",n:66,d:"C",a:0,q:"登録金融機関又はその役職員は、金銭を貸し付けることを条件として、有価証券の売買の受託等を行うことができる。",e:"問題文のような信用の供与を利用した抱き合わせ的行為は禁止されている"},
{c:6,s:"金融商品取引業者等の行為規制",n:67,d:"C",x:1,a:1,q:"銀行、協同組織金融機関その他政令で定める金融機関以外の者は、法人・個人を問わず、一定の要件を満たせば内閣総理大臣の登録を受けて金融商品仲介業を営むことができる。",e:"金融商品仲介業者は法人・個人（外務員）を問わず登録を受けられる。"},
{c:6,s:"金融商品取引所の適切な運営の確保",n:68,d:"B",x:1,a:1,q:"投資者保護基金の会員となる者は金融商品取引業者に限定されるが、第一種金融商品取引業者は原則としていずれか1つの基金に加入しなければならない。",e:"投資者保護基金（日本投資者保護基金）への加入義務。"},
{c:6,s:"金融商品取引所の適切な運営の確保",n:69,d:"B",x:1,a:1,q:"投資者保護基金の補償対象者には、適格機関投資家は含まれない。",e:"プロである適格機関投資家は自己責任で対応できるため補償対象から除外される。"},
{c:6,s:"金融商品取引所の適切な運営の確保",n:70,d:"B",a:0,q:"投資者保護基金の補償限度額は、顧客1人当たり3,000万円とされている。",e:"補償限度額は顧客1人当たり1,000万円とされている"},
{c:6,s:"金融商品取引所の適切な運営の確保",n:71,d:"B",a:0,q:"投資者保護基金の補償対象となる債権に、信用取引に係る保証金及び保証金代用有価証券は含まれない。",e:"投資者保護基金の補償対象となる債権には、先物取引の証拠金、信用取引の保証金（金銭・代用有価証券）などが含まれる"},
{c:6,s:"金融商品取引所の適切な運営の確保",n:72,d:"B",x:1,a:1,q:"投資者保護基金の補償対象となる債権には、原則として不法行為に基づく損害賠償請求権は含まれない。",e:"補償対象は金融商品取引業者の破綻等により返還されるべき顧客資産に関する債権が中心で、不法行為に基づく損害賠償請求権は原則含まれない。"},
{c:6,s:"金融商品取引所の適切な運営の確保",n:73,d:"B",a:0,q:"株式会社金融商品取引所の株主となるための資格には、金融商品取引法上の制限はない。",e:"株式会社金融商品取引所の株主となるための資格には、金融商品取引法上の制限がある（議決権保有比率の規制等）。"},
{c:6,s:"金融商品取引所の適切な運営の確保",n:74,d:"C",x:1,a:1,q:"証券金融会社が行う一般貸付けとは、金融商品取引業者又はその顧客に対し、有価証券又は金銭を担保として金銭又は有価証券を貸し付けることをいう。",e:"証券金融会社の一般貸付け（信用取引の貸借取引とは別の一般的な貸付け）の定義。"},
{c:6,s:"金融商品取引所の適切な運営の確保",n:75,d:"B",a:0,q:"金融商品取引清算機関とは、信用取引の決済に必要な金銭又は有価証券を、その金融商品取引所が開設する取引所金融商品市場の決済機構を利用して貸し付ける業務を行う会社で、内閣総理大臣の免許を受けた者のことである。",e:"記述は証券金融会社の説明。金融商品取引清算機関は、内閣総理大臣の免許又は承認を受け、金融商品債務引受業等及びこれに付帯する業務を行う者"},
{c:6,s:"市場阻害行為の規制",n:76,d:"B",a:0,q:"有価証券の売買について、不正の手段、計画又は技巧などの不公正取引を行った場合、違反者には課徴金制度のみが適用され、刑事罰は科されない。",e:"不公正取引を行った違反者には重い刑事罰が科される（課徴金制度のみではない）"},
{c:6,s:"市場阻害行為の規制",n:77,d:"C",x:1,a:1,q:"何人も有価証券の売買その他の取引又はデリバティブ取引等を誘引する目的で虚偽の相場を利用してはならない。",e:"虚偽相場の利用禁止（風説の流布等と並ぶ不公正取引の1類型）。"},
{c:6,s:"市場阻害行為の規制",n:78,d:"C",x:1,a:1,q:"何人も、有価証券の募集、売出し、売買その他の取引若しくはデリバティブ取引等のため、又は有価証券等の相場の変動を図る目的をもって、風説を流布し、偽計を用い、又は暴行若しくは脅迫をしてはならない。",e:"風説の流布・偽計・暴行脅迫の禁止（金商法158条）。"},
{c:6,s:"市場阻害行為の規制",n:79,d:"B",a:0,q:"仮装取引とは、自己が行う売付け若しくは買付け又はデリバティブ取引の申込みと同時期に、それと同価格で他人がその金融商品の買付け若しくは売付け又はデリバティブ取引の申込みを行うことを、あらかじめその者と通謀して、その売付け若しくは買付け又はデリバティブ取引の申込みを行うことである。",e:"問題文は馴合取引のこと。仮装取引とは、上場有価証券等の売買、市場デリバティブ取引や店頭デリバティブ取引について、取引状況に関し他人に誤解を生じさせる目的をもって、権利の移転、金銭の授受等を目的としない仮装の取引（例えば実際にはある銘柄の売注文を出しながら、別の金融商品取引業者から同一人物が同じ銘柄の買注文を出すといった取引）をすることをいう"},
{c:6,s:"市場阻害行為の規制",n:80,d:"C",x:1,a:1,q:"上場有価証券の売買、市場デリバティブ取引又は店頭デリバティブ取引（有価証券売買等）のいずれかの取引を誘引する目的をもって、有価証券売買等が繁盛であると誤解させ、又は取引所金融商品市場における上場金融商品等の相場を変動させるべき一連の有価証券売買等又はその申込み、委託等若しくは受託等をすることは、相場操縦として禁止されている。",e:"相場操縦（現実取引による相場操縦）の禁止の定義。"},
{c:6,s:"市場阻害行為の規制",n:81,d:"C",x:1,a:1,q:"約定の意図なく、架空の注文を発注・取消しを繰り返し、あたかも取引が活発であると見せかけ第三者の取引を誘引する、いわゆる見せ玉は相場操縦行為として禁止されている。",e:"見せ玉（みせぎょく）も相場操縦行為の一類型として禁止される。"},
{c:6,s:"市場阻害行為の規制",n:82,d:"B",a:0,q:"安定操作取引はいかなる場合も行ってはならない。",e:"安定操作取引は、一定の要件を満たす場合には行うことができる（3章の安定操作期間の規定と関連）"},
{c:6,s:"市場阻害行為の規制",n:83,d:"B",a:0,q:"上場会社の会社関係者がその会社の重要事実を知って、その重要事実が公表される前にその会社の株券を買い付け、公表後に売却したが損失があった場合は規制の対象とならない。",e:"このような行為は、売却後に損失が出たとしても内部者取引に該当し、規制の対象となる（内部者取引規制は結果的な損益にかかわらず、行為自体が規制対象）"},
{c:6,s:"市場阻害行為の規制",n:84,d:"B",a:0,q:"上場会社等の業務に関する重要事実が公表される前に、会社関係者がその職務に関して知った場合には、会社関係者でなくなった後1年間は、その間に重要事実が公表された後でも、当該会社の発行する上場株券等の売買をしてはならない。",e:"重要事実が公表された後は、当該会社の発行する上場株券等の売買をすることができる（未公表の間のみ規制対象）"},
{c:6,s:"市場阻害行為の規制",n:85,d:"B",a:0,q:"内部者取引の規制の対象となる会社関係者の範囲には、その上場会社の子会社の役員は含まれない。",e:"その上場会社の子会社の役員も内部者取引における会社関係者の範囲に含まれる"},
{c:6,s:"市場阻害行為の規制",n:86,d:"B",a:0,q:"内部者取引の要件における重要事実には、子会社に生じた重要事実は含まれない。",e:"重要事実には、子会社に生じた重要事実も含まれる（問85と対の出題）"},
{c:6,s:"市場阻害行為の規制",n:87,d:"B",a:0,q:"上場会社の業務を執行する機関が、いったんは重要事実に当たる募集株式の発行を決定し、公表したが、その後当該新株式の発行を中止する決定をした場合には、その中止の決定は重要事実には当たらない。",e:"いったん行うと決定した事項（重要事実にあたる募集株式の発行など）を行わないことを決定した場合も重要事実に該当する（問125参照）"},
{c:6,s:"市場阻害行為の規制",n:88,d:"B",x:1,a:1,q:"「合併」や「会社の分割」は、金商法に定める内部者取引の規制に係る上場会社等の業務等に関する重要事実に該当する（いわゆる軽微基準は考慮しない。）。",e:"合併・会社分割は重要事実の代表例（問125の一覧参照）。"},
{c:6,s:"市場阻害行為の規制",n:89,d:"B",x:1,a:1,q:"上場会社の子会社の業務執行を決定する機関が、他社に当該子会社の事業の一部を譲渡することを決定することは、当該上場会社の業務等に関する重要事実に当たる（いわゆる軽微基準は考慮しない。）。",e:"子会社の重要な決定も、親会社である上場会社の重要事実になりうる（問86参照）。"},
{c:6,s:"市場阻害行為の規制",n:90,d:"B",a:0,q:"内部者取引の規制に係る上場会社の主要株主とは、株主名簿で保有株数の多い上位10位までの株主をさす。",e:"主要株主とは、総株主等の議決権の100分の10以上の議決権を保有している株主をいう（順位ではなく議決権割合で定義）"},
{c:6,s:"市場阻害行為の規制",n:91,d:"B",a:0,q:"上場会社等の業務等に関する重要事実は、当該上場会社の代表取締役などから当該重要事実を公開することを委任された者により、当該重要事実が日刊紙を販売する新聞社や通信社又は放送機関等の2つ以上の報道機関に対して公開され、かつ、公開されたときから6時間経過すれば公表されたと認められる。",e:"公開されたときから12時間以上の経過が必要である"},
{c:6,s:"市場阻害行為の規制",n:92,d:"B",x:1,a:1,q:"上場会社等の業務等に関する重要事実が公表されたとみなされる事実の1つに、その重要事実が記載された有価証券届出書が公衆の縦覧に供された場合がある。",e:"有価証券届出書・有価証券報告書等の縦覧開始による「公表」もみなし公表事由の1つ。"},
{c:6,s:"市場阻害行為の規制",n:93,d:"B",a:0,q:"金融商品取引所に上場されている株券などの発行者である会社の役員及び主要株主（総株主等の議決権の100分の10以上の議決権を保有する株主。）は、自己の計算でその上場会社等の特定有価証券等の売買を行った場合は、利益が出ていなければ、その内容についての報告書を内閣総理大臣に提出する必要はない。",e:"利益が出ていなくても、報告書を内閣総理大臣に提出する必要がある（役員・主要株主の売買報告制度）"},
{c:6,s:"市場阻害行為の規制",n:94,d:"A",a:0,q:"上場会社等の役員又は主要株主が、当該上場会社等の特定有価証券等について、自己の計算においてその買付け等をした後1年以内に売付け等をし、又は売付け等をした後1年以内に買付け等をして利益を得たときは、当該上場会社等はその者に対し、得た利益の提供を請求することができる。",e:"「1年」ではなく「6か月」が正解（短期売買差益（いわゆるインサイダー利益）の返還請求制度、期間は6か月以内）"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:95,d:"B",a:0,q:"企業内容等開示制度の対象となる有価証券は、基本的に募集又は売出しの行われる有価証券であり、投資信託の受益証券、金融債及び事業債等の債券等がある。",e:"国債証券、地方債証券、金融債、政府保証債等は、企業内容等開示制度の対象ではない（問題文の記載とは逆に、金融債等は対象外）"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:96,d:"B",a:0,q:"株券等の発行会社から提出された届出書を内閣総理大臣が受理すると、原則として、その日から15日を経過した日に届出の効力が発生するが、実際にその有価証券を取得させたり、売り付けたりすることはまだできない。",e:"届出の効力が発生した日から、実際にその有価証券を取得させたり、売り付けたりすることができる"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:97,d:"B",a:0,q:"有価証券の募集又は売出しは、発行者がその募集又は売出しに関し、内閣総理大臣に届出をしているものでなければすることができないが、すでに当該有価証券に関して開示が行われている場合における売出しにおいても、内閣総理大臣への届出が必要である。",e:"すでにその有価証券に関して開示が行われている売出しについては、内閣総理大臣への届出は不要である"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:98,d:"B",a:0,q:"目論見書は、有価証券の募集又は売出しのために使用される勧誘文書であり、その募集又は売出しの取扱いを行う金融商品取引業者は必ずこれを作成しなければならないものとされている。",e:"目論見書は有価証券の発行会社が作成するものである"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:99,d:"B",a:0,q:"金融商品取引業者等は、届出を要する有価証券を募集又は売出しにより取得させ又は売り付ける場合には、目論見書をできる限り早く投資者に交付しなければならない。",e:"目論見書（交付目論見書）をあらかじめ又は同時に投資家に交付しなければならない"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:100,d:"C",x:1,a:1,q:"金融商品取引業者等は、有価証券の募集又は売出しに際して、適格機関投資家に取得させ、又は売り付ける場合は、目論見書を交付しなくてもよいとされている。",e:"適格機関投資家（プロ）向けの場合は目論見書交付義務が緩和される（問9・14の適合性原則と同様の考え方）。"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:101,d:"A",x:1,a:1,q:"発行登録制度とは、有価証券の募集又は売出しを1回以上予定している発行者であって参照方式が適用される会社は、内閣府令で定める発行予定期間における有価証券の発行予定額等を記載した発行登録書を提出し登録しておけば、発行の都度、内閣総理大臣に届出書を提出することを要しない制度のことである。",e:"発行登録制度（レジュメP166相当。9章の国債の発行登録制度と同じ発想）。"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:102,d:"B",a:0,q:"有価証券報告書を提出しなければならないのは金融商品取引業者のみである。",e:"有価証券報告書の提出義務者は、有価証券の発行者である会社である"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:103,d:"C",a:0,q:"有価証券報告書において記載される財務諸表は、その発行会社の監査役の監査を受けていれば、公認会計士又は監査法人の監査証明を受けなくてもよい。",e:"有価証券報告書に記載される財務諸表は、特別の利害関係のない公認会計士又は監査法人の監査証明を受けたものでなければならない"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:104,d:"B",x:1,a:1,q:"有価証券報告書の提出を義務付けられる上場会社等は、事業年度が開始した日以後6か月間の当該会社の属する企業集団の経理の状況その他の重要事項を記載した半期報告書を、期間経過後45日以内に内閣総理大臣に提出する必要がある。",e:"半期報告書の提出義務（事業年度開始後6か月間、期間経過後45日以内に提出）。"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:105,d:"B",x:1,a:1,q:"上場会社等は、経営者が有価証券報告書・半期報告書の記載内容が金商法令に基づき適正であることを確認した確認書を提出する必要がある。",e:"確認書制度（経営者による適正性の確認）。"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:106,d:"B",a:0,q:"上場会社等は、企業内容に関し財政状態及び経営成績に著しい影響を与える事象等が発生したときは、訂正報告書を遅滞なく、内閣総理大臣に提出することが義務付けられている。",e:"「訂正報告書」ではなく「臨時報告書」を遅滞なく、内閣総理大臣に提出することが義務付けられている"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:107,d:"B",a:0,q:"有価証券報告書の提出後、記載すべき重要事項について変更等がある場合には、発行会社は、臨時報告書を内閣総理大臣に提出しなければならない。",e:"この場合、「臨時報告書」ではなく「訂正報告書」を内閣総理大臣に提出しなければならない（問106と対で訂正報告書・臨時報告書の定義を入れ替えるひっかけ）"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:108,d:"C",x:1,a:1,q:"有価証券報告書や有価証券届出書などは、一定の場所に備え置かれ、各々の書類ごとに定められた期間、公衆の縦覧に供される。",e:"開示書類の公衆縦覧制度（財務局・取引所等での備置き）。"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:109,d:"B",x:1,a:1,q:"有価証券報告書提出義務のある上場会社等は、事業年度ごとに、当該会社の属する企業集団及び当該会社に係る財務計算に関する書類その他の情報の適正性を確保するために必要な体制について評価した報告書（内部統制報告書）を、有価証券報告書と併せて内閣総理大臣に提出しなければならない。",e:"内部統制報告書（J-SOX）の提出義務。"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:110,d:"C",x:1,a:1,q:"公開買付けとは、不特定かつ多数の者に対し、公告により株券等の買付け等の申込み又は売付け等の申込みの勧誘を行い、取引所金融商品市場外で株券等の買付け等を行うことである。",e:"公開買付け（TOB）の定義。"},
{c:6,s:"情報開示（ディスクロージャー）制度",n:111,d:"B",a:0,q:"公開買付けの途中では、対象株式の価格を引き上げることも引き下げることも認められない。",e:"公開買付けの途中で、価格を引き上げることは認められるが、引き下げることは認められない"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:112,d:"B",a:0,q:"株券等の大量保有の状況に関する開示制度において、報告対象となる有価証券の範囲に、投資証券は含まれるが、上場会社等の発行する新株予約権証券及び新株予約権付社債券は含まれない。",e:"報告対象となる有価証券の範囲に、上場会社等の発行する新株予約権証券及び新株予約権付社債券も含まれる"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:113,d:"B",a:0,q:"株券等の大量保有の状況に関する開示制度において、報告対象となる有価証券の範囲に、上場会社の発行する議決権のない株式も含まれる。",e:"報告対象となる有価証券の範囲に、議決権のない株式は含まれない"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:114,d:"B",x:1,a:1,q:"大量保有報告書の提出義務を負うのは、対象有価証券の保有者でその保有割合が5%を超えるものである。",e:"一般に「5%ルール」と呼ばれる（問名の由来）。"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:115,d:"C",x:1,a:1,q:"株券等の大量保有の状況に関する開示制度において、報告義務者は、名義の如何にかかわらず、株券等の実質的な保有者である。",e:"名義株ではなく実質的な保有者が報告義務者となる。"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:116,d:"B",x:1,a:1,q:"株券等の大量保有の状況に関する開示制度において、状況を計算するための「株券等保有割合」は、保有者の保有する株券等の数に共同保有者の保有する株券等の数を加え、それを発行済株式総数で除して求められる。",e:"共同保有者とは、保有者と共同して株券等の取得・譲渡又は議決権行使等をすることを合意している他の保有者のこと。夫婦関係や親子会社関係などがある場合には、共同保有者とみなされる。"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:117,d:"B",x:1,a:1,q:"大量保有報告書の提出期限は、原則として株券等の実質的な保有者がこの開示制度に定める大量保有者に該当することとなった日から起算して5日（日曜日その他政令で定める休日の日数は算入しない。）以内とされている。",e:"大量保有者となった日から5日以内（休日は算入しない）の提出義務。"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:118,d:"B",x:1,a:1,q:"報告義務者は、大量保有報告書をEDINETで内閣総理大臣（金融庁長官）に提出した場合には、発行者に当該大量保有報告書の写しを送付する義務が免除されている。",e:"EDINET提出により発行者への写しの送付義務が免除される。"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:119,d:"B",a:0,q:"株券等の大量保有の状況に関する開示制度において、大量保有報告書を提出すべき者は、一度、大量保有報告書を提出すれば、その後の株券等保有割合に変化が生じた場合でも、その異動状況等に関する報告を行う必要は一切ない。",e:"株券等保有割合が1%以上増減した場合には、その日から5日以内に変更報告書を提出する必要がある"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:120,d:"B",a:0,q:"株券等の大量保有の状況に関する開示制度において、提出された大量保有報告書及び変更報告書は、原則として10年間公衆の縦覧に供される。",e:"提出された大量保有報告書及び変更報告書は、5年間公衆の縦覧に供される"},
{c:6,s:"株券等の大量保有の状況に関する開示制度（5%ルール）等",n:121,d:"B",a:0,q:"銀行、金融商品取引業者等が、上場会社の事業活動を支配することを目的とせず、当該上場会社の株券を5%超保有している場合については、大量保有報告書を提出する必要はない。",e:"銀行、金融商品取引業者等が、上場会社の事業活動を支配することを目的としなくても、当該上場会社の株券を5%超保有している場合は、大量保有報告書を提出しなければならない（ただし提出頻度等の特例あり）"},
{c:6,s:"資本市場の監視・監督",n:122,d:"B",x:1,a:1,q:"証券取引等監視委員会は、日常的な市場監視、金融商品取引業者に対する検査、有価証券報告書等についての検査、課徴金調査、犯則事件の調査等を行う。",e:"証券取引等監視委員会の業務範囲（13章の自主規制機関との対比で問われる機関、問13章参照）。"},
{c:6,s:"金融商品取引業者等の行為規制",n:123,d:"B",o:["媒介とは、委託者の計算で、自己の名をもって有価証券を買入れ又は売却することである。", "取次ぎとは、自己の計算で、自己の名をもって有価証券を買入れ又は売却することである。", "媒介とは、委託者の計算で、委託者の名をもって有価証券を買入れ又は売却することである。", "取次ぎとは、自己の計算で、委託者の名をもって有価証券を買入れ又は売却することである。", "代理とは、委託者の計算で、委託者の名で有価証券の売買等を行うことを引き受けることである。"],a:[5],q:"次のうち、「有価証券の売買の媒介、取次ぎ又は代理」に関する記述として正しいものの番号を1つ選びなさい。",e:"媒介＝他人間の取引の成立に尽力すること。取次ぎ＝委託者の計算（顧客の資金）で、自己の名（金融商品取引業者の名前）で有価証券を買い入れ又は売却すること等を引き受けること。代理＝委託者の計算（顧客の資金）で、委託者の名で（又は委託者の代理人としての立場を示して）有価証券の売買等を行うことを引き受けること。3章の「自己取引」「取次ぎ（委託取引）」の区別（3章問2）と関連づけて整理する。"},
{c:6,s:"市場阻害行為の規制",n:124,d:"B",o:["当該上場会社等の役員、代理人、使用人その他の従業者", "上場会社等の帳簿閲覧権を有する株主や社員", "当該上場会社等に対して法令に基づく権限、すなわち許認可権や立入検査権、議院の国政調査権等を有する者", "当該上場会社等と契約を締結している者（取引銀行、公認会計士、引受人、顧問弁護士等）", "以前会社関係者であり、会社関係者でなくなってから1年超2年以内の者"],a:[5],q:"次のうち、内部者取引の規制の対象に該当しないものの番号を1つ選びなさい。",e:"内部者取引規制における会社関係者の主な範囲は、①その上場会社等の役員、代理人、使用人その他の従業者（役員等には親会社・子会社の役員等も含まれる）、②上場会社等の帳簿閲覧権を有する株主（大株主のこと）や社員、③その上場会社等に対して法令に基づく権限、すなわち許認可権や立入検査権、議院の国政調査権等を有する者、帳簿書類の閲覧請求権者等、④その上場会社等と契約を締結している者又は締結の交渉をしている者、すなわち取引銀行、公認会計士、引受人、顧問弁護士等。なお、現在は上記会社関係者ではないが、以前会社関係者であり、会社関係者でなくなってから1年以内の者も内部者取引の規制の対象となる（第一次情報受領者も同様に対象）。選択肢5は「1年超2年以内」であり、1年を超えているため規制の対象に該当しない。"},
{c:6,s:"市場阻害行為の規制",n:125,d:"B",o:["募集株式・新株予約権の募集", "代表取締役の交代", "新製品又は新技術の企業化", "資本金の額の減少", "主要取引先銀行の変更"],a:[2, 5],q:"次のうち、内部者取引における上場会社等の業務に関する重要事実に該当しないものの番号を2つ選びなさい。",e:"以下の事項を行う決定をしたこと、又は、いったん行うと決定した事項を行わないことを決定したことが、重要事実にあたる：募集株式・新株予約権の募集、資本準備金・利益準備金の額の減少、株式分割、株式交換及び株式移転、解散、新製品又は新技術の企業化、資本金の額の減少、自己の株式の取得、剰余金の配当、合併、会社の分割、事業の全部又は一部の譲渡又は譲受けなど。代表取締役の交代や主要取引先銀行の変更は、この重要事実の一覧に含まれない。"},
{c:6,s:"株券等の大量保有の状況に関する開示制度",n:126,d:"B",o:["イは1、ロは5、ハは1、ニは1", "イは1、ロは5、ハは1、ニは5", "イは5、ロは5、ハは5、ニは1", "イは5、ロは10、ハは5、ニは5", "イは5、ロは10、ハは5、ニは1"],a:[3],q:"次の文章は、「株券等の大量保有の状況に関する開示制度」に関する記述である。文中のそれぞれの（ ）に当てはまる正しい数字を選んでいるものの番号を1つ選びなさい。 上場会社等の発行会社の発行する株券等の（イ）%超の実質的な保有者は、大量保有者となった日から（ロ）日（日曜日その他政令で定める休日の日数は算入しない）以内に内閣総理大臣に大量保有報告書を提出するほか、発行者にその写しを送付しなければならない。この報告書は（ハ）年間、公衆の縦覧に供される。また、株券等保有割合の（ニ）%以上の増減等、重要な事項につき変更があった場合には、これを内閣総理大臣に報告しなければならない。",e:"イ＝5（5%超で大量保有者、問114）、ロ＝5（5日以内、問117）、ハ＝5（5年間の公衆縦覧、問120）、ニ＝1（1%以上の増減で変更報告書、問119）。すべて本章の○×問題（問114・117・119・120）と同じ数字を穴埋め形式で問う総合問題。"},
{c:7,s:"金融サービスの提供及び利用環境の整備等に関する法律",n:1,d:"C",x:1,a:1,q:"「金融サービスの提供及び利用環境の整備等に関する法律」では、説明義務違反により顧客に損害が生じた場合の損害賠償責任及び損害額の推定等について規定されている。",e:"金融サービス提供法（旧金融商品販売法）は、重要事項の説明義務とその違反時の損害賠償責任・損害額推定を定める法律。"},
{c:7,s:"金融サービスの提供及び利用環境の整備等に関する法律",n:2,d:"B",a:0,q:"「金融サービスの提供及び利用環境の整備等に関する法律」では、金融商品販売業者等は、金融商品の販売等を業として行うときは、金融商品の販売が行われるまでの間に、顧客に対して重要事項を口頭で説明すればよいものとされている。",e:"重要事項の説明は単に口頭で説明するのではなく、顧客の知識、経験、財産の状況及び当該金融商品の販売に係る契約を締結する目的に照らして、その顧客に理解されるために必要な方法及び程度によるものでなければならない"},
{c:7,s:"金融サービスの提供及び利用環境の整備等に関する法律",n:3,d:"B",a:0,q:"「金融サービスの提供及び利用環境の整備等に関する法律」では、金融商品販売業者等による重要事項の説明義務は、すべての顧客に対して適用される。",e:"金融サービス提供法では、重要事項の説明義務は、金融商品の販売等に関する専門的知識及び経験を有する者として政令に定める「特定顧客」に対しては適用されない"},
{c:7,s:"金融サービスの提供及び利用環境の整備等に関する法律",n:4,d:"B",a:0,q:"「金融サービスの提供及び利用環境の整備等に関する法律」では、顧客から重要事項について説明を要しない旨の意思表明があっても、金融商品販売業者等による重要事項の説明義務は免除されない。",e:"重要事項について説明を要しない旨の顧客の意思の表明があった場合には、商品関連市場デリバティブ取引及びその取次ぎの場合を除き、重要事項の説明義務は免除される。ただし、この場合でも金商法上の説明義務は免除されない"},
{c:7,s:"金融サービスの提供及び利用環境の整備等に関する法律",n:5,d:"B",a:0,q:"「金融サービスの提供及び利用環境の整備等に関する法律」では、金融商品の販売等に際して、金融商品取引業者等が過失により一定の重要事項の説明を行わなかった場合は損害賠償責任は問われない。",e:"重要事項の説明義務違反については、故意又は過失の有無を問わず損害賠償の責任を負う"},
{c:7,s:"金融サービスの提供及び利用環境の整備等に関する法律",n:6,d:"A",x:1,a:1,q:"「金融サービスの提供及び利用環境の整備等に関する法律」では、金融商品の販売等に際して、金融商品取引業者等が断定的判断の提供の禁止に違反する行為を行った場合に、不法行為による損害賠償責任があることを明確にしているが、不法行為と損害の発生との間の因果関係及び損害額についての立証責任は金融商品取引業者等に転換している。",e:"断定的判断の提供による不法行為の場合、通常の不法行為と異なり、因果関係・損害額の立証責任が顧客側ではなく金融商品取引業者等（金融業者）側に転換されている点が特徴（レジュメP177「(3)因果関係・損害額の推定」）。重要事項の説明義務違反も同様に無過失責任とされる（問5参照）。"},
{c:7,s:"消費者契約法",n:7,d:"B",a:0,q:"「消費者契約法」における「消費者」には、事業のために契約の当事者となる個人も含まれる。",e:"消費者契約法でいう「消費者」とは、個人のうち、「事業として又は事業のために契約の当事者となる場合におけるものを除いた者」である"},
{c:7,s:"消費者契約法",n:8,d:"B",x:1,a:1,q:"消費者契約法は、契約の相手方から媒介の委託を受けた者や代理権の授与を受けた者による勧誘などの行為についても適用される。",e:"事業者から委託を受けた媒介者・代理人による勧誘行為も消費者契約法の適用対象となる。"},
{c:7,s:"消費者契約法",n:9,d:"B",a:0,q:"協会員が顧客に投資信託を販売する場合は、顧客との間で直接の契約の相手方となるものではないので消費者契約法の対象とはならない。",e:"協会員が投資信託の販売を行う場合や、変額年金の販売を行う場合などは、顧客との間の直接の相手方となるわけではないが、このような場合においても、消費者契約法の適用対象となる"},
{c:7,s:"消費者契約法",n:10,d:"B",x:1,a:1,q:"「消費者契約法」により、消費者が契約の取消しができる場合の一つに、物品、権利、役務その他の当該消費者契約の目的となるものに関し、将来におけるその価額、将来において当該消費者が受け取るべき金額その他の将来における変動が不確実な事項につき断定的判断を提供することにより、当該提供された断定的判断の内容が確実であると誤認した場合が含まれる。",e:"消費者契約法上の断定的判断の提供による誤認類型（取消事由の1つ）。"},
{c:7,s:"消費者契約法",n:11,d:"B",a:0,q:"消費者契約法において、消費者が契約の取消しをすることができるのは、裁判による方法しかない。",e:"消費者が取消権を行使する方法については、消費者契約法において定められておらず、民法123条により相手方に対して意思表示を取り消す旨を伝えればよいと考えられている。必ずしも裁判において主張する必要はない"},
{c:7,s:"消費者契約法",n:12,d:"B",a:0,q:"消費者契約法に基づく取消権は、消費者契約の締結時から3年を経過したときに消滅するものとされている。",e:"消費者契約法に基づく取消権は、原則として消費者契約の締結時から5年を経過したときに消滅するものとされている（レジュメP178「覚・必ず」：追認できる時から1年間行使しない場合、又は契約締結から5年で取消権は消滅）"},
{c:7,s:"犯罪による収益の移転防止に関する法律",n:13,d:"C",a:0,q:"「犯罪による収益の移転防止に関する法律」では、取引時確認を行う際に有効な本人確認書類に、運転免許証、個人番号カード、年金手帳は含まれない。",e:"本人確認書類に、運転免許証、個人番号カード、年金手帳は含まれる（レジュメP179「覚・必ず」：運転免許証・在留カード・特別永住者証明書・個人番号カード・各種健康保険証・年金手帳など。学生証は本人確認書類にならない）"},
{c:7,s:"犯罪による収益の移転防止に関する法律",n:14,d:"B",a:0,q:"「犯罪による収益の移転防止に関する法律」では、協会員は、顧客に有価証券を取得させることを内容とする契約を締結する際は、最初に顧客について本人特定事項等の確認を行う必要があるが、代理人が取引を行う場合には、代理人の本人特定事項の確認を行えば本人の取引時確認を行う必要はない。",e:"代理人が取引を行う場合には、本人の取引時確認に加えて代理人についても本人特定事項の確認が必要である"},
{c:7,s:"犯罪による収益の移転防止に関する法律",n:15,d:"B",a:0,q:"「犯罪による収益の移転防止に関する法律」における取引時確認について、なりすましの疑いがある取引であっても、既に取引時確認をしていれば改めて確認をする必要はない。",e:"なりすましが疑われる取引や取引時確認に係る事項を偽っていた疑いがある顧客等との取引に該当するもの（ハイリスク取引）については、たとえ既に取引時確認をしたことのある顧客との取引であっても、改めて取引時確認を行う必要がある"},
{c:7,s:"犯罪による収益の移転防止に関する法律",n:16,d:"B",x:1,a:1,q:"金融商品取引業者は、顧客から受け取った財産が犯罪による収益である疑いがあるかどうか、又は顧客が犯罪収益の取得や処分について事実を仮装したり、犯罪収益を隠匿している疑いがあるかどうかを判断し、これらの疑いがあると認められる場合には、速やかに金融庁長官に対して疑わしい取引の届出を行わなければならない。",e:"疑わしい取引の届出義務（マネー・ローンダリング対策）。"},
{c:7,s:"個人情報の保護に関する法律",n:17,d:"B",x:1,a:1,q:"「個人情報の保護に関する法律」において、「個人情報」とは、生存する個人に関する情報で、①当該情報に含まれる氏名、生年月日その他の記述等により特定の個人を識別することができるもの、又は②個人識別符号が含まれているもののいずれかをいう。",e:"個人情報の定義（①記述等による識別、②個人識別符号）。"},
{c:7,s:"個人情報の保護に関する法律",n:18,d:"B",x:1,a:1,q:"「個人情報の保護に関する法律」において、情報それ自体からは特定の個人を識別できなくても、ある情報と他の情報を照合することで容易に識別することができる場合にも、その情報は個人情報に該当する。",e:"「容易照合性」により個人情報に該当する場合がある（レジュメP180の例：学籍番号など、それ単体では誰か分からなくても他の名簿と照合すれば個人を特定できる情報）。"},
{c:7,s:"個人情報の保護に関する法律",n:19,d:"B",x:1,a:1,q:"「個人情報の保護に関する法律」において、「要配慮個人情報」とは、本人の「人種」、「信条」、「社会的身分」、「病歴」、「犯罪の経歴」、「犯罪により害を被った事実」及び「その他本人に対する不当な差別、偏見その他の不利益が生じないようにその取扱いに特に配慮を要するものとして政令で定める記述等が含まれる個人情報」をいう。",e:"要配慮個人情報の定義（レジュメP180「人には知られたくない情報」）。取得には原則として本人の同意が必要。"},
{c:7,s:"個人情報の保護に関する法律",n:20,d:"B",x:1,a:1,q:"匿名加工情報とは、個人情報を個人情報の区分に応じて定められた措置を講じて特定の個人を識別することができないように加工して得られる個人に関する情報であって、当該個人情報を復元して特定の個人を再識別することができないようにしたものをいう。",e:"匿名加工情報の定義。"},
{c:7,s:"個人情報の保護に関する法律",n:21,d:"B",a:0,q:"「個人情報の保護に関する法律」において、個人情報取扱事業者は、個人情報を取り扱うにあたっては、「自社の所要の目的で用いる」といった抽象的な特定の仕方を行う必要がある。",e:"個人情報取扱事業者は、個人情報を取り扱うにあたっては、その利用目的をできる限り特定しなければならない。抽象的な記載ではなく、提供する金融商品・サービスを明示したうえで利用目的を特定することが望ましい"},
{c:7,s:"個人情報の保護に関する法律",n:22,d:"C",x:1,a:1,q:"「個人情報の保護に関する法律」において、個人情報取扱事業者が、利用目的の達成に必要な範囲内において個人データの取扱いを委託する場合、個人データの提供を受ける者は第三者に該当しない。",e:"委託先への提供は「第三者提供」に該当しない（委託は本人同意なしで可能な類型の1つ）。"},
{c:7,s:"個人情報の保護に関する法律",n:23,d:"B",a:0,q:"「個人情報の保護に関する法律」において、法人の代表者個人や取引担当者個人の氏名、住所、性別、生年月日、顔画像等個人を識別することができる情報は、個人情報に該当しない。",e:"法人の代表者個人や取引担当者個人の氏名、住所、性別、生年月日、顔画像等個人を識別することができる情報は、個人情報に該当する（法人そのものの情報は個人情報にあたらないが、法人に属する個人の情報は個人情報にあたる）"},
{c:7,s:"個人情報の保護に関する法律",n:24,d:"B",a:0,q:"「個人情報の保護に関する法律」において、一度公開された個人情報は公開情報となるので、個人情報として扱う必要はない。",e:"個人情報保護法では、公開・非公開を区別しておらず、非公開情報のみを保護するものではない。公開情報でも個人情報の定義に該当する限り、個人情報となる"},
{c:8,s:"付随業務",n:1,d:"A",a:0,q:"投資運用業者は付随業務を行うことができない。",e:"付随業務は第一種金融商品取引業者だけでなく、投資運用業者も行うことができる"},
{c:8,s:"付随業務",n:2,d:"C",x:1,a:1,q:"付随業務の1つに、累積投資契約の締結がある。",e:"付随業務の一覧（問18の解説参照）の1つ。累積投資契約とは、金融商品取引業者が顧客から金銭を預かり、その金銭を対価としてあらかじめ定めた期日に、顧客に有価証券を継続的に売付け、取得させることを内容とする契約（問9参照）。"},
{c:8,s:"付随業務",n:3,d:"B",a:0,q:"付随業務の1つに、PTS運営業務が含まれる。",e:"PTS運営業務は付随業務ではなく、金融商品取引業の1つ"},
{c:8,s:"付随業務",n:4,d:"B",a:0,q:"第一種金融商品取引業を行うことができる者は、内閣総理大臣に届出を行えば付随業務を行うことができる。",e:"第一種金融商品取引業者又は投資運用業者は、内閣総理大臣に届出や承認を受けることなく付随業務を行うことができる"},
{c:8,s:"付随業務",n:5,d:"B",x:1,a:1,q:"キャッシング業務とは、MRFの解約請求を行った顧客に対し、解約請求当日での顧客への解約代金相当額の支払を可能とするために、翌営業日に行われる解約代金の支払までの間、解約請求に係る当該有価証券を担保として解約代金相当額を解約請求日に貸し付ける業務である。",e:"MRFは解約請求の翌営業日に解約代金が支払われるため、当日中に資金化したい顧客のために、証券会社が解約代金相当額を担保付きで立て替え貸付けする仕組み（レジュメP184）。"},
{c:8,s:"付随業務",n:6,d:"B",x:1,a:1,q:"キャッシング業務に係る貸付限度額は、MRFの残高に基づき計算した返還可能金額又は500万円のうちいずれか少ない金額を基準に、各金融商品取引業者が定める金額である。",e:"貸付限度額の基準（残高基準額と500万円のいずれか少ない方）。"},
{c:8,s:"付随業務",n:7,d:"B",a:0,q:"キャッシング業務に係る貸付利息は、解約請求日から翌営業日までのMRFの分配金手取額である。",e:"貸付利息は、解約請求日から翌営業日前日までのMRFの分配金手取額である"},
{c:8,s:"付随業務",n:8,d:"B",a:0,q:"「有価証券に関する常任代理業務」の範囲には、単元未満株式に係る買取請求手続の代行は含まれない。",e:"「有価証券に関する常任代理業務」の範囲に、単元未満株式に係る買取請求手続の代行は含まれる"},
{c:8,s:"付随業務",n:9,d:"B",a:0,q:"累積投資契約では、投資家は株を購入したい時（任意の時）に単元未満株のまま機動的に任意の銘柄の買付けを行い、また、買付けた単元未満株を単元未満株のまま売却することもできる。",e:"記述は株式ミニ投資についてのもの。累積投資契約とは、金融商品取引業者が顧客から金銭を預かり、その金銭を対価としてあらかじめ定めた期日に、顧客に有価証券を継続的に売付け、取得させることを内容とする契約"},
{c:8,s:"付随業務",n:10,d:"A",a:0,q:"累積投資業務において取り扱うことができるのは上場株券のみである。",e:"累積投資業務で取り扱うことができる有価証券は、上場株券だけでなく、国債・地方債等の債券や投資信託受益証券などもある"},
{c:8,s:"付随業務",n:11,d:"C",x:1,a:1,q:"株式累積投資とは、一定額で毎月一定日に特定の銘柄の株式等を買い付ける制度をいう。",e:"いわゆる「るいとう」。株式ミニ投資（機動的・単元未満株のまま）と対比される（問9・14参照）。"},
{c:8,s:"付随業務",n:12,d:"C",x:1,a:1,q:"株式累積投資において、ドル・コスト平均法とは、株価の動きやタイミング等に関係なく、株式を定期的に継続して一定額ずつ購入する方法である。",e:"一定額ずつ購入することで、株価が高いときは少なく、安いときは多く買うことになり、平均買付コストを平準化できる手法。"},
{c:8,s:"付随業務",n:13,d:"C",x:1,a:1,q:"金融商品取引業者は、顧客と株式累積投資の契約を締結するときは、あらかじめ、当該顧客に対し株式累積投資約款を交付しなければならない。",e:"契約締結前の約款交付義務。"},
{c:8,s:"付随業務",n:14,d:"B",a:0,q:"株式累積投資において、顧客は、上場銘柄の中から買い付ける銘柄を自由に指定することができる。",e:"株式累積投資においては、金融商品取引業者が選定した銘柄に限られる"},
{c:8,s:"付随業務",n:15,d:"B",x:1,a:1,q:"株式累積投資について、買付株数の累計が単元株に達した時点で、株式累積投資口座より振替決済口座に振り替えられ、通常の株主となることができる。",e:"単元株に達するまでは株式累積投資口座で保有され、達した時点で通常の株主権を行使できる形に切り替わる。"},
{c:8,s:"付随業務",n:16,d:"B",a:0,q:"株式累積投資について、インサイダー情報を知った会社関係者が、その情報が公表される前に株式累積投資契約に基づく買付けを行った場合、その情報を知る前に締結された契約に基づく定期的な買付けであっても、インサイダー取引規制違反となる。",e:"問題文の場合は、インサイダー取引の規制の適用除外となる（情報を知る前から続く機械的・定期的な買付けであるため）"},
{c:8,s:"付随業務",n:17,d:"B",o:["信用取引に付随する金銭の貸付け", "商品市場における取引に係る業務", "貸金業", "宅地若しくは建物の賃貸に係る業務", "投資信託又は外国投資信託の受益証券の収益金、償還金又は解約金の支払業務の代理"],a:[1, 5],q:"次のうち、金融商品取引業者の付随業務（金融商品取引法35条1項に定める業務）に該当するものとして正しいものの番号を2つ選びなさい。",e:"付随業務には以下のようなものがある：①有価証券の貸借又はその媒介もしくは代理（株券等の貸借取引）、②信用取引に付随する金銭の貸付け、③顧客から保護預りをしている有価証券を担保とする金銭の貸付け、④有価証券に関する顧客の代理、⑤投資信託又は外国投資信託の受益証券に係る収益金・償還金又は解約金の支払いに係る業務の代理、⑥投資法人の発行する投資証券等に係る金銭の分配等の支払いに係る業務の代理、⑦累積投資契約の締結、⑧有価証券に関連する情報の提供又は助言、⑨他の金融商品取引業者等の業務の代理、⑩登録投資法人の資産の保管、⑪他の事業者の事業譲渡・合併等に関する相談・仲介、⑫他の事業者の経営に関する相談に応じること、⑬通貨等のデリバティブ取引に関連する資産の売買等、⑭譲渡性預金その他金銭債権の売買等、⑮特定資産等に対する運用財産の運用。2・3・4はいずれも該当しない。"},
{c:8,s:"付随業務",n:18,d:"B",o:["株券等の貸借取引", "有価証券の元引受け", "PTS運営業務", "有価証券に関する顧客の代理", "他の金融商品取引業者等の業務の代理"],a:[2, 3],q:"次のうち、金融商品取引業者の付随業務（金融商品取引法35条1項に定める業務）に該当しないものの番号を2つ選びなさい。",e:"有価証券の元引受け業務やPTS運営業務は付随業務ではなく、金融商品取引業そのもの（本業）に当たる。1・4・5は問17の解説にある付随業務の一覧に含まれる。"},
{c:9,s:"債券の基礎知識",n:1,d:"B",a:0,q:"物上担保債とは、発行者の全財産から、他の債権者に優先して弁済を受けられる一種の優先弁済権が付いた債券である。",e:"問題文は一般担保債の記述。物上担保債は、発行者の保有する土地、工場、船舶など特定の財産を担保に付けた債券"},
{c:9,s:"債券の基礎知識",n:2,d:"C",x:1,a:1,q:"長期国債（10年利付国債）は、発行・流通市場の双方において我が国の債券市場の中心的銘柄であり、その発行条件や流通利回りは、他の年限の国債、その他の国内債の指標となっている。",e:"10年利付国債は国債の中でも発行量が最も多く、市場の指標金利として最も重視される銘柄。"},
{c:9,s:"債券の基礎知識",n:3,d:"A",x:1,a:1,q:"超長期国債（20年債）は、価格競争入札による公募入札方式で発行される。",e:"超長期国債のうち20年債・30年債は価格競争入札、40年債はイールド（利回り）競争入札による公募入札方式で発行される（発行年限で入札方式が変わる点がひっかけの頻出ポイント）。"},
{c:9,s:"債券の基礎知識",n:4,d:"B",x:1,a:1,q:"変動利付国債は、期間15年で利率が年2回の利払日ごとに市場実勢に応じて変化する債券である。",e:"固定利率の国債と異なり、市場実勢（金利変動）に応じて利率が半年ごとに見直される点が特徴。"},
{c:9,s:"債券の基礎知識",n:5,d:"C",x:1,a:1,q:"期間2年の国債は中期国債に分類される。",e:"中期国債は期間2年・5年の2種類。長期国債（10年）・超長期国債（20年・30年・40年）と区別される。"},
{c:9,s:"債券の基礎知識",n:6,d:"B",a:0,q:"現在、中期国債は期間1年と5年の2種類が発行されている。",e:"中期国債は2年物と5年物が発行されている（1年ではない）"},
{c:9,s:"債券の基礎知識",n:7,d:"B",x:1,a:1,q:"中期国債は、価格競争入札による公募入札方式で発行される。",e:"国債の発行方式は原則として価格競争入札（公募入札方式）。"},
{c:9,s:"債券の基礎知識",n:8,d:"B",x:1,a:1,q:"国庫短期証券は、国債の償還の平準化を図り円滑な借換えを実現すること、並びに国の一般会計や種々の特別会計の一時的な資金不足を補うために発行される。",e:"国庫短期証券（TDB：トレジャリー・ディスカウント・ビル）は、価格競争入札による割引方式で発行され、償還期間は2か月・3か月・6か月及び1年。"},
{c:9,s:"債券の基礎知識",n:9,d:"B",a:0,q:"個人向け国債とは、購入者を個人に限定する国債であり、固定金利型と変動金利型のいずれも利払いは年1回である。",e:"いずれも利払いは年2回"},
{c:9,s:"債券の基礎知識",n:10,d:"B",a:0,q:"国債は、その発行根拠法により分類することができるが、財政法に基づき発行されるものは赤字国債、国債整理基金特別会計法に基づき発行されるものは建設国債と呼ばれる。",e:"「赤字国債」「建設国債」が逆。財政法に基づき発行されるものは建設国債（4条国債）、国債整理基金特別会計法に基づき発行されるものは借換国債"},
{c:9,s:"債券の基礎知識",n:11,d:"B",x:1,a:1,q:"特例国債とは、税収及び税外収入等に加えて、建設国債を発行してもなお歳入不足が見込まれる場合に、公共事業費等以外の歳出に充てる資金を調達することを目的として、特別の法律によって発行される国債で、赤字国債ともいわれる。",e:"建設国債（4条国債）を発行してもなお歳入が不足する場合に、特別立法（特例法）によって発行されるのが特例国債＝赤字国債。"},
{c:9,s:"債券の基礎知識",n:12,d:"B",a:0,q:"全国型市場公募地方債を発行できるのは、すべての都道府県と一部の政令指定都市に限定されている。",e:"「すべて」「一部」が逆。全国型市場公募地方債を発行できるのは、一部の都道府県とすべての政令指定都市（レジュメP193「覚・必ず」）"},
{c:9,s:"債券の基礎知識",n:13,d:"B",a:0,q:"銀行等引受地方債を発行できる団体は、一部の都道府県に限られている。",e:"銀行等引受地方債は、特定の市中金融機関など少数の者に直接引き受けてもらうもので、発行団体は市・区まで含んで多数あり、一部の都道府県には限られていない"},
{c:9,s:"債券の基礎知識",n:14,d:"C",a:0,q:"政府関係機関債のうち、元利払いについて政府の保証付きで発行されるものを一般に「縁故特別債」という。",e:"政府関係機関債（特別債）のうち元利払いについて政府保証付きで発行されるものは、一般に「政府保証債」という"},
{c:9,s:"債券の基礎知識",n:15,d:"B",a:0,q:"地方公共団体が設立した公社が発行する債券を地方公共債という。",e:"地方公社債という。金融商品取引法上の有価証券である"},
{c:9,s:"債券の基礎知識",n:16,d:"B",a:0,q:"金融債の発行方式には募集発行と売出発行の2通りがあり、募集発行は個人消化を主体とし、売出発行は法人消化を主体としている。",e:"「個人」「法人」が逆。募集発行は法人消化を主体とし、売出発行は個人消化を主体としている"},
{c:9,s:"債券の基礎知識",n:17,d:"C",a:0,q:"事業債とは、民間事業会社の発行する債券であるが、銀行はこれを発行することができない。",e:"銀行も事業債を発行することができる"},
{c:9,s:"債券の基礎知識",n:18,d:"A",a:0,q:"資産担保証券では、自らが保有する資産の信用力やキャッシュ・フローを裏付けとした資金調達になり、従来のファイナンス同様、直接の負債になる。",e:"資産担保証券は、自らが保有する資産の信用力やキャッシュ・フローを裏付けとした資金調達になるが、直接の負債にはならない"},
{c:9,s:"発行市場と流通市場・その他の債券",n:19,d:"B",x:1,a:1,q:"サムライ債は、国際機関や外国の政府、地方公共団体、及び事業法人（非居住者）等が日本国内市場において円貨建てで発行する債券である。",e:"「サムライ債」＝非居住者が日本国内市場で円貨建てで発行する債券。逆に日本の発行体が海外で発行する外貨建て債券は含まれない。"},
{c:9,s:"発行市場と流通市場・その他の債券",n:20,d:"B",a:0,q:"国内で発行されるコマーシャル・ペーパー（国内CP）とは、優良企業が無担保で短期の資金調達を行うために割引方式で発行する一種の約束手形であり、金融市場の動向等に精通した機関投資家及び個人向けに販売されている。",e:"コマーシャル・ペーパー（国内CP）は、主として機関投資家向けに販売され、個人向けには販売されない"},
{c:9,s:"発行市場と流通市場・その他の債券",n:21,d:"C",x:1,a:1,q:"各債券の金額に対する1年当たりの利子の割合を利率という。",e:"利率（クーポンレート）＝額面に対する年間利子の割合。利回り（購入価格に対する収益率）と混同させる出題に注意。"},
{c:9,s:"発行市場と流通市場・その他の債券",n:22,d:"C",x:1,a:1,q:"期中償還には定時償還と任意償還とがあり、定時償還は発行時に償還の時期と額面金額が決められているが、任意償還は発行者の都合で随時償還を行うことができる。",e:"最終償還（最終期限の到来）に対して、期中償還（最終期限到来前の償還）は定時償還・任意償還の2種類（レジュメP196）。"},
{c:9,s:"発行市場と流通市場・その他の債券",n:23,d:"B",a:1,q:"利回りと残存期間が同じ数銘柄の利付債券があれば、一般に、利率の低い銘柄ほど債券価格も低く、利率の高い銘柄ほど債券価格も高い。",e:"債券価格、利回り、残存期間の関係：〈利率と残存期間が一定の場合〉債券価格が高いと利回りは低下し、安いと利回りは上昇する（利回り低下＝市況好転、利回り上昇＝市況悪化）。〈利回りと残存期間が一定の場合〉利率が高いほど債券価格も高く、利率が低いほど債券価格が安くなる"},
{c:9,s:"発行市場と流通市場・その他の債券",n:24,d:"B",a:0,q:"事業債等の引受シンジケート団を組織することができるのは、証券会社及び銀行等の金融機関である。",e:"事業債等の引受シンジケート団を組織することができるのは証券会社のみであって、銀行等の金融機関は組織に加わることはできない"},
{c:9,s:"発行市場と流通市場・その他の債券",n:25,d:"B",a:0,q:"社債管理者とは、社債権者のために弁済を受ける等の業務を行うのに必要な一切の権限を有する会社であり、社債管理者となることができるのは、銀行、信託銀行や証券会社である。",e:"社債管理者となることができるのは、銀行、信託銀行又は担保付社債信託法による免許を受けた会社に限られている。証券会社は社債管理者になることはできない"},
{c:9,s:"発行市場と流通市場・その他の債券",n:26,d:"B",x:1,a:1,q:"社債管理者を設置する必要のない場合として、各社債の金額（社債の最低売買単位の金額。）が1億円以上である場合がある。",e:"社債管理者を設置しない場合、一般的に財務代理人が置かれる（レジュメP196「覚・必ず」）。"},
{c:9,s:"発行市場と流通市場・その他の債券",n:27,d:"B",x:1,a:1,q:"価格競争入札とは、財務省が提示した発行条件に対して、入札参加者が落札希望価格と落札希望額を入札し、その入札状況に基づいて発行価格と発行額を決定する方式である。",e:"各落札者自らの入札価格に基づいて発行条件が決まる方式（次のダッチ方式・コンベンショナル方式の区別と併せて出題される）。"},
{c:9,s:"発行市場と流通市場・その他の債券",n:28,d:"B",a:0,q:"わが国では、発行する国債の種類によって、各落札者自らが入札した価格が発行条件となるダッチ方式と、各落札者自らの入札価格にかかわらず均一の発行条件となるコンベンショナル方式を使い分けている。",e:"「ダッチ方式」「コンベンショナル方式」の説明が逆"},
{c:9,s:"発行市場と流通市場・その他の債券",n:29,d:"B",x:1,a:1,q:"国債管理政策の策定及び遂行に協力する者であって、国債市場に関する特別な責任及び資格を有する者を「国債市場特別参加者」として財務大臣が指定する。",e:"通称「国債市場特別参加者制度（プライマリー・ディーラー制度）」。国債の安定消化・流通市場の活性化のために財務大臣が指定する。"},
{c:9,s:"発行市場と流通市場・その他の債券",n:30,d:"B",x:1,a:1,q:"スプレッド・プライシング方式とは、投資家の需要状況を調査する際に、利率の絶対値で条件の提示をするのではなく、国債等の金利に対する上乗せ分（スプレッド）を提示することで、金利変化に応じると同時に、きめ細かく投資家の需要を探ろうとするものである。",e:"金利そのものではなく「国債金利＋スプレッド（上乗せ分）」という相対的な提示方式にすることで、入札までの金利変動リスクを抑えつつ投資家需要を把握できる。"},
{c:9,s:"債券市況とその変動要因",n:31,d:"B",x:1,a:1,q:"発行登録制度とは、発行会社があらかじめ有価証券の発行予定額等を記載した発行登録書を提出しておくことにより、一定期間内は実際の発行時に改めて発行届出を行うことなく、発行条件等を記載した発行登録追補書類を提出するだけで発行が可能となる制度である。",e:"発行のたびに届出をやり直す手間を省き、機動的な発行を可能にする制度。"},
{c:9,s:"債券市況とその変動要因",n:32,d:"C",a:0,q:"債券の取引は、取引所市場における売買が中心であり、店頭市場における取引はほとんどない。",e:"債券の取引は店頭市場における取引がほとんどである"},
{c:9,s:"債券市況とその変動要因",n:33,d:"B",x:1,a:1,q:"取引所市場で取引される上場国債の受渡日は、原則として約定日から起算して2営業日目の日とされている。",e:"株式の普通取引（約定日から3営業日目）と混同しないよう注意。"},
{c:9,s:"債券市況とその変動要因",n:34,d:"C",x:1,a:1,q:"債券ディーラー間の売買だけを専門に取り扱う証券会社の1つに債券ブローカーがあり、通称BBと呼ばれている。",e:"BB（ブローカーズ・ブローカー）は、値動きの薄い長期債において、ディーラー間の売買を仲介する専門業者。"},
{c:9,s:"債券市況とその変動要因",n:35,d:"B",a:0,q:"日本証券業協会は、公社債の店頭売買を行う投資者及び証券会社等の参考に資するため、日本証券業協会が指定する協会員からの報告に基づき、公社債店頭売買参考統計値を毎週1回発表している。",e:"「毎週1回」ではなく毎営業日発表している"},
{c:9,s:"債券市況とその変動要因",n:36,d:"C",x:1,a:1,q:"債券の相場は、どの銘柄でも株式ほどの個別色はなく、一般に金融情勢を反映して、概ね同一歩調で同一方向へ動く傾向がある。",e:"個別企業の業績より、金利動向など市場全体の情勢に連動しやすいのが債券相場の特徴。"},
{c:9,s:"債券市況とその変動要因",n:37,d:"B",a:0,q:"コール市場、手形市場、CD（譲渡性預金）市場などの短期金利が低下すると、一般に債券の価格は下落し、利回りは上昇する。",e:"短期金利が低下すると、債券の価格は上昇し、利回りは低下する"},
{c:9,s:"債券市況とその変動要因",n:38,d:"C",x:1,a:1,q:"一般的に、景気が良くなると金利が上がり、債券価格は下落し、景気が悪くなると金利が下がり、債券価格は上昇する。",e:"「景気↑→金利↑→債券価格↓」「景気↓→金利↓→債券価格↑」という基本の関係。"},
{c:9,s:"債券市況とその変動要因",n:39,d:"B",a:0,q:"一般に、債券は、金利上昇やインフレに強いとされる。",e:"債券は、金利の低下（債券価格が上昇）には強いですが、金利の上昇（価格が低下）やインフレには弱い特性があります"},
{c:9,s:"債券市況とその変動要因",n:40,d:"B",a:0,q:"一般に、金融緩和政策は債券市況にとってマイナス要因である。",e:"金融緩和政策は、金利の低下をもたらし、金利が低下すると債券の価格は上昇するので、債券市況にとってはプラス要因"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:41,d:"C",x:1,a:1,q:"一般に、長期債のほうが短期債より価格変動リスクが大きい。",e:"金利変化に対する価格変動幅（デュレーション）は、長期債の方が短期債より大きい。問42・43の入替戦略の前提知識。"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:42,d:"B",a:0,q:"一般的に金利が低下すると予想する場合は、長期債から短期債への入替えが有利である。",e:"金利が低下すると債券価格は上昇しますが、価格変動リスク（価格の値動きの幅）は長期債のほうが短期債より大きいので、短期債より大きく値上がりすることが期待されます。短期債から長期債への入替えが有利"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:43,d:"C",x:1,a:1,q:"長期金利が短期金利より高い状態にある場合、債券の最終利回りをアップさせるためには、利回りの高い長期債に入れ替えることになる。",e:"順イールド（長期金利＞短期金利）の状態を前提とした入替戦略。"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:44,d:"B",x:1,a:1,q:"債券の利回り較差（スプレッド）は、一般にクーポンの高低、期間の長短、上場・非上場などの条件の相違により発生する。",e:"同じ発行体・同じ残存期間でも、クーポンや上場・非上場の違いでスプレッド（利回り差）が生じる。"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:45,d:"C",a:0,q:"ダンベル型（バーベル型）のポートフォリオとは、短期から長期までの債券を各年度ごとに均等に保有し、毎期、同じ満期構成を維持するポートフォリオである。",e:"問題文はラダー型のポートフォリオ。ダンベル型（バーベル型）のポートフォリオとは、流動性確保のための短期債と、収益性追求のための長期債のみを保有するポートフォリオ"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:46,d:"B",a:0,q:"債券の売買に際して、同種、同量の債券等を、所定期日に、所定の価額で反対売買することをあらかじめ取り決めて行う取引のことを、「入替売買」という。",e:"問題文は現先取引のこと。入替売買とは、同一の投資者がある銘柄を売るとともに別の銘柄を買うというように、同時に売り買いを約定する売買手法"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:47,d:"C",x:1,a:1,q:"現先取引には、資金を調達したい売方と資金を運用したい買方との間で、金融商品取引業者がその仲介の役割をする委託現先と金融商品取引業者自身が売方若しくは買方となる自己現先がある。",e:"現先取引の当事者構成（委託現先／自己現先）。"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:48,d:"B",a:0,q:"債券の着地取引とは、将来の一定の時期に、一定の条件で債券を受渡しすることをあらかじめ取り決めて行う売買取引であって、約定日から受渡日までの期間（着地期間）が3か月を超える場合をいう。",e:"債券の着地取引における着地期間は、1か月以上で原則として6か月を超えないものとされている"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:49,d:"C",a:0,q:"着地取引の取引先は、上場会社又はこれに準ずる個人であって、経済的、社会的に信用のあるものに限られている。",e:"着地取引の取引先は、上場会社又はこれに準ずる法人であって、経済的、社会的に信用のあるものに限られている。個人は取引できない"},
{c:9,s:"債券売買手法・着地取引・貸借取引",n:50,d:"B",x:1,a:1,q:"債券貸借取引は、担保の有無によって3種類あるが、一般的に「貸借レポ取引」ともいわれる「現金担保付債券貸借取引」が、短期金融市場の中核として知られている。",e:"債券貸借取引の参加者に規制はないが、金融機関同士での取引が中心。「現金担保付債券貸借取引」のほかに「無担保債券貸借取引」「代用有価証券担保付債券貸借取引」がある。"},
{c:9,s:"転換社債型新株予約権付社債",n:51,d:"A",a:0,q:"転換社債型新株予約権付社債においては、新株予約権を社債から分離して譲渡することができる。",e:"転換社債型新株予約権付社債（転換社債・CB）は、新株予約権と社債を組み合わせた社債で、新株予約権を社債から分離して譲渡することはできない"},
{c:9,s:"転換社債型新株予約権付社債",n:52,d:"B",x:1,a:1,q:"転換社債の発行価額は額面単価より高く設定されているものもある。",e:"レジュメP212「覚・必ず」。転換社債は「バー」「オーバーパー」と呼ばれる、額面（パー）より高い発行価額で設定されるのが一般的。株式に転換できるメリットの分、発行体に有利な条件で発行できる。"},
{c:9,s:"転換社債型新株予約権付社債",n:53,d:"C",a:0,q:"転換社債は、株式に転換できるというメリットがあるために、一般的に同じ時期に発行される普通社債よりも利率が高く設定される。",e:"一般的に同時期に発行される普通社債より利率は低く設定される（低クーポン）。株式に転換できるメリットの分、利子（クーポン）を低く抑えられ、発行体は株式に転換されれば額面（借金）を返さなくてよい"},
{c:9,s:"転換社債型新株予約権付社債",n:54,d:"C",a:0,q:"転換請求期間内に転換請求されなかった転換社債は、償還日に株式に転換される。",e:"転換請求期間内に株式に転換されなかった転換社債は、償還日に額面で払い戻される（社債のまま満期償還）"},
{c:9,s:"転換社債型新株予約権付社債",n:55,d:"B",x:1,a:1,q:"転換社債は、ほとんどの銘柄が満期一括償還制をとっているが、発行会社が、自社の転換社債を市場から買入消却する場合もある。",e:"償還は一部に途中償還制もあるが満期一括償還制がほとんど。発行会社による買入消却や、繰上償還条項が付けられる場合がある（レジュメP212）。"},
{c:9,s:"転換社債型新株予約権付社債",n:56,d:"A",x:1,a:1,q:"転換により得られる株数は、転換社債型新株予約権付社債の額面を転換価額で除して求められるが、その計算の結果1株未満の端数が生じたときは、その端数分については銘柄により切り捨てられる場合又は金銭で支払われる場合がある。",e:"取得株数＝額面金額／転換価額（問64・65参照）。端数は切り捨てられる場合と現金で精算される場合があり、少数点は原則として現金精算。"},
{c:9,s:"転換社債型新株予約権付社債",n:57,d:"B",a:0,q:"転換社債の時価とパリティ価格との間に生じる差を乖離といい、転換社債の時価のほうがパリティ価格より割高な状態をマイナス（逆）乖離という。",e:"転換社債の時価のほうがパリティ価格より割高な状態を「プラス乖離」という"},
{c:9,s:"転換社債型新株予約権付社債",n:58,d:"B",x:1,a:1,q:"一般に転換社債において、転換社債価格よりパリティ価格のほうが上回っている場合、株式に転換して売却したほうが有利である。",e:"プラス乖離（転換社債価格＞パリティ価格）の場合は転換社債のままの売却が有利、マイナス乖離（転換社債価格＜パリティ価格、＝パリティ価格のほうが上回る）の場合は株式に転換して売却したほうが有利（レジュメP214「覚・必ず」）。"},
{c:9,s:"債券投資計算",n:59,d:"B",a:0,q:"投資者が最終償還期限まで債券を保有した場合の年利子と1年当たりの償還差損益の合計額の投資元本に対する割合を、所有期間利回りという。",e:"問題文は最終利回りの記述。所有期間利回りとは、既発債を市場価格で買い付け、償還期限まで保有せずに中途売却する場合の利回り"},
{c:9,s:"債券投資計算",n:60,d:"B",a:0,q:"直接利回りとは、投資者が新発債（新たに発行される債券。）を発行価格で買い付け、最終償還期限まで保有する場合の年利子と1年当たりの償還差損益の合計額の投資元本に対する割合である。",e:"問題文は応募者利回りの記述。直接利回りとは、購入価格に対して1年間でどれだけの利子（クーポン）が受け取れるかの割合"},
{c:9,s:"債券投資計算",n:61,d:"C",x:1,a:1,q:"転換社債の売却時に経過利子が発生している場合、当該経過利子を受け取ることができる。",e:"転換社債（利付債）も普通社債と同様、売却時に経過利子（直前利払日の翌日から受渡日までの日数分の利子）を受け取れる。"},
{c:9,s:"債券投資計算",n:62,d:"B",a:0,q:"一般に、経過利子は、既発行の利付債券を売買する場合に、直前利払日の翌日から受渡日までの期間に応じて、売方から買方に支払われる。",e:"経過利子は買方から売方に支払われる（受渡日までの期間分の利子を、次の利払いで受け取る売方があらかじめ買方から受け取る）"},
{c:9,s:"債券売買手法",n:63,d:"B",o:["顧客と取引を開始する場合は、あらかじめ契約書を交わし、整備・保管する。", "外貨建債は、現先取引の売買対象債券の範囲に含まれない。", "現先取引の対象となる債券は、残存期間が1年3か月以上のものとされている。", "現先取引の取引顧客は、上場会社又はこれに準ずる個人であって、経済的、社会的に信用のあるものに限られている。", "現先取引の対象となる債券には、新株予約権付社債が含まれる。"],a:[1],q:"次の文章のうち、「債券の現先取引」に関する記述として、正しいものの番号を1つ選びなさい。",e:"2：外貨建債は現先取引の対象債券に含まれる。3：現先取引の対象債券には、残存期間についての定めはない。4：現先取引の取引顧客は、上場会社又はこれに準ずる法人であって、個人は取引できない（問49の着地取引と同じひっかけパターン）。5：新株予約権付社債は、現先取引の対象にはならない。"},
{c:9,s:"債券投資計算",n:64,d:"B",o:["322株は株式となり、960円を現金で受け取る。", "322株は株式となり、1,340円を現金で受け取る。", "598株は株式となり、960円を現金で受け取る。", "598株は株式となり、1,340円を現金で受け取る。", "1,000株は株式となり、現金の受け取りはない。"],a:[4],q:"転換価額1,670円のA社転換社債額面100万円を転換した場合の取得株数、及び受取金額について、正しいものの番号を1つ選びなさい。 ※当該銘柄は、転換時に端数が生じた場合、その分は現金で支払われるものとする。 ※株式の売買単価は100株とする。 （注）答は、小数第3位以下を切り捨ててある。",e:"取得株数＝額面金額／転換価額＝100万円／1,670円＝598.80…株 ∴ 598株は株式となります。 端数は0.80…株で、100万円－(1,670円×598株)＝1,340円となり、この場合現金で支払われます。"},
{c:9,s:"転換社債の計算",n:65,d:"B",t:[["項目", "値"], ["転換価額", "800円"], ["利付転換社債の時価", "100円"], ["転換の対象となる株式の時価", "855円"]],o:["パリティ価格93円、乖離率-5.66%", "パリティ価格93円、乖離率5.66%", "パリティ価格106円、乖離率-5.66%", "パリティ価格106円、乖離率5.95%", "パリティ価格106円、乖離率-6.00%"],a:[3],q:"次の条件の利付転換社債型新株予約権付社債（本問において転換社債という）について、パリティ価格及び乖離率の組合せとして正しいものの番号を1つ選びなさい。（注）パリティ価格は円単位未満を、乖離率は小数第3位以下を切り捨てること。",e:"パリティ価格＝株価／転換価額×100＝855円／800円×100＝106.875円 ∴106円 乖離率＝(転換社債の時価－パリティ価格)／パリティ価格×100＝(100円－106円)／106円×100＝-5.6603…% ∴-5.66%"},
{c:9,s:"転換社債",n:66,d:"B",o:["転換社債価格上昇・金利低下・クレジットスプレッド縮小・株価上昇・ボラティリティ下落", "転換社債価格上昇・金利上昇・クレジットスプレッド縮小・株価上昇・ボラティリティ上昇", "転換社債価格上昇・金利低下・クレジットスプレッド縮小・株価下落・ボラティリティ上昇", "転換社債価格下落・金利上昇・クレジットスプレッド拡大・株価下落・ボラティリティ下落", "転換社債価格下落・金利上昇・クレジットスプレッド拡大・株価下落・ボラティリティ上昇"],a:[4],q:"転換社債型新株予約権付社債の価格と金利、クレジットスプレッド、株価及びボラティリティとの関係として、正しいものの番号を1つ選びなさい。",e:"転換社債の価格の変動要因別マトリクス（正しい組合せ）は「価格上昇：金利低下・クレジットスプレッド縮小・株価上昇・ボラティリティ上昇」「価格下落：金利上昇・クレジットスプレッド拡大・株価下落・ボラティリティ下落」。この組合せに一致するのは番号4のみ。"},
{c:9,s:"債券投資計算",n:67,d:"C",o:["0.062%", "1.023%", "1.386%", "1.401%", "1.416%"],a:[3],q:"利率1.6%、残存期間5年、購入価格101円の利付国債の最終利回りとして正しいものの番号を1つ選びなさい。 （注）答は、小数第4位以下を切り捨てること。",e:"最終利回り＝{利率＋(償還価格－購入価格)／残存期間(年)}／購入価格×100 ＝{1.6＋(100－101)／5}／101×100＝1.3861…% ≒ 1.386%"},
{c:9,s:"債券投資計算",n:68,d:"C",o:["イは償還価格、ロは購入価格、ハは所有期間、ニは購入価格", "イは償還価格、ロは発行価格、ハは償還期限、ニは発行価格", "イは償還価格、ロは償還価格、ハは償還期限、ニは購入価格", "イは売却価格、ロは償還価格、ハは所有期間、ニは発行価格", "イは売却価格、ロは購入価格、ハは償還期限、ニは購入価格"],a:[2],q:"次の算式は、債券の応募者利回りを算出する算式である。算式の（ ）に当てはまる語句の組合せとして正しいものの番号を1つ選びなさい。 ` 応募者利回り（%）＝ {利率＋((イ)－(ロ))／(ハ)} ／ (ニ) ×100 `",e:"応募者利回り＝新発債を発行価格で買い付け、償還期限まで保有する場合の利回り。イ＝償還価格、ロ＝発行価格、ハ＝償還期限、ニ＝発行価格の組合せが正しい（番号2）。"},
{c:9,s:"債券投資計算",n:69,d:"C",o:["2.389%", "2.514%", "2.643%", "2.815%", "2.987%"],a:[1],q:"利率1.8%の10年満期の利付国債を101.50円で買い付けたところ、4年後に104.00円に値上がりしたので売却した。この場合の所有期間利回りとして正しいものの番号を1つ選びなさい。 （注）答は、小数第4位以下を切り捨てること。",e:"所有期間利回り＝{利率＋(売却価格－購入価格)／所有期間(年)}／購入価格×100 ＝{1.8＋(104.00－101.50)／4}／101.50×100＝2.3891…% ≒ 2.389%"},
{c:9,s:"債券投資計算",n:70,d:"C",o:["1.676%", "1.818%", "2.095%", "2.232%", "2.514%"],a:[3],q:"利率年2.2%、償還期間6年、購入価格105円の利付債券の直接利回りとして正しいものの番号を1つ選びなさい。 （注）答は、小数第4位以下を切り捨てること。",e:"直接利回り（直利）＝利率／価格×100＝2.2／105×100＝2.0952…% ≒ 2.095%"},
{c:9,s:"債券投資計算",n:71,d:"B",o:["102.75円", "103.65円", "104.45円", "105.35円", "106.48円"],a:[5],q:"利率年3.0%、残存期間5年の利付債券について、最終利回りが1.6%となるように購入した場合の購入価格として正しいものの番号を1つ選びなさい。 （注）答は、小数第3位以下を切り捨てること。",e:"購入価格＝{償還価格＋(利率×残存年数)} ／ {1＋(利回り／100×残存年数)} ＝{100＋(3.0×5)} ／ {1＋(1.6／100×5)}＝106.481…円 ≒ 106.48円 補足: レジュメP218では、この公式の分母を素直に計算すると誤りやすいとして、購入価格をXとおいて「利率＋(償還価格－X)／残存年数」＝目標利回り、という一次方程式で解く別解が「覚・必ず」として紹介されている。検算の際に使うとよい。"},
{c:9,s:"債券投資計算",n:72,d:"B",t:[["直前の利払日", "XX年6月20日"], ["売買契約締結日（約定日）", "XX年9月12日"], ["受渡日", "XX年9月13日"], ["次の利払日", "XX年12月20日"]],o:["82日", "83日", "84日", "85日", "86日"],a:[4],q:"A氏は以下のように利付国債を売却したが、その経過利子を計算する際の経過日数として正しいものの番号を1つ選択しなさい。",e:"経過利子を計算する場合の経過日数は、直前の利払日の翌日から、債券の受渡日までです（約定日ではありません）。また、土曜日、日曜日及び祝日も日数にカウントします。 経過日数は、6月21日（直前の利払日の翌日）から9月13日（受渡日）までをカウントする。 6月：21日から30日までの10日間（6月は30日まで） 7月：31日間 8月：31日間 9月：13日までの13日間 ∴経過日数＝10日間＋31日間＋31日間＋13日間＝85日間"},
{c:9,s:"債券投資計算",n:73,d:"B",o:["経過利子の額は4,781円であり、売却代金から経過利子が差し引かれる。", "経過利子の額は4,781円であり、売却代金に経過利子が加えられる。", "経過利子の額は6,000円であり、売却代金から経過利子が差し引かれる。", "経過利子の額は6,000円であり、売却代金に経過利子が加えられる。", "経過利子の額は6,723円であり、売却代金に経過利子が加えられる。"],a:[4],q:"次の文章のうち、ある個人が利率年3.0%、額面100万円の上場国債を取引所取引により売り付けた場合で、経過日数が73日であるときの経過利子に関する記述として正しいものの番号を1つ選びなさい。",e:"経過利子は売方が買方から受け取ります（売却代金に加えられます）。 経過利子(A)＝額面(100円)当たりの年利子×経過日数／365 売買額面総額の経過利子＝(A)×売買額面総額／100 3×73／365＝0.6 0.6×100万円／100＝6,000円"},
{c:9,s:"債券投資計算",n:74,d:"B",o:["1,015,600円", "1,025,600円", "1,045,400円", "1,071,800円", "1,092,600円"],a:[2],q:"ある個人（居住者）が、額面100万円の長期利付国債を取引所取引により単価102円で購入したときの受渡代金として、正しいものの番号を1つ選びなさい。 （注）経過利子は1,200円、委託手数料は額面100円につき40銭（消費税相当額10%を考慮すること）で計算すること。",e:"受渡代金＝購入額面×(購入)単価／100円＋経過利子＋(委託手数料＋消費税) ＝(1,000,000円×102円／100円)＋1,200円＋(1,000,000円×0.4／100×1.1) ＝1,020,000円＋1,200円＋4,400円＝1,025,600円 補足: 買い代金＝購入額面×(購入)単価／100円＋経過利子＋(委託手数料＋消費税)、売り代金＝売却額面×(売却)単価／100円＋経過利子－(委託手数料＋消費税)。符号（＋か－か）の違いが頻出のひっかけポイント。"},
{c:10,s:"投資信託とは",n:1,d:"B",a:0,q:"投資信託は、市場型間接金融といわれており、投資信託に内在するリスクは、投資信託委託会社の信用リスクのみである。",e:"投資信託に内在するリスクは、投資信託委託会社の信用リスクのみでなく、運用資産の価格変動リスクや信用リスク、外国資産の為替変動リスクなど多岐に及ぶ"},
{c:10,s:"投資信託とは",n:2,d:"C",a:0,q:"投資信託は、信託銀行によって元本が保証されている。",e:"投資信託の元本は保証されていない"},
{c:10,s:"投資信託とは",n:3,d:"B",x:1,a:1,q:"投資信託及び投資法人の投資対象となる特定資産に、「デリバティブ取引に係る権利」、「不動産」、「不動産の賃借権」が含まれる。",e:"特定資産には有価証券のほか、デリバティブ取引に係る権利、不動産、不動産の賃借権、地上権なども含まれる（レジュメP222）。"},
{c:10,s:"投資信託とは",n:4,d:"B",a:0,q:"証券投資信託とは投資信託財産の総額の3分の1を超える額を有価証券等に対する投資として運用することを目的とした投資信託をいう。",e:"証券投資信託とは、投資信託財産の総額の2分の1を超える額を有価証券等に対する投資として運用することを目的とした投資信託をいう"},
{c:10,s:"投資信託の種類",n:5,d:"B",a:0,q:"委託者指図型投資信託の投資信託財産には法人格はないが、投資法人も投資信託財産自体には法人格はない。",e:"委託者指図型投資信託においてはファンドに法人格はないが、投資法人においてはファンド自体に法人格がある"},
{c:10,s:"投資信託の種類",n:6,d:"B",a:0,q:"委託者非指図型投資信託は、証券投資信託として設定されなければならない。",e:"委託者非指図型投資信託は、証券投資信託以外の投資信託として設定されなければならない"},
{c:10,s:"投資信託の種類",n:7,d:"B",a:0,q:"クローズド期間とは、投資信託約款によりあらかじめ配当を行わないと決めた期間のことをいう。",e:"クローズド期間とは、あらかじめ投資信託約款で定めた解約請求できない期間のことをいう"},
{c:10,s:"投資信託の種類",n:8,d:"B",a:0,q:"追加型投資信託は、最初に設定された信託の基金の上に次々と追加設定を行って一個の大きな基金として運用するもので、信託期間は10年である。",e:"追加型投資信託の信託期間は、無期限や長期であり、10年のみではない"},
{c:10,s:"投資信託の種類",n:9,d:"B",x:1,a:1,q:"単位型投資信託は、当初の募集期間にのみ購入することができ、その後、追加設定は行われない。",e:"単位型（ユニット型）は当初募集期間限定で、その後の追加設定は行われない点が追加型との最大の違い（問11参照）。"},
{c:10,s:"投資信託の種類",n:10,d:"B",x:1,a:1,q:"追加型投資信託は、ファンドの規模を大きくするために、いつでも自由に追加設定を行うことができる。",e:"追加型（オープン型）は当初設定後も追加設定が可能で、いつでも購入できる。"},
{c:10,s:"投資信託の種類",n:11,d:"B",a:0,q:"単位型投資信託と追加型投資信託の違いは、投資対象が株式か公社債かという点にある。",e:"単位型・追加型の違いは、当初募集後に追加設定ができるかどうかという点。投資対象が株式か公社債かという分類は「株式投資信託」「公社債投資信託」の違い"},
{c:10,s:"投資信託の種類",n:12,d:"B",x:1,a:1,q:"株式投資信託は、投資信託約款上、株式を組み入れることができる旨の規定があれば、実際に株式を組み入れていなくても株式投資信託に分類される。",e:"実際の組入比率にかかわらず、約款上の株式組入れの可否で株式投資信託／公社債投資信託が区分される。"},
{c:10,s:"投資信託の種類",n:13,d:"C",x:1,a:1,q:"公社債投資信託は、投資信託約款上、一切株式を組み入れることができない旨の規定がある投資信託をいう。",e:"公社債投資信託は株式を一切組み入れられない旨が約款に定められている投資信託。"},
{c:10,s:"投資信託の種類",n:14,d:"B",a:0,q:"外貨建て資産に投資対象を限定した投資信託を、外国投資信託という。",e:"問題文は外貨建て投資信託の記述。外国投資信託とは、外国において外国の法令に基づいて設定される投資信託"},
{c:10,s:"投資信託の種類",n:15,d:"B",x:1,a:1,q:"通貨選択型ファンドは、投資対象資産が生み出す利子や配当等の収益機会に加え、為替変動による収益機会も追求するファンドである。",e:"投資対象資産（株式・債券等）とは別に、複数の通貨から投資家が選択した通貨との為替取引を組み合わせることで、為替差益（or差損）も収益源とする仕組み。"},
{c:10,s:"投資信託の種類",n:16,d:"B",a:0,q:"ファンド・オブ・ファンズとは、投資信託財産の運用を、投資信託や投資証券などの証券投資信託受益証券以外の証券に対して行う証券投資信託をいう。",e:"ファンド・オブ・ファンズとは、投資信託財産の運用を、主として投資信託や投資証券などの証券投資信託受益証券等に対して行う証券投資信託をいう"},
{c:10,s:"投資信託の種類",n:17,d:"B",a:0,q:"ブル・ベア型ファンドのうち、ベア型は、相場が上昇した場合に利益が出るように設計されたファンドである。",e:"記述はブル型のもの。ベア型は、相場が下落した場合に利益が出るように設計されたファンド"},
{c:10,s:"投資信託の種類",n:18,d:"C",x:1,a:1,q:"上場投資信託（ETF）は、証券取引所に上場され、株式と同様の方法で売買が行われる投資信託である。",e:"ETFの基本的な定義（詳細は問82以降で扱う）。"},
{c:10,s:"投資信託の種類",n:19,d:"C",x:1,a:1,q:"ラップ口座とは、証券会社等が投資家との間で投資一任契約を締結し、株式や投資信託等の売買を一括して行うサービスである。",e:"資産配分から売買執行、管理までを一括して証券会社等に任せられる口座サービス。"},
{c:10,s:"投資信託の種類",n:20,d:"B",x:1,a:1,q:"MRF（マネー・リザーブ・ファンド）は、証券総合口座専用の追加型公社債投資信託である。",e:"MRFは証券総合口座に付随する公社債投資信託（安全性・流動性重視、問95参照）。"},
{c:10,s:"証券投資信託の仕組み",n:21,d:"B",x:1,a:1,q:"証券投資信託は、委託者指図型投資信託のうち、投資信託財産を主として有価証券に対する投資として運用することを目的とするものである。",e:"証券投資信託の定義そのもの。"},
{c:10,s:"証券投資信託の仕組み",n:22,d:"B",a:0,q:"委託者指図型投資信託において、投資信託契約は委託者、受託者及び受益者の三者間で締結されなければならない。",e:"委託者指図型投資信託において、投資信託契約は委託者及び受託者の二者間で締結される"},
{c:10,s:"証券投資信託の仕組み",n:23,d:"C",x:1,a:1,q:"証券投資信託の投資信託委託会社は、内閣総理大臣の登録を受けた金融商品取引業者（投資運用業）である。",e:"投資信託委託会社は投資運用業の登録を受けた金融商品取引業者。"},
{c:10,s:"証券投資信託の仕組み",n:24,d:"C",x:1,a:1,q:"証券投資信託において、投資信託委託会社は、一つの投資信託約款について、一つの信託会社又は信託業務を営む金融機関を受託者としなければならない。",e:"1つの投資信託約款につき受託者は1つ。"},
{c:10,s:"証券投資信託の仕組み",n:25,d:"B",x:1,a:1,q:"証券投資信託において、受益証券は無記名式である。",e:"証券投資信託の受益証券は無記名式で発行される。"},
{c:10,s:"証券投資信託の仕組み",n:26,d:"B",x:1,a:1,q:"証券投資信託の受益者は、投資信託約款に基づいて信託の利益を受ける権利を持つとともに、その受益権を均等に有する。",e:"受益者は口数に応じて均等の権利を有する（問36参照）。"},
{c:10,s:"証券投資信託の仕組み",n:27,d:"B",x:1,a:1,q:"証券投資信託の投資信託約款の記載事項には、「委託者における公告の方法」が含まれる。",e:"投資信託約款の記載事項の1つ。"},
{c:10,s:"証券投資信託の仕組み",n:28,d:"B",a:0,q:"委託会社は、投資信託を取得しようとする者に対して、必ず投資信託約款の内容を記載した書面を交付しなければならない。",e:"目論見書に投資信託約款の内容が記載されている場合などは、書面の交付を省くことができる"},
{c:10,s:"証券投資信託の仕組み",n:29,d:"B",a:0,q:"証券投資信託において、受託者となることができるのは、信託会社、信託業務を営む金融機関又は投資顧問会社である。",e:"投資顧問会社は、受託者となることはできない。受託者となれるのは信託会社又は信託業務を営む金融機関"},
{c:10,s:"証券投資信託の仕組み",n:30,d:"C",a:0,q:"委託者指図型投資信託では、受託者が投資信託財産の運用の指図を行う。",e:"委託者指図型投資信託では、委託者が投資信託財産の運用の指図を行う"},
{c:10,s:"証券投資信託の仕組み",n:31,d:"B",a:0,q:"証券投資信託において、目論見書の作成及び運用報告書の作成は受託会社の業務である。",e:"目論見書及び運用報告書の作成は委託会社の業務である"},
{c:10,s:"証券投資信託の仕組み",n:32,d:"C",x:1,a:1,q:"証券投資信託における受託会社は、投資信託財産を分別保管し、投資信託財産の名義人となって自己の名で管理する。",e:"受託会社（信託銀行等）は投資信託財産を自己の固有財産や他の信託財産と分別保管し、名義人として管理する。"},
{c:10,s:"証券投資信託の仕組み",n:33,d:"B",a:0,q:"投資信託財産は、すべて投資信託委託会社の名義となる。",e:"投資信託財産は、受託会社の名義となる"},
{c:10,s:"証券投資信託の仕組み",n:34,d:"B",a:0,q:"証券投資信託において、受託者は、投資信託財産の設定を業務として行う。",e:"投資信託財産の設定は委託会社の業務である"},
{c:10,s:"証券投資信託の仕組み",n:35,d:"B",x:1,a:1,q:"証券投資信託の受益者は、投資信託契約に基づき信託の利益を受ける権利を有する者である。",e:"受益者の定義そのもの。"},
{c:10,s:"証券投資信託の仕組み",n:36,d:"B",x:1,a:1,q:"証券投資信託の受益者は、分配金、償還金の受領について受益権の口数に応じて均等の権利を有する。",e:"受益権の内容（口数に応じた均等性、問26と関連）。"},
{c:10,s:"証券投資信託の仕組み",n:37,d:"B",x:1,a:1,q:"販売会社の投資信託に係る業務には、委託会社の代理人として受益者に対する償還金や分配金の支払いの取扱いがある。",e:"販売会社は募集・販売のほか、委託会社の代理人として償還金・分配金の支払取扱いも行う。"},
{c:10,s:"証券投資信託の仕組み",n:38,d:"B",x:1,a:1,q:"信託報酬とは、投資信託財産の運用管理を行うことに対する報酬で、投資信託委託会社と受託会社が投資信託財産から受けるもので、所定の率を日割計算し、日々、投資信託財産から控除している。",e:"信託報酬は投資信託財産から日々控除される、委託会社・受託会社（販売会社を含む場合もある）の運用管理報酬。"},
{c:10,s:"証券投資信託の運用",n:39,d:"C",a:0,q:"アクティブ運用の代表的なものにインデックス運用があり、日経平均株価やTOPIXなどの指数をベンチマークとして、できるだけベンチマークに近い運用成果を目指す。",e:"インデックス運用は、アクティブ運用ではなくパッシブ運用である"},
{c:10,s:"証券投資信託の運用",n:40,d:"B",a:0,q:"トップダウン・アプローチとは、個別企業に対する調査・分析に基づいて、個別銘柄の積み重ねでポートフォリオを組成していく手法である。",e:"トップダウン・アプローチとは、マクロ経済に対する調査・分析に基づいてポートフォリオを組成する方法。問題文はボトムアップ・アプローチのこと"},
{c:10,s:"証券投資信託の運用",n:41,d:"B",x:1,a:1,q:"グロース株運用は企業の成長性を重視し、バリュー株運用は割安な株価を重視して株式の銘柄選択を行うアクティブ運用の運用スタイルである。",e:"グロース株運用＝成長性重視、バリュー株運用＝割安性重視（問42参照）。"},
{c:10,s:"証券投資信託の運用",n:42,d:"B",a:0,q:"株式のアクティブ運用のうち、企業の成長性を重視する運用手法をバリュー株運用という。",e:"企業の成長性を重視する運用手法はグロース株運用である。バリュー株運用とは株価が割安であることを重視する運用手法"},
{c:10,s:"証券投資信託の運用",n:43,d:"A",x:1,a:1,q:"債券投資信託の運用は、ポートフォリオの平均残存期間（デュレーション）を定めて流動性を確保し、組入債券の信用リスクの変化に注目して銘柄の入替を行うリスク・コントロールが基本である。",e:"デュレーション管理と信用リスク管理が債券投信運用の基本（レジュメP238）。"},
{c:10,s:"証券投資信託の運用",n:44,d:"C",x:1,a:1,q:"投資信託委託会社は、証券投資信託の受益者のために忠実に、また、善良な管理者の注意をもって投資信託財産の運用の指図その他の業務を遂行しなければならない。",e:"善管注意義務・忠実義務（レジュメP239）。"},
{c:10,s:"証券投資信託の運用",n:45,d:"B",a:0,q:"証券投資信託において、信託財産に組み入れた有価証券に係る議決権の行使は受託会社が行うが、その指図は投資者である受益者が行う。",e:"議決権の行使は受託会社が行うが、その指図は委託会社が行う（受益者ではない）"},
{c:10,s:"証券投資信託の運用",n:46,d:"B",a:0,q:"証券投資信託において、投資信託委託会社は、自己が運用する投資信託財産の運用の指図について、他の投資信託委託会社に再委託することを一切禁止されている。",e:"投資信託委託会社は、自己が運用する特定の投資信託財産の全部又は一部の運用指図権を、他の国内外の投資信託委託会社等に再委託することができる。ただし、その投資信託委託会社が運用するすべての投資信託財産の運用指図権の全部を再委託することはできない"},
{c:10,s:"証券投資信託の販売",n:47,d:"B",a:0,q:"投資信託の販売は金融商品取引法上の金融商品取引契約の締結に該当するため、金融商品取引業者等は販売に当たっては必ず契約締結前交付書面を作成し、あらかじめ投資家に交付しなければならない。",e:"契約締結前交付書面に記載すべき内容が記載されている目論見書や、記載もれの事項を別途記載した書面を目論見書と共に交付した場合は、契約締結前交付書面の交付は必要ない"},
{c:10,s:"証券投資信託の販売",n:48,d:"C",x:1,a:1,q:"公募投資信託を募集、販売し、取得してもらうためには、定められた時期に目論見書の交付が必要となるが、この目論見書には交付目論見書と請求目論見書とがある。",e:"目論見書は「交付目論見書」（販売時に必ず交付）と「請求目論見書」（投資家からの請求があれば交付）の2種類（レジュメP241）。"},
{c:10,s:"証券投資信託の販売",n:49,d:"B",x:1,a:1,q:"あらかじめ投資家の同意を得た上で、目論見書の内容を電子メールで提供した場合には、当該目論見書を交付したものとみなされる。",e:"投資家の事前同意があれば、電磁的方法（電子メール等）による提供も目論見書の交付とみなされる。"},
{c:10,s:"証券投資信託の販売",n:50,d:"B",a:0,q:"金融商品取引業者等は、MMFやMRFの換金を行うのに併せて、他のファンドへの取得の申込みを勧誘（乗換えの勧誘）する場合には、乗換えに関する重要な事項について説明を行わなければならない。",e:"乗換えに関する重要事項の説明については、MMFやMRFを換金する場合は除外されている"},
{c:10,s:"証券投資信託の販売",n:51,d:"B",x:1,a:1,q:"単位型株式投資信託及び追加型株式投資信託の募集（販売）手数料は販売会社により異なる。",e:"販売手数料は各販売会社が独自に設定できる（自由化されている）。"},
{c:10,s:"証券投資信託の販売",n:52,d:"B",x:1,a:1,q:"追加型の株式投資信託において、外国の資産を組み入れたファンドの購入価額は、買付申込日の翌営業日の基準価額となる。",e:"外国資産組入れファンドは為替市場・海外市場の時差を考慮し、購入価額の適用日が国内資産のみのファンド（申込当日の基準価額）より1日遅れる場合がある。"},
{c:10,s:"証券投資信託の販売",n:53,d:"B",x:1,a:1,q:"追加型投資信託が、基準価額適用日・申込締切時刻・海外取引所などの休業日における申込受付中止などの制度を設け、ブラインド方式を採用しているのは、フリーランチを防止し、金融商品市場の取引の公平性を保つためである。",e:"ブラインド方式＝申込時点でその日の基準価額が分からない仕組み。既に分かっている基準価額を見てから駆け込みで売買する「フリーランチ」を防ぎ、投資家間の公平性を保つための制度。"},
{c:10,s:"証券投資信託のディスクロージャー",n:54,d:"B",x:1,a:1,q:"証券投資信託において、投資信託委託会社は、受益証券の取得の申込の勧誘が適格機関投資家私募の方法により行われた場合には、投資信託約款で運用報告書を交付しない旨を定めることができる。",e:"適格機関投資家私募（プロ向け私募）の場合、運用報告書の交付省略を約款で定められる（レジュメP244）。"},
{c:10,s:"証券投資信託の計算",n:55,d:"B",a:0,q:"証券投資信託の基準価額とは、投資信託財産の1口当たりの時価総額のことをいう。",e:"基準価額とは、投資信託財産の1口当たりの純資産価額のことをいう"},
{c:10,s:"証券投資信託の計算",n:56,d:"B",x:1,a:1,q:"追加型株式投資信託の場合、経費控除後の配当等収益の全額に加え、期中の実現売買損益と期末時価で評価替えした評価損益との合計額から経費を控除し、前期から繰り越された欠損金がある場合にはその欠損金を補填した後の額を分配することができる。",e:"追加型株式投資信託の分配可能額の計算方法（レジュメP246・247）。"},
{c:10,s:"証券投資信託の計算",n:57,d:"B",x:1,a:1,q:"追加型株式投資信託における受益者の換金方法には、解約と買取りの2つの方法がある。",e:"「解約請求」（委託会社に信託契約の一部解約を請求）と「買取請求」（販売会社に受益証券の買取りを請求）の2種類。"},
{c:10,s:"証券投資信託の計算",n:58,d:"B",a:0,q:"単位型投資信託は、信託期間が終了するまでは、いかなる場合も償還されることはない。",e:"残存口数が30億口を下回る場合など、定められた水準以下となれば（信託期間終了前でも）償還することができる"},
{c:10,s:"証券投資信託の税金",n:59,d:"B",a:0,q:"追加型株式投資信託の分配金は、普通分配金と元本払戻金（特別分配金）に分けられるが、課税対象となるのは元本払戻金（特別分配金）である。",e:"課税対象となるのは普通分配金である。元本払戻金（特別分配金）は投資元本の払い戻しにあたるため非課税"},
{c:10,s:"証券投資信託の税金",n:60,d:"B",x:1,a:1,q:"追加型株式投資信託の元本払戻金（特別分配金）の支払を受けた投資家については、分配金発生日（決算日）において、個別元本から元本払戻金（特別分配金）を控除した額が、当該受益者のその後の個別元本とされる。",e:"元本払戻金（特別分配金）を受け取ると、その分だけ個別元本が切り下がる。"},
{c:10,s:"証券投資信託の税金",n:61,d:"A",x:1,a:1,q:"株式投資信託の普通分配金について、法人投資家は所得税及び復興特別所得税のみの源泉徴収となり、住民税の源泉徴収はない。",e:"個人投資家は所得税・復興特別所得税に加え住民税も源泉徴収されるが、法人投資家は住民税の源泉徴収がない点が異なる。"},
{c:10,s:"投資法人",n:62,d:"C",x:1,a:1,q:"投資法人は、資産運用以外の行為を営業とすることができない。",e:"投資法人の業務範囲の原則（レジュメP251）。"},
{c:10,s:"投資法人",n:63,d:"C",a:0,q:"投資法人は、投資法人であることが明らかな場合にはその商号中に投資法人という文字を用いる必要がない。",e:"投資法人は「投資法人」という文字を、その商号中に用いなければならない"},
{c:10,s:"投資法人",n:64,d:"B",x:1,a:1,q:"登録投資法人は、実際の資産運用業務、資産保管業務及びその他の一般事務について、外部委託することが義務付けられている。",e:"投資法人は社員（従業員）を雇用しない「箱」のような組織で、実務は資産運用会社・資産保管会社・一般事務受託者に外部委託することが義務付けられている。"},
{c:10,s:"投資法人",n:65,d:"B",x:1,a:1,q:"設立企画人の少なくとも1名には、設立しようとする投資法人が主として投資の対象とする特定資産と同種の資産の運用事務の経験などが資格要件として定められている。",e:"設立企画人の資格要件の1つ。"},
{c:10,s:"投資法人",n:66,d:"B",x:1,a:1,q:"投資法人制度における規約は、投資法人の基本事項を定めたもので、契約型投資信託でいえば投資信託約款、株式会社でいえば定款に当たるものである。",e:"投資法人の「規約」＝契約型投資信託の「投資信託約款」＝株式会社の「定款」に相当。"},
{c:10,s:"投資法人",n:67,d:"B",x:1,a:1,q:"投資法人制度において、規約に記載すべき事項の1つに「投資法人が発行することができる投資口の総口数」がある。",e:"規約の記載事項の1つ。"},
{c:10,s:"投資法人",n:68,d:"B",x:1,a:1,q:"投資法人の成立時の出資総額は、設立の際に発行する投資口の払込価額の総額であり、1億円以上と定められている。",e:"投資法人成立時の最低出資総額（1億円以上）。"},
{c:10,s:"投資法人",n:69,d:"B",a:0,q:"投資法人は、設立については登録制を採用しているが、業務については届出制を採用している。",e:"設立は届出制を採用しているが、業務は登録制を採用している（「設立」「業務」に対応する制度が逆）"},
{c:10,s:"投資法人",n:70,d:"C",x:1,a:1,q:"投資法人は投資口の募集を行うことができるが、投資法人の執行役員は投資証券等の募集等に係る事務を行ってはならない。",e:"投資証券等の募集等に係る事務は、資産運用会社等の第三者に委託する必要がある。"},
{c:10,s:"投資法人",n:71,d:"B",x:1,a:1,q:"「監督役員の選任・解任」及び「資産運用業務委託契約の承認」は投資主総会の決議事項とされている。",e:"投資主総会の決議事項の例。"},
{c:10,s:"投資法人",n:72,d:"B",a:0,q:"投信法では、投資主が投資主総会に出席せず、かつ議決権を行使しないときは、議案に反対するとみなす旨を規約に定めることができるとしている。",e:"規約に定めれば、投資主が投資主総会に出席せず、かつ議決権を行使しないときは、議案について賛成したものとみなすことができる"},
{c:10,s:"投資法人",n:73,d:"C",a:0,q:"投資法人の役員には、執行役員、監督役員及び会計監査人の3種類がある。",e:"投資法人の役員は執行役員と監督役員の2種類である（会計監査人は役員ではない）"},
{c:10,s:"投資法人",n:74,d:"B",a:0,q:"執行役員の数には制限はなく、1名でもよいとされ、役員会で選任される。",e:"執行役員は1人でもよいとされているが、投資主総会で選任される（役員会ではない）"},
{c:10,s:"投資法人",n:75,d:"B",a:0,q:"投資法人の監督役員は投資主総会で選任され、その数に制限はなく1人でもよいとされる。",e:"監督役員の数は、（執行役員の数＋1）以上の人数でなければならない"},
{c:10,s:"投資法人",n:76,d:"B",x:1,a:1,q:"ある投資法人の監督役員となっている者は、その同じ投資法人の執行役員を兼任することができない。",e:"執行役員と監督役員の兼任禁止（相互牽制のため）。"},
{c:10,s:"投資法人",n:77,d:"B",x:1,a:1,q:"資産運用会社は、資産運用に係る権限の一部について、他の運用業務を行う金融商品取引業者等に再委託することができる旨を、投資法人との契約に定めることができる。",e:"資産運用会社による再委託も、投資法人との契約で可能。"},
{c:10,s:"投資法人",n:78,d:"B",x:1,a:1,q:"不動産投資法人は、主として不動産等や不動産等を主たる投資対象とする資産対応証券等に投資し、賃料収入等の運用益を投資者に分配する。",e:"不動産投資法人（J-REIT）の基本的な仕組み。"},
{c:10,s:"投資法人",n:79,d:"B",a:0,q:"ファンドの運用資産の50%以上を不動産等で運用するものであれば、不動産投資法人として取引所に上場することができる。",e:"上場不動産投資法人は、金融商品取引所のルールにより、ファンド運用資産全体の70%以上が不動産等で占められることなどの要件を満たす必要がある"},
{c:10,s:"投資法人",n:80,d:"B",x:1,a:1,q:"不動産投資法人は上場株式と同様に市場で売買され、指値・成行注文のどちらも認められている。",e:"上場不動産投資法人は上場株式同様、指値・成行いずれの注文も可能で、信用取引も可能（問85のETFと共通する性質）。"},
{c:10,s:"投資法人",n:81,d:"B",a:0,q:"「一般事務受託者」とは、投資法人の委託を受けてその資産の運用及び保管に関する業務に係る事務を行う者をいう。",e:"一般事務受託者は、投資法人の委託を受けて、その資産の運用及び保管に関する業務以外の業務に係る事務を行う（資産の運用・保管は資産運用会社・資産保管会社が担う）"},
{c:10,s:"ETF",n:82,d:"C",x:1,a:1,q:"ETFは投資成果が株価指数や商品価格等の指標に連動するように設定され、取引所に上場される投資信託をいう。",e:"ETF（上場投資信託）の定義。"},
{c:10,s:"ETF",n:83,d:"B",x:1,a:1,q:"現物拠出型のETFの場合には、証券会社や機関投資家などの大口投資家は、株価指数に連動するETFであれば、対象株価指数に連動するように選定された現物株式のポートフォリオをファンドに拠出して、受益権を取得すること（設定）ができる。",e:"現物拠出型ETFの設定・交換（現物株バスケットとETF受益権の交換）の仕組み。"},
{c:10,s:"ETF",n:84,d:"B",x:1,a:1,q:"ETFは指値注文、成行注文が可能である。",e:"上場株式と同様の注文方法が使える。"},
{c:10,s:"ETF",n:85,d:"B",x:1,a:1,q:"ETFの売買注文については信用取引が認められている。",e:"上場株式同様、ETFも信用取引の対象となりうる。"},
{c:10,s:"ETF",n:86,d:"B",x:1,a:1,q:"ETFの取引単位は、ファンドごとに定められている。",e:"取引単位（売買単位）は銘柄（ファンド）ごとに個別に設定される。"},
{c:10,s:"ETF",n:87,d:"B",a:0,q:"ETFは、他の証券投資信託と同様に基準価額に基づく価格で購入・換金することができる。",e:"ETFは他の証券投資信託とは異なり、上場株式と同様に取引所における市場価格で売買される（基準価額に基づく購入・換金ではない）"},
{c:10,s:"ETF",n:88,d:"B",a:0,q:"ETFの収益の分配については、所得税法に対する税法上の取扱いは、普通分配金と元本払戻金（特別分配金）に区別される。",e:"ETFの収益の分配は、上場株式等の配当と同様に扱われるので、一般の株式投資信託のように普通分配金と元本払戻金（特別分配金）に区別されることはない"},
{c:10,s:"公社債投資信託",n:89,d:"B",a:0,q:"「長期公社債投資信託（追加型）」は換金代金の支払方法として、キャッシングの制度がある。",e:"長期公社債投資信託（追加型）には、キャッシングの制度はない（キャッシング制度があるのはMRF、問95参照）"},
{c:10,s:"公社債投資信託",n:90,d:"B",x:1,a:1,q:"「長期公社債投資信託（追加型）」では、期末における元本超過額の全額を分配することになっている。",e:"長期公社債投資信託（追加型）の分配方針。"},
{c:10,s:"投資信託の種類",n:91,d:"B",o:["イ：オープンエンド ロ：クローズドエンド ハ：オープンエンド ニ：クローズドエンド", "イ：オープンエンド ロ：クローズドエンド ハ：クローズドエンド ニ：オープンエンド", "イ：オープンエンド ロ：クローズドエンド ハ：クローズドエンド ニ：クローズドエンド", "イ：クローズドエンド ロ：オープンエンド ハ：オープンエンド ニ：クローズドエンド", "イ：クローズドエンド ロ：オープンエンド ハ：クローズドエンド ニ：オープンエンド"],a:[2],q:"次の文中のイ〜ニの（ ）に当てはまる語句を正しく選んでいるものを1〜5より1つ選びなさい。 ・（イ）型は、発行者が発行証券を買い戻すことができるファンドであり、換金は純資産価格（基準価額）に基づいて行われる。 ・（ロ）型は、解約又は買戻しとこれによる基金の減少が原則として行われず、換金は市場で売却するしかない。 ・（ハ）型は（ニ）型と比べると基金の資金量が安定している。",e:"イ＝オープンエンド型（発行者による買戻しあり、基準価額で換金）、ロ＝クローズドエンド型（解約・買戻しなし、市場売却のみ）。クローズドエンド型は解約による資金流出がないため、オープンエンド型と比べて基金の資金量が安定している＝ハ＝クローズドエンド型、ニ＝オープンエンド型。"},
{c:10,s:"証券投資信託の仕組み",n:92,d:"B",o:["投資信託財産の運用の指図", "投資信託約款の届出・変更", "投資信託財産の管理", "目論見書、運用報告書などのディスクロージャー作成", "投資信託約款の内容及び内容の変更に関する承諾・同意"],a:[3, 5],q:"証券投資信託における投資信託委託会社の業務として、誤っているものを2つ選びなさい。",e:"3・5はいずれも受託会社（信託会社及び信託業務を営む金融機関）の業務である。投資信託委託会社は運用の指図・約款の届出変更・ディスクロージャー作成などを行う（問30・31・33・34参照）。"},
{c:10,s:"証券投資信託の運用",n:93,d:"B",o:["イ④、ロ③、ハ①、ニ②", "イ③、ロ④、ハ②、ニ①", "イ③、ロ④、ハ①、ニ②", "イ④、ロ③、ハ⑥、ニ⑤", "イ③、ロ④、ハ⑥、ニ⑤"],a:[3],q:"次の文中のそれぞれの（ ）に当てはまる語句を下の語群から選びなさい。 証券投資信託の運用手法でアクティブ運用には、大別して、マクロ経済に対する調査・分析結果でポートフォリオを組成していく（イ）と個別企業に対する調査・分析結果の積み重ねでポートフォリオを組成していく（ロ）がある。 さらに、アクティブ運用には、企業の成長性を重視する（ハ）や株式の価値と株価水準を比較し、割安と判断される銘柄を中心にする（ニ）などがある。 〔語群〕①グロース株運用 ②バリュー株運用 ③トップダウン・アプローチ ④ボトムアップ・アプローチ ⑤パッシブ運用 ⑥インデックス運用",e:"イ＝トップダウン・アプローチ（③）、ロ＝ボトムアップ・アプローチ（④）、ハ＝グロース株運用（①、成長性重視）、ニ＝バリュー株運用（②、割安性重視）。問40・41・42と同じ内容を穴埋め形式で問う問題。"},
{c:10,s:"証券投資信託のディスクロージャー",n:94,d:"B",o:["イ及びハ", "イ及びニ", "イ、ロ及びハ", "ロ、ハ及びニ", "イ、ロ、ハ及びニ全て"],a:[5],q:"証券投資信託の交付運用報告書の記載事項として正しいものを選んでいる選択肢を1つ選びなさい。 イ．当該投資信託財産の運用方針 ロ．当該投資信託財産の計算期間中における資産の運用の経過 ハ．運用状況の推移 ニ．株式のうち主要なものにつき、銘柄ごとに、当期末現在における時価総額の投資信託財産の純資産額に対する比率",e:"イ〜ニのすべてが交付運用報告書の記載事項に該当する。"},
{c:10,s:"公社債投資信託",n:95,d:"B",o:["買付日から30日未満の日に解約した場合、1万口（1口1円）について10円の信託財産留保額が控除される。", "販売単位は、1口（1口10万円）単位とされている。", "毎月決算が行われ、分配金は毎月末に再投資される。", "株式投資信託に分類される。", "キャッシング（即日引出）が可能である。"],a:[5],q:"証券総合口座用ファンド（MRF）に関する記述として、正しいものを1つ選びなさい。",e:"1：MRFは信託財産留保額が控除されることはない。2：販売単位は1口（1口1円）単位。3：毎月ではなく毎日決算が行われ、分配金は月末に再投資される。4：MRFは公社債投資信託に分類される。5：MRFは解約請求当日に資金化したい場合のキャッシング業務（即日引出）が利用できる（8章問5〜7参照）。"},
{c:12,s:"経済",n:1,d:"B",a:0,q:"国民経済計算では「国内総生産＝雇用者報酬＋営業余剰・混合所得＋固定資本減耗＋（間接税＋補助金）」の式が成立する。",e:"正しくは（間接税 − 補助金）"},
{c:12,s:"経済",n:2,d:"B",x:1,a:1,q:"GDPは一国の経済活動の様子を全体的にとらえる代表的な指標といえ、これは生産（付加価値）、分配（所得）、支出（需要）の3つの側面を持っており、3つのどの面から見ても金額が等しいという意味で「三面等価の原則」が成り立っているという。",e:"レジュメP290。生産＝分配＝支出。同じパイを3つの角度から見ているだけなので、必ず一致する。"},
{c:12,s:"経済",n:3,d:"B",a:0,q:"物価関連統計のうち「GDPデフレーター」は、実質GDPを名目GDPで除して求められる。",e:"名目GDPを実質GDPで除して求める"},
{c:12,s:"経済",n:4,d:"B",a:0,q:"内閣府は、景気動向指数と呼ばれる指標を作成し、3か月に1度公表している。",e:"内閣府が 毎月 公表"},
{c:12,s:"経済",n:5,d:"B",a:0,q:"景気動向指数は、先行指数、一致指数及び遅行指数からなるが、東証株価指数は一致指数の1つである。",e:"東証株価指数は 先行指数"},
{c:12,s:"経済",n:6,d:"B",a:0,q:"景気動向指数の先行指数の1つに有効求人倍率がある。",e:"有効求人倍率は 一致指数"},
{c:12,s:"経済",n:7,d:"C",a:1,q:"DIによる景気動向指数においては、50％を上回れば景気は拡張し、逆に下回れば景気は後退しているとされている。",e:"DIは採用系列のうち拡張した系列の割合。50％を超えるか否かだけが問題で、数値の水準には意味がなく景気の方向感しかわからない"},
{c:12,s:"経済",n:8,d:"B",a:0,q:"「全国企業短期経済観測調査（日銀短観）」は、日本銀行が2か月に1度公表している。",e:"日本銀行が 3か月ごと に公表"},
{c:12,s:"経済",n:9,d:"B",a:1,q:"消費関連統計において、所得には、雇用者報酬、財産所得、混合所得・営業余剰、社会保障給付等がある。",e:"所得＝雇用者報酬＋財産所得＋混合所得・営業余剰＋社会保障給付 等"},
{c:12,s:"経済",n:10,d:"C",a:0,q:"消費関連統計において、可処分所得とは、所得から所得税を差し引いたものである。",e:"所得税だけでなく 社会保険料等（健康保険料・年金保険料・雇用保険料等）も差し引く"},
{c:12,s:"経済",n:11,d:"B",x:1,a:1,q:"平均消費性向が一定であっても、可処分所得が増加すれば消費支出は増加する。",e:"消費性向＝消費支出 ÷ 可処分所得。この比率が一定のまま可処分所得が増えれば、消費支出も比例して増える。"},
{c:12,s:"経済",n:12,d:"C",a:0,q:"消費関連統計において、「家計貯蓄」は、所得から可処分所得を差し引いて求められる。",e:"家計貯蓄＝可処分所得 − 消費支出"},
{c:12,s:"経済",n:13,d:"B",a:0,q:"消費関連統計のうち「家計貯蓄率」は、家計貯蓄を財産所得で除して求められる。",e:"家計貯蓄率＝家計貯蓄 ÷ 可処分所得"},
{c:12,s:"経済",n:14,d:"B",x:1,a:1,q:"住宅関連統計のうち新設住宅着工は工事着工ベースであるため、新設住宅着工の戸数は景気の変動に先行して動く傾向があり、景気先行指標として利用されている。",e:"レジュメP294。新設住宅着工は「工事着工ベース」なので景気より先に動く＝先行指数。GDP統計の民間住宅投資は「工事進捗ベース」で別物。"},
{c:12,s:"経済",n:15,d:"B",a:1,q:"完全失業率は、完全失業者数を労働力人口で除して求められる。",e:"完全失業者＝求職活動はしたが仕事をしなかった人。労働力人口＝15歳以上で働く意思を持つ者の人口（学生は含まない）"},
{c:12,s:"経済",n:16,d:"B",a:0,q:"労働力人口は、就業者数と完全失業者数との合計であり、労働力人口比率はこの労働力人口に占める15歳以上人口の割合である。",e:"労働力人口比率は 15歳以上人口に占める労働力人口 の割合（分子分母が逆）"},
{c:12,s:"経済",n:17,d:"B",a:0,q:"雇用関連統計のうち「有効求人倍率」は、有効求職者数を有効求人数で除して求められる。",e:"有効求人倍率＝有効求人数 ÷ 有効求職者数（分子分母が逆）"},
{c:12,s:"経済",n:18,d:"C",x:1,a:1,q:"有効求人倍率は、一般に好況期に上昇し、不況期に低下し、景気の動きにほぼ一致して変動する。",e:"景気の動きに「ほぼ一致して」変動するから一致指数。問6の「先行指数」というひっかけと対で覚える。"},
{c:12,s:"経済",n:19,d:"B",x:1,a:1,q:"有効求人倍率が1を上回るということは、「仕事を探している人の数」より「企業が募集している働く人の数」が相対的に多く、逆に1を下回るとその反対の状況であることを意味している。",e:"有効求人倍率＝求人数 ÷ 求職者数。1を超える＝求人が求職者より多い＝好景気。レジュメでは「好景気1倍以上／不景気1倍以下」。"},
{c:12,s:"経済",n:20,d:"B",x:1,a:1,q:"有効求人倍率は、公共職業安定所等に登録した人のみを対象とするので、実態よりも高く表れる傾向がある。",e:"ハローワーク等に登録した人だけが分母になる。実際に職を探している人はもっと多いので、実態より高めに出る。"},
{c:12,s:"経済",n:21,d:"B",a:1,q:"労働生産性とは、労働投入量1単位当たりの生産量であり、生産量を就業者数と年間総労働時間の積で除したものである。",e:"労働生産性 ＝ 生産量 ÷（就業者数 × 年間総労働時間）"},
{c:12,s:"経済",n:22,d:"B",x:1,a:1,q:"労働投入量とは、就業者数と年間総労働時間の積で表される。",e:"労働投入量＝就業者数 × 年間総労働時間。労働生産性＝生産量 ÷ 労働投入量、の分母にあたる部分。"},
{c:12,s:"経済",n:23,d:"B",x:1,a:1,q:"企業物価指数（CGPI）は企業間で取引される財の価格の水準を指数で示したものであり、国内企業物価指数、輸出物価指数、輸入物価指数の3つの基本分類指数と、この他に基本分類指数を組み替えたり、調整を加えた参考指数があり、日本銀行から発表される。",e:"レジュメP296。CGPIは日本銀行が発表。企業間で取引される財の価格で、短期的な変動が大きく為替の影響を受ける。CPI（総務省）と作成主体を入れ替えるひっかけに注意。"},
{c:12,s:"経済",n:24,d:"C",a:1,q:"消費者物価指数（CPI）は総務省から発表される。",e:"CPIは家計（消費者）が購入する各種の消費財やサービスの 小売価格 の水準を指数値で示したもの"},
{c:12,s:"経済",n:25,d:"B",a:0,q:"消費者物価指数（CPI）は、家計が購入する約600品目の価格を各品目の平均消費額で加重平均した数値であり、その算出にあたっては、土地や住宅等の価格は含まれ、直接税や社会保険料等の非消費支出は含まれない。",e:"CPIの算出にあたっては 土地や住宅等の価格も含まれない"},
{c:12,s:"経済",n:26,d:"B",x:1,a:1,q:"GDPデフレーターはGDPに計上されるすべての財・サービスを含むのでCPIよりも包括的な物価指標である。",e:"GDPデフレーターはGDPに計上される全ての財・サービスが対象。CPIは家計が買うものだけなので、範囲が広いのはGDPデフレーターのほう。"},
{c:12,s:"経済",n:27,d:"B",x:1,a:1,q:"国際収支統計は、一定期間における一国のあらゆる対外取引を体系的に記録した統計である。",e:"一定期間における一国のあらゆる対外取引を、体系的に記録した統計。"},
{c:12,s:"経済",n:28,d:"B",a:0,q:"国際収支統計において、金融収支は、貿易・サービス収支、第一次所得収支及び第二次所得収支を合計して求められる。",e:"その合計は 経常収支"},
{c:12,s:"経済",n:29,d:"A",x:1,a:1,q:"国際収支統計は、「経常収支＋資本移転等収支−金融収支＋誤差脱漏＝0」になるように統計が作成されている。",e:"レジュメP297。経常収支＋資本移転等収支−金融収支＋誤差脱漏＝0。誤差脱漏は帳尻合わせの項目で、必ず0になるように作られている。"},
{c:12,s:"経済",n:30,d:"A",x:1,a:1,q:"国際収支統計においては、経常収支が黒字の国は金融収支が黒字となるのに対し、経常収支が赤字の国は金融収支が赤字となるのが一般的である。",e:"経常収支で稼いだ分は、対外資産の増加（＝金融収支の黒字）として現れる。問29の恒等式から導ける。"},
{c:12,s:"経済",n:31,d:"C",x:1,a:1,q:"為替レートとは外国為替市場において異なる通貨が交換（売買）される際の交換比率のことであり、例えば、「1ドル130円」といった表示方法を邦貨建ての為替レートという。",e:"レジュメP302。「1ドル＝130円」のように自国通貨で表すのが邦貨建て。「1円＝0.0066ドル」なら外貨建て。"},
{c:12,s:"経済",n:32,d:"B",a:0,q:"ドルの需要が発生するのは、外国が日本から製品を輸入する場合や日本の債券・株式を購入する場合であり、ドルの供給が発生するのは、日本が外国から原材料や製品を輸入する場合や外国の債券・株式を購入する場合である。",e:"逆。ドルの需要＝日本が外国から輸入する場合や外国の債券・株式を購入する場合。ドルの供給＝外国が日本から輸入する場合や日本の債券・株式を購入する場合"},
{c:12,s:"経済",n:33,d:"B",a:1,q:"貿易依存度は、自国の貿易額（輸出＋輸入）を名目GDPで除して求められる。",e:"貿易依存度は、世界貿易の動向に自分の国の経済がどの程度影響を受けるかを表したもの"},
{c:12,s:"金融",n:34,d:"C",x:1,a:1,q:"通貨の基本的機能には、価値尺度としての機能、交換手段としての機能、価値の貯蔵手段としての機能がある。",e:"レジュメP299。価値尺度（物価）・交換手段（支払、決済）・価値の貯蔵手段（貯蓄）の3つ。インフレになると、この3つがそれぞれ低下する。"},
{c:12,s:"金融",n:35,d:"B",x:1,a:1,q:"マネーストックとは、国内の民間非金融機関が保有する通貨量（一般の法人、個人及び地方公共団体等が保有する通貨の量。）のことであり、国や金融機関が保有する預金等は含まれない。",e:"レジュメP299で「覚」が付いた箇所。世の中に出回っているお金の量。国と金融機関が保有する分は含まない。有価証券（株式）も含まない。"},
{c:12,s:"金融",n:36,d:"B",x:1,a:1,q:"現金通貨と預金通貨の合計をM1と呼び、M1に準通貨である定期性預金及びCDを加えたものをM3と呼ぶ。",e:"M1＝現金通貨＋預金通貨。M3＝M1＋準通貨（定期性預金）＋CD。積み上がる順で覚える。M2はM3のうち預け先が国内銀行等に限定されたもの。"},
{c:12,s:"金融",n:37,d:"B",x:1,a:1,q:"マネーストック統計において、要求払預金はM1に計上される。",e:"要求払預金＝いつでも引き出せる預金（普通預金、当座預金）。これが預金通貨にあたるのでM1に入る。定期性預金は準通貨なのでM3。"},
{c:12,s:"金融",n:38,d:"B",a:0,q:"インフレが起こると通貨の価値がその分上がることになる。",e:"通貨の価値はその分 下がる"},
{c:12,s:"金融",n:39,d:"C",a:0,q:"実質金利から物価上昇率を差し引いたものが、名目金利である。",e:"名目金利は、実質金利に物価上昇率（インフレ率）を加えた もの"},
{c:12,s:"金融",n:40,d:"C",a:0,q:"物価上昇率年0.5％の状況で年1.5％の金利で資金を借り入れた場合、実質金利は年2％となる。",e:"実質金利＝名目金利−期待インフレ率＝1.5％−0.5％＝1.0％"},
{c:12,s:"金融",n:41,d:"B",a:1,q:"マーシャルのkとは、貨幣の量であるマネーストックを実際の経済活動の程度を表す名目GDPで除したものである。",e:"マーシャルのk ＝ マネーストック ÷ 名目GDP"},
{c:12,s:"金融",n:42,d:"C",a:0,q:"ドルが1ドル80円から160円になったなら、円の価値は倍になったことになる。",e:"円の価値は 半分 になった"},
{c:12,s:"金融",n:43,d:"C",a:0,q:"直接金融とは、金融機関自身が資金余剰主体から資金を調達し、その資金を資金不足主体に貸し付ける金融手法である。",e:"問題文は 間接金融。直接金融は証券市場で企業や政府が株式や債券を発行し資金調達する方法（資金不足主体が発行した証券を資金余剰主体が購入する方法）"},
{c:12,s:"金融",n:44,d:"B",x:1,a:1,q:"日本銀行は、銀行券の独占的発行権を有する「発券銀行」としての機能のほか、市中金融機関を対象に取引を行う「銀行の銀行」及び政府の出納業務を行う「政府の銀行」としての機能も有している。",e:"発券銀行（銀行券の独占的発行）・銀行の銀行（市中金融機関と取引）・政府の銀行（政府の出納業務）の3つの機能。"},
{c:12,s:"金融",n:45,d:"B",a:0,q:"証券金融会社は、短期金融市場における金融機関相互の資金取引の仲介業務を行っている。",e:"問題文は 短資会社 のこと"},
{c:12,s:"金融",n:46,d:"B",a:0,q:"短資会社は、金融商品取引法に基づき免許を受けて、信用取引の決済に必要な資金や有価証券を証券会社に貸し付ける業務を行っている。",e:"問題文は 証券金融会社 のこと"},
{c:12,s:"金融",n:47,d:"C",x:1,a:1,q:"消費者金融会社やリース会社等のいわゆるノンバンクは、社債発行を通じて調達した資金を使って貸付業務を行うことができる。",e:"レジュメP303。ノンバンクは預金業務は×、貸付業務は○。預金を集められないので、社債発行などで資金を調達する。"},
{c:12,s:"金融",n:48,d:"C",a:0,q:"短期金融市場のうち、オープン市場は、金融機関相互の資金運用・調達の場として利用されており、非金融機関は参加できない市場である。",e:"問題文は インターバンク市場。オープン市場とは広く一般の事業法人等が参加できる市場"},
{c:12,s:"金融",n:49,d:"B",x:1,a:1,q:"短期金融市場のうち、インターバンク市場は、コール市場と手形市場からなり、日本銀行の金融調整や金利水準誘導の場としての機能を果たしている。",e:"レジュメP304。インターバンク市場＝金融機関同士（プロのみ）で、コール市場と手形市場からなる。一般企業も入れるオープン市場と対で覚える。"},
{c:12,s:"金融",n:50,d:"B",x:1,a:1,q:"コール市場における資金の最大の貸し手は信託銀行である。",e:"レジュメP304。コール市場の資金の出し手は信託銀行、仲介するのは短資会社。この役割を入れ替えたひっかけが出る。"},
{c:12,s:"金融",n:51,d:"B",a:0,q:"インターバンク市場のうちコール市場で取引されているのは、翌日物（オーバーナイト物）のみである。",e:"翌日物（オーバーナイト物）と 各種期日物 がある"},
{c:12,s:"金融",n:52,d:"B",a:1,q:"CDの流通市場において、事業法人等はCD現先の買い手として参加している。",e:"CD（Negotiable Certificate of Deposit）＝譲渡性預金の略称。第三者に譲渡可能な大口預金"},
{c:12,s:"金融",n:53,d:"C",x:1,a:1,q:"国庫短期証券は、日銀の公開市場操作の対象である。",e:"公開市場操作の対象は手形に限られず、国債や国庫短期証券などの債券も含まれる。問60の「手形に限られている」というひっかけと対。"},
{c:12,s:"金融",n:54,d:"B",x:1,a:1,q:"CPの流通市場においては、短期の現先取引が最大の割合を占めている。",e:"CP＝優良企業が発行する約束手形（3か月物が中心）。流通市場では短期の現先取引が最大の割合を占める。"},
{c:12,s:"金融",n:55,d:"B",a:0,q:"短期プライムレートとは、日本銀行の民間金融機関に対する貸出金について適用される基準金利のことをいう。",e:"問題文は 基準割引率及び基準貸付利率。短期プライムレートは最も信用力がある企業に対する短期最優遇貸出金利"},
{c:12,s:"金融",n:56,d:"B",x:1,a:1,q:"基準割引率及び基準貸付利率とは、日銀の民間金融機関に対する貸出金について適用される基準金利のことであり、一般的に商業手形割引歩合で代表される。",e:"旧公定歩合のこと。日銀が民間金融機関に貸すときの基準金利。短期プライムレート（最も信用力のある企業への最優遇貸出金利）と入れ替えるひっかけが定番。"},
{c:12,s:"金融",n:57,d:"C",a:1,q:"日本銀行の代表的な金融政策手段は公開市場操作である。",e:"日銀が金利を調整する主な方法は公開市場操作（オペレーション）と預金準備率操作。公開市場操作が中心"},
{c:12,s:"金融",n:58,d:"B",x:1,a:1,q:"日銀の日々の金融調節は、日本銀行政策委員会が金融政策決定会合で決定した金融市場調節方針に従って、オペレーションによって行われている。",e:"金融政策決定会合で金融市場調節方針を決め、それに従って日々オペレーションを行う。決めるのは日本銀行政策委員会。"},
{c:12,s:"金融",n:59,d:"C",x:1,a:1,q:"公開市場操作とは、日本銀行が貸付利率を入札に付して行う貸付けあるいは市場で債券や手形の売買を行って、民間金融機関が日銀に保有する当座預金残高を増減させ、短期金利に影響を与える政策である。",e:"レジュメP307。市場で債券や手形を売買して、民間金融機関が日銀に持つ当座預金残高を増減させ、短期金利を動かす。日銀の代表的な金融政策手段。"},
{c:12,s:"金融",n:60,d:"C",a:0,q:"日本銀行の行う公開市場操作の対象は、手形に限られている。",e:"手形に限らず 国債などの債券も含まれる"},
{c:12,s:"金融",n:61,d:"B",x:1,a:1,q:"日本銀行の行う公開市場操作の対象に、国債証券は含まれるが株券は含まれない。",e:"公開市場操作の対象は国債証券などの債券で、株券は対象外。問60と合わせて、対象の範囲を整理しておく。"},
{c:12,s:"金融",n:62,d:"B",a:1,q:"日本銀行が市場で債券などを買い入れて資金供給する場合を「買いオペ」、逆に売却して資金吸収する場合を「売りオペ」という。",e:"買いオペ→民間の資金量が増加し金利が低下。売りオペ→民間の資金量が減少し金利が上昇"},
{c:12,s:"金融",n:63,d:"B",a:0,q:"「買いオペ」とは、日本銀行が預金準備率を変更することによって金融機関の支払準備を増減させ、金融市場に影響を与えることをいう。",e:"問題文の記述は「買いオペ」ではなく 預金準備率操作"},
{c:12,s:"金融",n:64,d:"B",a:0,q:"日本銀行が行う預金準備率操作において、預金準備率を上げる目的は、民間金融機関の貸出金利を低下させることである。",e:"預金準備率を上げる目的は貸出金利を 上昇 させること"},
{c:12,s:"金融",n:65,d:"C",x:1,a:1,q:"BIS（Bank for International Settlements）とは、世界の主要国中央銀行の出資によって設立された国際決済銀行のことであり、中央銀行間の決済や国際金融問題に関する協議・調査を行っている。",e:"レジュメP308。BIS＝国際決済銀行。主要国の中央銀行が出資して設立。BIS規制では自己資本比率8％以上が求められる。"},
{c:12,s:"金融",n:66,d:"B",a:0,q:"ペイオフ制度とは、金融機関が破綻した場合、そこに預けてある預金などを、1名義当たり合算して元本と利息をあわせて1,000万円を限度に預金保険機構が払い戻す制度である。",e:"保護されるのは 元本1,000万円までと、その利息。利息は1,000万円の枠の外に上乗せされる。「元本と利息をあわせて1,000万円まで」ではない"},
{c:12,s:"財政",n:67,d:"B",a:0,q:"予算の作成、国会への提出は財務大臣が行い、実際に予算案の編成を行うのは内閣である。",e:"予算の作成、国会への提出は 内閣 が行い、実際に予算案の編成を行うのは 財務大臣"},
{c:12,s:"財政",n:68,d:"C",a:0,q:"国会における予算審議はまず参議院で行われ、可決後に衆議院に送られる。",e:"国会における予算審議はまず 衆議院 で行われ、可決後に 参議院 に送られる"},
{c:12,s:"財政",n:69,d:"C",a:0,q:"参議院が衆議院の可決した予算案を受け取ってから60日以内に議決しない場合、予算は自然成立する。",e:"60日以内ではなく 30日以内"},
{c:12,s:"財政",n:70,d:"B",a:1,q:"参議院が衆議院の可決した予算案を否決した場合は、両院協議会を開くことになっている。",e:"さらに、両院協議会においても意見が一致しない場合には、衆議院の議決が国会の議決 となり、予算が成立する"},
{c:12,s:"財政",n:71,d:"C",a:0,q:"「補正予算」とは、予算成立までの期間の必要経費だけを計上した予算である。",e:"問題文は 暫定予算 のこと。補正予算 は、予算成立後に新たに追加される予算"},
{c:12,s:"財政",n:72,d:"B",x:1,a:1,q:"公共部門とは、一般政府（中央政府、地方政府と社会保障基金の各部門を合わせ、その相互の重複関係を調整したもの。）に公的企業を合わせたものである。",e:"公共部門 ＝ 一般政府 ＋ 公的企業。一般政府は「中央政府・地方政府・社会保障基金」の3つ。ここに公的企業を足したものが公共部門。"},
{c:12,s:"財政",n:73,d:"C",a:0,q:"国民負担率とは、国民所得に対する租税負担の比率である。",e:"国民負担率 とは、国民所得 に対する 租税及び社会保障負担 の比率。社会保障負担が抜けている"},
{c:12,s:"財政",n:74,d:"B",x:1,a:1,q:"基礎的財政収支対象経費とは、一般会計の歳出から国債費の一部を除いたものをいう。",e:"一般会計の歳出から国債費の一部を除いた残り。国の政策そのものに使う経費で、問80のプライマリー・バランスを見るための土台になる。"},
{c:12,s:"財政",n:75,d:"C",a:0,q:"日本の一般会計における基礎的財政収支対象経費の中で最も金額の大きな経費は、公共事業関係費である。",e:"最も金額の大きな経費は 社会保障関係費"},
{c:12,s:"財政",n:76,d:"B",x:1,a:1,q:"国債費とは一般会計で社会保障関係費に次ぐ大きい支出で、過去に発行した国債の元利払いのための支出である。",e:"一般会計全体では 社会保障関係費 ＞ 国債費 ＞ 地方交付税交付金等 の順。国債費は基礎的財政収支対象経費の外側にあるので、問84の順位とは別の話。"},
{c:12,s:"財政",n:77,d:"C",a:0,q:"いわゆる赤字国債は、財政法第4条1項但書に基づいて発行され、4条国債とも呼ばれている。",e:"いわゆる 赤字国債 は、特例公債法 に基づいて発行され、特例国債 とも呼ばれる。財政法第4条にもとづく建設国債が4条国債"},
{c:12,s:"財政",n:78,d:"B",x:1,a:1,q:"公共財とは、防衛、警察、司法などの特殊な財・サービスであり、社会的な必要性が認められるものの、市場メカニズムによる適切な供給が難しいので、政府が供給する必要がある。",e:"市場に任せても適切に供給されないから政府が出る、というのが公共財の考え方。防衛・警察・司法が代表例。"},
{c:12,s:"財政",n:79,d:"B",x:1,a:1,q:"財政の役割として、資源の効率的配分、所得再分配、経済安定化効果の3つがある。",e:"財政の3つの役割は「資源の効率的配分」「所得再分配」「経済の安定化」。3つセットで覚える。数を増やしたり減らしたりして出される。"},
{c:12,s:"財政",n:80,d:"B",a:0,q:"プライマリー・バランスとは、公債金収入を含む収入と利払費及び債務償還費を含めた支出との収支のことである。",e:"プライマリー・バランス とは、公債金収入以外の収入 と、利払費及び債務償還費を除いた支出 との収支のこと。「含む／含めた」と「以外／除いた」が正反対"},
{c:12,s:"財政",n:81,d:"C",a:0,q:"「地方税」とは、納税者が地方公共団体を通じて国に納める税金のことである。",e:"「地方税」とは、納税者が 地方公共団体に 納める税金のこと。国には納めない"},
{c:12,s:"財政",n:82,d:"C",x:1,a:1,q:"国及び地方公共団体の予算は、ともに一般会計予算と特別会計予算から構成されている。",e:"国も地方公共団体も、予算は「一般会計」と「特別会計」の2本立て。どちらか一方だけ、と書かれていたら×。"},
{c:12,s:"金融",n:83,d:"B",o:["当座預金", "定期積金", "投資信託", "国債", "普通預金"],a:[1, 5],q:"次のうち、マネーストック統計において、M1に計上されるものとして正しいものの番号を2つ選びなさい。",e:"M1＝現金通貨＋預金通貨（普通預金・当座預金等の要求払預金）。当座預金と普通預金が要求払預金にあたる。定期積金は準通貨なのでM3、投資信託と国債は広義流動性に入る。"},
{c:12,s:"財政",n:84,d:"B",o:["地方交付税交付金 ＞ 社会保障関係費 ＞ 防衛関係費", "社会保障関係費 ＞ 防衛関係費 ＞ 地方交付税交付金", "防衛関係費 ＞ 公共事業関係費 ＞ 社会保障関係費", "社会保障関係費 ＞ 地方交付税交付金 ＞ 防衛関係費", "地方交付税交付金 ＞ 社会保障関係費 ＞ 公共事業関係費"],a:[4],q:"日本の2024年度の一般会計歳出の内訳について、以下の歳出額の比較として正しいものの番号を1つ選びなさい。",e:"基礎的財政収支対象経費の中の順位は ①社会保障関係費 ②地方交付税交付金等 ③防衛関係費 ④公共事業関係費 ⑤文教及び科学振興費。社会保障関係費は、基礎的財政収支対象経費で見ても一般会計全体で見ても最も大きい。"},
{c:13,s:"金融システムと証券市場",n:1,d:"B",a:0,q:"家計部門、企業部門、政府・公共部門といった経済主体間の資金需要額と供給額は、部門間でも全体としても一致する。",e:"経済主体間の資金需要額と供給額は、全体としてみれば一致するが、部門別では過不足が生じるため必ずしも一致しない"},
{c:13,s:"金融システムと証券市場",n:2,d:"C",a:0,q:"証券市場のうち、株式市場は「直接金融」に分類され、債券市場は「間接金融」に分類される。",e:"株式市場、債券市場ともに「直接金融」に分類される"},
{c:13,s:"金融システムと証券市場",n:3,d:"C",a:0,q:"直接金融では金融仲介機関が資金回収にかかわるリスクを負い、間接金融では資金の最終的貸し手（投資家）がリスクを負う。",e:"「直接金融」と「間接金融」が逆。間接金融では金融仲介機関が資金回収にかかわるリスクを負うのに対して、直接金融では資金の最終的貸し手（投資家）がリスクを負う"},
{c:13,s:"金融システムと証券市場",n:4,d:"C",x:1,a:1,q:"市場型間接金融とは、銀行などの金融機関が資金供給者から預かった資金を、直接企業に貸付けるのではなく、企業が発行する社債やCPなどの有価証券に投資することをいう。",e:"直接金融（証券市場）と間接金融（銀行貸付）の中間形態。金融機関が仲介する点は間接金融と同じだが、貸付ではなく企業の発行する有価証券に投資する点が異なる。"},
{c:13,s:"金融システムと証券市場",n:5,d:"B",a:0,q:"金融商品取引法上の投資者保護は、投資対象となる有価証券の価格を保証したり、株式の配当を約束するものである。",e:"投資の勧誘にあたって、損益をあらかじめ約束したり保証するものではない。ルールを整備して証券投資に関する情報を正確・迅速に投資者が入手できるようにする（ディスクロージャー）こと、また不公正取引から投資者を回避させることが基本"},
{c:13,s:"証券市場",n:6,d:"C",a:0,q:"有価証券が発行者から直接にあるいは証券会社や金融機関等の仲介者を介して、投資者に第一次取得される市場を「流通市場」という。",e:"「流通市場」ではなく 「発行市場」"},
{c:13,s:"証券市場",n:7,d:"C",a:0,q:"既発行となった証券が、第一次投資者から、第二次、第三次投資者に転々流通する市場を「発行市場」という。",e:"「発行市場」ではなく 「流通市場」。問6と対で、発行市場・流通市場の定義を入れ替えて出される"},
{c:13,s:"証券市場",n:8,d:"C",a:0,q:"流通市場は、取引所金融商品市場と債券市場に、大きく分類される。",e:"流通市場は、大きく分けて、（取引所）金融商品市場と金融商品市場以外の市場（店頭市場）に分類される"},
{c:13,s:"証券市場",n:9,d:"B",a:0,q:"金融商品取引業者が店頭デリバティブ業務を行うにはリスクが高いので内閣総理大臣の認可が必要である。",e:"「認可」ではなく 内閣総理大臣の登録 が必要"},
{c:13,s:"証券市場",n:10,d:"B",a:1,q:"金融商品取引業の規制方式には、監督官庁（金融庁）による公的規制のほか、自主規制機関を通じて行われる規制がある。",e:"金融商品取引法により、各金融商品取引所・日本証券業協会・投資信託協会の3団体が自主規制機関としての資格を付与され、監督官庁の公的規制と並んで金融商品取引業規制の柱となっている"},
{c:13,s:"証券市場",n:11,d:"B",x:1,a:1,q:"日本証券業協会は、自主規制機関の1つである。",e:"問10の3団体（各金融商品取引所・日本証券業協会・投資信託協会）の1つ。"},
{c:13,s:"証券市場",n:12,d:"B",a:1,q:"証券取引等監視委員会には、インサイダー取引や金融商品取引業者等による損失保証や損失補填等の市場や取引の公正を損なう行為についての強制調査権が付与されている。",e:"金融商品取引業者・金融機関等の定期検査、捜査当局への告発、金融庁長官への行政処分勧告なども行う"},
{c:13,s:"証券市場",n:13,d:"B",a:0,q:"証券取引等監視委員会は、証券業界の自主規制機関である。",e:"証券取引等監視委員会は証券業界の 監督官庁 であり、自主規制機関ではない。問10・11の自主規制機関（取引所・証券業協会・投資信託協会）と混同させるひっかけ"},
{c:13,s:"証券市場",n:14,d:"B",a:0,q:"証券保管振替機構は、国債の決済及び管理業務を集中的に行う証券決済機関である。",e:"証券保管振替機構は、国債以外の有価証券の決済及び管理業務を集中的に行う証券決済機関。国債の決済は日銀で行う"},
{c:13,s:"証券市場",n:15,d:"B",x:1,a:1,q:"日本証券金融は、金融商品取引法に基づき内閣総理大臣の免許を受けた証券金融専門の株式会社である。",e:"レジュメP319。日本証券金融は内閣総理大臣の免許（登録・認可ではない）を受けた証券金融専門の会社で、信用取引の決済に必要な資金・証券の貸付けに関わる。証券金融会社は「免許」、証券会社は「登録」、PTS業務は「認可」と、手続きの種類を混同させるひっかけに注意。"},
{c:13,s:"サステナブルファイナンス",n:16,d:"B",a:0,q:"サステナブルファイナンスは、特定の金融商品や運用スタイルを指す言葉である。",e:"特定の金融商品や運用スタイルを指す言葉ではない。持続可能な社会を支える金融の制度や仕組み、行動規範、評価手法等の全体像を指す"},
{c:13,s:"サステナブルファイナンス",n:17,d:"C",x:1,a:1,q:"ESG投資において、考慮すべき要素の1つとして、気候変動が挙げられる。",e:"レジュメP320。ESG投資（環境・社会・ガバナンス）の中でも特に注目されているのが気候変動（2015年のパリ協定が契機）。"},
{c:13,s:"サステナブルファイナンス",n:18,d:"B",x:1,a:1,q:"持続可能な社会の実現に向けた投資アプローチとして「ESGインテグレーション」があるが、これはリスク調整後の収益を向上させることを目的として、投資分析及び意思決定プロセスの中でESG要因を継続的に考慮するものである。",e:"問19のスクリーニング系（ポジティブ／ネガティブ）とは別の型のESGアプローチ。「除外する」のではなく「投資判断のプロセスにESG要因を組み込む」点が特徴。"},
{c:13,s:"サステナブルファイナンス",n:19,d:"B",a:0,q:"持続可能な社会の実現に向けたスクリーニングとして「ポジティブ／ベスト・イン・クラス・スクリーニング」があるが、これは投資可能と考えられない活動に基づいて、特定のセクター、企業、国、その他の発行体を、ファンドやポートフォリオから除外するものである。",e:"記述は 「ネガティブ／除外スクリーニング」 のもの。ポジティブ／ベスト・イン・クラス・スクリーニングとは、同業他社比でESGパフォーマンスに優れており、定められた閾値以上の評価を達成したセクター・企業・プロジェクトへの投資をいう"},
{c:13,s:"サステナブルファイナンス",n:20,d:"B",x:1,a:1,q:"ESG要素を考慮した投資信託や、環境や社会課題解決に資するプロジェクトに資金が使われる債券など、サステナブルファイナンスの推進に資する金融商品も増えている。",e:"レジュメP321「ESG関連金融商品」。ESG投資を考慮した投資信託、環境・社会課題解決プロジェクトに資金が使われる債券（SDGs債）などが該当する。"},
{c:13,s:"サステナブルファイナンス",n:21,d:"B",x:1,a:1,q:"債券において、例えば環境にポジティブなインパクトを与えるプロジェクトに資金使途を限定して発行する「グリーンボンド」、社会にポジティブなインパクトを与えるプロジェクトに資金使途を限定して発行する「ソーシャルボンド」、環境にも社会にもポジティブなインパクトを与えるプロジェクトに資金使途を限定して発行する「サステナビリティボンド」の発行が増えている。",e:"レジュメP321のSDGs債の表そのまま。グリーンボンド＝環境、ソーシャルボンド＝社会、サステナビリティボンド＝環境＋社会。組み合わせを入れ替えて出される可能性が高い。"},
{c:13,s:"サステナブルファイナンス",n:22,d:"B",a:0,q:"サステナビリティ・リンク・ボンドは、脱炭素化に時間を要する、温室効果ガスを大量に排出する産業（鉄鋼、化学、電力、ガス、石油、セメント、製紙、パルプ等）の利用を想定したものである。",e:"記述は 「トランジション（移行）ボンド」 のもの。サステナビリティ・リンク・ボンドは、発行体が自らのサステナビリティ戦略に基づくKPI（重要業績評価指標）を投資家に明示し、KPI毎に1つ以上のSPT（Sustainability Performance Target）を設定したうえで、達成状況に応じて利払いや償還等の条件を変える債券"},
{c:13,s:"サステナブルファイナンス",n:23,d:"B",x:1,a:1,q:"機関投資家がESG投資を行うにあたり、企業のESGの取り組みを評価するESG評価機関の評価・格付けを用いることもある。",e:"自社で全ての企業のESGへの取り組みを調べるのは大変なので、外部のESG評価機関の評価・格付けを判断材料に使うことも認められている。"},
{c:13,s:"サステナブルファイナンス",n:24,d:"B",x:1,a:1,q:"金融商品取引業者は、ESG関連金融商品の販売にあたり、グリーンウォッシュやSDGsウォッシュなどに代表されるウォッシュ問題に注意する必要がある。",e:"グリーンウォッシュ＝実態が伴わないのに環境に配慮しているように見せかけること。SDGsウォッシュも同様の考え方。ESG関連商品の販売時に注意すべき問題として出題される。"},
{c:14,s:"セールス業務",n:1,d:"C",x:1,a:1,q:"外務員は、金融商品取引業者等に対する投資者の信頼に応えられるように、高い倫理性に立脚して最善を尽くさなければならない。",e:"レジュメP324の倫理規範(1)そのまま。外務員が守るべき4つの行動原則のうちの1つめ。"},
{c:14,s:"セールス業務",n:2,d:"C",a:0,q:"顧客の注文が相場操縦等不正な取引になることを知りながら、その注文を受託した。",e:"不正な取引になることを知りながら、その注文を受託してはならない"},
{c:14,s:"セールス業務",n:3,d:"C",a:0,q:"投資勧誘を行った銘柄について責任を持つため、顧客と損益を共にすることを約束して投資勧誘を行った。",e:"顧客と損益を共にすることを約束して投資勧誘を行ってはならない"},
{c:14,s:"セールス業務",n:4,d:"C",a:0,q:"かなりの自信をもって推奨できる銘柄であったので、断定的な判断による勧誘を行った。",e:"断定的判断の提供による勧誘は禁止行為にあたる"},
{c:14,s:"セールス業務",n:5,d:"C",a:0,q:"外務員は、投資者に対し、将来における株式の価格の騰落について、断定的にアドバイスしなければならない。",e:"断定的なアドバイスは禁止されている"},
{c:14,s:"セールス業務",n:6,d:"C",a:0,q:"投資経験があまりない顧客から、アドバイスを求められたので、外務員自身が投資の最終決定を行った。",e:"投資の最終決定者は投資者自身"},
{c:14,s:"セールス業務",n:7,d:"C",x:1,a:1,q:"顧客にとって最適であると確信してハイ・リターンの商品を勧めたが、当該顧客は確定利付商品を選択したことから、最終的に顧客の意向に従った。",e:"勧めること自体は問題ない。最後に顧客の意向に従っていて、決定権を顧客に残しているので○。押し切って外務員が決めると×になる。"},
{c:14,s:"セールス業務",n:8,d:"C",x:1,a:1,q:"投資は投資家自身が判断し、その結果は投資家自身に帰属することを顧客に理解してもらった。",e:"自己責任の原則。レジュメで「必ず覚える」と指定された箇所。投資の最終決定権者は投資家自身。"},
{c:14,s:"セールス業務",n:9,d:"C",a:0,q:"市況が大きく変動していたが、顧客と連絡が付かなかったため、同意を得ることなく当該顧客の計算により売買を行った。",e:"同意を得ることなく顧客の計算により売買を行うことは禁止されている"},
{c:14,s:"セールス業務",n:10,d:"C",a:0,q:"投資者が投資目的や資金量にふさわしくない投資を行おうとしている場合、協会員は、会社での権限や立場、利用可能な比較優位情報を利用しながら投資者に代わってその投資の決定を行う。",e:"あくまで投資の決定を行うのは、その投資者自身"},
{c:14,s:"セールス業務",n:11,d:"C",a:0,q:"投資を最終的に決定するのはあくまで投資者自身であり、市況の変動が大きい場合を除いて外務員が決定することがあってはならない。",e:"市況の変動が大きい場合であっても、投資の最終判断は投資者自身が行うもの"},
{c:14,s:"セールス業務",n:12,d:"C",a:0,q:"目論見書に予想分配率が表示されていない証券投資信託について、過去の分配率から外務員自身が予想した分配率を示し、投資勧誘を行った。",e:"外務員自身が予想した分配率を示して投資勧誘を行ってはならない"},
{c:14,s:"セールス業務",n:13,d:"C",x:1,a:1,q:"顧客に投資信託の仕組みについて十分説明し、理解させたうえで、投資勧誘を行った。",e:"「十分説明し、理解させたうえで」がポイント。説明を尽くしたうえでの勧誘なので○。"},
{c:14,s:"セールス業務",n:14,d:"C",x:1,a:1,q:"外務員は、投資家に投資アドバイスを行う際は、合理的な根拠に基づき十分な説明を行う必要がある。また、投資家の誤解を招かないためにも、その説明内容や使用する資料などは正確でなければならない。",e:"レジュメP324の倫理規範(3)「正確かつ合理的根拠に基づく営業活動」。裏返すと、断定的判断の提供は禁止。"},
{c:14,s:"セールス業務",n:15,d:"C",x:1,a:1,q:"顧客の投資目的、資金量、投資知識等を考慮し、それにあった商品、数量及び頻度の投資勧誘を行った。",e:"適合性の原則。顧客の知識・経験・財産の状況・投資目的に照らして判断する。レジュメの倫理規範(4)に対応。"},
{c:14,s:"セールス業務",n:16,d:"C",x:1,a:1,q:"顧客がその投資目的や資金量にふさわしくない投資を行おうとしたので、考え直すよう適切にアドバイスした。",e:"アドバイスは○、代わりに決定するのは×。問10・問11と対で覚える。"},
{c:14,s:"セールス業務",n:17,d:"C",x:1,a:1,q:"顧客に対し、能動的にコミュニケーションをとって、当該顧客の事情を探ったうえで、顧客の投資ニーズに合うと判断した商品の勧誘を行った。",e:"レジュメP324の倫理規範(4)「投資経験や資産など顧客属性の把握に努めること」の実践例。"},
{c:14,s:"セールス業務",n:18,d:"C",x:1,a:1,q:"外務員が適切な倫理感覚を養うには、顧客の立場に立つことが必要であり、また、第三者の目線を意識することも必要である。",e:"顧客の立場に立つことと、第三者の目線を意識すること。どちらか一方だけと書かれていたら×。"},
{c:14,s:"セールス業務",n:19,d:"B",x:1,a:1,q:"「金融サービス業におけるプリンシプル」とは、法令等個別ルールの基礎にあり、各金融機関等が業務を行う際、また、当局が行政を行うに当たって、尊重すべき主要な行動規範・行動原則と考えられるものである。",e:"レジュメP325。プリンシプル＝金融機関が満たすべき行動規範や目指すべき目的を、抽象的な原則として示したもの。証券界の「あるべき姿」。"},
{c:14,s:"セールス業務",n:20,d:"C",a:0,q:"金融サービスの提供者である各金融機関等は、成文化されたルールがない場合やルールの解釈が分かれる場合には、常に周りと同じ行動をするべきである。",e:"成文化されたルールがない場合やルールの解釈が分かれる場合であっても、プリンシプルにより自らがとるべき行動について基本的な考え方が明確となり、機動的・自主的な改善や新サービスの開発・提供に取り組む際の指針となることが期待される"},
{c:14,s:"セールス業務",n:21,d:"B",a:0,q:"「金融サービス業におけるプリンシプル」において、利用者が反社会的勢力であっても、創意工夫をこらした自主的な取り組みにより、利用者利便の向上や社会に期待されている役割を果たすと定められている。",e:"「反社会的勢力との関係を遮断するなど金融犯罪等に利用されない態勢を構築する」と定められている"},
{c:14,s:"セールス業務",n:22,d:"B",a:0,q:"金融サービス提供者は、利用者等からの相談や問い合わせに対し真摯に対応し、必要な情報を提供し、自己の見解を事実と説明したうえで、アドバイス等を行うとともに金融知識の普及に努める必要がある。",e:"「自己の見解を事実と説明したうえで」が不適切"},
{c:14,s:"セールス業務",n:23,d:"B",x:1,a:1,q:"金融サービス提供者は、自身、グループと利用者の間、また、利用者とその他の利用者の間等の利益相反による弊害を防止しなければならない。",e:"レジュメで「覚」が付いた箇所。利益相反は、プリンシプルベース（顧客本位の原則）では「管理」、IOSCOの行為規範原則では「回避」。ここを入れ替えて出題される。"},
{c:14,s:"セールス業務",n:24,d:"B",x:1,a:1,q:"「顧客本位の業務運営に関する原則」では、金融事業者が各々のおかれた状況に応じて、形式ではなく実質において顧客本位の業務運営が実現できるよう、「プリンシプルベース・アプローチ」が採用されている。",e:"レジュメP326。「形式ではなく実質において」が要点。細かい規則で縛らず、原則で示す方式がプリンシプルベース・アプローチ。"},
{c:14,s:"セールス業務",n:25,d:"B",x:1,a:1,q:"「顧客本位の業務運営に関する原則」には、「金融事業者は、顧客本位の業務運営を実現するための明確な方針を策定・公表するとともに、当該方針に係る取組状況を定期的に公表すべきである。当該方針は、より良い業務運営を実現するため、定期的に見直されるべきである」と掲げられている。",e:"顧客本位の業務運営に関する原則1。方針を「策定・公表」し、取組状況を「定期的に公表」し、方針を「定期的に見直す」。この3つがセット。"},
{c:14,s:"セールス業務",n:26,d:"B",x:1,a:1,q:"金融事業者は、高度の専門性と職業倫理を保持し、顧客に対して誠実・公正に業務を行い、顧客の最善の利益を図るべきであり、こうした業務運営が企業文化として定着するよう努めるべきである。",e:"原則2「顧客の最善の利益の追求」。高度の専門性と職業倫理、誠実・公正、そして企業文化として定着させること。"},
{c:14,s:"セールス業務",n:27,d:"B",x:1,a:1,q:"金融事業者は、名目を問わず、顧客が負担する手数料その他の費用の詳細を、当該手数料等がどのようなサービスの対価に関するものかを含め、顧客が理解できるよう情報提供すべきである。",e:"原則4「手数料等の明確化」。「名目を問わず」がポイント。どんな名前の費用でも、何の対価かを含めて顧客に分かるよう示す。"},
{c:14,s:"セールス業務",n:28,d:"B",x:1,a:1,q:"「顧客本位の業務運営に関する原則」には、顧客本位の業務運営を実現するための明確な方針として、「重要な情報の分かりやすい提供」が含まれる。",e:"原則5「重要な情報の分かりやすい提供」。原則は全部で7つある。5と6の名称を入れ替えるひっかけに注意。"},
{c:14,s:"セールス業務",n:29,d:"B",x:1,a:1,q:"「顧客本位の業務運営に関する原則」には、顧客本位の業務運営を実現するための明確な方針として、「顧客にふさわしいサービスの提供」が含まれる。",e:"原則6「顧客にふさわしいサービスの提供」。問28の原則5とセットで覚える。"}
];
