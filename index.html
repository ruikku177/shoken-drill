<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="証券外務員問題集">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>証券外務員問題集</title>
</head>
<body>
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --card2:#E7EBEF; --sunk:#DDE2E7;
  --tx:#141A1F; --tx2:#5C6873; --tx3:#8B97A3;
  --acc:#0F9B7A; --accS:#E2F3EE; --accOn:#FFFFFF;
  --bad:#D4482F; --badS:#FAEAE6; --badOn:#FFFFFF;
  --r:20px; --r2:16px; --r3:14px;
  --sh:0 1px 2px rgba(16,24,32,.05), 0 6px 18px rgba(16,24,32,.06);
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181C; --card:#1D2329; --card2:#262D34; --sunk:#2E353D;
  --tx:#EBF0F4; --tx2:#96A2AE; --tx3:#74808C;
  --acc:#2FBF9A; --accS:#10302A; --accOn:#04211A;
  --bad:#EE7057; --badS:#36201B; --badOn:#210C07;
  --sh:0 1px 2px rgba(0,0,0,.32), 0 6px 18px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#14181C; --card:#1D2329; --card2:#262D34; --sunk:#2E353D;
  --tx:#EBF0F4; --tx2:#96A2AE; --tx3:#74808C;
  --acc:#2FBF9A; --accS:#10302A; --accOn:#04211A;
  --bad:#EE7057; --badS:#36201B; --badOn:#210C07;
  --sh:0 1px 2px rgba(0,0,0,.32), 0 6px 18px rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  --bg:#F2F4F6; --card:#FFFFFF; --card2:#E7EBEF; --sunk:#DDE2E7;
  --tx:#141A1F; --tx2:#5C6873; --tx3:#8B97A3;
  --acc:#0F9B7A; --accS:#E2F3EE; --accOn:#FFFFFF;
  --bad:#D4482F; --badS:#FAEAE6; --badOn:#FFFFFF;
  --sh:0 1px 2px rgba(16,24,32,.05), 0 6px 18px rgba(16,24,32,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--jp);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h1,h2{margin:0;font-weight:600;line-height:1.45;text-wrap:balance}
p{margin:0}

.stage{max-width:34rem;margin:0 auto;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;padding:0 1.1rem}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1rem;padding:1.1rem 0}
.dock{margin-top:auto;padding:1rem 0 1.6rem;display:flex;flex-direction:column;gap:.7rem}

.top{display:flex;align-items:center;justify-content:space-between;gap:.9rem;padding:1.3rem 0 .3rem}
.top h1{font-size:1.12rem;letter-spacing:.01em}
.stamp{font-size:.78rem;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
.quit{font-size:.8rem;color:var(--tx3);padding:.4rem 0}
.quit:hover{color:var(--bad)}

/* progress */
.track{height:9px;background:var(--card2);border-radius:99px;overflow:hidden;display:flex;margin-top:.9rem}
.track i{display:block;height:100%;border-radius:99px}
.track .g1{background:var(--acc)} .track .g2{background:var(--bad)}
.segs{display:flex;gap:3px;margin-top:.9rem}
.segs i{flex:1;height:5px;background:var(--card2);border-radius:99px;transition:background .2s}
.segs i.ok{background:var(--acc)}
.segs i.cl{background:var(--acc);opacity:.55}
.segs i.ng{background:var(--bad)}
.segs i.at{background:var(--tx3)}

/* pills */
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.95rem}
.tg{font-size:.73rem;padding:.36rem .72rem;border-radius:99px;background:var(--card);
  color:var(--tx2);line-height:1.35;white-space:nowrap}
.tg.hot{background:var(--badS);color:var(--bad);font-weight:700}
.tg.good{background:var(--accS);color:var(--acc);font-weight:700}
.tg.run{background:var(--accS);color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}

/* question */
.qcard{background:var(--card);border-radius:var(--r);padding:1.5rem 1.3rem;
  font-size:1.04rem;line-height:1.98;box-shadow:var(--sh)}
.qtb{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.86rem;
  font-variant-numeric:tabular-nums}
.qtb td{border:1px solid var(--card2);padding:.5rem .6rem;line-height:1.5}
.qtb tr:first-child td{background:var(--card2);font-weight:700}
.qtb tr:not(:first-child) td:first-child{color:var(--tx2)}
.item .qtb{font-size:.8rem}

/* 五肢選択 */
.opts5{display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem}
.op{display:flex;align-items:flex-start;gap:.8rem;width:100%;text-align:left;
  background:var(--card);border-radius:var(--r2);padding:.95rem 1rem;box-shadow:var(--sh);
  font-size:.94rem;line-height:1.7;transition:transform .07s,background .13s}
.op:active{transform:scale(.99)}
.op .no{flex:none;width:1.65rem;height:1.65rem;border-radius:99px;background:var(--card2);
  color:var(--tx2);font-size:.82rem;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:.05rem;transition:background .13s,color .13s}
.op[aria-pressed="true"]{background:var(--accS)}
.op[aria-pressed="true"] .no{background:var(--acc);color:var(--accOn)}
.op.hit{background:var(--accS)} .op.hit .no{background:var(--acc);color:var(--accOn)}
.op.miss{background:var(--badS)} .op.miss .no{background:var(--bad);color:var(--badOn)}
.op.hit .mk,.op.miss .mk{flex:none;font-weight:700;font-size:1rem}
.op.hit .mk{color:var(--acc)} .op.miss .mk{color:var(--bad)}
.op:disabled{opacity:1}
.pickinfo{font-size:.78rem;color:var(--tx3);padding:0 .2rem;display:flex;
  justify-content:space-between;gap:1rem}
.pickinfo b{color:var(--acc);font-variant-numeric:tabular-nums}

/* answer */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.b{background:var(--card);color:var(--tx);border-radius:var(--r2);padding:1.15rem .5rem 1rem;
  display:flex;flex-direction:column;align-items:center;gap:.2rem;box-shadow:var(--sh);
  transition:transform .08s,background .15s}
.b .g{font-size:1.85rem;line-height:1}
.b .l{font-size:.74rem;color:var(--tx3)}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.45}

/* feedback */
.fb{border-radius:var(--r);padding:1.2rem 1.2rem;display:flex;flex-direction:column;gap:.65rem;
  animation:rise .24s cubic-bezier(.2,.7,.3,1)}
.fb.ok{background:var(--accS)} .fb.ng{background:var(--badS)}
.fb.win{background:var(--acc);box-shadow:var(--sh)}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.fb .head{display:flex;align-items:center;gap:.7rem}
.fb .glyph{font-size:2.15rem;line-height:1;flex:none;width:2.4rem;text-align:center;
  animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.fb.win .glyph{animation:burst .5s cubic-bezier(.2,1.4,.35,1)}
@keyframes pop{from{transform:scale(.45)}to{transform:none}}
@keyframes burst{0%{transform:scale(.3)}55%{transform:scale(1.3)}100%{transform:none}}
.fb .said{font-size:1.14rem;font-weight:700;line-height:1.35;display:block}
.fb .truth{font-size:.78rem;display:block;margin-top:.18rem}
.fb .exp{font-size:.89rem;line-height:1.9}
.sup{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;
  padding:.14rem .42rem;border-radius:99px;margin-right:.45rem;vertical-align:.08em;
  background:var(--card2);color:var(--tx2);white-space:nowrap}
.fb.win .sup{background:rgba(255,255,255,.28);color:var(--accOn)}
.fb.ok .glyph,.fb.ok .said{color:var(--acc)}
.fb.ok .truth{color:var(--tx2)} .fb.ok .exp{color:var(--tx)}
.fb.ng .glyph,.fb.ng .said{color:var(--bad)}
.fb.ng .truth{color:var(--tx2)} .fb.ng .exp{color:var(--tx)}
.fb.win .glyph,.fb.win .said{color:var(--accOn)}
.fb.win .said{font-size:1.32rem}
.fb.win .truth{color:var(--accOn);opacity:.8} .fb.win .exp{color:var(--accOn);opacity:.95}

/* AIに質問用コピー */
.copyai{align-self:flex-start;border-radius:99px;background:var(--card);color:var(--tx2);
  font-size:.78rem;font-weight:600;padding:.48rem .95rem;box-shadow:var(--sh);
  transition:transform .07s}
.copyai:active{transform:scale(.96)}
.fb.win .copyai{background:rgba(255,255,255,.28);color:var(--accOn);box-shadow:none}
.copyai.mini{margin-top:.6rem;font-size:.74rem;padding:.42rem .85rem;
  background:var(--card2);box-shadow:none}

/* buttons */
.cta{width:100%;border-radius:var(--r3);background:var(--acc);color:var(--accOn);
  padding:1.1rem;font-size:1rem;font-weight:700;transition:transform .08s,filter .15s}
.cta:hover{filter:brightness(1.06)} .cta:active{transform:scale(.99)}
.cta:disabled{background:var(--card2);color:var(--tx3);cursor:not-allowed;transform:none;filter:none}
.cta.plain{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.ghost{width:100%;border-radius:var(--r3);background:transparent;color:var(--tx2);
  padding:.95rem;font-size:.92rem;font-weight:600}
.ghost:hover{color:var(--tx);background:var(--card)}
.ghost:disabled{opacity:.4;cursor:not-allowed;background:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.tile{background:var(--card);border-radius:var(--r2);padding:1rem .6rem;text-align:center;box-shadow:var(--sh)}
.tile b{display:block;font-size:1.85rem;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.7rem;color:var(--tx3);margin-top:.35rem}
.tile.bad b{color:var(--bad)} .tile.good b{color:var(--acc)}

.note{font-size:.78rem;color:var(--tx3);display:flex;justify-content:space-between;
  gap:1rem;font-variant-numeric:tabular-nums;padding:0 .2rem}
/* 問題集の切り替え（別冊の必須問題集があるときだけ出る） */
.banksw{display:flex;gap:.35rem;background:var(--card2);padding:.3rem;border-radius:99px}
.banksw .bk{flex:1;border-radius:99px;padding:.62rem .5rem;font-size:.86rem;font-weight:600;
  color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:.4rem;
  transition:background .15s,color .15s}
.banksw .bk i{font-style:normal;font-size:.72rem;opacity:.65;font-variant-numeric:tabular-nums}
.banksw .bk.on{background:var(--card);color:var(--tx);box-shadow:var(--sh);cursor:default}

.scope{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;
  padding:0 .2rem;font-size:.82rem;color:var(--tx2);line-height:1.5}
.scope b{font-size:.82rem;font-weight:700;color:var(--tx3);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* settings */
.setbar{background:var(--card);border-radius:var(--r2);padding:.95rem 1.1rem;display:flex;
  align-items:center;justify-content:space-between;gap:.8rem;box-shadow:var(--sh);width:100%;text-align:left}
.setbar .cur{font-size:.85rem;color:var(--tx);line-height:1.6}
.setbar .cur em{font-style:normal;color:var(--tx3);font-size:.74rem;display:block;margin-bottom:.15rem}
.setbar .arw{font-size:.8rem;color:var(--tx3);white-space:nowrap}
.panel{background:var(--card);border-radius:var(--r2);padding:1.1rem;display:flex;
  flex-direction:column;gap:1.05rem;box-shadow:var(--sh);animation:rise .2s ease-out}
.grp{display:flex;flex-direction:column;gap:.5rem}
.grp>span{font-size:.74rem;color:var(--tx3);display:flex;align-items:baseline;gap:.5rem}
.grp>span i{font-style:normal;font-size:.7rem;color:var(--tx3);opacity:.75}
.opts{display:flex;flex-wrap:wrap;gap:.4rem}
.opt{border-radius:99px;background:var(--card2);color:var(--tx2);padding:.5rem .85rem;
  font-size:.83rem;line-height:1.3;transition:background .13s,color .13s;
  display:inline-flex;align-items:baseline;gap:.4rem}
.opt i{font-style:normal;font-size:.72rem;opacity:.65;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--acc);color:var(--accOn);font-weight:700}
.opt[aria-pressed="true"] i{opacity:.8}
.opt:disabled{opacity:.35;cursor:not-allowed}

/* lists */
.list{display:flex;flex-direction:column;gap:.6rem}
.list h2{font-size:.83rem;color:var(--tx2);font-weight:600;padding:0 .2rem}
.list h2.win{color:var(--acc)}
.item{background:var(--card);border-radius:var(--r2);padding:1rem 1.1rem;
  display:flex;flex-direction:column;gap:.55rem;box-shadow:var(--sh)}
.rowtop{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.item .qt{font-size:.88rem;line-height:1.85}
.item .an{font-size:.84rem;line-height:1.85;color:var(--tx2);background:var(--badS);
  border-radius:12px;padding:.7rem .85rem}
.item .an b{color:var(--bad)}
.item.done .an{background:var(--accS)} .item.done .an b{color:var(--acc)}
.cnt{font-size:.72rem;font-weight:700;color:var(--bad);background:var(--badS);
  padding:.26rem .6rem;border-radius:99px;white-space:nowrap}
.done-badge{font-size:.72rem;font-weight:700;color:var(--acc);background:var(--accS);
  padding:.26rem .6rem;border-radius:99px;white-space:nowrap}
.empty{background:var(--card);border-radius:var(--r2);padding:1.5rem 1.2rem;
  font-size:.9rem;line-height:1.9;color:var(--tx2);box-shadow:var(--sh);text-align:center}

/* result */
.score{text-align:center;padding:1.2rem 0 .4rem}
.score b{display:block;font-size:3.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score b i{font-style:normal;font-size:1.5rem;color:var(--tx3)}
.score span{display:block;font-size:.86rem;color:var(--tx2);margin-top:.6rem}

/* リセット確認 */
.danger{background:var(--badS);border-radius:var(--r2);padding:1.15rem 1.15rem;
  display:flex;flex-direction:column;gap:.9rem;animation:rise .2s ease-out}
.danger p{font-size:.86rem;line-height:1.85;color:var(--tx)}
.danger .row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.danger .yes{background:var(--bad);color:var(--badOn);border-radius:12px;
  padding:.9rem;font-weight:700;font-size:.92rem;transition:transform .08s}
.danger .yes:active{transform:scale(.98)}
.danger .no{background:var(--card);color:var(--tx);border-radius:12px;
  padding:.9rem;font-weight:600;font-size:.92rem}

.tip em{font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.tip{font-size:.76rem;line-height:1.8;color:var(--tx3);display:flex;
  justify-content:space-between;gap:1rem;align-items:flex-start;padding:.2rem .2rem 0}
.linky{color:var(--tx3);font-size:.76rem;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.linky:hover{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage" id="app"></div>

<script>
/* ===== 問題データ ここから =====
   ../問題バンク/*.md から ../ビルド.py が生成します。ここを手で書き換えないこと。 */
const Q_ALL=[
{c:1,s:"会社",n:1,d:"B",x:1,a:1,q:"会社の形態として、会社法は株式会社、合名会社、合資会社、合同会社の4種類を規定している。",e:"会社法が定める会社は株式会社・合名会社・合資会社・合同会社の4種類。数を増減させたり、有限会社を混ぜたりして出される。"},
{c:1,s:"会社",n:2,d:"A",x:1,a:1,q:"株式会社において、社員は会社の債務について何の責任も負わないが、合名会社において、社員は会社に対して出資義務を負うだけでなく、会社の債務につき、債権者に対して直接・連帯・無限の責任を負う。",e:"ここでいう「社員」は従業員ではなく出資者のこと。株式会社の出資者は出資額までしか損をしない。合名会社の社員は債権者に対して直接・連帯・無限の責任を負う。"},
{c:1,s:"会社",n:3,d:"A",x:1,a:1,q:"合資会社には、無限責任社員が最低1名必要で、他に有限責任社員が1名以上いる。",e:"合資会社は無限責任社員と有限責任社員の両方が要る。無限責任社員だけなら合名会社、有限責任社員だけなら合同会社。"},
{c:1,s:"株式会社の特色と設立",n:4,d:"C",a:0,q:"株式会社を設立するには、資本金として1,000万円以上必要である。",e:"最低資本金制度は廃止されたので、資本金1円の株式会社の設立も可能"},
{c:1,s:"株式会社の特色と設立",n:5,d:"C",a:1,q:"定款に記載しておけば、土地・建物や特許権など、金銭以外の物を対価に株式を発行する現物出資が認められる。",e:"会社の成立時にそれらの財産を譲り受けることをあらかじめ約束しておく「財産引受け」も、定款への記載が必要"},
{c:1,s:"株式会社の特色と設立",n:6,d:"B",a:1,q:"株式の払込金額が1株10万円である場合には、払込金額の2分の1の5万円を資本金に組み入れれば足りる。",e:"資本金の額は「株式の払込金額 × 発行株式数」が原則だが、発行時に決めれば、払込金額の 2分の1以内 は資本金に入れなくてよい"},
{c:1,s:"株式会社の特色と設立",n:7,d:"A",a:0,q:"会社法で定める大会社は、資本金の額が5億円以上で、かつ負債総額が200億円以上の株式会社とされる。",e:"大会社とは、資本金の額が5億円以上 又は 負債総額が200億円以上。※試験では「又は」を「かつ」に変えて出題される場合があるので注意（問題集の注意書き）"},
{c:1,s:"株式会社の特色と設立",n:8,d:"B",x:1,a:1,q:"大会社でなくても公開会社であれば、必ず取締役会を置かなければならない。",e:"公開会社は必ず取締役会を置く。大会社かどうかは関係ない。"},
{c:1,s:"株式会社の特色と設立",n:9,d:"B",a:0,q:"株式会社設立に際し、事前に株主間相互の同意を得れば、定款の作成を省略することができる。",e:"株式会社の設立に際し、いかなる理由があっても定款の作成を省略することはできない。株主間相互の同意があっても不可"},
{c:1,s:"株式会社の特色と設立",n:10,d:"B",a:0,q:"株式会社を設立するには、2名以上の発起人が定款を作成し、署名をしなければならない。",e:"発起人は 1人でも可能。また、発起人は 法人でも可能"},
{c:1,s:"株式会社の特色と設立",n:11,d:"B",a:0,q:"定款に記載しなければならない事項に「会社の目的」は含まれない。",e:"定款には「会社の目的」「商号」「本店所在地」などを記載しなければならない（絶対的記載事項）"},
{c:1,s:"株式会社の特色と設立",n:12,d:"B",a:1,q:"株式会社の発起人は1人でもよいことから、株主数が1人だけの株式会社を設立することも可能である。",e:"株主が1人だけの会社を「一人会社（いちにんがいしゃ）」という"},
{c:1,s:"株式会社の特色と設立",n:13,d:"C",a:1,q:"発起設立とは、株式会社の設立において発行する株式の全部を発起人だけで引き受けて設立することをいう。",e:"なお、発起人が一部を引き受け、残りを株主募集によって引き受けてもらう会社設立は「募集設立」という"},
{c:1,s:"株式会社の特色と設立",n:14,d:"B",a:0,q:"株式会社の設立に際して選任される取締役は、当該設立が適正に行われたかどうかを調査する必要はない。",e:"設立に際して選任される取締役は、設立が適正に行われたかどうかを 調査する必要がある"},
{c:1,s:"株式会社の特色と設立",n:15,d:"B",a:0,q:"「会社の目的」については、定款変更の手続きを履行しても変更できない。",e:"「会社の目的」は、定款変更の手続きをして変更することができる"},
{c:1,s:"株式会社の特色と設立",n:16,d:"A",a:0,q:"株式会社の設立の無効は、当該株式会社の取締役がその設立登記の日から1年以内に裁判所へ訴えることによってしか主張できない。",e:"設立の無効は、株主と取締役が設立登記の日から 2年以内 に裁判所へ訴えることによってしか主張できない。「取締役だけ」「1年」の2か所が誤り"},
{c:1,s:"株式と株主の権利",n:17,d:"B",a:0,q:"株式を分割すると発行済株式が増え、1株当たりの実質的価値は大きくなる。",e:"株式を分割すると発行済株式が増え、1株当たりの実質的価値は 小さくなる"},
{c:1,s:"株式と株主の権利",n:18,d:"A",a:0,q:"株式の分割、株式の併合、株式無償割当て及び株式の消却にあたっては、取締役会設置会社では取締役会の決議で定める。",e:"取締役会設置会社では、株式の分割・無償割当て・消却は取締役会決議だが、株式の併合 は 株主総会の特別決議 で定める"},
{c:1,s:"株式と株主の権利",n:19,d:"B",x:1,a:1,q:"株式の消却とは、発行されている株式をなくしてしまうことであり、消却により発行済株式数は減少する。",e:"消却すると発行済株式数は減る。分割（問17）は増える。増減の向きを入れ替えて出される。"},
{c:1,s:"株式と株主の権利",n:20,d:"B",a:0,q:"株式の消却は、会社が所有する自己株式の消却のほかに、株主が持っている株式についても消却を行うことができる。",e:"株式の消却は、すべて会社がいったん株式を取得してから行う"},
{c:1,s:"株式と株主の権利",n:21,d:"B",a:0,q:"単元株は最大500株とされている。",e:"単元株のひとくくりの数は、1,000以下 かつ 発行済株式総数の200分の1以下"},
{c:1,s:"株式と株主の権利",n:22,d:"B",a:0,q:"定款に定めることにより、単元未満株主に株主総会の議決権を与えることができる。",e:"単元未満株主には株主総会の議決権を与えることはできない"},
{c:1,s:"株式と株主の権利",n:23,d:"B",a:1,q:"株式会社は一部の株式について異なる権利内容を有する旨を、定款をもって定めることができる。",e:"2種類以上の株式が併存する会社を「種類株式発行会社」という"},
{c:1,s:"株式と株主の権利",n:24,d:"B",a:0,q:"ある種類の株式にまず一定率の配当をし、残った剰余金から他の株式に配当するような場合、その前者のような株式を劣後株という。",e:"前者は（配当）優先株、後者が 後配株（劣後株）。前後が逆"},
{c:1,s:"株式と株主の権利",n:25,d:"B",a:1,q:"公開会社においては、議決権制限株式の発行数が発行済株式総数の2分の1を超えたときは、2分の1以下にするための措置をとらなければならない。",e:"「議決権が全くない」「株主総会決議事項の一部についてだけ議決権がある」など、完全な議決権のある株式以外はすべて 議決権制限株式"},
{c:1,s:"株式と株主の権利",n:26,d:"B",x:1,a:1,q:"株式会社は一部の株式について、譲渡に会社の承認が必要な株式を発行することができる。",e:"譲渡に会社の承認が必要な株式が譲渡制限株式。一部の株式についてだけ設定することもできる。"},
{c:1,s:"株式と株主の権利",n:27,d:"C",a:0,q:"共益権とは、その権利の行使が株主全体の利害に影響を及ぼすものをいい、具体的には剰余金や残余財産の分配を受ける権利が挙げられる。",e:"剰余金や残余財産の分配を受ける権利は 自益権。共益権の説明自体は正しいが、例が自益権になっている"},
{c:1,s:"株式と株主の権利",n:28,d:"C",a:0,q:"自益権とは、個々の株主の利益のみに関係する権利のことをいい、具体例の1つとして議決権が挙げられる。",e:"議決権は共益権の1つ。問27と対で、自益権と共益権の例が入れ替えて出される"},
{c:1,s:"株式と株主の権利",n:29,d:"B",a:0,q:"少数株主権とは、1株しか持たない株主でも行使できる権利のことをいう。",e:"少数株主権とは、一定割合以上の議決権（又は一定割合以上の株式数）を持った株主だけが行使できる権利"},
{c:1,s:"株式の譲渡",n:30,d:"C",a:0,q:"会社が自社の発行する株式を取得すると、出資の払戻しと同じ結果となるなど、株主間に不平等をもたらす可能性があることから、自己株式（金庫株）の取得はいかなる場合も禁止されている。",e:"一定の要件を満たせば、自己株式の取得は可能。「いかなる場合も」と言い切っている点が誤り"},
{c:1,s:"株式の譲渡",n:31,d:"B",x:1,a:1,q:"自己株式を会社が保有する際は会社が株主となるが、議決権や剰余金の配当を受ける権利はない。",e:"会社が自分の株を持っても、議決権も配当を受ける権利もない。自分で自分に議決権を行使できてしまうと不公平になるため。"},
{c:1,s:"株式の譲渡",n:32,d:"A",a:0,q:"新株発行の効力発生前のように、株式が発行されていない段階で株式引受人の地位（権利株）を譲渡した場合、当事者間でも、又会社との間でも、その効力はともに無効である。",e:"権利株の譲渡は、当事者間では有効だが 会社との間では無効。「ともに無効」が誤り"},
{c:1,s:"株式の譲渡",n:33,d:"B",a:0,q:"独占禁止法上、金融会社がある会社の株式の3％超を持つことは、原則として禁止されている。",e:"5％超 が正しい"},
{c:1,s:"株式の譲渡",n:34,d:"C",a:1,q:"子会社が親会社の株式を取得することは原則禁止されている。",e:"会社の合併や分割などで取得した場合でも、相当の時期に処分しなければならない"},
{c:1,s:"株券と株主名簿",n:35,d:"B",a:1,q:"会社法においては、株式会社が株券を発行することは、定款にそのことを定めれば可能である。",e:"会社法は 株券のない会社を原則 としているので、株券を発行しようとする会社（株券発行会社）は定款にそのことを定める必要がある"},
{c:1,s:"株券と株主名簿",n:36,d:"B",x:1,a:1,q:"株券には、会社の商号や株式数などを記載し、代表取締役が署名又は記名押印しなければならない。",e:"署名するのは代表取締役。ほかの役職に置き換えて出される。"},
{c:1,s:"株券と株主名簿",n:37,d:"B",x:1,a:1,q:"株式会社は、権利を行使できる株主を確定するため、一定の日（基準日）に株主名簿に載っている株主に権利行使させることができるが、基準日と権利行使日との間は3か月以内でなければならない。",e:"基準日から3か月以内。数字を1か月・6か月などに変えて出される。"},
{c:1,s:"株式会社の機関",n:38,d:"C",x:1,a:1,q:"株主総会には定時総会と臨時総会があり、このうち定時総会とは、毎決算期に1回その年度の会社の成果を確認するために開催されるものをいう。",e:"定時総会は毎決算期に1回、その年度の成果を確認するため。臨時総会は必要に応じて開催。"},
{c:1,s:"株式会社の機関",n:39,d:"C",x:1,a:1,q:"取締役会を置く会社の株主総会においては、その招集通知に議題として掲げられていない事項について決議することは認められていない。",e:"招集通知に議題として掲げていない事項の決議は違法。ただし 取締役会を置かない会社 では、株主総会で決議できる事項は無限定。"},
{c:1,s:"株式会社の機関",n:40,d:"B",x:1,a:1,q:"公開会社では議決権総数の3％以上の株式を引き続き6か月以上保有している株主は、取締役に株主総会の招集を請求することができる。",e:"議決権総数の3％以上を（公開会社では引き続き6か月以上）持つ少数株主は、招集を請求でき、拒否されれば裁判所の許可を得て自分で招集できる。"},
{c:1,s:"株式会社の機関",n:41,d:"B",x:1,a:1,q:"株主の提案権は、取締役会設置会社の場合、議決権総数の1％以上又は300個以上の議決権を（公開会社の場合は引き続き6か月以上）持っている株主に与えられる。",e:"提案権は 1％以上 又は 300個以上（単元株制度をとる会社では300単元）。招集請求の「3％以上」と数字を混ぜて出される。"},
{c:1,s:"株式会社の機関",n:42,d:"C",a:0,q:"株主総会では株主1人につき1個の議決権が与えられる。",e:"株主の 頭数 ではなく、投下した 資本の額に比例 して議決権が与えられる"},
{c:1,s:"株式会社の機関",n:43,d:"A",x:1,a:1,q:"A社がB社の議決権総数の4分の1以上を持つとき、B社がA社株を保有していてもそれには議決権がない。",e:"相互に株を持ち合うと議決権行使が歪むため、4分の1以上持たれている側の議決権は認められない。"},
{c:1,s:"株式会社の機関",n:44,d:"B",a:0,q:"株主総会には、株主本人が出席して議決権を行使する必要があることから、代理人による議決権の行使は認められていない。",e:"株主本人が出席する必要はなく、代理人に議決権を行使させてもよい"},
{c:1,s:"株式会社の機関",n:45,d:"B",a:0,q:"株主総会の特別決議においては、議決権総数の3分の2以上に当たる株式を持つ株主が出席し、出席株主の議決権の過半数の賛成を得ることが求められる。",e:"特別決議は 議決権総数の過半数 を持つ株主が出席し、出席株主の議決権の3分の2以上 の賛成。定足数と賛成要件の数字が入れ替わっている"},
{c:1,s:"株式会社の機関",n:46,d:"C",x:1,a:1,q:"株主総会の議事録は、本店に10年間（支店があるときは支店に写しを5年間。）備え置かれ、株主及び会社債権者の閲覧に供される。",e:"本店に10年、支店には写しを5年。数字を入れ替えて出される。"},
{c:1,s:"株式会社の機関",n:47,d:"B",a:1,q:"取締役会を置く会社には、取締役は3名以上必要であり、その選任は株主総会の決議事項である。",e:"取締役会を置く会社は取締役3名以上。取締役会を置かない会社では取締役は1人いれば足りる"},
{c:1,s:"株式会社の機関",n:48,d:"B",a:0,q:"公開会社の取締役の任期は、株主総会で承認を得れば、4年以内とすることができる。",e:"公開会社の取締役の任期は原則 2年以内。期間を短くすることはできるが、長くすることはできない"},
{c:1,s:"株式会社の機関",n:49,d:"B",x:1,a:1,q:"公開会社において不正行為をした取締役の解任が否決されたとき、引き続き6か月以上、議決権又は発行済株式の3％以上を持つ少数株主は、裁判所にその取締役の解任を請求することができる。",e:"解任が株主総会で否決されても、少数株主（6か月以上・3％以上）は裁判所に解任を請求できる。株主総会の招集請求と同じ「6か月・3％」の組み合わせ。"},
{c:1,s:"株式会社の機関",n:50,d:"B",a:0,q:"取締役に欠員が出た場合には、新取締役が就任するまでの間、退任取締役が職務を続けることも、その会社の監査役に取締役を兼任させることもできる。",e:"退任取締役が職務を続けるのは正しいが、監査役は取締役を兼任できない。監査する側とされる側が同じ人では意味がないため"},
{c:1,s:"株式会社の機関",n:51,d:"B",a:0,q:"取締役の報酬は、定款又は監査役会で定められる。",e:"取締役の報酬は 定款又は株主総会決議 で定める"},
{c:1,s:"株式会社の機関",n:52,d:"B",x:1,a:1,q:"過去10年内に子会社の従業員であった人は、社外取締役になることができない。",e:"社外取締役は「社外」であることが要件。過去10年内に子会社の従業員だった人は除かれる。"},
{c:1,s:"株式会社の機関",n:53,d:"B",a:0,q:"取締役が任務を怠って会社に損害を与えたときは、当該損害に対して賠償責任を負うものとされているが、原則として株主総会で議決権の過半数による同意を得た場合には、この責任を免除することができる。",e:"責任免除には、原則として 株主全員の同意 が必要。「過半数」では足りない"},
{c:1,s:"株式会社の機関",n:54,d:"A",a:0,q:"取締役がその株式会社と取引するときは、監査役会（設置しない会社では監査役。）の承認を受ける必要がある。",e:"取締役会（設置しない会社では株主総会）の承認を受ける必要がある。監査役ではない"},
{c:1,s:"株式会社の機関",n:55,d:"B",a:0,q:"取締役会の決議は頭数の多数によるが、代理人による投票も認められている。",e:"取締役会の決議は頭数の多数による（ここは正しい）が、代理人による投票は認められていない。株主総会（問44）は代理人可なので、対で覚える"},
{c:1,s:"株式会社の機関",n:56,d:"B",a:1,q:"取締役会の議事録は10年間本店に備え置くこととされている。",e:"そのとおり。"},
{c:1,s:"株式会社の機関",n:57,d:"B",a:0,q:"取締役会設置会社においては、代表取締役を選定する必要はない。",e:"取締役会設置会社には 代表取締役が1名以上必要"},
{c:1,s:"株式会社の機関",n:58,d:"A",a:0,q:"公開会社の監査役の任期は2年である。",e:"公開会社の監査役の任期は 4年（取締役の2年より長い）"},
{c:1,s:"株式会社の機関",n:59,d:"B",a:1,q:"大会社にはすべて会計監査人を置かなくてはならない。",e:"監査等委員会設置会社と指名委員会等設置会社にも会計監査人が必要"},
{c:1,s:"株式会社の機関",n:60,d:"B",a:0,q:"大会社においては、会計監査人の任期は監査役と同様に4年とされている。",e:"会計監査人の任期は 1年"},
{c:1,s:"株式会社の機関",n:61,d:"B",a:0,q:"大会社においては、会計監査人の選任・解任は取締役会の決議事項である。",e:"会計監査人の選任・解任は 株主総会の決議事項（普通決議）"},
{c:1,s:"株式会社の機関",n:62,d:"A",a:0,q:"大会社においては、会計監査人を任期満了後に再任する場合、その都度、定時株主総会の再任決議を行わなければならない。",e:"会計監査人の任期は1年だが、定時株主総会が特に 不再任を決議しない限り自動的に更新 される。毎回の再任決議は不要"},
{c:1,s:"株式会社の機関",n:63,d:"A",a:0,q:"指名委員会等設置会社には、監査役を置かなくてはならない。",e:"指名委員会等設置会社には監査委員会があるので、監査役を置くことはできない"},
{c:1,s:"株式会社の機関",n:64,d:"A",a:1,q:"指名委員会等設置会社における委員会のメンバーは、取締役会が選ぶ3名以上の取締役であり、過半数は社外取締役でなければならない。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:65,d:"C",a:1,q:"公開会社である大会社においては、貸借対照表や損益計算書については、会計監査人及び監査役会の監査を受けなければならない。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:66,d:"B",a:0,q:"大会社は定時株主総会終了後、貸借対照表及び損益計算書のほか、事業報告についても公告しなければならない。",e:"事業報告については公告の必要はない"},
{c:1,s:"会社の計算",n:67,d:"B",a:1,q:"定時株主総会が終わると、貸借対照表（大会社は損益計算書と両方。）を公告するが、ホームページなどを使う方法でもよく、官報や日刊新聞紙を使う会社は要旨を公告すれば足りる。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:68,d:"C",a:0,q:"法定準備金には、資本準備金と配当準備金の2種類がある。",e:"法定準備金は、資本準備金と利益準備金 からなる"},
{c:1,s:"会社の計算",n:69,d:"B",a:1,q:"株式会社は、利益準備金として、配当などを剰余金から支出するたびに、その10分の1以上を積み立てなければならないが、資本準備金との合計が資本金の4分の1に達した後は積み立てなくてもよいとされている。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:70,d:"B",a:1,q:"資本金と準備金の合計額に相当する資産を留保した上でなければ、剰余金の配当や自己株式の買受けはできない。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:71,d:"B",a:1,q:"剰余金の配当における分配可能額は、純資産額から資本金の額と法定準備金その他法令で定める額を差し引くことによって求められる。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:72,d:"C",a:0,q:"分配可能額がないのに行われた配当は無効であり、監査役は株主に対してこれを返還するよう要求できる。",e:"分配可能額がないのに行われた配当（いわゆるたこ配当）は無効であり、会社債権者 が株主に対して返還を要求できる（監査役ではない）"},
{c:1,s:"会社の計算",n:73,d:"B",a:0,q:"剰余金の配当は、株主総会で承認されれば年に何回でも行うことができるが、必ず金銭で支給されなければならない。",e:"年に何度でも行えるのは正しいが、配当の方法は 金銭以外の財産の支給でも可能"},
{c:1,s:"会社の計算",n:74,d:"B",a:1,q:"中間配当は、定款に定めることにより、取締役会の決議をもって行うことができる。",e:"そのとおり。"},
{c:1,s:"新株発行・社債",n:75,d:"B",a:0,q:"会社設立時に発行する株式数は、原則として定款に定めた発行可能株式総数の10分の1以上でよいとされている。",e:"発行可能株式総数の 4分の1以上 でよいとされている"},
{c:1,s:"新株発行・社債",n:76,d:"B",a:0,q:"会社は、新株予約権者が新株予約権を行使した場合、必ずその者に新株を発行しなければならない。",e:"新株を発行しなくとも、手持ちの自己株式で対応することができる"},
{c:1,s:"新株発行・社債",n:77,d:"B",a:1,q:"新株予約権付社債は、新株予約権と社債のどちらかが消滅するまでは、両方を一体としてしか譲渡できない。",e:"そのとおり。"},
{c:1,s:"組織の再編",n:78,d:"A",a:0,q:"会社の合併の方法は吸収合併の1つしかない。",e:"合併には、当事会社の全部が解散して新会社を設立する 新設合併 と、当事会社の1つが存続して他を吸収する 吸収合併 の2つがある"},
{c:1,s:"組織の再編",n:79,d:"A",a:0,q:"会社が合併する場合、新設会社又は存続会社は解散する会社の資産を引き継ぐが、債務を引き継ぐ必要はない。",e:"解散する会社の資産や債務といった権利義務が、包括的に新設会社又は存続会社に移転する"},
{c:1,s:"組織の再編",n:80,d:"A",a:1,q:"会社が合併する場合、解散する会社の株主は、その保有する株式と交換に新設会社又は存続会社の株式あるいは金銭その他の財産を交付される。",e:"そのとおり。"},
{c:1,s:"組織の再編",n:81,d:"A",a:0,q:"会社の分割には、事業の1部門を切り離して別会社として独立させる吸収分割と、切り離した部門を既存の別会社にくっつける新設分割がある。",e:"吸収分割と新設分割の説明が逆。新設分割＝切り離して独立させる、吸収分割＝切り離した部門を既存の別会社にくっつける"},
{c:1,s:"組織の再編",n:82,d:"A",a:0,q:"会社の分割は、事業譲渡と同様に、分割の対象となる部門を構成する権利義務が個別に別会社に移転される。",e:"事業譲渡と異なり、権利義務は分割の対象となる部門ごと 一括して 承継される"},
{c:1,s:"組織の再編",n:83,d:"B",a:0,q:"株式会社が新設分割をするに際し、新設される会社が発行する株式を分割会社の株主に割り当てることは認められていない。",e:"分割会社（元の会社）の株主に割り当てることは 認められている"},
{c:1,s:"組織の再編",n:84,d:"B",a:0,q:"新設分割を実施する場合、原則として、株主総会の普通決議でそれを承認する必要がある。",e:"原則として株主総会の 特別決議 が必要"},
{c:1,s:"組織の再編",n:85,d:"B",a:0,q:"A社がB社の発行済株式全部を取得しようとするとき、両者の間で株式交換契約を結び、B社の株主が持つB社株をそっくりA社が発行する新株又は保有中の自己株式と交換した場合には、A社は完全子会社となり、B社は完全親会社となる。",e:"A社が完全親会社であり、B社が完全子会社となる（前後が逆）"},
{c:1,s:"組織の再編",n:86,d:"B",a:0,q:"事業譲渡により、事業全部を譲渡した場合、会社は当然に解散する。",e:"事業譲渡をしても、対価で別の事業をすることが可能であり、会社は 当然には解散しない"},
{c:1,s:"組織の再編",n:87,d:"A",a:0,q:"一度株式会社を設立すると、組織を変更して合名会社、合資会社又は合同会社とすることはできない。",e:"一定の手続きを行えば、株式会社から合名会社・合資会社・合同会社に 組織変更できる"},
{c:1,s:"組織の再編",n:88,d:"B",a:1,q:"組織変更することで、合資会社を株式会社にすることができる。",e:"そのとおり。"},
{c:1,s:"組織の再編",n:89,d:"B",a:1,q:"会社は、合併や破産、定款に定めた存続期間の満了などのほか、株主総会の特別決議によっても解散する。",e:"そのとおり。"},
{c:1,s:"組織の再編",n:90,d:"B",o:["取締役の選任", "代表取締役の選定", "社債の発行", "定款の変更", "会計監査人の選任"],a:[1, 5],q:"次のうち、取締役会設置会社における株主総会の普通決議による決議事項を2つ選びなさい。",e:"株主総会の普通決議事項は、①取締役・監査役・会計参与・会計監査人の選任、②取締役・会計参与・会計監査人の解任、③取締役の報酬、④計算書類の承認。代表取締役の選定・社債の発行は取締役会の決議事項、定款の変更は株主総会の特別決議事項。"},
{c:1,s:"組織の再編",n:91,d:"B",o:["取締役の解任", "代表取締役の選定", "社債の発行", "定款の変更", "株式会社の解散"],a:[4, 5],q:"次のうち、取締役会設置会社における株主総会の特別決議による決議事項を2つ選びなさい。",e:"株主総会の特別決議事項は、特定の株主からの自己株式の取得、株式併合、取締役会がない会社の新株発行、監査役の解任、取締役・監査役・会計参与・会計監査人・執行役の責任の軽減、資本金の額の減少、金銭以外の財産による配当、定款変更・事業譲渡・解散・清算、組織変更・合併・会社分割・株式交換・株式移転など。取締役の解任は普通決議、代表取締役の選定・社債の発行は取締役会決議。"},
{c:1,s:"組織の再編",n:92,d:"B",o:["会計監査人の選任", "代表取締役の選定", "取締役の解任", "募集株式の発行", "会計参与の選任"],a:[2, 4],q:"次のうち、取締役会設置会社における取締役会の決議事項を2つ選びなさい。",e:"取締役会の決議事項は、重要財産の処分・多額の借財・重要な人事・支店の変更・内部統制システムの整備、社債の発行、募集株式の発行、新株予約権の発行、株主総会の招集、代表取締役の選定・解職、株式の分割、準備金の資本組入れなど。会計監査人・会計参与の選任は株主総会の普通決議、取締役の解任も株主総会の普通決議。"},
{c:2,s:"財務諸表",n:1,d:"B",a:0,q:"貸借対照表は、一定期間における企業の経営成績を明らかにする報告書であり、損益計算書は、一定時点における企業の財政状態の一覧表である。",e:"「貸借対照表」と「損益計算書」の説明が逆。貸借対照表は一定時点における企業の財政状態の一覧表、損益計算書は一定期間における企業の経営成績を明らかにする報告書"},
{c:2,s:"財務諸表",n:2,d:"C",x:1,a:1,q:"資産は営業循環基準と1年基準によって流動資産又は固定資産に分類される。",e:"資産を流動・固定に分ける2つの基準（営業循環基準・1年基準）。問3の営業循環基準の定義と併せて押さえる。"},
{c:2,s:"財務諸表",n:3,d:"B",a:0,q:"営業循環基準とは、企業の本来の事業活動により現金が商品（製品）になり、また現金として戻ってくるような循環過程内において発生したものを固定項目とし、それ以外を流動項目とする基準である。",e:"「固定項目」と「流動項目」が逆。営業循環基準においては、循環過程内において発生したものを流動項目とし、それ以外を固定項目とする"},
{c:2,s:"財務諸表",n:4,d:"B",a:0,q:"貸借対照表において、当座資産とは、販売過程を経ることなく比較的容易に現金化できる資産をいい、具体的には、現金、預金、一時所有の有価証券、支払手形、買掛金がある。",e:"支払手形、買掛金は流動負債であり、当座資産ではない（問10参照）"},
{c:2,s:"財務諸表",n:5,d:"C",x:1,a:1,q:"貸借対照表において、売掛金は当座資産に分類される。",e:"当座資産には、売掛金のほか現金、預金、受取手形なども含まれる。"},
{c:2,s:"財務諸表",n:6,d:"C",x:1,a:1,q:"貸借対照表において、棚卸資産は流動資産に分類される。",e:"棚卸資産や当座資産は、いずれも流動資産に分類される。"},
{c:2,s:"財務諸表",n:7,d:"B",a:0,q:"貸借対照表において、棚卸資産とは、①通常の営業過程において販売する目的で保有される資産、②販売資産となるために生産過程の途中にある資産、③販売資産の生産のために漸次消費される資産をいい、製品・商品が該当するが、仕掛品、原材料などは棚卸資産に該当しない。",e:"棚卸資産には、仕掛品、原材料なども含まれる（②が仕掛品、③が原材料にあたる）"},
{c:2,s:"財務諸表",n:8,d:"B",a:0,q:"貸借対照表において、有形固定資産とは、生産準備手段として役立つ実体価値を有する資産をいい、土地、建物、機械装置のほか、のれんや特許権もこれに含まれる。",e:"のれんや特許権は無形固定資産であり、有形固定資産には含まれない"},
{c:2,s:"財務諸表",n:9,d:"C",a:0,q:"貸借対照表において、退職給付に係る負債は流動負債に分類される。",e:"貸借対照表において、退職給付に係る負債は固定負債に分類される"},
{c:2,s:"財務諸表",n:10,d:"B",x:1,a:1,q:"貸借対照表において、支払手形は流動負債に分類される。",e:"流動負債には、支払手形、買掛金、短期借入金、返品調整引当金、前受金、預り金、未払費用などがある。"},
{c:2,s:"財務諸表",n:11,d:"B",x:1,a:1,q:"法定準備金には、資本準備金と利益準備金がある。",e:"法定準備金とは、資本剰余金の中の資本準備金と、利益剰余金の中の利益準備金のことをいう。"},
{c:2,s:"財務諸表",n:12,d:"C",x:1,a:1,q:"損益計算書とは、一定期間（1年、四半期）における収益と費用とを対応表示することによって、一定期間における企業の経営成績を明らかにする報告書である。",e:"損益計算書の定義そのもの（問1のひっかけ元）。レジュメP44：売上高－売上原価＝売上総利益（粗利益）、－販管費＝営業利益（本業の儲け）、＋営業外収益－営業外費用＝経常利益（本業＋財務活動の儲け）、＋特別利益－特別損失＝税引前当期純利益、－法人税等＝当期純利益（最終利益）という段階構造。"},
{c:2,s:"財務諸表",n:13,d:"B",a:0,q:"損益計算書において、営業利益は、経常利益に営業外収益を加算し、営業外費用を減算して求められる。",e:"問題文は経常利益の求め方。営業利益は、売上総利益から販売費及び一般管理費を減算して求める（問14と対のひっかけ）"},
{c:2,s:"財務諸表",n:14,d:"B",a:0,q:"損益計算書において、経常利益とは、営業利益に営業外費用を加えた利益をいう。",e:"経常利益とは、営業利益に営業外収益を加え、営業外費用を引いて求めた利益をいう"},
{c:2,s:"財務諸表",n:15,d:"C",x:1,a:1,q:"損益計算書において、受取利息や受取配当金は営業外収益に分類される。",e:"営業外収益＝企業本来の営業活動以外（財務活動等）によって生じた収益。〈例〉受取利息、受取配当金 等。"},
{c:2,s:"財務諸表",n:16,d:"C",x:1,a:1,q:"損益計算書において、支払利息は営業外費用に分類される。",e:"営業外費用＝企業本来の営業活動以外（財務活動等）によって生じた費用。〈例〉支払利息 等。"},
{c:2,s:"財務諸表",n:17,d:"B",x:1,a:1,q:"販売費及び一般管理費とは、商品を販売するのにかかる費用や会社全体の業務の管理にかかる費用である。",e:"販売費及び一般管理費の〈例〉人件費、賃借料 等。なお特別利益＝臨時的な収益（土地や不動産の売却益等）、特別損失＝臨時的な損失（土地や不動産の売却損等）。"},
{c:2,s:"財務諸表",n:18,d:"B",x:1,a:1,q:"キャッシュ・フロー計算書における「キャッシュ概念」は、「現金及び現金同等物」を意味する。",e:"問19の株式が含まれるかどうかのひっかけと対で押さえる。"},
{c:2,s:"財務諸表",n:19,d:"B",a:0,q:"キャッシュ・フロー計算書におけるキャッシュには株式が含まれる。",e:"キャッシュ・フロー計算書におけるキャッシュは、現金及び現金同等物であり、株式は含まれない"},
{c:2,s:"財務諸表",n:20,d:"B",x:1,a:1,q:"キャッシュ・フロー計算書は、企業活動の状況を、①営業活動、②投資活動、③財務活動という3領域に区分し、そこでのキャッシュ・フローの状況から、企業活動の全般の動きをとらえようとするものである。",e:"キャッシュ・フロー計算書の3区分（営業活動・投資活動・財務活動）。"},
{c:2,s:"連結財務諸表",n:21,d:"B",a:0,q:"連結財務諸表に含まれる企業の範囲として、わが国では支配力基準で判定しているが、議決権の所有割合が50%以下である場合は連結対象にはならない。",e:"議決権の所有割合が50%以下であっても、連結対象となる場合もある（形式的な持株比率ではなく実質的な支配力で判定するのが支配力基準）"},
{c:2,s:"連結財務諸表",n:22,d:"B",a:0,q:"非支配株主持分とは、子会社の資本のうち、親会社に帰属する部分をいう。",e:"非支配株主持分とは、子会社の資本のうち、親会社に帰属しない部分をいう"},
{c:2,s:"連結財務諸表",n:23,d:"B",x:1,a:1,q:"連結貸借対照表は、親会社が他の会社を支配するに至った日において作成するものとされている。",e:"支配獲得日に作成されるのは連結貸借対照表のみで、他の連結財務諸表は後日作成される。"},
{c:2,s:"連結財務諸表",n:24,d:"B",x:1,a:1,q:"連単倍率とは、連結財務諸表の売上高や利益、資産等の規模が、親会社単独の場合の何倍あるかを示すものである。",e:"連単倍率＝連結ベースの規模 ÷ 親会社単独ベースの規模。グループ全体でどれだけ事業が広がっているかの目安。"},
{c:2,s:"景気の動向と収益率・配当性向・配当率",n:25,d:"B",a:0,q:"配当性向は「配当金÷経常利益×100」で求められる。",e:"配当性向は「配当金÷当期（純）利益×100」で求められる（分母は経常利益ではない）"},
{c:2,s:"景気の動向と収益率・配当性向・配当率",n:26,d:"A",a:0,q:"配当性向は、当期（純）利益に対する配当金の割合を示すものであって、配当性向が低いということは、内部留保率が低いことを意味する。",e:"配当性向が低いということは、利益のうち社内に残す割合が大きいということなので、内部留保率は高いことを意味する"},
{c:2,s:"企業分析",n:27,d:"B",a:0,q:"収益性分析に用いられるのは、資本利益率と流動比率である。",e:"収益性分析に用いられるのは、資本利益率と売上高利益率である（流動比率は安全性分析の指標。レジュメP52：資本金（純）利益率＝当期（純）利益／資本金（期首・期末平均）×100、売上高（純）利益率＝当期（純）利益／（純）売上高×100）"},
{c:2,s:"企業分析",n:28,d:"A",a:0,q:"資本構成が一定であるとすれば、総資本利益率が高い場合には、自己資本利益率（ROE）は低くなる。",e:"資本構成が一定であるとすれば、総資本利益率が高い場合には、自己資本利益率（ROE）も高くなる"},
{c:2,s:"企業分析",n:29,d:"A",a:0,q:"総資本利益率が低いにもかかわらず、自己資本利益率が高いときは、資本構成において、総資本の中に占める他人資本（負債）の割合が低い。",e:"この場合、総資本の中に占める他人資本（負債）の割合が高いといえる（自己資本が小さいぶんROEが高く出る）"},
{c:2,s:"企業分析",n:30,d:"B",x:1,a:1,q:"当期利益が同額の企業間では、資本金の額の少ない企業のほうが資本金（純）利益率は高くなる。",e:"分子（当期利益）が同じなら、分母（資本金）が小さいほど比率は大きくなる。"},
{c:2,s:"企業分析",n:31,d:"A",x:1,a:1,q:"売上原価率が上昇すれば、売上高総利益率は低下することになる。",e:"売上高総利益率＝1－売上原価率。原価率が上がればそのぶん総利益率は下がる。"},
{c:2,s:"企業分析",n:32,d:"B",a:0,q:"流動比率は「流動負債÷流動資産×100」で求められる。",e:"流動比率は「流動資産÷流動負債×100」で求められる（分母分子が逆）"},
{c:2,s:"企業分析",n:33,d:"B",a:0,q:"一般に流動比率は100%以下が望ましい。",e:"流動比率は200%以上が望ましいとされている"},
{c:2,s:"企業分析",n:34,d:"B",a:0,q:"一般に当座比率は100%以下が望ましい。",e:"当座比率は100%以上で高い方が望ましいとされている"},
{c:2,s:"企業分析",n:35,d:"B",a:0,q:"当座比率は小さいほうがよい。",e:"当座比率＝当座資産／流動負債×100 より、当座比率は大きいほうがよいといえる"},
{c:2,s:"企業分析",n:36,d:"B",x:1,a:1,q:"一般に固定比率は100%以下が望ましい。",e:"固定比率は、固定資産が返済の必要のない自己資本でまかなわれているかどうかを見る指標（レジュメP55「覚・必ず」：出資（自己資本）から固定資産をどのくらい買っているか）。"},
{c:2,s:"企業分析",n:37,d:"B",a:0,q:"固定比率は大きいほうがよい。",e:"固定比率＝固定資産／自己資本×100 より、固定比率は小さいほうがよいといえる"},
{c:2,s:"企業分析",n:38,d:"B",x:1,a:1,q:"一般に固定長期適合率は100%以下が望ましい。",e:"固定長期適合率＝固定資産／(自己資本＋非支配株主持分＋固定負債)×100（問49・50の計算問題で使う）。"},
{c:2,s:"企業分析",n:39,d:"A",x:1,a:1,q:"流動比率が100%の場合、固定長期適合率も100%となる。",e:"流動資産＝流動負債のとき、残りの固定資産と長期資金（自己資本＋固定負債）も一致するため。"},
{c:2,s:"企業分析",n:40,d:"B",x:1,a:1,q:"一般に負債比率は低いほどよく、100%以下が望ましい。",e:"負債比率は、返済の必要のない自己資本に対して負債の総額がいくらあるかを示す指標。低いほど財務の安定性は高くなる。"},
{c:2,s:"企業分析",n:41,d:"B",a:0,q:"自己資本比率とは、総資本に占める自己資本の割合を示すものであり、一般にその比率が低ければ低いほどよいものと考えられる。",e:"自己資本比率は、一般にその比率が高ければ高いほどよいものと考えられる"},
{c:2,s:"企業分析",n:42,d:"B",x:1,a:1,q:"自己資本比率の高い企業とは、一般に、不況に対する抵抗力が強く、長期的観点から健全な発展が期待できる企業といえる。",e:"問41と対。返済不要の自己資本の比重が大きいほど、財務基盤が安定する。"},
{c:2,s:"企業分析",n:43,d:"B",a:0,q:"一般に総資本回転率が低ければ低いほど資本効率は高いことになる。",e:"一般に総資本回転率が低ければ低いほど、資本効率は低いことになる"},
{c:2,s:"企業分析",n:44,d:"A",x:1,a:1,q:"総資本回転率が0.96回（1年決算）の場合の総資本回転期間は、12.5か月である。",e:"総資本回転期間＝12／総資本回転率＝12／0.96＝12.5（月）。"},
{c:2,s:"企業分析",n:45,d:"A",a:0,q:"売上高（純）利益率が一定である場合、総資本回転率を高めると総資本（純）利益率は低下する。",e:"売上高（純）利益率が一定である場合、総資本回転率を高めると総資本（純）利益率は高くなる"},
{c:2,s:"財務諸表",n:46,d:"B",t:[["科目", "金額"], ["営業損益 売上高", "50,000"], ["営業損益 売上原価", "35,000"], ["営業損益 販売費及び一般管理費", "8,000"], ["営業利益", "（イ）"], ["営業外損益 営業外収益", "700"], ["営業外損益 営業外費用", "850"], ["経常利益", "（ロ）"], ["特別利益", "250"], ["特別損失", "1,520"], ["税引前当期利益", "（ハ）"], ["法人税、住民税及び事業税", "2,700"], ["当期利益", "（ニ）"]],o:["イは15,000", "ロは6,150", "ロは6,850", "ハは5,580", "ニは2,560"],a:[3, 4],q:"ある会社（年1回決算）の期末現在の損益計算書から抜粋した科目及び金額（単位：百万円）は次のとおりである。（ ）内にあてはまる数字として正しいものの番号を2つ選びなさい。",e:"イ：7,000、ロ：6,850、ハ：5,580、ニ：2,880 営業利益＝売上高－売上原価－販売費及び一般管理費 ＝50,000－35,000－8,000＝7,000……イ 経常利益＝営業利益＋営業外損益 ＝7,000＋700－850＝6,850……ロ 税引前当期利益＝経常利益＋特別損益 ＝6,850＋250－1,520＝5,580……ハ 当期利益＝税引前当期利益－法人税、住民税及び事業税 ＝5,580－2,700＝2,880……ニ 損益計算書の仕組みを覚えていれば解ける問題。お金が入ってくる科目はプラス、お金が出ていく科目はマイナスとする。"},
{c:2,s:"景気の動向と収益率・配当性向・配当率",n:47,d:"B",t:[["項目", "値"], ["資本金", "800億円"], ["資本剰余金等", "100億円"], ["発行済株式総数", "10億株"], ["株価（時価）", "1,500円"], ["中間配当", "9円"], ["期末配当", "11円"], ["科目", "金額"], ["売上高", "3,000"], ["売上原価", "1,900"], ["販売費及び一般管理費", "500"], ["営業外損益", "200"], ["特別損益", "▲100"], ["法人税、住民税及び事業税", "200"]],o:["配当性向は20%、配当率は10%", "配当性向は30%、配当率は15%", "配当性向は40%、配当率は25%", "配当性向は50%、配当率は30%", "配当性向は60%、配当率は35%"],a:[3],q:"以下の会社（年1回決算）の配当性向及び配当率として正しいものの番号を1つ選びなさい。前期と当期で資本金の増減はないものとする。 （当期の損益計算書）（単位：億円）",e:"当期純利益＝売上高－売上原価－販売費及び一般管理費＋営業外損益＋特別損益－法人税、住民税及び事業税 ＝3,000－1,900－500＋200＋▲100－200＝500（億円） 配当性向＝配当金（年額）／当期純利益×100 ＝(9円＋11円)×10億株／500億円×100＝40% 配当率＝配当金（年額）／資本金（期中平均）×100 ＝(9円＋11円)×10億株／800億円×100＝25% 年間の配当金は中間配当と期末配当を合計して求める。配当率を計算する際の分母は資本金であり、資本剰余金等は含まない点がひっかけポイント。"},
{c:2,s:"企業分析",n:48,d:"B",t:[["項目", "金額"], ["流動資産", "7,000"], ["流動負債", "6,000"], ["固定負債", "4,000"]],o:["自己資本は5,000百万円、固定資産は8,000百万円", "自己資本は4,000百万円、固定資産は7,000百万円", "自己資本は3,000百万円、固定資産は6,000百万円", "自己資本は2,000百万円、固定資産は5,000百万円", "自己資本は1,000百万円、固定資産は4,000百万円"],a:[1],q:"ある会社の連結貸借対照表の一部を示すと次のとおりであった。この会社の負債比率を200%としたとき、自己資本及び固定資産の額として正しいものの番号を1つ選びなさい。（注）単位は百万円。",e:"負債比率(%)＝(流動負債＋固定負債)／自己資本×100＝200 (6,000＋4,000)／自己資本×100＝200 10,000／自己資本＝2 ∴ 自己資本＝5,000百万円 固定資産＝総資本－流動資産＝(流動負債＋固定負債＋自己資本)－流動資産 ＝6,000＋4,000＋5,000－7,000＝8,000 ∴ 固定資産＝8,000百万円"},
{c:2,s:"企業分析",n:49,d:"B",t:[["（資産の部）", "金額", "（負債の部）", "金額"], ["流動資産", "24,000", "流動負債", "40,000"], ["固定資産", "72,000", "固定負債", "40,000"], ["", "", "（純資産の部）自己資本", "16,000"], ["資産合計", "96,000", "負債・資本合計", "96,000"]],o:["流動比率は75%", "固定長期適合率は128.5%", "負債比率は600%", "自己資本比率は22.4%", "総資本回転期間は15.6か月"],a:[2],q:"ある会社（年1回決算）の今期末現在の連結貸借対照表上の数字を示すと次のとおりであった。この会社の当該年度の（純）売上高が90,000百万円であった場合に、下の1〜5の数値として正しいものを1つ選びなさい。 （注）比率は、小数点第2位以下は切り捨てること。なお、総資本の金額は前期末と同額とする。（単位：百万円）",e:"1 流動比率＝流動資産／流動負債×100＝24,000／40,000×100＝60% 2 固定長期適合率＝固定資産／(自己資本＋非支配株主持分＋固定負債)×100 ＝72,000／(16,000＋0＋40,000)×100＝128.57…≒128.5% 3 負債比率＝(流動負債＋固定負債)／自己資本×100＝(40,000＋40,000)／16,000×100＝500% 4 自己資本比率＝自己資本／総資本×100＝16,000／96,000×100＝16.66…≒16.6% 5 総資本回転期間(月)＝総資本／(年間の売上高÷12)＝96,000／(90,000÷12)＝12.8か月 正しいのは2のみ。"},
{c:2,s:"企業分析",n:50,d:"A",t:[["科目", "前期", "当期"], ["流動資産", "2,000", "※2,500"], ["固定資産", "4,500", "4,500"], ["流動負債", "1,500", "1,750"], ["固定負債", "3,000", "3,000"], ["純資産", "2,000", "2,250"], ["科目", "前期", "当期"], ["売上高", "25,000", "26,000"], ["売上原価", "18,000", "19,000"], ["販売費及び一般管理費", "6,000", "6,000"], ["営業外損益", "50", "0"], ["特別損益", "75", "▲150"], ["法人税、住民税及び事業税", "600", "450"]],o:["当期の自己資本利益率は、18.82%である。", "当期の売上高経常利益率は、2.35%である。", "当期の固定長期適合率は、85.71%である。", "当期の総資本回転率は、2.65回である。", "当期の利益成長率は、76.19%である。"],a:[2, 4],q:"連結貸借対照表及び損益計算書より抜粋した金額（単位：百万円）が次のとおりである上場会社に関する記述として、誤っているものの番号を2つ選びなさい。なお、純資産と自己資本は同額とする。（注）小数点第3位以下は切り捨てること。 貸借対照表より ※当期の流動資産2,500のうち当座資産は1,850である。 損益計算書より",e:"損益計算書より、当期の各段階の利益を計算する。 売上総利益＝売上高－売上原価＝26,000－19,000＝7,000 営業利益＝売上総利益－販売費及び一般管理費＝7,000－6,000＝1,000 経常利益＝営業利益＋営業外損益＝1,000＋0＝1,000 (税引後)当期純利益＝経常利益＋特別損益－法人税、住民税及び事業税＝1,000＋▲150－450＝400 1 自己資本利益率＝当期(純)利益／自己資本(期首・期末平均)×100 ＝400／((2,000＋2,250)÷2)×100＝18.823…% → 正しい 2 売上高経常利益率＝当期の経常利益／(純)売上高×100 ＝1,000／26,000×100＝3.846…% → 誤り（2.35%ではない） 3 固定長期適合率＝固定資産／(自己資本＋非支配株主持分＋固定負債)×100 ＝4,500／(2,250＋0＋3,000)×100＝85.714…% → 正しい 4 総資本回転率＝(純)売上高／総資本(期首・期末平均) ＝26,000／((6,500＋7,000)÷2)＝3.851…回 → 誤り（2.65回ではない） 5 前期の(税引後)純利益＝25,000－18,000－6,000＋50＋75－600＝525 利益成長率＝当期利益／前期利益×100＝400／525×100＝76.190…% → 正しい"},
{c:2,s:"企業分析",n:51,d:"A",t:[["科目", "金額"], ["売上高", "20,000"], ["変動費", "12,000"], ["固定費", "（X）"], ["利益", "2,000"]],o:["イのみ", "イ及びロ", "イ及びハ", "ロ及びハ", "イ、ロ及びハ"],a:[3],q:"損益分岐点分析に関する次の記述のうち正しいものはどれか。イロハの中から正しく選んでいるものの番号を1つ選びなさい。（注）答は小数点第3位以下を切り捨ててある。（単位：百万円） イ 限界利益率 40% ロ 損益分岐点売上高 16,000百万円 ハ 損益分岐点比率 75%",e:"表より、まず固定費(X)を求める。 売上高－費用＝利益 なので 20,000－12,000－X＝2,000 ∴ X＝6,000百万円 イ 限界利益率＝1－変動費率＝1－変動費／売上高＝1－12,000／20,000＝0.4 ∴40% → 正しい ロ 損益分岐点売上高＝固定費／(1－変動費／売上高)＝6,000／(1－12,000／20,000)＝15,000百万円 → 誤り（16,000百万円ではない） ハ 損益分岐点比率＝損益分岐点／売上高×100＝15,000／20,000×100＝75% → 正しい 損益分岐点分析の公式：損益分岐点売上高＝固定費／(1－変動費／売上高)、損益分岐点比率(%)＝損益分岐点／売上高×100、変動費率＝変動費／売上高、限界利益率＝1－変動費率。"},
{c:3,s:"取引の種類・売買の形態",n:1,d:"C",x:1,a:1,q:"我が国では、有価証券の現物の売買を行う場所として、東京証券取引所・名古屋証券取引所・福岡証券取引所・札幌証券取引所があり、それぞれの取引所において取引所金融商品市場が開設されている。",e:"レジュメP64。現物売買を行う取引所は東京・名古屋・福岡・札幌の4つ。上場株式は約3,800社（全株式会社約400万社のうち）。"},
{c:3,s:"取引の種類・売買の形態",n:2,d:"C",x:1,a:1,q:"株式の売買の取次ぎとは、顧客からの売買注文を、顧客の計算において金融商品取引業者の名をもって行う取引で、売買を委託されて執行することから委託取引といわれる。",e:"レジュメP66・67で「覚・必ず」指定。自己取引＝自己の計算（証券会社のお金）で売買。取次ぎ（委託取引）＝顧客の計算（顧客のお金）、金融商品取引業者の名前で売買。この2つの主体の違いが頻出。"},
{c:3,s:"売買の受託",n:3,d:"B",a:0,q:"有価証券の募集又は売出しの発表日からその申込最終日までを一般にファイナンス期間といい、その間の取引に際しては、受注・執行の管理に注意を払う必要がある。",e:"ファイナンス期間とは、有価証券の募集又は売出しの発表日の翌日から払込日までの期間"},
{c:3,s:"売買の受託",n:4,d:"B",a:0,q:"元引受けを行う金融商品取引業者は、安定操作期間中、当該銘柄の株券等に関し、株式ミニ投資を含めて自己の計算による買付けが禁止されている。",e:"例外として、株式累積投資及び株式ミニ投資に伴う買付けは認められている"},
{c:3,s:"売買の受託",n:5,d:"B",x:1,a:1,q:"安定操作取引又はその受託をした金融商品取引業者は、当該銘柄の株券等に関し、安定操作期間中、顧客に対して、安定操作取引が行われた旨を表示しないで買付けを受託すること、又は有価証券関連デリバティブ取引等を受託することは禁止されている。",e:"レジュメP69「覚・必ず」。安定操作期間中は原則、相場操縦行為として禁止だが、例外として安定操作取引そのものは認められる（相場くぎ付けを顧客に表示すればOK）。表示しない受託や、デリバティブ取引等の受託は禁止のまま。"},
{c:3,s:"売買の受託",n:6,d:"B",x:1,a:1,q:"金融商品取引業者は、顧客から有価証券売買の売付けの注文を受けるときには、当該売付けが空売りであるか否かの別を確認しなければならない。",e:"レジュメP69の空売り規制に関連。空売りかどうかで取引所への明示義務（問7）が変わるため、注文受託の時点でまず確認する必要がある。"},
{c:3,s:"売買の受託",n:7,d:"B",x:1,a:1,q:"金融商品取引業者は、自己の計算による売付け、顧客から受託する売付けが空売りに該当する場合、市場で行う空売りは取引所に明示しなければならない。",e:"レジュメP69「②空売り規制」。空売り＝手元に株がないのに売ること。禁止されているわけではないが、取引所金融商品市場で行う空売りは取引所への明示（報告）が必要。"},
{c:3,s:"売買の受託",n:8,d:"B",x:1,a:1,q:"取引所では、受託契約準則で、「売買の種類」「銘柄」「売付け・買付けの区別」「数量」「値段の限度」「委託注文の有効期間」「現物・信用取引の別」など、顧客が金融商品取引業者に有価証券の売買の委託の都度、指示すべき事項を定めている。",e:"レジュメP71「覚・必ず」。委託注文内容の確認事項がそのまま列挙されている。値段の限度は成行（値段を決めない）か指値（値段を決める）かの別を含む。"},
{c:3,s:"売買の受託",n:9,d:"B",x:1,a:1,q:"金融商品取引業者は、顧客から売指値注文を受託した場合には、指値を下回る値段で約定させてはならない。",e:"指値注文は顧客が値段を指定する注文（レジュメP71）。売り注文なら指定した値段を下回る（顧客に不利な）値段での約定は認められない。買い注文なら逆に指定額を上回る値段での約定が不可となる。"},
{c:3,s:"売買の受託",n:10,d:"B",a:0,q:"金融商品取引業者が注文伝票を作成するのは、顧客から株式の売買注文を受託し、当該注文に係る売買が成立した場合に限られる。",e:"顧客から株式の売買注文を受託した場合は、売買成立にかかわらず必ず注文伝票を作成しなければならない"},
{c:3,s:"売買の受託",n:11,d:"B",x:1,a:1,q:"「自己又は委託の別」は、「注文伝票」に記載すべき事項である。",e:"レジュメP71。注文伝票の記載事項は「自己または委託の別・顧客の氏名又は名称・取引の種類・銘柄・売付け買付けの別・受注数量・約定数量・指値または成行の別・受注日時・約定日時・約定価格」。契約締結時交付書面（P72、問12・13）の記載事項と混同させる出題が多い。"},
{c:3,s:"売買の受託",n:12,d:"B",a:0,q:"顧客から株式の売買注文を受託した場合に、金融商品取引業者は、当該注文に係る売買が成立したかどうかにかかわらず、当該顧客に契約締結時交付書面を交付しなければならない。",e:"契約締結時交付書面は、売買が成立した場合に、遅滞なく、顧客に交付しなければならない"},
{c:3,s:"売買の受託",n:13,d:"C",x:1,a:1,q:"金融商品取引業者は、契約締結時交付書面の交付方法について、顧客から書面又は電磁的方法による承諾を得て、書面に記載すべき事項について電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法により提供することができる。",e:"契約締結時交付書面（レジュメP72、問12参照）は原則書面交付だが、顧客の事前承諾があれば電子的な方法での提供も認められる。"},
{c:3,s:"売買の受託",n:14,d:"B",a:0,q:"東京証券所取引における上場株式の普通取引について、金曜日に約定が成立した場合には、原則として翌週の月曜日に決済を行うこととされている。",e:"普通取引による上場株式の受渡しは、約定日（売買成立日）から起算して3営業日目の日。金曜日が約定日であれば、受渡日は翌週の火曜日（カウントは土曜・日曜・祝日を含まない）"},
{c:3,s:"売買の受託",n:15,d:"C",a:0,q:"株式の売買に係る委託手数料は、取引所の定める受託契約準則により売買代金に応じて規定されている。",e:"委託手数料の額については自由化されている"},
{c:3,s:"金融商品取引所における株式の売買",n:16,d:"B",a:0,q:"金融商品取引所の内国株式の売買の種類は、決済日の違いによる区分として、当日決済取引、普通取引、信用取引及び発行日決済取引の4種類がある。",e:"当日決済取引、普通取引及び発行日決済取引の3種類に区分される（信用取引は含まない）"},
{c:3,s:"金融商品取引所における株式の売買",n:17,d:"A",x:1,a:1,q:"東京証券取引所における金融商品取引業者間の決済において、資金と証券の同時又は同日中の引渡しを行う決済のことをDVP決済といい、取引相手の決済不履行から生じる元本リスク（資金又は証券を交付した後、その対価を受け取れないリスク。）を排除することができる。",e:"DVP（Delivery Versus Payment）決済＝資金と証券を同時・同日中に引き渡す決済方式。片方だけ先に渡してしまい対価を受け取れなくなるリスク（元本リスク）を防ぐための仕組み。"},
{c:3,s:"金融商品取引所における株式の売買",n:18,d:"C",x:1,a:1,q:"信用取引とは、金融商品取引業者が顧客に信用を供与して行う有価証券の売買その他の取引のことをいう。",e:"レジュメP75。信用取引＝購入代金を借りて株式を買う（信用買い）、株券を借りて株式を売る（信用売り）。自己資金・保有株式で行う現物取引と対になる概念。"},
{c:3,s:"金融商品取引所における株式の売買",n:19,d:"A",a:0,q:"立会外売買の取引対象銘柄にETFやJ-REITは含まれない。",e:"立会外売買には上場株式（内国株式及び外国株式）だけでなく、新株予約権付社債、ETF、J-REIT等についても取引対象となる"},
{c:3,s:"金融商品取引所における株式の売買",n:20,d:"A",a:0,q:"東京証券取引所において株式の立会外バスケット取引が利用できるのは、15銘柄以上で構成され、かつ、売買代金5,000万円以上のポートフォリオについてである。",e:"15銘柄以上かつ売買代金1億円以上のポートフォリオから利用することができる"},
{c:3,s:"株式の店頭取引",n:21,d:"B",x:1,a:1,q:"店頭有価証券については、原則として成行注文の受託や信用取引及び未発行店頭有価証券の店頭取引が禁止されている。",e:"店頭有価証券（上場していない有価証券）は値動きの目安となる取引所価格が無く、成行注文や信用取引になじまないため原則禁止。未発行のものの店頭取引も同様に禁止。"},
{c:3,s:"株式の店頭取引",n:22,d:"B",x:1,a:1,q:"株式投資型クラウドファンディング業務とは、会員等が店頭有価証券のうち株券又は新株予約権証券について行う第一種少額電子募集取扱業務をいう。",e:"インターネットを通じて不特定多数の投資者から少額の資金を集める仕組み。対象は店頭有価証券のうち株券・新株予約権証券に限られる。"},
{c:3,s:"上場株券等の取引所金融商品市場外での売買",n:23,d:"B",a:0,q:"金融商品取引所に上場されている転換社債型新株予約権付社債券及び投資信託受益証券については、いずれも取引所外で取引を行うことはできない。",e:"いずれも取引所外での取引は可能である"},
{c:3,s:"上場株券等の取引所金融商品市場外での売買",n:24,d:"C",x:1,a:1,q:"PTSは、「私設取引システム」ともいわれる電子取引の場であり、開設できるのは、金融商品取引業者である。",e:"取引所外取引の一形態であるPTSは、原則として内閣総理大臣の認可を受けた金融商品取引業者の開設する「電子取引の場」であり、投資家や金融商品取引業者がここに注文を出して取引が行われる。"},
{c:3,s:"上場株券等の取引所金融商品市場外での売買",n:25,d:"B",a:0,q:"PTSは上場株式しか取り扱えない。",e:"PTSでは上場株式だけでなく、店頭売買有価証券も売買される"},
{c:3,s:"上場株券等の取引所金融商品市場外での売買",n:26,d:"B",a:0,q:"PTSでの価格決定は、取引所市場における売買価格を用いる方法のほか、競売買（オークション）の方法についても認められているが、顧客の間の交渉に基づく価格を用いる方法では価格を決定することができない。",e:"顧客の間の交渉に基づく価格を用いる方法（顧客間交渉方式）でも価格を決定することができる"},
{c:3,s:"外国株式の取引",n:27,d:"B",x:1,a:1,q:"金融商品取引業者が顧客から外国証券の売買を受託するときには、あらかじめ各金融商品取引業者が定める様式の「外国証券取引口座に関する約款」を交付するとともに、「外国証券取引口座設定に関する申込書」を徴収しなければならない。",e:"レジュメP80。国内の取引口座とは別に、外国証券取引口座を開設する必要がある。注文を受ける前に「約款」を交付し、「申込書」を徴収する、の順番。"},
{c:3,s:"外国株式の取引",n:28,d:"B",a:0,q:"一般投資家が行う外国証券取引は、国内委託取引のみである。",e:"一般投資家が行う外国証券取引は、その取引形態により、国内委託取引、外国取引及び国内店頭取引に区分される"},
{c:3,s:"外国株式の取引",n:29,d:"B",a:0,q:"顧客から外国証券の委託注文を受け、外国の金融商品市場に取次ぐ取引を、国内委託取引という。",e:"問題文の記述は外国取引のもの"},
{c:3,s:"外国株式の取引",n:30,d:"A",x:1,a:1,q:"外国取引において、金融商品取引業者が顧客に対し、勧誘を行うことができる銘柄は、適格外国金融商品取引市場で取引が行われている外国証券又は取引が予定されている外国証券で一定の要件を満たすものとされている。",e:"レジュメP80。外国取引＝顧客の委託注文を海外市場（NYSE、NASDAQ等）に取り次ぐ形態。勧誘できる銘柄は適格外国金融商品取引市場で取引される（予定される）ものに限定される。決済日は国内と同じ約定日から3営業日目。"},
{c:3,s:"株式ミニ投資",n:31,d:"B",a:0,q:"株式ミニ投資とは、投資者から少額の資金を預かり、その金銭を対価として、毎月一定日に特定の銘柄の株式等を買い付ける制度をいう。",e:"問題文は株式累積投資のもの。株式ミニ投資とは、金融商品取引業者と顧客との間で行う取引所の定める1売買単位に満たない株式を、株式等振替制度を利用して定型的な方法で行う売買取引"},
{c:3,s:"株式ミニ投資",n:32,d:"B",x:1,a:1,q:"株式ミニ投資は、任意の時に単元未満株のまま機動的に任意の銘柄の買付けを行い、また、買付けた単元未満株を単元未満株のまま売り付けることができる制度である。",e:"レジュメP82「覚」。株式ミニ投資＝1売買単位の10分の1単位（1取引単位の9倍まで）で任意のときに売買できる制度。議決権はないが配当は1株から受けられる。株式累積投資（毎月一定日・一定金額）との違いが最頻出。"},
{c:3,s:"株式ミニ投資",n:33,d:"B",a:0,q:"顧客の株式ミニ投資による買付けは、1売買単位の10分の1単位の株式の持分を取引単位とする一定金額分の株式を毎月一定日に買い付ける方法により行われる。",e:"株式ミニ投資は任意のときに単元未満株のまま、機動的に任意の銘柄の買付け（売付け）を行うことができる制度で、一定金額分の株式を毎月一定日に買い付けるものではない（それは株式累積投資）"},
{c:3,s:"株式ミニ投資",n:34,d:"B",x:1,a:1,q:"株式ミニ投資の取扱対象は、金融商品取引所に上場されている株券のみである。",e:"レジュメP82「取扱対象銘柄：取引所に上場されている株券」「※全ての銘柄×」と明示。非上場の株券は対象外。"},
{c:3,s:"株式ミニ投資",n:35,d:"C",x:1,a:1,q:"株式ミニ投資に係る取引において、約定日は金融商品取引業者が顧客から注文を受託した日の翌営業日とされている。",e:"レジュメP82「覚」。約定日＝金融業者が注文を受託した日（注文日）の翌営業日。受渡日は約定日から3営業日。指値注文は不可（成行注文のみ）。"},
{c:3,s:"株式の上場",n:36,d:"C",x:1,a:1,q:"一般的に、株式公開のメリットとして期待されるものに、公開会社の社会的信用の向上や資金調達力の拡大等がある。",e:"問題文のメリットのほか、企業のPR、財産保全機能の拡大、経営管理体制の確立なども挙げられる。"},
{c:3,s:"株式の上場",n:37,d:"C",x:1,a:1,q:"株券の新規上場における公開価格の決定方式には、ブックビルディング方式と競争入札による公募等の2種類がある。",e:"レジュメP84。ブックビルディング方式＝新規上場予定会社と幹事証券会社が公開価格の仮条件を決定する方式（現在の主流、IPO）。競争入札方式＝上場前の公開株式数の50％以上を一般投資家の入札にかけて決定する方式。問38はこの2つを入れ替えたひっかけ。"},
{c:3,s:"株式の上場",n:38,d:"B",a:0,q:"ブックビルディング方式では、上場前の公開株式数の50%以上の株式を一般投資家の参加する入札に付し、これにより公開価格が決定される。",e:"問題文は競争入札方式のこと。ブックビルディング方式とは、市場に新規上場する際の上場前の株式の公募価格を決める際に、投資家の需要状況に応じて公募価格を決定する方式"},
{c:3,s:"証券投資計算",n:39,d:"C",a:0,q:"株価収益率（PER）は、1株当たり当期純利益を株価で除して求められる。",e:"分母分子が逆。株価収益率（PER）＝株価 ÷ 1株当たり当期純利益"},
{c:3,s:"証券投資計算",n:40,d:"C",a:1,q:"株価純資産倍率（PBR）は、株価を1株当たり純資産で除して求められる。",e:"株価純資産倍率（PBR）＝株価 ÷ 1株当たり純資産（問題文のとおり）"},
{c:3,s:"証券投資計算",n:41,d:"C",x:1,a:1,q:"PBRが1倍ということは、その企業の株価が資産価値（解散価値）と同水準であることになる。",e:"PBR＝1倍とは、株価と1株当たり純資産（帳簿上の価値）が等しい状態。会社を解散したときに株主に返還される部分（純資産）と株価が同水準という意味（レジュメP87）。"},
{c:3,s:"証券投資計算",n:42,d:"B",a:0,q:"株価キャッシュ・フロー倍率（PCFR）とは、株価を1株当たりのキャッシュ・フローで除した数値であり、PCFRが高ければ株価は割安、PCFRが低ければ株価は割高である。",e:"「割安」「割高」が逆。株価キャッシュ・フロー倍率＝株価 ÷ 1株当たりキャッシュ・フロー。PCFRが高ければ株価は割高、低ければ割安"},
{c:3,s:"証券投資計算",n:43,d:"A",a:1,q:"EBITDAは、「金利・税金・償却前利益」の略で、経済のグローバル化により国際的な収益力の比較をするために考えられた利益指標である。",e:"EBITDA＝税引前利益＋支払利息＋減価償却費"},
{c:3,s:"証券投資計算",n:44,d:"B",x:1,a:1,q:"EV/EBITDA倍率が低ければ、株価は割安である。",e:"EV（企業価値）＝時価総額＋有利子負債－現金預金－短期有価証券。EV/EBITDA倍率は、その企業を買収した場合に何年で投資額を回収できるかの目安で、数値が低いほど割安（問52で計算問題として出題）。"},
{c:3,s:"証券投資計算",n:45,d:"B",a:0,q:"東証株価指数（TOPIX）とは、東証プライム市場上場銘柄中、流動性が高く代表的な225銘柄の株価を平均し、増資権利落などを修正したものである。",e:"問題文は日経平均株価のこと。東証株価指数（TOPIX）とは、時価総額加重方式によって算出される株価指数であり、東証上場銘柄のうち株式会社JPX総研が選定する銘柄の時価総額が、基準時の時価総額と比較してどのくらい増減したかを通じて市場全体の動きを表すもの"},
{c:3,s:"売買の受託",n:46,d:"B",o:["顧客の氏名又は名称", "受注日時", "約定日時", "売付け又は買付けの別", "手数料の金額"],a:[5],q:"次のうち、「注文伝票」の記載事項に該当しないものの番号を1つ選びなさい。",e:"1〜4はいずれも注文伝票の記載事項。手数料の金額は契約締結時交付書面の記載事項である。"},
{c:3,s:"売買の受託",n:47,d:"B",o:["売付け又は買付けの別", "営業所の名称", "受注日時", "指値又は成行の別", "委託注文の有効期間"],a:[1, 2],q:"次のうち、「契約締結時交付書面」の記載事項に該当するものの番号を2つ選びなさい。",e:"3・4は注文伝票の記載事項。5（委託注文の有効期間）は、顧客が委託注文を出す際に金融商品取引業者に指示すべき事項として受託契約準則に定められている。「注文伝票」と「契約締結時交付書面」の記載事項は頻繁に出題される。"},
{c:3,s:"金融商品取引所における株式の売買・計算",n:48,d:"A",o:["40円", "60円", "80円", "100円", "120円"],a:[2],q:"1：1.5の株式分割を行う上場銘柄A社株式の権利付相場は900円であった。権利落後の値段が560円になったとすれば、権利付相場の900円に対していくら値下がりしたことになるか。正しいものの番号を1つ選びなさい。（注）答は円単位未満を切り捨ててある。",e:"実際の権利落後の値段から算出される権利付相場を求め、その値段と元々の権利付相場の値段（この場合900円）との比較をする。 権利落相場 ＝ 権利付相場 ÷ 分割比率 ∴ 権利付相場 ＝ 権利落相場 × 分割比率 ＝ 560円 × 1.5 ＝ 840円 権利落価格560円は、1：1.5の分割比率であれば権利付価格は840円の計算になる。 ∴ 840円 － 900円 ＝ －60円"},
{c:3,s:"証券投資計算",n:49,d:"B",t:[["", "総資本", "自己資本（期末）", "売上高", "当期純利益（税引後）"], ["本年3月期", "2,380", "1,700", "4,240", "400"], ["前年3月期", "2,100", "1,500", "3,270", "300"]],o:["5%", "10%", "15%", "20%", "25%"],a:[5],q:"以下の会社の決算期（年1回決算）における本年3月期の自己資本利益率（ROE）として正しいものの番号を1つ選びなさい。 （単位：百万円）",e:"自己資本（期首・期末平均）＝(1,500百万円＋1,700百万円)／2＝1,600百万円 自己資本利益率（ROE）＝当期純利益（年換算）／自己資本（期首・期末平均）×100 ＝400百万円／1,600百万円×100＝25%"},
{c:3,s:"証券投資計算",n:50,d:"C",t:[["項目", "値"], ["発行済株式総数", "400万株"], ["総資産", "50億円"], ["総負債", "20億円"], ["株価（時価）", "1,200円"], ["当期（純）利益", "3億6,000万円"]],o:["PBR 1.6倍、PER 11.2倍", "PBR 1.6倍、PER 12.6倍", "PBR 1.6倍、PER 13.3倍", "PBR 2.1倍、PER 15.2倍", "PBR 2.1倍、PER 16.7倍"],a:[3],q:"以下の会社（年1回決算）の株価純資産倍率（PBR）及び株価収益率（PER）の組合せとして正しいものの番号を1つ選びなさい。（注）答は小数点第2位以下を切り捨てること。",e:"純資産額＝総資産－総負債＝50億円－20億円＝30億円 1株当たり純資産＝純資産／発行済株式総数＝30億円／400万株＝750円 PBR＝株価／1株当たり純資産＝1,200円／750円＝1.6倍 1株当たり当期純利益＝当期純利益／発行済株式総数＝3億6,000万円／400万株＝90円 PER＝株価／1株当たり当期純利益＝1,200円／90円＝13.333…≒13.3倍"},
{c:3,s:"証券投資計算",n:51,d:"B",t:[["項目", "値"], ["資本金", "300億円"], ["発行済株式数", "5億株"], ["当期純利益（税引後）", "130億円"], ["減価償却費", "20億円"], ["株価", "1,350円"]],o:["15.4倍", "35.7倍", "45.0倍", "58.5倍", "62.2倍"],a:[3],q:"次の会社（年1回決算）の当期における株価キャッシュ・フロー倍率（PCFR）として正しいものの番号を1つ選びなさい。（注）簡便的にキャッシュ・フローは当期純利益（税引後）に減価償却費を加えたものとして計算すること。又、答は小数点第2位を四捨五入してある。",e:"1株当たりキャッシュ・フロー＝(税引後当期純利益＋減価償却費)／発行済株式総数 ＝(130億円＋20億円)／5億株＝30円 株価キャッシュ・フロー倍率＝株価／1株当たりキャッシュ・フロー＝1,350円／30円＝45.0倍"},
{c:3,s:"証券投資計算",n:52,d:"A",o:["5.14倍", "6.27倍", "7.21倍", "8.35倍", "9.68倍"],a:[1],q:"資本金600億円、時価総額1,900億円、利益剰余金800億円、保有現金預金（短期有価証券を含む）250億円、有利子負債820億円、EBITDA480億円の場合のEV/EBITDA倍率として正しいものの番号を1つ選びなさい。（注）答は小数点第3位以下を切り捨ててある。",e:"EV＝時価総額＋有利子負債－現金預金－短期有価証券＝1,900億円＋820億円－250億円＝2,470億円 EV/EBITDA倍率＝2,470億円／480億円＝5.145…≒5.14倍"},
{c:3,s:"証券投資計算",n:53,d:"B",t:[["約定代金", "委託手数料額"], ["100万円超 500万円以下の場合", "約定代金×0.900%＋2,500円"], ["500万円超 1,000万円以下の場合", "約定代金×0.700%＋12,500円"]],o:["6,624,386円", "7,268,521円", "8,875,274円", "9,127,045円", "10,035,621円"],a:[3],q:"ある個人（居住者）が、取引所取引で現物取引により、上場銘柄A社株式10,000株を成行注文で売り委託したところ、同一日に896円で8,000株、895円で2,000株の約定が成立した。この場合の受渡金額として正しいものの番号を1つ選びなさい。（注）株式委託手数料は、下表に基づき計算すること。なお、株式の譲渡に係る所得税については、考慮しないものとする。 ・上式による算出額に10%の消費税相当額が加算される。",e:"A社株式の約定代金＝(896円×8,000株)＋(895円×2,000株)＝8,958,000円……Ⓐ 委託手数料＝8,958,000円×0.700%＋12,500円＝75,206円……Ⓑ 消費税＝75,206円×10%≒7,520円（消費税額は円単位未満切捨て）……Ⓒ 受渡金額＝Ⓐ－(Ⓑ＋Ⓒ)＝8,958,000円－(75,206円＋7,520円)＝8,875,274円 売り注文のときの受渡金額は、投資家が金融商品取引業者から受け取ります。その際、売却にかかった委託手数料（消費税込み）を受け取り額から減算します。"},
{c:4,s:"定款・取引参加者規程",n:1,d:"C",x:1,a:1,q:"東京証券取引所及び大阪取引所（OSE）は、会社法上の株式会社である。",e:"金融商品取引所は会社法上の株式会社で、開設には内閣総理大臣の免許が必要（レジュメP92）。"},
{c:4,s:"定款・取引参加者規程",n:2,d:"C",x:1,a:1,q:"東京証券取引所の取引参加者は、有価証券の売買を行うことができる総合取引参加者の1種類である。",e:"東証の取引参加者資格は「総合取引参加者」の1種類のみ。大阪取引所は先物取引等取引参加者・国債先物等取引参加者・外国為替証拠金取引参加者の複数種類がある点と対比される（レジュメP92）。"},
{c:4,s:"定款・取引参加者規程",n:3,d:"B",a:0,q:"大阪取引所の国債先物等取引参加者には金融商品取引業者しかなることができない。",e:"大阪取引所の国債先物等取引参加者には、金融商品取引業者だけでなく、取引所取引許可業者や登録金融機関もなることができる"},
{c:4,s:"定款・取引参加者規程",n:4,d:"C",a:0,q:"金融商品取引所の取引参加者である金融商品取引業者は、顧客から金融商品取引所における有価証券の売買等の委託を受けるときに、あらかじめ当該顧客の住所、氏名等を調査する義務はない。",e:"取引参加者は、顧客から金融商品取引所における有価証券の売買等の委託を受けるときは、あらかじめ顧客の住所、氏名その他の事項を調査しなければならない（義務がある）"},
{c:4,s:"有価証券上場規程",n:5,d:"B",a:0,q:"ある金融商品取引所に上場されている有価証券であれば、国内の他のすべての金融商品取引所の市場において売買を行うことができる。",e:"取引所において売買の対象となる有価証券は、その取引所に上場されている有価証券だけである"},
{c:4,s:"有価証券上場規程",n:6,d:"B",x:1,a:1,q:"上場の対象となる有価証券は、金融商品取引法上の有価証券に限られる。",e:"レジュメP94「覚・必ず」。金融商品取引法上の有価証券に限られ、小切手や約束手形は上場できない（問7のひっかけ元）。"},
{c:4,s:"有価証券上場規程",n:7,d:"B",a:0,q:"上場の対象となる有価証券には、株券や国債証券のほか、小切手や約束手形も含まれる。",e:"上場の対象となる有価証券は、金融商品取引法上の有価証券に限られる。小切手や約束手形は含まれない"},
{c:4,s:"有価証券上場規程",n:8,d:"B",a:0,q:"スタンダード市場とは、多くの機関投資家の投資対象となりうる規模の時価総額（流動性）を持ち、より高いガバナンス水準を備え、投資家との建設的な対話を中心に据えて持続的な成長と中長期的な企業価値の向上にコミットする企業向けの市場のことである。",e:"記述はプライム市場のもの。スタンダード市場とは、公開された市場における投資対象として一定の時価総額（流動性）を持ち、上場企業としての基本的なガバナンス水準を備えつつ、持続的な成長と中長期的な企業価値の向上にコミットする企業向けの市場のこと"},
{c:4,s:"有価証券上場規程",n:9,d:"B",x:1,a:1,q:"グロース市場とは、高い成長可能性を実現するための事業計画及びその進捗の適時・適切な開示が行われ一定の市場評価が得られる一方、事業実績の観点から相対的にリスクが高い企業向けの市場のことである。",e:"東証の市場区分は3種類（レジュメP94）。プライム市場＝機関投資家の投資対象・投資家との建設的な対話、スタンダード市場＝一定の時価総額（流動性）、グロース市場＝高い成長可能性・相対的にリスクが高い企業向け。"},
{c:4,s:"有価証券上場規程",n:10,d:"B",a:0,q:"外国国債証券及び外国地方債証券の上場にあたっては、発行者からの上場申請は不要とされている。",e:"外国国債証券及び外国地方債証券の上場にあたっては、発行者からの上場申請が必要である"},
{c:4,s:"有価証券上場規程",n:11,d:"C",a:0,q:"国債証券、地方債証券については、発行者からの上場申請がなくても上場できる。",e:"国債証券については、発行者からの上場申請がなくても上場できるが、地方債証券については、発行者からの上場申請が必要である"},
{c:4,s:"有価証券上場規程",n:12,d:"C",a:0,q:"国債証券の上場は、財務省からの上場申請のあったものに限り取引所が上場審査を行い、上場を決定している。",e:"国債証券については財務省（発行者）からの上場申請がなくても上場できる"},
{c:4,s:"有価証券上場規程",n:13,d:"C",a:0,q:"スタンダード市場の株券等の上場審査においては、株主数、事業継続年数、純資産の額、単元株式数、株式の譲渡制限などのいずれかが形式要件に適合するものを対象としている。",e:"「いずれか」ではなく「すべて」が形式要件に適合する必要がある"},
{c:4,s:"有価証券上場規程",n:14,d:"B",a:0,q:"東京証券取引所における外国株券の上場審査は、内国株券と全く同じ審査が行われる。",e:"外国株券等の上場審査については、内国株券の上場審査制度を基準にして、外国株券等に特有な性質を配慮して審査が行われる。具体的には、本国等における法制度、実務慣行等を勘案した実質審査が行われる"},
{c:4,s:"有価証券上場規程",n:15,d:"C",x:1,a:1,q:"東証は、東証に既に上場されている株券等の発行者が同一種類の株券等を新たに発行する場合は、原則として上場を承認するものとしている。",e:"追加発行に係る上場承認の原則（レジュメP94・95）。"},
{c:4,s:"有価証券上場規程",n:16,d:"B",x:1,a:1,q:"東証は、他の市場区分（スタンダード市場、プライム市場又はグロース市場のうち、上場株券等が上場している市場区分以外の市場区分をいう。）への市場区分の変更申請を受けた場合、新規上場申請時と同様に審査を行わなければならない。",e:"市場区分の変更申請にも、新規上場申請時と同様の審査が行われる（レジュメP95）。"},
{c:4,s:"有価証券上場規程",n:17,d:"B",x:1,a:1,q:"東京証券取引所は、上場された株券等について、発行者の経営に重大な影響を与える事実及び株券等に関する権利等に係る重要な決定等の開示を義務付けている。",e:"適時開示義務。投資判断に重要な影響を与える情報を、発行者に開示させる制度。"},
{c:4,s:"有価証券上場規程",n:18,d:"B",a:0,q:"東京証券取引所は、上場株券等が上場廃止基準に該当するおそれがある場合には、その事実を投資者に周知させるため、一定期間、当該株券等を整理銘柄に指定することができる。",e:"「整理銘柄」ではなく「監理銘柄」。監理銘柄＝上場廃止基準に該当するおそれがある場合や、上場廃止申請の審査期間中に指定。整理銘柄＝上場廃止が決定された場合に指定"},
{c:4,s:"有価証券上場規程",n:19,d:"B",a:0,q:"東京証券取引所は、上場株券等の上場廃止が決定された場合には、その事実を投資者に周知させるため、上場廃止日の前日までの間、監理銘柄に指定してその株券等の売買取引を行わせることができる。",e:"「監理銘柄」ではなく「整理銘柄」。問18と対で、監理銘柄・整理銘柄の定義を入れ替えて出される"},
{c:4,s:"有価証券上場規程",n:20,d:"A",a:0,q:"非参加型優先株及び子会社連動配当株（優先株等）の上場にあたり、上場審査及び上場廃止については、普通株と同じ基準で行っている。",e:"優先株等の上場申請については普通株とほぼ同様の手続きだが、上場審査及び上場廃止については、優先株等の特異性を考慮し、普通株とは異なった基準を設けている"},
{c:4,s:"有価証券上場規程",n:21,d:"B",a:0,q:"優先株等の上場審査基準の1つに、当該上場申請銘柄の発行会社が、その取引所の上場会社であることは含まれない。",e:"優先株等の上場審査基準（形式要件）の1つに、「その発行者が普通株を上場していること」がある"},
{c:4,s:"有価証券上場規程",n:22,d:"B",x:1,a:1,q:"上場している普通株について、上場廃止基準に該当することとなった場合には、その発行者が発行する優先株等についても同様に上場が廃止される。",e:"優先株等の上場廃止基準の1つ（発行者に対する基準）として、発行する普通株がその普通株の上場廃止基準に該当した場合が含まれる（レジュメP96・97）。"},
{c:4,s:"有価証券上場規程",n:23,d:"B",a:0,q:"転換社債型新株予約権付社債券については、国債証券と同様、当該転換社債型新株予約権付社債券の発行者からの上場申請がなくても上場できることとされている。",e:"国債の場合等を除き、発行者から取引所への上場申請がない限り、その有価証券は上場できない。転換社債型新株予約権付社債券も発行者からの上場申請が必要"},
{c:4,s:"有価証券上場規程",n:24,d:"B",x:1,a:1,q:"転換社債型新株予約権付社債券の上場審査基準は、発行者に対する基準と上場申請銘柄に対する基準がある。",e:"①発行者に対する基準（東証の上場会社であること）と、②上場申請銘柄に対する基準（発行額面総額、新株予約権の行使条件が適当でないと認められるものでないこと等）の2種類（レジュメP98）。"},
{c:4,s:"有価証券上場規程",n:25,d:"B",a:0,q:"東京証券取引所は、転換社債型新株予約権付社債券の上場に際して、その発行者の発行する株券が上場されていれば、当該転換社債型新株予約権付社債券の上場審査を行わずに上場を決定することとなっている。",e:"転換社債型新株予約権付社債券の上場については、上場申請のあった転換社債型新株予約権付社債券の上場審査基準に基づき審査を行い、上場を決定する。発行者の発行する株券が上場されていることは、「発行者に対する基準」を満たしているだけである"},
{c:4,s:"有価証券上場規程",n:26,d:"C",a:0,q:"東京証券取引所に上場されている転換社債型新株予約権付社債券の上場が廃止されるのは、当該上場転換社債型新株予約権付社債券が上場額面総額等所定の事項について定められた上場廃止基準のすべてに該当する場合である。",e:"上場廃止基準のいずれかに該当すれば、その銘柄の上場は廃止される（「すべて」ではない）"},
{c:4,s:"有価証券上場規程",n:27,d:"B",a:0,q:"上場株券等が上場廃止となった場合であっても、当該株券等の発行会社が発行する上場転換社債型新株予約権付社債券は上場廃止されない。",e:"上場株券等が上場廃止となった場合、当該株券等の発行者が発行する上場転換社債型新株予約権付社債券は上場廃止される（転換社債型新株予約権付社債に対する上場廃止基準の1つ）"},
{c:4,s:"有価証券上場規程",n:28,d:"B",x:1,a:1,q:"上場転換社債型新株予約権付社債券の上場廃止基準の1つに、新株予約権の行使期間の満了がある。",e:"転換社債型新株予約権付社債に対する上場廃止基準（レジュメP98）：最終償還期限の1か月前までに上場額面総額が3億円未満となった場合、新株予約権の行使期間満了、など。"},
{c:4,s:"有価証券上場規程",n:29,d:"B",a:0,q:"内国指標連動型ETF上場に際しての上場申請者は投資信託委託会社に限られている。",e:"内国指標連動型ETFの上場については、投資信託委託会社等及びその受託者である信託会社等からの上場申請があったものについて、上場審査基準に基づき審査が行われる"},
{c:4,s:"業務規程",n:30,d:"B",x:1,a:1,q:"東京証券取引所における株券の普通取引においては、配当金（中間配当を含む。）交付株主の確定期日又は新株予約権その他の権利確定期日の前日から、配当落ち又は権利落ちとして売買が行われる。",e:"レジュメP101。権利確定日の前日から配当落ち・権利落ちとして売買される。3月末決算なら、3月29日（権利付き最終売買日）までに買えば配当・優待がもらえ、30日（権利落ち）以降に買っても間に合わない。"},
{c:4,s:"業務規程",n:31,d:"B",x:1,a:1,q:"証券金融会社と金融商品取引業者との間で行われる資金や株券の貸借関係を貸借取引という。",e:"信用取引の決済に必要な資金・証券を、証券金融会社が証券会社に貸し付ける仕組み（13章の日本証券金融の内容と関連）。"},
{c:4,s:"業務規程",n:32,d:"B",x:1,a:1,q:"東京証券取引所の売買立会による売買において、1単元の株式の数を定めていない会社の発行する上場株券は、1株を売買単位として取引を行うこととされている。",e:"株券の売買単位は原則1単元（100株）。1単元の株式数を定めていない会社は1株が売買単位（レジュメP102）。"},
{c:4,s:"業務規程",n:33,d:"C",x:1,a:1,q:"国債証券の売買単位は、額面5万円である。",e:"株券の売買単位が1単元（原則100株）であるのに対し、債券の売買単位は額面5万円（レジュメP102）。"},
{c:4,s:"業務規程",n:34,d:"C",a:0,q:"指値による呼値は、成行呼値に値段的に優先する。",e:"「指値」「成行」が逆。成行呼値は、指値による呼値に値段的に優先する"},
{c:4,s:"業務規程",n:35,d:"B",a:0,q:"売呼値においては、高い値段の売呼値が低い値段の売呼値に優先する。",e:"売呼値においては、低い値段の売呼値が高い値段の売呼値に優先する（価格優先の原則）"},
{c:4,s:"業務規程",n:36,d:"B",x:1,a:1,q:"価格優先の原則とは、売呼値においては、低い値段の売呼値が高い値段の売呼値に優先し、買呼値においては、高い値段の買呼値が低い値段の買呼値に優先することである。",e:"価格優先の原則（レジュメP103「覚・必ず」）。売呼値は低い値段が優先、買呼値は高い値段が優先。同一値段の場合は時間優先の原則（早い注文が優先）が適用される。"},
{c:4,s:"業務規程",n:37,d:"C",a:0,q:"ザラ場とは、売買立会の始値の決定方法のことをいう。",e:"問題文は「板寄せ」のこと。ザラ場とは、始値と終値との間に行われる継続売買のことで、始値決定後の値段の決定方法をザラ場方式という"},
{c:4,s:"業務規程",n:38,d:"B",x:1,a:1,q:"売買立会の始値を定める場合には、板寄せの方法が用いられる。",e:"板寄せとは、約定値段決定前の売呼値・買呼値をすべて注文控え（板）に記載し、それらを価格優先・成行注文優先の原則で対当させながら数量的に合致する値段を求め、その値段を単一の約定価格として始値を決定する方法（レジュメP103・104）。"},
{c:4,s:"業務規程",n:39,d:"B",a:0,q:"債券（転換社債型新株予約権付社債券などを除く。）の呼値の制限値幅は1円であり、いかなる場合においても制限値幅を変更することはない。",e:"債券の呼値の制限値幅は1円だが、東証は売買の状況に異常があると認める場合又はそのおそれがあると認める場合には、全部もしくは一部の銘柄について呼値の制限値幅を変更することができる"},
{c:4,s:"業務規程",n:40,d:"B",x:1,a:1,q:"東京証券取引所は、過誤のある注文により売買が成立した場合において、その決済が極めて困難であり、取引所市場が混乱するおそれがあると認めたとき等は、一度成立した売買を取り消すことができる。",e:"約定取消ルール（レジュメP106）。金融商品取引では一度成立した売買は取り消されず確実に決済まで行われることが大前提だが、取引所は市場の混乱を防ぐため例外的な取消ルールを制定している。"},
{c:4,s:"業務規程",n:41,d:"C",x:1,a:1,q:"東京証券取引所における有価証券の売買の清算・決済は、「株式会社日本証券クリアリング機構」で行われる。",e:"清算機関としての株式会社日本証券クリアリング機構（JSCC）（レジュメP106）。"},
{c:4,s:"業務規程",n:42,d:"B",x:1,a:1,q:"有価証券等清算取次ぎは、清算参加者に清算機関との間で清算を行わせるために、名義上清算参加者の名によって売買を成立させるための行為である。",e:"清算参加者でない証券会社が、清算参加者を通じて清算機関に清算を委託する仕組み（レジュメP106）。"},
{c:4,s:"受託契約準則",n:43,d:"C",a:0,q:"取引参加者が東京証券取引所市場において、有価証券の売買等を受託するにあたっては、取引所の定める「受託契約準則」によらなければならず、取引参加者にはこれを遵守すべき義務があるが、顧客にはこれを遵守すべき義務はない。",e:"顧客も受託契約準則を熟知し、遵守すべき義務がある。受託契約準則は取引所が定め、金融庁長官の認可事項とされる"},
{c:4,s:"受託契約準則",n:44,d:"C",x:1,a:1,q:"国債証券や地方債証券は、信用取引の委託保証金の代用有価証券とすることができる。",e:"信用取引の代用有価証券（委託保証金の代用）として認められるもの（レジュメP107）：国内上場株券、国債証券、地方債証券、政府保証債、公社債投資信託の受益証券、その他の投資信託の受益証券、国内に上場されている外国国債証券など。"},
{c:4,s:"受託契約準則",n:45,d:"C",a:0,q:"有価証券の売買に係る顧客と取引参加者との間の金銭の授受は、必ず円貨で行わなければならない。",e:"原則すべて円貨で行うが、受託取引参加者（証券会社）が同意した場合は、顧客の指定する外貨によることも可能である"},
{c:4,s:"業務規程",n:46,d:"C",o:["イは時間、ロは価格、ハは競争", "イは価格、ロは時間、ハは競争", "イは時間、ロは価格、ハは相対", "ニは指値、ホは成行", "ニは成行、ホは指値"],a:[2, 5],q:"次の文章のうち、（ ）にあてはまる語句を下の語群からそれぞれ正しく選んでいるものの番号を2つ選びなさい。 東京証券取引所の売買立会による売買において、売買注文を売り・買い別に市場に集中し、まず（イ）優先の原則を適用する。この方法で解決できない場合には（ロ）優先の原則に従い（ハ）売買によって行われる。又、（ニ）呼値は、（ホ）による呼値に値段的に優先する。 〔語群〕価格、時間、相対、競争、指値、成行",e:"価格優先の原則（イ＝価格）→時間優先の原則（ロ＝時間）→競争売買（ハ＝競争）の順で売買が成立する（レジュメP103）。また、成行呼値（ニ＝成行）は指値による呼値（ホ＝指値）に値段的に優先する（問34の裏返し）。"},
{c:4,s:"業務規程",n:47,d:"B",t:[["売呼値記載欄", "値段", "買呼値記載欄"], ["35,000株", "成行", "27,000株"], ["21,000", "803", ""], ["13,000", "802", "8,000"], ["10,000", "801", "7,000"], ["8,000", "800", "9,000"], ["3,000", "799", "8,000"], ["4,000", "798", "15,000"], ["", "774", "15,000"]],o:["802円", "801円", "800円", "799円", "798円"],a:[3],q:"売買立会の始値決定直前の注文控（板）の状況が下表の状態である場合、始値はいくらで決定されるか。正しいものの番号を1つ選びなさい。",e:"価格優先原則及び成行注文優先により、まず成行売呼値35,000株と買呼値27,000株を対当させる。この時点で成行売呼値8,000株が残る。次に、残りの成行売呼値8,000株を、最も高い買呼値の802円8,000株と対当させる。続いて、残りの呼値のうち、まず最も低い売呼値798円4,000株を、最も高い買呼値801円7,000株と対当させる。次に、その買残株3,000株と売呼値の799円3,000株を対当させる。最後に、売呼値800円8,000株と買呼値800円9,000株を対当させた時点で、板寄せによる約定価格決定の条件が整い、始値800円となる。 〈成立過程〉 売呼値 買呼値 売買が成立した株 成行 35,000株 ⇔ 成行 27,000株 ⇒ 27,000株 成行 8,000株 ⇔ 802円 8,000株 ⇒ 8,000株 798円 4,000株 ⇔ 801円 7,000株 ⇒ 4,000株 799円 3,000株 ⇔ 801円 3,000株 ⇒ 3,000株 800円 8,000株 ⇔ 800円 9,000株 ⇒ 8,000株"},
{c:5,s:"日本証券業協会の定款と諸規則",n:1,d:"C",a:0,q:"日本証券業協会は、金融商品取引法67条の2・2項の規定により、内閣総理大臣の登録を受けた法人である。",e:"「登録」ではなく「認可」を受けた法人である（レジュメP110「覚・必ず」：日本証券業協会は自主規制機関）"},
{c:5,s:"日本証券業協会の定款と諸規則",n:2,d:"C",x:1,a:1,q:"日本証券業協会の協会員は、「会員」、「特定業務会員」及び「特別会員」の3種類に区分されている。",e:"レジュメP110。①会員＝第一種金融商品取引業を行う者（証券会社）、②特定業務会員、③特別会員＝登録金融機関（銀行・信託銀行）。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:3,d:"B",x:1,a:1,q:"顧客（特定投資家を除く。）にブル・ベア型投資信託を販売する場合は、ベア型については対象となる指数が上昇した場合にその指数と比べて大きな損失が生じる可能性があることを説明するとともに、理解を得るよう努めなければならない。",e:"レジュメP111。ブル型＝指数上昇で大きな利益、ベア型＝指数下落で大きな利益となる仕組みなので、ベア型は指数が上昇した場合には指数の値動き以上に大きな損失が生じうる（10章問17のブル・ベア型の定義と関連）。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:4,d:"C",x:1,a:1,q:"協会員は、顧客の投資経験、投資目的、資力等を十分に把握し、顧客の意向と実情に適合した投資勧誘を行うよう努めなければならないが、これは適合性の原則と呼ばれているものである。",e:"適合性の原則（6章問7の金商法上の適合性原則と同じ考え方）。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:5,d:"C",x:1,a:1,q:"協会員は、投資勧誘にあたっては、顧客に対し、投資は投資者自身の判断と責任において行うべきものであることを理解させる必要がある。",e:"自己責任原則の周知義務。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:6,d:"C",a:0,q:"協会員は、債券又は公社債投資信託のみの取引を行う顧客については、必ずしも顧客カードを備え付けなくてもよい。",e:"有価証券の売買等を行う顧客については、（取扱商品にかかわらず）顧客カードを備え付けなければならない"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:7,d:"A",a:0,q:"協会員が、特定投資家を除く個人顧客に対し、販売の勧誘を行うに当たって勧誘開始基準を定めなければならないものは、店頭デリバティブ取引に類する複雑な投資信託に係る販売及びレバレッジ投資信託に係る販売だけである。",e:"勧誘開始基準を定める必要があるのは、店頭デリバティブ取引に類する複雑な投資信託に係る販売及びレバレッジ投資信託に係る販売だけでなく、店頭デリバティブ取引に類する複雑な仕組債に係る販売も該当する"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:8,d:"B",x:1,a:1,q:"協会員は、信用取引については、取引開始基準を定め、当該基準に適合した顧客からこれを受託するものとされているが、確認書の徴求は必要はない。",e:"信用取引・新株予約権証券の取引については「取引開始基準」を定めて適合した顧客から受託すれば足り、確認書の徴求までは求められていない。注意喚起文書の交付が必要となるデリバティブ取引等（問9）との違いに注意。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:9,d:"A",a:0,q:"協会員は、特定投資家を除く個人顧客と有価証券関連デリバティブ取引等の販売に係る契約を締結しようとするときは、あらかじめいかなる場合も当該顧客に対し、注意喚起文書を交付するものとされている。",e:"有価証券関連デリバティブ取引等、特定店頭デリバティブ取引等、商品関連市場デリバティブ取引取次ぎ等の販売に係る契約の締結前1年以内にその顧客に対し、同種の内容の有価証券等の販売に係る注意喚起文書を交付している場合及びその顧客が目論見書の交付を受けないことについて同意している場合は、注意喚起文書の交付は必要ない（レジュメP112・113。デリバティブ取引等は「勧誘開始基準」、信用取引等は「取引開始基準」＋確認書の徴求、と規制の掛かり方が異なる点に注意）"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:10,d:"B",x:1,a:1,q:"協会員は、高齢顧客（個人に限り、特定投資家を除く。）に有価証券等の勧誘による販売を行う場合には、当該協会員の業態、規模、顧客分布及び顧客属性並びに社会情勢その他の条件を勘案し、高齢顧客の定義、販売対象となる有価証券等、説明方法、受注方法に関する社内規則を定め、適正な投資勧誘に努めなければならない。",e:"高齢顧客への勧誘に関する社内規則の整備義務。高齢顧客の定義そのものを法令で一律に決めるのではなく、各協会員が自社の業態等を勘案して定める点がポイント。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:11,d:"C",a:0,q:"協会員は、顧客の有価証券関連デリバティブ取引等、特定店頭デリバティブ取引等及び商品関連市場デリバティブ取引取次ぎ等の建玉、損益、委託証拠金、預り資産等の状況について適切な把握に努めるため、当該取引等を重複して行う顧客の評価損益については、総合的な管理を行ってはならない。",e:"総合的な管理を行う必要がある（「行ってはならない」が誤り）"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:12,d:"C",x:1,a:1,q:"協会員は、顧客に対し、主観的又は恣意的な情報提供となる特定銘柄の有価証券又は有価証券の売買に係るオプションの一律集中的推奨をしてはならない。",e:"一律集中的推奨の禁止。特定銘柄を組織的・集中的に推奨すると相場形成をゆがめるおそれがあるため。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:13,d:"C",a:0,q:"協会員は、顧客が株券の名義書換えを請求するに際し、顧客から書面による承諾を受けた場合は自社の名義を貸与することができる。",e:"顧客の書面による承諾があっても、自社の名義を貸与することはできない"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:14,d:"B",a:0,q:"会員は、有価証券の売買その他の取引等に関連し、顧客の資金又は有価証券の借入れにつき行う保証、あっせん等の便宜の供与については、一切行ってはならない。",e:"一切行ってはならないのではなく、顧客の取引金額その他に照らして過度にならないように、適切な管理を行うこととされている（レジュメP114「覚・必ず」：保証・あっせん自体は禁止行為ではない）"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:15,d:"C",x:1,a:1,q:"協会員は、上場会社等の特定有価証券等の売買を初めて行う顧客から、上場会社等の役員等であるか否かについて届出を求めるとともに、上場会社等の役員等である場合には、当該有価証券の売買が行われるまでに内部者登録カードを備え付けなければならない。",e:"内部者登録カードの備付けは売買が行われるまでに行う（問16のひっかけ元）。記載事項は問87を参照。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:16,d:"B",a:0,q:"協会員は、上場会社等の役員等に該当する顧客については、上場会社等の特定有価証券等に係る売買等が行われた後、速やかに内部者登録カードを備え付けなければならない。",e:"「売買等が行われた後、速やかに」ではなく、売買等が行われるまでに内部者登録カードを備え付けなければならない（問15と対のひっかけ）"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:17,d:"C",x:1,a:1,q:"協会員は、新規顧客、大口取引顧客等からの注文の受託に際しては、あらかじめ当該顧客から買付代金又は売付有価証券の全部又は一部の預託を受けるなど、取引の安全性の確保に努めるものとされている。",e:"新規顧客・大口取引顧客からの受託時の取引安全性確保（前受金・前受株の預託）。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:18,d:"B",a:0,q:"協会員は、有価証券の売買その他の取引等を行う場合には、管理上必要と認められる場合に限り、顧客の注文に係る取引と自己の計算による取引とを峻別することとされている。",e:"「管理上必要と認められる場合に限り」ではない。顧客の注文に係る取引と自己の計算による取引とを峻別しなければならず、顧客の注文に係る伝票を速やかに作成の上、整理、保存するものとされている"},
{c:5,s:"協会員の従業員に関する規則",n:19,d:"C",x:1,a:1,q:"原則として、協会員は他の協会員の使用人を自社の従業員として採用してはならない。",e:"従業員に対する監督責任の所在を明らかにするため、協会員が他の協会員の使用人を自己の従業員として採用することは原則禁止。"},
{c:5,s:"協会員の従業員に関する規則",n:20,d:"B",a:0,q:"協会員は、出向により受け入れる場合であっても、他の協会員の使用人を自己の従業員として採用することは禁止されている。",e:"出向により受入採用する場合等については、この規制の対象外となっている（問19の原則に対する例外。レジュメP116「二重採用禁止・出向はOK」）"},
{c:5,s:"協会員の従業員に関する規則",n:21,d:"B",a:0,q:"協会員は、従業員として採用しようとする者の処分の有無を照会してはならない。",e:"処分の有無を照会する必要がある（「照会してはならない」が誤り）。レジュメP116：一級不都合行為者＝採用不可（採用前に協会へ照会）、二級不都合行為者＝5年間採用不可（過去5年間に実務経験があれば照会）"},
{c:5,s:"協会員の従業員に関する規則",n:22,d:"A",x:1,a:1,q:"協会員の従業員は、いかなる名義を用いているかを問わず、原則として、自己の計算において信用取引、有価証券関連デリバティブ取引、特定店頭デリバティブ取引又は商品関連市場デリバティブ取引を行ってはならない。",e:"従業員による自己の計算での信用取引・デリバティブ取引の原則禁止。名義を問わず適用される点に注意。"},
{c:5,s:"協会員の従業員に関する規則",n:23,d:"C",x:1,a:1,q:"「仮名取引」とは、顧客が架空名義あるいは他人の名義を使用して、その取引の法的効果を得ようとする取引のことをいう。",e:"従業員は、本人名義以外の名義を使用していることを知りながら注文を受けてはならない。ただし、名義人の配偶者及び二親等内の血族が名義人本人の取引としての注文であることを明示して発注し、その確認が行われていれば本人名義の取引とみなされる。"},
{c:5,s:"協会員の従業員に関する規則",n:24,d:"C",a:0,q:"協会員の従業員が有価証券の取引について、顧客と損益をともにする場合には、あらかじめ当該顧客の承諾を得なければならない。",e:"あらかじめ顧客の承諾をとっても、協会員の従業員が有価証券の取引について顧客と損益をともにすることは禁止されている"},
{c:5,s:"協会員の従業員に関する規則",n:25,d:"B",a:0,q:"協会員の従業員は、顧客から有価証券の売買注文を受けた場合において、当該顧客及び所属協会員から書面による承諾を受けた場合に限り、自己がその相手方となって売買を成立させることができる。",e:"協会員の従業員は、顧客から有価証券の売買注文を受けた場合、自己がその相手方となって売買を成立させることはできない（書面による承諾があっても不可）"},
{c:5,s:"協会員の従業員に関する規則",n:26,d:"C",a:0,q:"協会員の従業員は、顧客から有価証券の売買注文を受けた場合において、顧客の許可を得れば、自己の有価証券の売買その他の取引等について顧客の名義又は住所を使用することができる。",e:"協会員の従業員は、自己の有価証券の売買その他の取引等について顧客の名義又は住所を使用してはならない（顧客の許可があっても不可）"},
{c:5,s:"協会員の従業員に関する規則",n:27,d:"C",a:0,q:"協会員の従業員は、顧客から有価証券の名義書換え等の手続きの依頼を受けた場合において、所属する協会員を通じないでその手続きを行ってはならないが、顧客の名義書換えについて便宜上自己の名義を使用させることは認められている。",e:"顧客の名義書換えに自己の名義を使用させることは禁止されている（問13の協会員自社名義の貸与禁止と同系統）"},
{c:5,s:"協会員の従業員に関する規則",n:28,d:"C",x:1,a:1,q:"協会員の従業員は、所属協会員から顧客に交付するために預託された業務に関する書類を遅滞なく当該顧客に交付しなければならない。",e:"預託された書類の遅滞なき交付義務。"},
{c:5,s:"協会員の従業員に関する規則",n:29,d:"C",a:0,q:"協会員の従業員は、顧客の債務の立替えであれば、有価証券の売買その他の取引に関して、顧客と金銭、有価証券の貸借を行うことができる。",e:"協会員の従業員は、有価証券の売買その他の取引に関して、顧客の債務の立替えを行うことは禁止されている"},
{c:5,s:"協会員の従業員に関する規則",n:30,d:"B",x:1,a:1,q:"協会員は、その従業員が顧客に関する情報（見込み顧客及び引受部門、投資銀行部門等の顧客に関する情報を含み、公知の情報を除く。）について、「他の協会員の顧客に関する情報などを不正に取得すること。」や「顧客に関する情報を漏えいすること。」のないようにしなければならない。",e:"顧客情報の不正取得・漏えいの防止義務。見込み顧客や引受部門・投資銀行部門の顧客情報も対象に含まれる点に注意。"},
{c:5,s:"協会員の従業員に関する規則",n:31,d:"B",x:1,a:1,q:"協会員の従業員は、顧客から有価証券の売付けの注文を受ける場合において、原則として、当該有価証券の売付けが空売りであるか否かの別を確認したうえで注文を受けなければならない。",e:"空売りかどうかの確認義務（3章問6の金商法上の空売り確認義務と同じ内容）。"},
{c:5,s:"協会員の従業員に関する規則",n:32,d:"C",x:1,a:1,q:"協会員は、その従業員が有価証券等の性質又は取引の条件について、顧客を誤認させるような勧誘をすることのないよう指導、監督しなければならない。",e:"協会員が従業員に行わせてはならない不適切行為には次のものがある。①有価証券の売買その他の取引等において、銘柄・価格・数量・指値または成行の区別等、顧客の注文内容の確認を行わないまま注文を執行すること、②有価証券等の性質や取引の条件について、顧客を誤認させるような勧誘を行うこと、③有価証券の価格等について、騰貴または下落することに関し顧客を誤認させるような勧誘を行うこと、④顧客の注文の執行において、過失により事務処理を誤ること。"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:33,d:"B",x:1,a:1,q:"一種外務員は、外務員のうち、外務員の職務のすべてを行うことができる者をいう。",e:"レジュメP120「覚・必ず」。一種外務員＝職務すべてOK、信用取引外務員＝二種の職務＋信用取引OK、二種外務員＝デリバティブ取引・信用取引・選択権付債券売買・新株予約権証券等以外はOK。"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:34,d:"B",a:0,q:"二種外務員が行うことができる外務員の職務の範囲には、投資信託の受益証券の募集に係るものは含まれない。",e:"投資信託の受益証券の募集は、二種外務員が行うことができる外務員の職務に含まれる（二種の職務範囲から除かれるのはデリバティブ・信用取引・選択権付債券売買・新株予約権証券等）"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:35,d:"C",a:0,q:"二種外務員は、有価証券関連デリバティブ取引に係る外務員の職務を行うことができる。",e:"二種外務員は、有価証券関連デリバティブ取引に係る外務員の職務を行うことができない"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:36,d:"B",x:1,a:1,q:"二種外務員が行うことができる外務員の職務の範囲には、選択権付債券売買取引に係るものは含まれない。",e:"選択権付債券売買取引（債券のオプション取引）はデリバティブ性が高いため、二種外務員の職務範囲外。問34の投資信託の募集（含まれる）との対比で押さえる。"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:37,d:"B",a:0,q:"二種外務員が行うことができる外務員の職務の範囲には、新株予約権証券に係るものが含まれる。",e:"二種外務員が行うことができる外務員の職務の範囲に、新株予約権証券に係るものは含まれない"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:38,d:"C",a:0,q:"二種外務員は、レバレッジ投資信託に係る外務員の職務を行うことはできるが、店頭デリバティブ取引に類する複雑な仕組債に係る外務員の職務を行うことはできない。",e:"二種外務員は、店頭デリバティブ取引に類する複雑な仕組債、店頭デリバティブ取引に類する複雑な投資信託及びレバレッジ投資信託に係る外務員の職務については、いずれも行えない"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:39,d:"B",x:1,a:1,q:"二種外務員は、所属会員の一種外務員又は信用取引外務員の同行がある場合は、信用取引に係る外務員の職務を行うことができる。",e:"信用取引は「一種外務員または信用取引外務員の同行」があれば二種外務員でも可。問40の有価証券関連デリバティブ取引（同行があっても不可）との違いが最頻出。"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:40,d:"B",a:0,q:"二種外務員は、所属会員の一種外務員の同行がある場合に限り、有価証券関連デリバティブ取引等に係る外務員の職務を行うことができることとされている。",e:"二種外務員は、所属会員の一種外務員が同行した場合でも、有価証券関連デリバティブ取引に係る注文を受託することはできません（問39の信用取引と対のひっかけ）"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:41,d:"C",a:0,q:"外務員の種類ごとに定める一定の資格を有していれば、外務員の登録をしていなくても外務員の職務を行うことができる。",e:"外務員の種類ごとに定める一定の資格を有していても、外務員の登録をしていなければ外務員の職務を行うことはできない（資格と登録は別）"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:42,d:"C",a:0,q:"一度、外務員として登録された者は、その登録が取り消されることはない。",e:"協会は、登録を受けている外務員が欠格事由に該当したとき、金融商品取引業のうち外務員の職務又はこれに付随する業務に関し法令に違反したとき、その他外務員の職務に関して著しく不適当な行為をしたと認められるときは、その登録を取り消し、又は2年以内の期間を定めて外務員の職務の停止の処分を行うことができる（レジュメP121「覚・必ず」）"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:43,d:"B",x:1,a:1,q:"協会員は、外務員の登録を受けている者については、原則として5年目ごとに、協会の資格更新研修を受講させなければならない。",e:"レジュメP121。外務員登録を受けている者＝5年ごと、外務員登録を受けていない者＝登録後180日（ただし登録前2年以内に試験合格していれば研修免除）。問44・45の未受講時の効果と併せて押さえる。"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:44,d:"B",x:1,a:1,q:"受講義務期間内に外務員資格更新研修を受講することができなかった場合には、外務員資格更新研修を修了するまでの間、すべての外務員資格の効力が停止し外務員の職務を行うことができなくなる。",e:"未受講の場合はまず「効力停止」。受講義務期間の最終日の翌日から180日以内に研修を修了しないと資格そのものが取り消される（問45、レジュメP121）。"},
{c:5,s:"協会員の外務員の資格・登録等に関する規則",n:45,d:"B",x:1,a:1,q:"受講義務期間の最終日の翌日から180日までの間に外務員資格更新研修を修了しなかった場合には、すべての外務員資格が取り消され、外務員の職務を行うことができなくなる。",e:"効力停止（問44）→180日以内に修了しなければ資格取消し、という2段階を数字とセットで覚える。"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:46,d:"B",a:0,q:"協会員が顧客から有価証券の寄託を受けることができるのは、顧客から有価証券の保管の委託を受け、その有価証券を顧客ごとに個別に保管する「単純な寄託契約」による場合に限定されている。",e:"協会員が顧客から有価証券の寄託を受けることができるのは、単純な寄託契約による場合の他に、委任契約による場合、混合寄託契約による場合、協会員が質権者である場合、消費寄託契約による場合がある"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:47,d:"C",x:1,a:1,q:"協会員は、顧客から単純な寄託契約等により有価証券の寄託を受ける場合には、当該顧客と保護預り約款に基づく有価証券の寄託に関する契約を締結しなければならない。",e:"保護預り約款に基づく契約（保護預り契約）の締結義務。"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:48,d:"C",x:1,a:1,q:"協会員は、顧客の保護預り口座を設定したときは、その旨を当該顧客に通知しなければならない。",e:"協会員は保護預り契約を締結するときは、顧客から保護預り口座設定申込書を受け入れ、保護預り口座を設定した場合は顧客にその旨を通知しなければならない。"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:49,d:"B",x:1,a:1,q:"会員及び特別会員は、抽選償還が行われることのある債券について顧客から混合寄託契約により寄託を受ける場合には、事前に、その取扱方法（被償還者の選定方法等。）を定めた社内規程について当該顧客の了承を得るものとされている。",e:"抽選償還とは、抽選で償還する債券を決定して償還すること。混合保管だと誰の債券が当選したかを決める必要があるため、事前に選定方法の了承を得る（レジュメP122・123。累積投資契約・常任代理人契約に基づく有価証券・国内CPは保護預り契約の適用除外、問51参照）。"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:50,d:"C",x:1,a:1,q:"会員及び特別会員は、顧客から単純な寄託契約又は混合寄託契約により寄託を受けた有価証券は、すべてその口座により出納保管しなければならない。",e:"保護預り口座による出納保管の原則。"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:51,d:"B",a:0,q:"会員が、顧客から累積投資契約に基づく有価証券の寄託を受けるには、当該顧客と保護預り契約を締結しなければならない。",e:"累積投資契約に基づく有価証券の寄託については、保護預り契約を締結する必要はない（レジュメP122・123「保護預り契約の適用除外」：累積投資契約、常任代理人契約に基づく有価証券、国内CPの3つ）"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:52,d:"C",a:0,q:"保護預り証券は、原則として会員が保管する。",e:"金融商品取引所又は決済会社の振替決済に係る証券については、決済会社で混合保管するものとされている"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:53,d:"B",a:0,q:"協会員は、顧客が要求する都度又は顧客の債権債務の残高の変動や有価証券等の残高の変動がある都度、照合通知書により当該顧客に報告しなければならない。",e:"照合通知書による顧客への報告は、顧客が要求する都度又は残高の変動がある都度行うのではなく、顧客の取引区分にしたがって、それぞれに定める頻度で行う（レジュメP123：①有価証券の売買等がある顧客＝1年に1回以上、②有価証券関連デリバティブ取引等がある顧客＝1年に2回以上、③残高があるのに1年以上取引・受渡しがない顧客＝随時。取引残高報告書を交付している場合は照合通知書は免除）"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:54,d:"B",x:1,a:1,q:"照合通知書に記載すべき事項として、寄託を受けている有価証券の残高及び預り金の残高がある。",e:"照合通知書の記載事項の1つ（残高照合による顧客保護）。"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:55,d:"C",x:1,a:1,q:"会員は、照合通知書による報告を行う時点で金銭及び有価証券等の残高がない顧客で、直前に行った報告以後1年に満たない期間においてその残高があったものについては、照合通知書により当該顧客に現在その残高がない旨の報告をしなければならない。",e:"残高ゼロになった顧客にも一定期間は「現在残高なし」の報告を継続する必要がある。"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:56,d:"C",a:0,q:"照合通知書の作成は、広報部門又は営業部門が行う。",e:"照合通知書の作成は、会員の検査、監査又は管理の担当部門で行う必要がある（広報部門・営業部門ではない）"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:57,d:"B",a:0,q:"照合通知書は、会員の検査、監査又は管理の担当部門で作成することとされており、顧客には、原則として店頭で直接交付することとされている。",e:"照合通知書を交付するときには、顧客との連絡を確保する趣旨から、住所、事務所の所在地又は顧客の指定した場所に、原則として郵送しなければならない（店頭での直接交付が原則ではない）"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:58,d:"C",a:0,q:"照合通知書を顧客に店頭で直接交付する場合でも、後日当該顧客の住所、事務所の所在地又は当該顧客が指定した場所に郵送しなければならない。",e:"店頭で直接交付すれば、改めて郵送する必要はない"},
{c:5,s:"有価証券の寄託の受入れ等に関する規則",n:59,d:"C",a:0,q:"会員は、契約締結時交付書面を交付するときは、顧客との直接連絡を確保する趣旨から、原則として当該顧客に直接手渡すこととされている。",e:"契約締結時交付書面を交付するときも、遅滞なく、顧客の住所、事務所の所在地又は顧客の指定した場所に、原則として郵送しなければならない（照合通知書と同じ考え方。問57参照）"},
{c:5,s:"広告等の表示及び景品類の提供に関する規則",n:60,d:"C",x:1,a:1,q:"協会員は、景品類の提供を行うときは、取引の信義則を遵守し、品位の保持を図るとともに、その適正な提供に努めなければならない。",e:"景品類提供の基本原則。"},
{c:5,s:"広告等の表示及び景品類の提供に関する規則",n:61,d:"B",a:0,q:"協会員は、広告等の表示又は景品類の提供を行うときは、広告等の表示又は景品類の提供の審査を行う内部管理責任者を任命し、禁止行為に違反する事実がないかどうかを内部管理責任者に審査させなければならない。",e:"「内部管理責任者」ではなく「広告審査担当者」を任命し、審査させなければならない"},
{c:5,s:"広告等の表示及び景品類の提供に関する規則",n:62,d:"C",a:0,q:"従業員限りであっても複数の者で確認を行えば、広告等の表示を行うことができる。",e:"協会員は、複数の者で確認を行ったとしても、広告審査担当者の審査を受けずに、従業員限りで広告等の表示又は景品類の提供を行うことは禁止されている"},
{c:5,s:"広告等の表示及び景品類の提供に関する規則",n:63,d:"C",x:1,a:1,q:"協会員は、広告等の表示及び景品類の提供の適正化を図るために、広告等の表示及び景品類の提供に係る審査体制、審査基準及び保管体制に関する社内規則を制定し、これを役職員に周知し、その遵守を徹底させなければならない。",e:"広告・景品規制に関する社内体制整備義務。"},
{c:5,s:"店頭有価証券に関する規則",n:64,d:"B",x:1,a:1,q:"店頭有価証券とは、我が国の法人が国内において発行する取引所金融商品市場に上場されていない株券、新株予約権証券及び新株予約権付社債券をいう。",e:"店頭有価証券の定義。未上場の株券・新株予約権証券・新株予約権付社債券が対象。"},
{c:5,s:"店頭有価証券に関する規則",n:65,d:"B",x:1,a:1,q:"店頭取扱有価証券とは、店頭有価証券のうち、継続開示会社又は一定レベル以上の開示ができる銘柄をいう。",e:"「継続開示会社又は一定レベル以上の開示」とは、①金融商品取引法に基づき有価証券報告書を内閣総理大臣に提出していること、②会員などが投資勧誘を行う際の説明に用いる会社内容説明書を作成していること、のどちらかを満たしている場合をいう。"},
{c:5,s:"店頭有価証券に関する規則",n:66,d:"B",x:1,a:1,q:"協会員は、店頭有価証券については、原則として顧客に対し投資勧誘を行ってはならない。",e:"店頭有価証券は開示情報に乏しいため、原則として投資勧誘が禁止される。店頭取扱有価証券（問65・67）はこの規制の対象から除かれている。"},
{c:5,s:"店頭有価証券に関する規則",n:67,d:"A",x:1,a:1,q:"協会員は、顧客から店頭取扱有価証券の取引の注文を受ける際は、その都度、当該有価証券が店頭取扱有価証券であることを明示し、募集等の取扱い等を行う場合には、有価証券届出書、目論見書又は会社内容説明書を取扱部店に備え置き、顧客の縦覧に供しなければならない。",e:"店頭取扱有価証券は勧誘禁止の対象外だが、取扱いのたびに明示義務や開示書類の縦覧義務が課される。"},
{c:5,s:"上場株券等の取引所金融商品市場外での売買等に関する規則",n:68,d:"B",x:1,a:1,q:"協会は、公益又は投資者保護のために必要かつ適当であると認めるときは、会員が行う取引所外売買及び協会員が媒介等を行う取引所外売買を停止することができる。",e:"協会による取引所外売買の停止権限。"},
{c:5,s:"上場株券等の取引所金融商品市場外での売買等に関する規則",n:69,d:"B",x:1,a:1,q:"会員は、同時に多数の者に対し、取引所金融商品市場外での上場株券等の売付け又は買付けの申込みを行ったときは、銘柄名、買いに係る申込みにあっては当該銘柄中最も高い価格を、売りに係る申込みにあっては当該銘柄中最も低い価格を、数量等と併せて協会に報告しなければならない。",e:"取引所外での多数向け売買申込みに関する協会への報告義務（価格は買い＝最高値、売り＝最安値を報告）。"},
{c:5,s:"上場株券等の取引所金融商品市場外での売買等に関する規則",n:70,d:"B",x:1,a:1,q:"会員は、取引所外売買が成立したときは、銘柄名、売買価格、売買数量等を日本証券業協会に報告しなければならない。",e:"取引所外売買成立後の協会への報告義務（問69の申込段階の報告と対で押さえる）。"},
{c:5,s:"外国証券の取引に関する規則",n:71,d:"B",a:0,q:"「外国証券の取引に関する規則」では、日本国内の取引所金融商品市場に上場されている外国証券に関する規則を定めている。",e:"「外国証券の取引に関する規則」は外国証券の取引のうち、国内店頭取引及び外国取引について定めたもの。国内の取引所金融商品市場における取引（国内委託取引）は取引所の諸規則によって規制されるため、この規則の対象から除かれている"},
{c:5,s:"外国証券の取引に関する規則",n:72,d:"B",x:1,a:1,q:"協会員は顧客と外国証券の取引に関する契約を締結しようとするときは、外国証券取引口座に関する約款を当該顧客に交付する必要があるが、すでに約款を交付している場合で、その顧客から改めて約款の交付を求める旨の申し出がないときは、約款を交付する必要はない。",e:"外国証券取引口座約款の交付は初回のみが原則で、再交付の申し出がなければ改めての交付は不要。"},
{c:5,s:"外国証券の取引に関する規則",n:73,d:"B",x:1,a:1,q:"「外国証券取引口座に関する約款」には、顧客の注文に基づく外国証券の売買等の執行、売買代金の決済、証券の保管、配当・新株予約権その他の権利の処理等について規定されている。",e:"外国証券取引口座約款の主な規定事項（売買執行・決済・保管・権利処理）。"},
{c:5,s:"外国証券の取引に関する規則",n:74,d:"B",x:1,a:1,q:"協会員は、顧客との外国証券の取引について、公開買付けに対する売付けを取り次ぐ場合を除き、外国証券取引口座に関する約款の条項に従って行わなければならない。",e:"公開買付けへの売付け取次ぎは、外国証券取引口座約款の条項によらない例外的な取扱い。"},
{c:5,s:"外国証券の取引に関する規則",n:75,d:"B",x:1,a:1,q:"協会員は、顧客から保管の委託を受けた外国証券について、発行者から交付された通知書及び資料等を保管し、顧客の閲覧に供するとともに、顧客より請求を受けた場合には、当該通知書及び資料等を交付しなければならない。",e:"外国証券の保管に伴う通知書・資料の保管・閲覧・交付義務。"},
{c:5,s:"外国証券の取引に関する規則",n:76,d:"B",x:1,a:1,q:"協会員は、外国国債等及び我が国が加盟している国際機関が発行する債券を顧客に対して勧誘することができる。",e:"外国国債等・国際機関債は信用力が高いとされ、外国証券の勧誘規制の中でも例外的に勧誘が認められている。"},
{c:5,s:"外国証券の取引に関する規則",n:77,d:"B",a:0,q:"協会員が顧客との間で外国株券等の国内店頭取引を行うにあたっては、本国の外国有価証券市場における当該外国株券の前日の終値により取引を行わなければならない。",e:"協会員が顧客との間で外国株券等（外国株券、外国新株予約権証券、外国債券）の国内店頭取引を行うにあたっては、「社内時価（合理的な方法で算出された時価）」を基準とした適正な価格により取引を行わなければならない（「前日の終値」ではない）"},
{c:5,s:"外国証券の取引に関する規則",n:78,d:"C",a:0,q:"協会員は、あらゆる外国投資信託証券を顧客（適格機関投資家を除く。）に販売することができる。",e:"協会員が顧客（適格機関投資家を除く）に勧誘することにより販売等ができる外国投資信託証券は、外国投資信託証券に係る制度及び開示について法令等が整備されていること等の要件を満たす国又は地域で設立され、募集の取扱い又は売出しに該当する場合は、外国投資信託受益証券又は外国投資証券ごとに定められた選別基準に適合しており、投資者保護上問題がないと協会員が確認した外国投資信託証券であることとされている（「あらゆる」外国投資信託証券ではない）"},
{c:5,s:"外国証券の取引に関する規則",n:79,d:"B",x:1,a:1,q:"協会員は、外国投資信託証券が選別基準に適合しなくなった場合でも、顧客から買戻しの取次ぎや解約の取次ぎの注文があったときはこれに応じなければならない。",e:"選別基準に適合しなくなっても、既存の顧客保有分の買戻し・解約の取次ぎ自体は拒否できない。"},
{c:5,s:"外国証券の取引に関する規則",n:80,d:"B",x:1,a:1,q:"協会員は、外国投資信託証券を販売した顧客に対しては、原則としてその外国投資信託証券に関する決算報告書その他の書類を送付しなければならない。",e:"外国投資信託証券販売後の決算報告書等の送付義務。"},
{c:5,s:"その他の規則",n:81,d:"B",x:1,a:1,q:"協会員は、法人関係情報の管理に関し、その情報を利用した不公正取引が行われないよう、法人関係情報を取得した際の手続に関する事項等について規定した社内規則を定めなければならない。",e:"法人関係情報（インサイダー情報）の管理に関する社内規則整備義務。"},
{c:5,s:"その他の規則",n:82,d:"B",a:0,q:"法人関係情報を取得した役職員は、当該情報を営業部門に報告し、情報を共有しなくてはならない。",e:"協会員は、法人関係情報を取得した役職員に対し、当該取得した法人関係情報を直ちに管理部門に報告するなど、法人関係情報を取得した際の管理のために必要な手続きを定めなければならない（「営業部門」ではない）"},
{c:5,s:"その他の規則",n:83,d:"C",x:1,a:1,q:"会員は、相手方が反社会的勢力であることを知りながら、当該相手方への資金の提供その他の便宜の供与を行ってはならない。",e:"反社会的勢力への資金提供等の便宜供与の禁止。"},
{c:5,s:"その他の規則",n:84,d:"B",x:1,a:1,q:"会員は、初めて有価証券の売買その他の取引等に係る顧客の口座を開設しようとする場合は、あらかじめ、当該顧客から反社会的勢力でない旨の確約を受けなければならない。",e:"新規口座開設時の反社会的勢力排除に関する確約書徴求義務。"},
{c:5,s:"その他の規則",n:85,d:"B",x:1,a:1,q:"協会員は、特定投資家以外の顧客に対して行う上場CFD取引の勧誘に関して、勧誘受諾意思の確認義務と再勧誘の禁止が適用される。",e:"上場CFD取引（差金決済取引）についても、店頭デリバティブ取引等と同様に勧誘受諾意思の確認義務・再勧誘の禁止が適用される。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:86,d:"B",o:["取引の種類", "本籍地", "家族構成", "資産の状況", "不動産投資経験の有無"],a:[1, 4],q:"次のうち、「顧客カード」に記載すべき事項に該当するものの番号を2つ選びなさい。",e:"「顧客カード」の記載事項は、氏名または名称、住所または所在地及び連絡先、生年月日、職業、投資目的、資産の状況、投資経験の有無、取引の種類、その他各協会員において必要と認める事項。2の本籍地、3の家族構成、5の（不動産に限定した）投資経験の有無は記載事項に含まれない（5は「投資経験の有無」全般であれば含まれるが、「不動産投資経験」に限定している点で誤り）。"},
{c:5,s:"協会員の投資勧誘・顧客管理等に関する規則",n:87,d:"B",o:["家族構成及び続柄", "住所又は所在地及び連絡先", "本籍地", "氏名又は名称", "会社名、役職名及び所属部署"],a:[1, 3],q:"次のうち、「内部者登録カード」に記載すべき事項として誤っているものの番号を2つ選びなさい。",e:"「内部者登録カード」の記載事項は、氏名または名称、住所または所在地及び連絡先、生年月日、会社名・役職名及び所属部署、上場会社等の役員等に該当することとなる上場会社等の名称及び銘柄コード。1の家族構成及び続柄、3の本籍地は記載事項に含まれない。"},
{c:5,s:"広告等の表示及び景品類の提供に関する規則",n:88,d:"B",o:["正しいのはイのみである。", "正しいのはロのみである。", "正しいのはハのみである。", "正しいのはイ、ロである。", "正しいのはイ、ロ、ハである。"],a:[5],q:"次のうち、「広告等の表示及び景品類の提供に関する規則」において規定される協会員が行ってはならない広告等の表示に該当するものはどれか。イロハの中から正しく選んでいるものの番号を1つ選びなさい。 イ 協会員としての品位を損なうもの ロ 判断、評価等が入る場合において、その根拠を明示しないもの ハ 協会員間の公正な競争を妨げるもの",e:"イ・ロ・ハのいずれも、協会員が行ってはならない広告等の表示に該当する。禁止行為の全体像（品位を損なうもの、根拠を示さない判断・評価、公正な競争を妨げるもの等）をセットで押さえておくこと。"},
{c:6,s:"総論",n:1,d:"B",x:1,a:1,q:"金融商品取引法上の有価証券には、資産流動化法に規定する特定社債券や海外CDも含まれる。",e:"レジュメP137「第一項有価証券」の一覧に、国債・地方債・社債券・株券等に加え、特定社債券、海外CDが列挙されている。"},
{c:6,s:"総論",n:2,d:"B",x:1,a:1,q:"金融商品取引法上の有価証券には、貸付信託の受益証券やカバード・ワラントも含まれる。",e:"同じくレジュメP137の第一項有価証券の一覧に、貸付信託の受益証券、カバード・ワラントが含まれる。"},
{c:6,s:"総論",n:3,d:"B",a:0,q:"金融商品取引法上の有価証券には、株券や債券のほか、支払手形や小切手も含まれる。",e:"金融商品取引法上の有価証券には、支払手形や小切手は含まれない（レジュメP137「覚・必ず」：小切手・約束手形・国内CDは有価証券ではない）"},
{c:6,s:"総論",n:4,d:"C",a:0,q:"有価証券の券面に表示されるべき権利は、証券が発行されていないものは、金融商品取引法上の有価証券とはみなされない。",e:"有価証券の券面に表示されるべき権利は、証券が発行されていなくても、金融商品取引法上の有価証券とみなされる（みなし有価証券。レジュメP137「第二項有価証券」）"},
{c:6,s:"総論",n:5,d:"B",a:0,q:"金融商品取引法は、金融商品取引業を行う者に関し必要な事項を定めること等により、金融商品取引業者の最大の利益に資することを目的とする。",e:"金融商品取引法の目的は、国民経済の健全な発展及び投資者の保護に資することにある（「金融商品取引業者の最大の利益」ではない）"},
{c:6,s:"金融商品取引業者",n:6,d:"B",x:1,a:1,q:"有価証券等清算取次ぎとは、対象取引に基づく債務を金融商品取引清算機関又は外国金融商品取引清算機関に負担させることを条件に、顧客の委託を受けて、当該顧客を代理して取引を成立させる等の業をいう。",e:"レジュメP139。証券会社が顧客に代わって、清算機関（株式会社日本証券クリアリング機構等）に取引の決済（売買量の精算）をさせる仕組み。"},
{c:6,s:"金融商品取引業者",n:7,d:"B",a:0,q:"有価証券の引受けとは、有価証券の募集若しくは売出し又は私募若しくは特定投資家向け売付け勧誘等に際し、その有価証券を取得させることを目的として、その有価証券の全部又は一部を取得（買取引受け）する契約を結ぶことであり、売れ残りがあった場合にそれを取得する残額引受けは契約の中に含まれない。",e:"売れ残りがあった場合にそれを取得する残額引受けも契約の中に含まれる"},
{c:6,s:"金融商品取引業者",n:8,d:"B",a:0,q:"金融商品取引業者が有価証券の元引受けを行う場合には、第一種金融商品取引業を行う者として内閣総理大臣の認可を受けなければならない。",e:"元引受けを行うには、第一種金融商品取引業を行う者として内閣総理大臣の登録を受ける（「認可」ではない）"},
{c:6,s:"金融商品取引業者",n:9,d:"B",a:0,q:"有価証券の売出しとは、新たに発行される有価証券の取得の申込みの勧誘のうち、第一項有価証券については勧誘対象者が50名以上である場合、第二項有価証券については500名以上の者が所有することとなる取得勧誘のことをいう。",e:"有価証券の売出しとは、すでに発行された有価証券の場合をいう。新たに発行される有価証券の取得の申込み勧誘は、有価証券の募集という（レジュメP140「募集＝新規募集（発行）／売出し＝既に発行されてる証券」。問題文の50名・500名の基準自体は募集・売出しどちらにも共通する数字）"},
{c:6,s:"金融商品取引業者",n:10,d:"A",x:1,a:1,q:"有価証券の募集又は売出しの取扱いにおいて、勧誘対象者が50名未満であるものや適格機関投資家のみであっても、転売制限を満たしていない場合は、これらの勧誘は募集に該当する。",e:"少人数私募・適格機関投資家私募であっても、転売制限（譲渡制限）が満たされていなければ、募集として扱われる。"},
{c:6,s:"金融商品取引業者",n:11,d:"B",a:0,q:"金融商品取引業者が私設取引システム（PTS）運営業務を行う場合には、内閣総理大臣へ届出を行わなければならない。",e:"PTS運営業務を行う場合には、原則として内閣総理大臣の認可が必要である（「届出」ではない。レジュメP141「許認可制度：認可＞登録＞届出」の順で規制が厳しい。4章・13章のPTSひっかけと同系統）"},
{c:6,s:"金融商品取引業者",n:12,d:"C",x:1,a:1,q:"有価証券の引受けは、第一種金融商品取引業に含まれる。",e:"有価証券の元引受け等を行う業務は第一種金融商品取引業に含まれる。"},
{c:6,s:"金融商品取引業者",n:13,d:"C",a:0,q:"金融商品取引業は、内閣総理大臣から免許を受けた者でなければ、行うことができない。",e:"「免許」ではなく「登録」を受けた者でなければ行うことができない"},
{c:6,s:"金融商品取引業者",n:14,d:"B",a:0,q:"金融商品取引業を開業しようとする者は、誰でも登録申請を行い登録を受けることができる。",e:"金融商品取引業を開業しようとする者は、一定の要件を満たしていなければ登録を受けることはできない"},
{c:6,s:"金融商品取引業者",n:15,d:"B",a:0,q:"金融商品取引業を営むことができるのは、一定の要件を満たした法人に限られる。",e:"第二種金融商品取引業及び投資助言・代理業については、個人が行うこともできる（第一種金融商品取引業・投資運用業は法人に限られる）"},
{c:6,s:"金融商品取引業者",n:16,d:"C",a:0,q:"金融商品取引業者は、営業所外で外務行為を行う者については、外務員登録を行わなければならないが、営業所内で外務行為を行う者については、外務員の登録を要しない。",e:"営業所内で外務行為を行う者についても、外務員登録が必要である"},
{c:6,s:"金融商品取引業者",n:17,d:"C",a:0,q:"金融商品取引業者は、投資者保護上問題がないと認められる場合には、登録を受けた外務員以外の者にも外務員の職務を行わせることができる。",e:"金融商品取引業者は、いかなる場合であろうと登録外務員以外の者に外務員の職務を行わせてはならない"},
{c:6,s:"金融商品取引業者",n:18,d:"C",x:1,a:1,q:"金融商品取引業者は、その役員又は使用人のうち、その金融商品取引業者のために有価証券の売買やその勧誘などを行う者については、すべて外務員として日本証券業協会に備える外務員登録原簿に登録をしなければならない。",e:"外務員登録原簿への登録義務。"},
{c:6,s:"金融商品取引業者",n:19,d:"B",x:1,a:1,q:"内閣総理大臣は、外務員が欠格事由のいずれかに該当することとなった場合、登録の取消し又は2年以内の職務停止を命じることができる。",e:"外務員登録の取消し・職務停止処分（欠格事由該当時）。"},
{c:6,s:"金融商品取引業者",n:20,d:"C",a:0,q:"一度登録を受けた外務員は、いかなる場合も登録を取り消されることはない。",e:"欠格事由に該当することとなった場合等には、登録を取り消されることがある（問19参照）"},
{c:6,s:"金融商品取引業者",n:21,d:"C",x:1,a:1,q:"金融商品取引業者等は、登録を受けている外務員が退職その他の理由により外務員の職務を行わないこととなったときは、遅滞なくその旨を内閣総理大臣（金融庁長官）に届け出なければならない。",e:"外務員の職務終了時の届出義務。"},
{c:6,s:"金融商品取引業者",n:22,d:"B",a:0,q:"外務員は、その所属する金融商品取引業者等に代わって、有価証券の売買等法律に規定する行為に関し、一切の裁判上及び裁判外の行為を行う権限を有するものとみなされる。",e:"外務員がみなされる権限は裁判外の行為に限られ、裁判上の行為を行う権限は有しない（レジュメP144「覚・必ず」：裁判行為は弁護士業務にあたるため外務員の代理権には含まれない）"},
