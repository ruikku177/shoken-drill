<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="証券外務員問題集">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>証券外務員問題集</title>
</head>
<body>
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --card2:#E7EBEF; --sunk:#DDE2E7;
  --tx:#141A1F; --tx2:#5C6873; --tx3:#8B97A3;
  --acc:#0F9B7A; --accS:#E2F3EE; --accOn:#FFFFFF;
  --bad:#D4482F; --badS:#FAEAE6; --badOn:#FFFFFF;
  --r:20px; --r2:16px; --r3:14px;
  --sh:0 1px 2px rgba(16,24,32,.05), 0 6px 18px rgba(16,24,32,.06);
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181C; --card:#1D2329; --card2:#262D34; --sunk:#2E353D;
  --tx:#EBF0F4; --tx2:#96A2AE; --tx3:#74808C;
  --acc:#2FBF9A; --accS:#10302A; --accOn:#04211A;
  --bad:#EE7057; --badS:#36201B; --badOn:#210C07;
  --sh:0 1px 2px rgba(0,0,0,.32), 0 6px 18px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#14181C; --card:#1D2329; --card2:#262D34; --sunk:#2E353D;
  --tx:#EBF0F4; --tx2:#96A2AE; --tx3:#74808C;
  --acc:#2FBF9A; --accS:#10302A; --accOn:#04211A;
  --bad:#EE7057; --badS:#36201B; --badOn:#210C07;
  --sh:0 1px 2px rgba(0,0,0,.32), 0 6px 18px rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  --bg:#F2F4F6; --card:#FFFFFF; --card2:#E7EBEF; --sunk:#DDE2E7;
  --tx:#141A1F; --tx2:#5C6873; --tx3:#8B97A3;
  --acc:#0F9B7A; --accS:#E2F3EE; --accOn:#FFFFFF;
  --bad:#D4482F; --badS:#FAEAE6; --badOn:#FFFFFF;
  --sh:0 1px 2px rgba(16,24,32,.05), 0 6px 18px rgba(16,24,32,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--jp);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h1,h2{margin:0;font-weight:600;line-height:1.45;text-wrap:balance}
p{margin:0}

.stage{max-width:34rem;margin:0 auto;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;padding:0 1.1rem}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1rem;padding:1.1rem 0}
.dock{margin-top:auto;padding:1rem 0 1.6rem;display:flex;flex-direction:column;gap:.7rem}

.top{display:flex;align-items:center;justify-content:space-between;gap:.9rem;padding:1.3rem 0 .3rem}
.top h1{font-size:1.12rem;letter-spacing:.01em}
.stamp{font-size:.78rem;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
.quit{font-size:.8rem;color:var(--tx3);padding:.4rem 0}
.quit:hover{color:var(--bad)}

/* progress */
.track{height:9px;background:var(--card2);border-radius:99px;overflow:hidden;display:flex;margin-top:.9rem}
.track i{display:block;height:100%;border-radius:99px}
.track .g1{background:var(--acc)} .track .g2{background:var(--bad)}
.segs{display:flex;gap:3px;margin-top:.9rem}
.segs i{flex:1;height:5px;background:var(--card2);border-radius:99px;transition:background .2s}
.segs i.ok{background:var(--acc)}
.segs i.cl{background:var(--acc);opacity:.55}
.segs i.ng{background:var(--bad)}
.segs i.at{background:var(--tx3)}

/* pills */
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.95rem}
.tg{font-size:.73rem;padding:.36rem .72rem;border-radius:99px;background:var(--card);
  color:var(--tx2);line-height:1.35;white-space:nowrap}
.tg.hot{background:var(--badS);color:var(--bad);font-weight:700}
.tg.good{background:var(--accS);color:var(--acc);font-weight:700}
.tg.run{background:var(--accS);color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}

/* question */
.qcard{background:var(--card);border-radius:var(--r);padding:1.5rem 1.3rem;
  font-size:1.04rem;line-height:1.98;box-shadow:var(--sh)}

/* 五肢選択 */
.opts5{display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem}
.op{display:flex;align-items:flex-start;gap:.8rem;width:100%;text-align:left;
  background:var(--card);border-radius:var(--r2);padding:.95rem 1rem;box-shadow:var(--sh);
  font-size:.94rem;line-height:1.7;transition:transform .07s,background .13s}
.op:active{transform:scale(.99)}
.op .no{flex:none;width:1.65rem;height:1.65rem;border-radius:99px;background:var(--card2);
  color:var(--tx2);font-size:.82rem;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:.05rem;transition:background .13s,color .13s}
.op[aria-pressed="true"]{background:var(--accS)}
.op[aria-pressed="true"] .no{background:var(--acc);color:var(--accOn)}
.op.hit{background:var(--accS)} .op.hit .no{background:var(--acc);color:var(--accOn)}
.op.miss{background:var(--badS)} .op.miss .no{background:var(--bad);color:var(--badOn)}
.op.hit .mk,.op.miss .mk{flex:none;font-weight:700;font-size:1rem}
.op.hit .mk{color:var(--acc)} .op.miss .mk{color:var(--bad)}
.op:disabled{opacity:1}
.pickinfo{font-size:.78rem;color:var(--tx3);padding:0 .2rem;display:flex;
  justify-content:space-between;gap:1rem}
.pickinfo b{color:var(--acc);font-variant-numeric:tabular-nums}

/* answer */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.b{background:var(--card);color:var(--tx);border-radius:var(--r2);padding:1.15rem .5rem 1rem;
  display:flex;flex-direction:column;align-items:center;gap:.2rem;box-shadow:var(--sh);
  transition:transform .08s,background .15s}
.b .g{font-size:1.85rem;line-height:1}
.b .l{font-size:.74rem;color:var(--tx3)}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.45}

/* feedback */
.fb{border-radius:var(--r);padding:1.2rem 1.2rem;display:flex;flex-direction:column;gap:.65rem;
  animation:rise .24s cubic-bezier(.2,.7,.3,1)}
.fb.ok{background:var(--accS)} .fb.ng{background:var(--badS)}
.fb.win{background:var(--acc);box-shadow:var(--sh)}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.fb .head{display:flex;align-items:center;gap:.7rem}
.fb .glyph{font-size:2.15rem;line-height:1;flex:none;width:2.4rem;text-align:center;
  animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.fb.win .glyph{animation:burst .5s cubic-bezier(.2,1.4,.35,1)}
@keyframes pop{from{transform:scale(.45)}to{transform:none}}
@keyframes burst{0%{transform:scale(.3)}55%{transform:scale(1.3)}100%{transform:none}}
.fb .said{font-size:1.14rem;font-weight:700;line-height:1.35;display:block}
.fb .truth{font-size:.78rem;display:block;margin-top:.18rem}
.fb .exp{font-size:.89rem;line-height:1.9}
.sup{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;
  padding:.14rem .42rem;border-radius:99px;margin-right:.45rem;vertical-align:.08em;
  background:var(--card2);color:var(--tx2);white-space:nowrap}
.fb.win .sup{background:rgba(255,255,255,.28);color:var(--accOn)}
.fb.ok .glyph,.fb.ok .said{color:var(--acc)}
.fb.ok .truth{color:var(--tx2)} .fb.ok .exp{color:var(--tx)}
.fb.ng .glyph,.fb.ng .said{color:var(--bad)}
.fb.ng .truth{color:var(--tx2)} .fb.ng .exp{color:var(--tx)}
.fb.win .glyph,.fb.win .said{color:var(--accOn)}
.fb.win .said{font-size:1.32rem}
.fb.win .truth{color:var(--accOn);opacity:.8} .fb.win .exp{color:var(--accOn);opacity:.95}

/* buttons */
.cta{width:100%;border-radius:var(--r3);background:var(--acc);color:var(--accOn);
  padding:1.1rem;font-size:1rem;font-weight:700;transition:transform .08s,filter .15s}
.cta:hover{filter:brightness(1.06)} .cta:active{transform:scale(.99)}
.cta:disabled{background:var(--card2);color:var(--tx3);cursor:not-allowed;transform:none;filter:none}
.cta.plain{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.ghost{width:100%;border-radius:var(--r3);background:transparent;color:var(--tx2);
  padding:.95rem;font-size:.92rem;font-weight:600}
.ghost:hover{color:var(--tx);background:var(--card)}
.ghost:disabled{opacity:.4;cursor:not-allowed;background:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.tile{background:var(--card);border-radius:var(--r2);padding:1rem .6rem;text-align:center;box-shadow:var(--sh)}
.tile b{display:block;font-size:1.85rem;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.7rem;color:var(--tx3);margin-top:.35rem}
.tile.bad b{color:var(--bad)} .tile.good b{color:var(--acc)}

.note{font-size:.78rem;color:var(--tx3);display:flex;justify-content:space-between;
  gap:1rem;font-variant-numeric:tabular-nums;padding:0 .2rem}
.scope{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;
  padding:0 .2rem;font-size:.82rem;color:var(--tx2);line-height:1.5}
.scope b{font-size:.82rem;font-weight:700;color:var(--tx3);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* settings */
.setbar{background:var(--card);border-radius:var(--r2);padding:.95rem 1.1rem;display:flex;
  align-items:center;justify-content:space-between;gap:.8rem;box-shadow:var(--sh);width:100%;text-align:left}
.setbar .cur{font-size:.85rem;color:var(--tx);line-height:1.6}
.setbar .cur em{font-style:normal;color:var(--tx3);font-size:.74rem;display:block;margin-bottom:.15rem}
.setbar .arw{font-size:.8rem;color:var(--tx3);white-space:nowrap}
.panel{background:var(--card);border-radius:var(--r2);padding:1.1rem;display:flex;
  flex-direction:column;gap:1.05rem;box-shadow:var(--sh);animation:rise .2s ease-out}
.grp{display:flex;flex-direction:column;gap:.5rem}
.grp>span{font-size:.74rem;color:var(--tx3);display:flex;align-items:baseline;gap:.5rem}
.grp>span i{font-style:normal;font-size:.7rem;color:var(--tx3);opacity:.75}
.opts{display:flex;flex-wrap:wrap;gap:.4rem}
.opt{border-radius:99px;background:var(--card2);color:var(--tx2);padding:.5rem .85rem;
  font-size:.83rem;line-height:1.3;transition:background .13s,color .13s;
  display:inline-flex;align-items:baseline;gap:.4rem}
.opt i{font-style:normal;font-size:.72rem;opacity:.65;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--acc);color:var(--accOn);font-weight:700}
.opt[aria-pressed="true"] i{opacity:.8}
.opt:disabled{opacity:.35;cursor:not-allowed}

/* lists */
.list{display:flex;flex-direction:column;gap:.6rem}
.list h2{font-size:.83rem;color:var(--tx2);font-weight:600;padding:0 .2rem}
.list h2.win{color:var(--acc)}
.item{background:var(--card);border-radius:var(--r2);padding:1rem 1.1rem;
  display:flex;flex-direction:column;gap:.55rem;box-shadow:var(--sh)}
.rowtop{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.item .qt{font-size:.88rem;line-height:1.85}
.item .an{font-size:.84rem;line-height:1.85;color:var(--tx2);background:var(--badS);
  border-radius:12px;padding:.7rem .85rem}
.item .an b{color:var(--bad)}
.item.done .an{background:var(--accS)} .item.done .an b{color:var(--acc)}
.cnt{font-size:.72rem;font-weight:700;color:var(--bad);background:var(--badS);
  padding:.26rem .6rem;border-radius:99px;white-space:nowrap}
.done-badge{font-size:.72rem;font-weight:700;color:var(--acc);background:var(--accS);
  padding:.26rem .6rem;border-radius:99px;white-space:nowrap}
.empty{background:var(--card);border-radius:var(--r2);padding:1.5rem 1.2rem;
  font-size:.9rem;line-height:1.9;color:var(--tx2);box-shadow:var(--sh);text-align:center}

/* result */
.score{text-align:center;padding:1.2rem 0 .4rem}
.score b{display:block;font-size:3.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score b i{font-style:normal;font-size:1.5rem;color:var(--tx3)}
.score span{display:block;font-size:.86rem;color:var(--tx2);margin-top:.6rem}

/* リセット確認 */
.danger{background:var(--badS);border-radius:var(--r2);padding:1.15rem 1.15rem;
  display:flex;flex-direction:column;gap:.9rem;animation:rise .2s ease-out}
.danger p{font-size:.86rem;line-height:1.85;color:var(--tx)}
.danger .row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.danger .yes{background:var(--bad);color:var(--badOn);border-radius:12px;
  padding:.9rem;font-weight:700;font-size:.92rem;transition:transform .08s}
.danger .yes:active{transform:scale(.98)}
.danger .no{background:var(--card);color:var(--tx);border-radius:12px;
  padding:.9rem;font-weight:600;font-size:.92rem}

.tip em{font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.tip{font-size:.76rem;line-height:1.8;color:var(--tx3);display:flex;
  justify-content:space-between;gap:1rem;align-items:flex-start;padding:.2rem .2rem 0}
.linky{color:var(--tx3);font-size:.76rem;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.linky:hover{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage" id="app"></div>

<script>
/* ===== 問題データ ここから =====
   ../問題バンク/*.md から ../ビルド.py が生成します。ここを手で書き換えないこと。 */
const Q=[
{c:1,s:"会社",n:1,d:"B",x:1,a:1,q:"会社の形態として、会社法は株式会社、合名会社、合資会社、合同会社の4種類を規定している。",e:"会社法が定める会社は株式会社・合名会社・合資会社・合同会社の4種類。数を増減させたり、有限会社を混ぜたりして出される。"},
{c:1,s:"会社",n:2,d:"A",x:1,a:1,q:"株式会社において、社員は会社の債務について何の責任も負わないが、合名会社において、社員は会社に対して出資義務を負うだけでなく、会社の債務につき、債権者に対して直接・連帯・無限の責任を負う。",e:"ここでいう「社員」は従業員ではなく出資者のこと。株式会社の出資者は出資額までしか損をしない。合名会社の社員は債権者に対して直接・連帯・無限の責任を負う。"},
{c:1,s:"会社",n:3,d:"A",x:1,a:1,q:"合資会社には、無限責任社員が最低1名必要で、他に有限責任社員が1名以上いる。",e:"合資会社は無限責任社員と有限責任社員の両方が要る。無限責任社員だけなら合名会社、有限責任社員だけなら合同会社。"},
{c:1,s:"株式会社の特色と設立",n:4,d:"C",a:0,q:"株式会社を設立するには、資本金として1,000万円以上必要である。",e:"最低資本金制度は廃止されたので、資本金1円の株式会社の設立も可能"},
{c:1,s:"株式会社の特色と設立",n:5,d:"C",a:1,q:"定款に記載しておけば、土地・建物や特許権など、金銭以外の物を対価に株式を発行する現物出資が認められる。",e:"会社の成立時にそれらの財産を譲り受けることをあらかじめ約束しておく「財産引受け」も、定款への記載が必要"},
{c:1,s:"株式会社の特色と設立",n:6,d:"B",a:1,q:"株式の払込金額が1株10万円である場合には、払込金額の2分の1の5万円を資本金に組み入れれば足りる。",e:"資本金の額は「株式の払込金額 × 発行株式数」が原則だが、発行時に決めれば、払込金額の 2分の1以内 は資本金に入れなくてよい"},
{c:1,s:"株式会社の特色と設立",n:7,d:"A",a:0,q:"会社法で定める大会社は、資本金の額が5億円以上で、かつ負債総額が200億円以上の株式会社とされる。",e:"大会社とは、資本金の額が5億円以上 又は 負債総額が200億円以上。※試験では「又は」を「かつ」に変えて出題される場合があるので注意（問題集の注意書き）"},
{c:1,s:"株式会社の特色と設立",n:8,d:"B",x:1,a:1,q:"大会社でなくても公開会社であれば、必ず取締役会を置かなければならない。",e:"公開会社は必ず取締役会を置く。大会社かどうかは関係ない。"},
{c:1,s:"株式会社の特色と設立",n:9,d:"B",a:0,q:"株式会社設立に際し、事前に株主間相互の同意を得れば、定款の作成を省略することができる。",e:"株式会社の設立に際し、いかなる理由があっても定款の作成を省略することはできない。株主間相互の同意があっても不可"},
{c:1,s:"株式会社の特色と設立",n:10,d:"B",a:0,q:"株式会社を設立するには、2名以上の発起人が定款を作成し、署名をしなければならない。",e:"発起人は 1人でも可能。また、発起人は 法人でも可能"},
{c:1,s:"株式会社の特色と設立",n:11,d:"B",a:0,q:"定款に記載しなければならない事項に「会社の目的」は含まれない。",e:"定款には「会社の目的」「商号」「本店所在地」などを記載しなければならない（絶対的記載事項）"},
{c:1,s:"株式会社の特色と設立",n:12,d:"B",a:1,q:"株式会社の発起人は1人でもよいことから、株主数が1人だけの株式会社を設立することも可能である。",e:"株主が1人だけの会社を「一人会社（いちにんがいしゃ）」という"},
{c:1,s:"株式会社の特色と設立",n:13,d:"C",a:1,q:"発起設立とは、株式会社の設立において発行する株式の全部を発起人だけで引き受けて設立することをいう。",e:"なお、発起人が一部を引き受け、残りを株主募集によって引き受けてもらう会社設立は「募集設立」という"},
{c:1,s:"株式会社の特色と設立",n:14,d:"B",a:0,q:"株式会社の設立に際して選任される取締役は、当該設立が適正に行われたかどうかを調査する必要はない。",e:"設立に際して選任される取締役は、設立が適正に行われたかどうかを 調査する必要がある"},
{c:1,s:"株式会社の特色と設立",n:15,d:"B",a:0,q:"「会社の目的」については、定款変更の手続きを履行しても変更できない。",e:"「会社の目的」は、定款変更の手続きをして変更することができる"},
{c:1,s:"株式会社の特色と設立",n:16,d:"A",a:0,q:"株式会社の設立の無効は、当該株式会社の取締役がその設立登記の日から1年以内に裁判所へ訴えることによってしか主張できない。",e:"設立の無効は、株主と取締役が設立登記の日から 2年以内 に裁判所へ訴えることによってしか主張できない。「取締役だけ」「1年」の2か所が誤り"},
{c:1,s:"株式と株主の権利",n:17,d:"B",a:0,q:"株式を分割すると発行済株式が増え、1株当たりの実質的価値は大きくなる。",e:"株式を分割すると発行済株式が増え、1株当たりの実質的価値は 小さくなる"},
{c:1,s:"株式と株主の権利",n:18,d:"A",a:0,q:"株式の分割、株式の併合、株式無償割当て及び株式の消却にあたっては、取締役会設置会社では取締役会の決議で定める。",e:"取締役会設置会社では、株式の分割・無償割当て・消却は取締役会決議だが、株式の併合 は 株主総会の特別決議 で定める"},
{c:1,s:"株式と株主の権利",n:19,d:"B",x:1,a:1,q:"株式の消却とは、発行されている株式をなくしてしまうことであり、消却により発行済株式数は減少する。",e:"消却すると発行済株式数は減る。分割（問17）は増える。増減の向きを入れ替えて出される。"},
{c:1,s:"株式と株主の権利",n:20,d:"B",a:0,q:"株式の消却は、会社が所有する自己株式の消却のほかに、株主が持っている株式についても消却を行うことができる。",e:"株式の消却は、すべて会社がいったん株式を取得してから行う"},
{c:1,s:"株式と株主の権利",n:21,d:"B",a:0,q:"単元株は最大500株とされている。",e:"単元株のひとくくりの数は、1,000以下 かつ 発行済株式総数の200分の1以下"},
{c:1,s:"株式と株主の権利",n:22,d:"B",a:0,q:"定款に定めることにより、単元未満株主に株主総会の議決権を与えることができる。",e:"単元未満株主には株主総会の議決権を与えることはできない"},
{c:1,s:"株式と株主の権利",n:23,d:"B",a:1,q:"株式会社は一部の株式について異なる権利内容を有する旨を、定款をもって定めることができる。",e:"2種類以上の株式が併存する会社を「種類株式発行会社」という"},
{c:1,s:"株式と株主の権利",n:24,d:"B",a:0,q:"ある種類の株式にまず一定率の配当をし、残った剰余金から他の株式に配当するような場合、その前者のような株式を劣後株という。",e:"前者は（配当）優先株、後者が 後配株（劣後株）。前後が逆"},
{c:1,s:"株式と株主の権利",n:25,d:"B",a:1,q:"公開会社においては、議決権制限株式の発行数が発行済株式総数の2分の1を超えたときは、2分の1以下にするための措置をとらなければならない。",e:"「議決権が全くない」「株主総会決議事項の一部についてだけ議決権がある」など、完全な議決権のある株式以外はすべて 議決権制限株式"},
{c:1,s:"株式と株主の権利",n:26,d:"B",x:1,a:1,q:"株式会社は一部の株式について、譲渡に会社の承認が必要な株式を発行することができる。",e:"譲渡に会社の承認が必要な株式が譲渡制限株式。一部の株式についてだけ設定することもできる。"},
{c:1,s:"株式と株主の権利",n:27,d:"C",a:0,q:"共益権とは、その権利の行使が株主全体の利害に影響を及ぼすものをいい、具体的には剰余金や残余財産の分配を受ける権利が挙げられる。",e:"剰余金や残余財産の分配を受ける権利は 自益権。共益権の説明自体は正しいが、例が自益権になっている"},
{c:1,s:"株式と株主の権利",n:28,d:"C",a:0,q:"自益権とは、個々の株主の利益のみに関係する権利のことをいい、具体例の1つとして議決権が挙げられる。",e:"議決権は共益権の1つ。問27と対で、自益権と共益権の例が入れ替えて出される"},
{c:1,s:"株式と株主の権利",n:29,d:"B",a:0,q:"少数株主権とは、1株しか持たない株主でも行使できる権利のことをいう。",e:"少数株主権とは、一定割合以上の議決権（又は一定割合以上の株式数）を持った株主だけが行使できる権利"},
{c:1,s:"株式の譲渡",n:30,d:"C",a:0,q:"会社が自社の発行する株式を取得すると、出資の払戻しと同じ結果となるなど、株主間に不平等をもたらす可能性があることから、自己株式（金庫株）の取得はいかなる場合も禁止されている。",e:"一定の要件を満たせば、自己株式の取得は可能。「いかなる場合も」と言い切っている点が誤り"},
{c:1,s:"株式の譲渡",n:31,d:"B",x:1,a:1,q:"自己株式を会社が保有する際は会社が株主となるが、議決権や剰余金の配当を受ける権利はない。",e:"会社が自分の株を持っても、議決権も配当を受ける権利もない。自分で自分に議決権を行使できてしまうと不公平になるため。"},
{c:1,s:"株式の譲渡",n:32,d:"A",a:0,q:"新株発行の効力発生前のように、株式が発行されていない段階で株式引受人の地位（権利株）を譲渡した場合、当事者間でも、又会社との間でも、その効力はともに無効である。",e:"権利株の譲渡は、当事者間では有効だが 会社との間では無効。「ともに無効」が誤り"},
{c:1,s:"株式の譲渡",n:33,d:"B",a:0,q:"独占禁止法上、金融会社がある会社の株式の3％超を持つことは、原則として禁止されている。",e:"5％超 が正しい"},
{c:1,s:"株式の譲渡",n:34,d:"C",a:1,q:"子会社が親会社の株式を取得することは原則禁止されている。",e:"会社の合併や分割などで取得した場合でも、相当の時期に処分しなければならない"},
{c:1,s:"株券と株主名簿",n:35,d:"B",a:1,q:"会社法においては、株式会社が株券を発行することは、定款にそのことを定めれば可能である。",e:"会社法は 株券のない会社を原則 としているので、株券を発行しようとする会社（株券発行会社）は定款にそのことを定める必要がある"},
{c:1,s:"株券と株主名簿",n:36,d:"B",x:1,a:1,q:"株券には、会社の商号や株式数などを記載し、代表取締役が署名又は記名押印しなければならない。",e:"署名するのは代表取締役。ほかの役職に置き換えて出される。"},
{c:1,s:"株券と株主名簿",n:37,d:"B",x:1,a:1,q:"株式会社は、権利を行使できる株主を確定するため、一定の日（基準日）に株主名簿に載っている株主に権利行使させることができるが、基準日と権利行使日との間は3か月以内でなければならない。",e:"基準日から3か月以内。数字を1か月・6か月などに変えて出される。"},
{c:1,s:"株式会社の機関",n:38,d:"C",x:1,a:1,q:"株主総会には定時総会と臨時総会があり、このうち定時総会とは、毎決算期に1回その年度の会社の成果を確認するために開催されるものをいう。",e:"定時総会は毎決算期に1回、その年度の成果を確認するため。臨時総会は必要に応じて開催。"},
{c:1,s:"株式会社の機関",n:39,d:"C",x:1,a:1,q:"取締役会を置く会社の株主総会においては、その招集通知に議題として掲げられていない事項について決議することは認められていない。",e:"招集通知に議題として掲げていない事項の決議は違法。ただし 取締役会を置かない会社 では、株主総会で決議できる事項は無限定。"},
{c:1,s:"株式会社の機関",n:40,d:"B",x:1,a:1,q:"公開会社では議決権総数の3％以上の株式を引き続き6か月以上保有している株主は、取締役に株主総会の招集を請求することができる。",e:"議決権総数の3％以上を（公開会社では引き続き6か月以上）持つ少数株主は、招集を請求でき、拒否されれば裁判所の許可を得て自分で招集できる。"},
{c:1,s:"株式会社の機関",n:41,d:"B",x:1,a:1,q:"株主の提案権は、取締役会設置会社の場合、議決権総数の1％以上又は300個以上の議決権を（公開会社の場合は引き続き6か月以上）持っている株主に与えられる。",e:"提案権は 1％以上 又は 300個以上（単元株制度をとる会社では300単元）。招集請求の「3％以上」と数字を混ぜて出される。"},
{c:1,s:"株式会社の機関",n:42,d:"C",a:0,q:"株主総会では株主1人につき1個の議決権が与えられる。",e:"株主の 頭数 ではなく、投下した 資本の額に比例 して議決権が与えられる"},
{c:1,s:"株式会社の機関",n:43,d:"A",x:1,a:1,q:"A社がB社の議決権総数の4分の1以上を持つとき、B社がA社株を保有していてもそれには議決権がない。",e:"相互に株を持ち合うと議決権行使が歪むため、4分の1以上持たれている側の議決権は認められない。"},
{c:1,s:"株式会社の機関",n:44,d:"B",a:0,q:"株主総会には、株主本人が出席して議決権を行使する必要があることから、代理人による議決権の行使は認められていない。",e:"株主本人が出席する必要はなく、代理人に議決権を行使させてもよい"},
{c:1,s:"株式会社の機関",n:45,d:"B",a:0,q:"株主総会の特別決議においては、議決権総数の3分の2以上に当たる株式を持つ株主が出席し、出席株主の議決権の過半数の賛成を得ることが求められる。",e:"特別決議は 議決権総数の過半数 を持つ株主が出席し、出席株主の議決権の3分の2以上 の賛成。定足数と賛成要件の数字が入れ替わっている"},
{c:1,s:"株式会社の機関",n:46,d:"C",x:1,a:1,q:"株主総会の議事録は、本店に10年間（支店があるときは支店に写しを5年間。）備え置かれ、株主及び会社債権者の閲覧に供される。",e:"本店に10年、支店には写しを5年。数字を入れ替えて出される。"},
{c:1,s:"株式会社の機関",n:47,d:"B",a:1,q:"取締役会を置く会社には、取締役は3名以上必要であり、その選任は株主総会の決議事項である。",e:"取締役会を置く会社は取締役3名以上。取締役会を置かない会社では取締役は1人いれば足りる"},
{c:1,s:"株式会社の機関",n:48,d:"B",a:0,q:"公開会社の取締役の任期は、株主総会で承認を得れば、4年以内とすることができる。",e:"公開会社の取締役の任期は原則 2年以内。期間を短くすることはできるが、長くすることはできない"},
{c:1,s:"株式会社の機関",n:49,d:"B",x:1,a:1,q:"公開会社において不正行為をした取締役の解任が否決されたとき、引き続き6か月以上、議決権又は発行済株式の3％以上を持つ少数株主は、裁判所にその取締役の解任を請求することができる。",e:"解任が株主総会で否決されても、少数株主（6か月以上・3％以上）は裁判所に解任を請求できる。株主総会の招集請求と同じ「6か月・3％」の組み合わせ。"},
{c:1,s:"株式会社の機関",n:50,d:"B",a:0,q:"取締役に欠員が出た場合には、新取締役が就任するまでの間、退任取締役が職務を続けることも、その会社の監査役に取締役を兼任させることもできる。",e:"退任取締役が職務を続けるのは正しいが、監査役は取締役を兼任できない。監査する側とされる側が同じ人では意味がないため"},
{c:1,s:"株式会社の機関",n:51,d:"B",a:0,q:"取締役の報酬は、定款又は監査役会で定められる。",e:"取締役の報酬は 定款又は株主総会決議 で定める"},
{c:1,s:"株式会社の機関",n:52,d:"B",x:1,a:1,q:"過去10年内に子会社の従業員であった人は、社外取締役になることができない。",e:"社外取締役は「社外」であることが要件。過去10年内に子会社の従業員だった人は除かれる。"},
{c:1,s:"株式会社の機関",n:53,d:"B",a:0,q:"取締役が任務を怠って会社に損害を与えたときは、当該損害に対して賠償責任を負うものとされているが、原則として株主総会で議決権の過半数による同意を得た場合には、この責任を免除することができる。",e:"責任免除には、原則として 株主全員の同意 が必要。「過半数」では足りない"},
{c:1,s:"株式会社の機関",n:54,d:"A",a:0,q:"取締役がその株式会社と取引するときは、監査役会（設置しない会社では監査役。）の承認を受ける必要がある。",e:"取締役会（設置しない会社では株主総会）の承認を受ける必要がある。監査役ではない"},
{c:1,s:"株式会社の機関",n:55,d:"B",a:0,q:"取締役会の決議は頭数の多数によるが、代理人による投票も認められている。",e:"取締役会の決議は頭数の多数による（ここは正しい）が、代理人による投票は認められていない。株主総会（問44）は代理人可なので、対で覚える"},
{c:1,s:"株式会社の機関",n:56,d:"B",a:1,q:"取締役会の議事録は10年間本店に備え置くこととされている。",e:"そのとおり。"},
{c:1,s:"株式会社の機関",n:57,d:"B",a:0,q:"取締役会設置会社においては、代表取締役を選定する必要はない。",e:"取締役会設置会社には 代表取締役が1名以上必要"},
{c:1,s:"株式会社の機関",n:58,d:"A",a:0,q:"公開会社の監査役の任期は2年である。",e:"公開会社の監査役の任期は 4年（取締役の2年より長い）"},
{c:1,s:"株式会社の機関",n:59,d:"B",a:1,q:"大会社にはすべて会計監査人を置かなくてはならない。",e:"監査等委員会設置会社と指名委員会等設置会社にも会計監査人が必要"},
{c:1,s:"株式会社の機関",n:60,d:"B",a:0,q:"大会社においては、会計監査人の任期は監査役と同様に4年とされている。",e:"会計監査人の任期は 1年"},
{c:1,s:"株式会社の機関",n:61,d:"B",a:0,q:"大会社においては、会計監査人の選任・解任は取締役会の決議事項である。",e:"会計監査人の選任・解任は 株主総会の決議事項（普通決議）"},
{c:1,s:"株式会社の機関",n:62,d:"A",a:0,q:"大会社においては、会計監査人を任期満了後に再任する場合、その都度、定時株主総会の再任決議を行わなければならない。",e:"会計監査人の任期は1年だが、定時株主総会が特に 不再任を決議しない限り自動的に更新 される。毎回の再任決議は不要"},
{c:1,s:"株式会社の機関",n:63,d:"A",a:0,q:"指名委員会等設置会社には、監査役を置かなくてはならない。",e:"指名委員会等設置会社には監査委員会があるので、監査役を置くことはできない"},
{c:1,s:"株式会社の機関",n:64,d:"A",a:1,q:"指名委員会等設置会社における委員会のメンバーは、取締役会が選ぶ3名以上の取締役であり、過半数は社外取締役でなければならない。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:65,d:"C",a:1,q:"公開会社である大会社においては、貸借対照表や損益計算書については、会計監査人及び監査役会の監査を受けなければならない。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:66,d:"B",a:0,q:"大会社は定時株主総会終了後、貸借対照表及び損益計算書のほか、事業報告についても公告しなければならない。",e:"事業報告については公告の必要はない"},
{c:1,s:"会社の計算",n:67,d:"B",a:1,q:"定時株主総会が終わると、貸借対照表（大会社は損益計算書と両方。）を公告するが、ホームページなどを使う方法でもよく、官報や日刊新聞紙を使う会社は要旨を公告すれば足りる。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:68,d:"C",a:0,q:"法定準備金には、資本準備金と配当準備金の2種類がある。",e:"法定準備金は、資本準備金と利益準備金 からなる"},
{c:1,s:"会社の計算",n:69,d:"B",a:1,q:"株式会社は、利益準備金として、配当などを剰余金から支出するたびに、その10分の1以上を積み立てなければならないが、資本準備金との合計が資本金の4分の1に達した後は積み立てなくてもよいとされている。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:70,d:"B",a:1,q:"資本金と準備金の合計額に相当する資産を留保した上でなければ、剰余金の配当や自己株式の買受けはできない。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:71,d:"B",a:1,q:"剰余金の配当における分配可能額は、純資産額から資本金の額と法定準備金その他法令で定める額を差し引くことによって求められる。",e:"そのとおり。"},
{c:1,s:"会社の計算",n:72,d:"C",a:0,q:"分配可能額がないのに行われた配当は無効であり、監査役は株主に対してこれを返還するよう要求できる。",e:"分配可能額がないのに行われた配当（いわゆるたこ配当）は無効であり、会社債権者 が株主に対して返還を要求できる（監査役ではない）"},
{c:1,s:"会社の計算",n:73,d:"B",a:0,q:"剰余金の配当は、株主総会で承認されれば年に何回でも行うことができるが、必ず金銭で支給されなければならない。",e:"年に何度でも行えるのは正しいが、配当の方法は 金銭以外の財産の支給でも可能"},
{c:1,s:"会社の計算",n:74,d:"B",a:1,q:"中間配当は、定款に定めることにより、取締役会の決議をもって行うことができる。",e:"そのとおり。"},
{c:1,s:"新株発行・社債",n:75,d:"B",a:0,q:"会社設立時に発行する株式数は、原則として定款に定めた発行可能株式総数の10分の1以上でよいとされている。",e:"発行可能株式総数の 4分の1以上 でよいとされている"},
{c:1,s:"新株発行・社債",n:76,d:"B",a:0,q:"会社は、新株予約権者が新株予約権を行使した場合、必ずその者に新株を発行しなければならない。",e:"新株を発行しなくとも、手持ちの自己株式で対応することができる"},
{c:1,s:"新株発行・社債",n:77,d:"B",a:1,q:"新株予約権付社債は、新株予約権と社債のどちらかが消滅するまでは、両方を一体としてしか譲渡できない。",e:"そのとおり。"},
{c:1,s:"組織の再編",n:78,d:"A",a:0,q:"会社の合併の方法は吸収合併の1つしかない。",e:"合併には、当事会社の全部が解散して新会社を設立する 新設合併 と、当事会社の1つが存続して他を吸収する 吸収合併 の2つがある"},
{c:1,s:"組織の再編",n:79,d:"A",a:0,q:"会社が合併する場合、新設会社又は存続会社は解散する会社の資産を引き継ぐが、債務を引き継ぐ必要はない。",e:"解散する会社の資産や債務といった権利義務が、包括的に新設会社又は存続会社に移転する"},
{c:1,s:"組織の再編",n:80,d:"A",a:1,q:"会社が合併する場合、解散する会社の株主は、その保有する株式と交換に新設会社又は存続会社の株式あるいは金銭その他の財産を交付される。",e:"そのとおり。"},
{c:1,s:"組織の再編",n:81,d:"A",a:0,q:"会社の分割には、事業の1部門を切り離して別会社として独立させる吸収分割と、切り離した部門を既存の別会社にくっつける新設分割がある。",e:"吸収分割と新設分割の説明が逆。新設分割＝切り離して独立させる、吸収分割＝切り離した部門を既存の別会社にくっつける"},
{c:1,s:"組織の再編",n:82,d:"A",a:0,q:"会社の分割は、事業譲渡と同様に、分割の対象となる部門を構成する権利義務が個別に別会社に移転される。",e:"事業譲渡と異なり、権利義務は分割の対象となる部門ごと 一括して 承継される"},
{c:1,s:"組織の再編",n:83,d:"B",a:0,q:"株式会社が新設分割をするに際し、新設される会社が発行する株式を分割会社の株主に割り当てることは認められていない。",e:"分割会社（元の会社）の株主に割り当てることは 認められている"},
{c:1,s:"組織の再編",n:84,d:"B",a:0,q:"新設分割を実施する場合、原則として、株主総会の普通決議でそれを承認する必要がある。",e:"原則として株主総会の 特別決議 が必要"},
{c:1,s:"組織の再編",n:85,d:"B",a:0,q:"A社がB社の発行済株式全部を取得しようとするとき、両者の間で株式交換契約を結び、B社の株主が持つB社株をそっくりA社が発行する新株又は保有中の自己株式と交換した場合には、A社は完全子会社となり、B社は完全親会社となる。",e:"A社が完全親会社であり、B社が完全子会社となる（前後が逆）"},
{c:1,s:"組織の再編",n:86,d:"B",a:0,q:"事業譲渡により、事業全部を譲渡した場合、会社は当然に解散する。",e:"事業譲渡をしても、対価で別の事業をすることが可能であり、会社は 当然には解散しない"},
{c:1,s:"組織の再編",n:87,d:"A",a:0,q:"一度株式会社を設立すると、組織を変更して合名会社、合資会社又は合同会社とすることはできない。",e:"一定の手続きを行えば、株式会社から合名会社・合資会社・合同会社に 組織変更できる"},
{c:1,s:"組織の再編",n:88,d:"B",a:1,q:"組織変更することで、合資会社を株式会社にすることができる。",e:"そのとおり。"},
{c:1,s:"組織の再編",n:89,d:"B",a:1,q:"会社は、合併や破産、定款に定めた存続期間の満了などのほか、株主総会の特別決議によっても解散する。",e:"そのとおり。"},
{c:1,s:"組織の再編",n:90,d:"B",o:["取締役の選任", "代表取締役の選定", "社債の発行", "定款の変更", "会計監査人の選任"],a:[1, 5],q:"次のうち、取締役会設置会社における株主総会の普通決議による決議事項を2つ選びなさい。",e:"株主総会の普通決議事項は、①取締役・監査役・会計参与・会計監査人の選任、②取締役・会計参与・会計監査人の解任、③取締役の報酬、④計算書類の承認。代表取締役の選定・社債の発行は取締役会の決議事項、定款の変更は株主総会の特別決議事項。"},
{c:1,s:"組織の再編",n:91,d:"B",o:["取締役の解任", "代表取締役の選定", "社債の発行", "定款の変更", "株式会社の解散"],a:[4, 5],q:"次のうち、取締役会設置会社における株主総会の特別決議による決議事項を2つ選びなさい。",e:"株主総会の特別決議事項は、特定の株主からの自己株式の取得、株式併合、取締役会がない会社の新株発行、監査役の解任、取締役・監査役・会計参与・会計監査人・執行役の責任の軽減、資本金の額の減少、金銭以外の財産による配当、定款変更・事業譲渡・解散・清算、組織変更・合併・会社分割・株式交換・株式移転など。取締役の解任は普通決議、代表取締役の選定・社債の発行は取締役会決議。"},
{c:1,s:"組織の再編",n:92,d:"B",o:["会計監査人の選任", "代表取締役の選定", "取締役の解任", "募集株式の発行", "会計参与の選任"],a:[2, 4],q:"次のうち、取締役会設置会社における取締役会の決議事項を2つ選びなさい。",e:"取締役会の決議事項は、重要財産の処分・多額の借財・重要な人事・支店の変更・内部統制システムの整備、社債の発行、募集株式の発行、新株予約権の発行、株主総会の招集、代表取締役の選定・解職、株式の分割、準備金の資本組入れなど。会計監査人・会計参与の選任は株主総会の普通決議、取締役の解任も株主総会の普通決議。"},
{c:3,s:"取引の種類・売買の形態",n:1,d:"C",x:1,a:1,q:"我が国では、有価証券の現物の売買を行う場所として、東京証券取引所・名古屋証券取引所・福岡証券取引所・札幌証券取引所があり、それぞれの取引所において取引所金融商品市場が開設されている。",e:"レジュメP64。現物売買を行う取引所は東京・名古屋・福岡・札幌の4つ。上場株式は約3,800社（全株式会社約400万社のうち）。"},
{c:3,s:"取引の種類・売買の形態",n:2,d:"C",x:1,a:1,q:"株式の売買の取次ぎとは、顧客からの売買注文を、顧客の計算において金融商品取引業者の名をもって行う取引で、売買を委託されて執行することから委託取引といわれる。",e:"レジュメP66・67で「覚・必ず」指定。自己取引＝自己の計算（証券会社のお金）で売買。取次ぎ（委託取引）＝顧客の計算（顧客のお金）、金融商品取引業者の名前で売買。この2つの主体の違いが頻出。"},
{c:3,s:"売買の受託",n:3,d:"B",a:0,q:"有価証券の募集又は売出しの発表日からその申込最終日までを一般にファイナンス期間といい、その間の取引に際しては、受注・執行の管理に注意を払う必要がある。",e:"ファイナンス期間とは、有価証券の募集又は売出しの発表日の翌日から払込日までの期間"},
{c:3,s:"売買の受託",n:4,d:"B",a:0,q:"元引受けを行う金融商品取引業者は、安定操作期間中、当該銘柄の株券等に関し、株式ミニ投資を含めて自己の計算による買付けが禁止されている。",e:"例外として、株式累積投資及び株式ミニ投資に伴う買付けは認められている"},
{c:3,s:"売買の受託",n:5,d:"B",x:1,a:1,q:"安定操作取引又はその受託をした金融商品取引業者は、当該銘柄の株券等に関し、安定操作期間中、顧客に対して、安定操作取引が行われた旨を表示しないで買付けを受託すること、又は有価証券関連デリバティブ取引等を受託することは禁止されている。",e:"レジュメP69「覚・必ず」。安定操作期間中は原則、相場操縦行為として禁止だが、例外として安定操作取引そのものは認められる（相場くぎ付けを顧客に表示すればOK）。表示しない受託や、デリバティブ取引等の受託は禁止のまま。"},
{c:3,s:"売買の受託",n:6,d:"B",x:1,a:1,q:"金融商品取引業者は、顧客から有価証券売買の売付けの注文を受けるときには、当該売付けが空売りであるか否かの別を確認しなければならない。",e:"レジュメP69の空売り規制に関連。空売りかどうかで取引所への明示義務（問7）が変わるため、注文受託の時点でまず確認する必要がある。"},
{c:3,s:"売買の受託",n:7,d:"B",x:1,a:1,q:"金融商品取引業者は、自己の計算による売付け、顧客から受託する売付けが空売りに該当する場合、市場で行う空売りは取引所に明示しなければならない。",e:"レジュメP69「②空売り規制」。空売り＝手元に株がないのに売ること。禁止されているわけではないが、取引所金融商品市場で行う空売りは取引所への明示（報告）が必要。"},
{c:3,s:"売買の受託",n:8,d:"B",x:1,a:1,q:"取引所では、受託契約準則で、「売買の種類」「銘柄」「売付け・買付けの区別」「数量」「値段の限度」「委託注文の有効期間」「現物・信用取引の別」など、顧客が金融商品取引業者に有価証券の売買の委託の都度、指示すべき事項を定めている。",e:"レジュメP71「覚・必ず」。委託注文内容の確認事項がそのまま列挙されている。値段の限度は成行（値段を決めない）か指値（値段を決める）かの別を含む。"},
{c:3,s:"売買の受託",n:9,d:"B",x:1,a:1,q:"金融商品取引業者は、顧客から売指値注文を受託した場合には、指値を下回る値段で約定させてはならない。",e:"指値注文は顧客が値段を指定する注文（レジュメP71）。売り注文なら指定した値段を下回る（顧客に不利な）値段での約定は認められない。買い注文なら逆に指定額を上回る値段での約定が不可となる。"},
{c:3,s:"売買の受託",n:10,d:"B",a:0,q:"金融商品取引業者が注文伝票を作成するのは、顧客から株式の売買注文を受託し、当該注文に係る売買が成立した場合に限られる。",e:"顧客から株式の売買注文を受託した場合は、売買成立にかかわらず必ず注文伝票を作成しなければならない"},
{c:3,s:"売買の受託",n:11,d:"B",x:1,a:1,q:"「自己又は委託の別」は、「注文伝票」に記載すべき事項である。",e:"レジュメP71。注文伝票の記載事項は「自己または委託の別・顧客の氏名又は名称・取引の種類・銘柄・売付け買付けの別・受注数量・約定数量・指値または成行の別・受注日時・約定日時・約定価格」。契約締結時交付書面（P72、問12・13）の記載事項と混同させる出題が多い。"},
{c:3,s:"売買の受託",n:12,d:"B",a:0,q:"顧客から株式の売買注文を受託した場合に、金融商品取引業者は、当該注文に係る売買が成立したかどうかにかかわらず、当該顧客に契約締結時交付書面を交付しなければならない。",e:"契約締結時交付書面は、売買が成立した場合に、遅滞なく、顧客に交付しなければならない"},
{c:3,s:"売買の受託",n:13,d:"C",x:1,a:1,q:"金融商品取引業者は、契約締結時交付書面の交付方法について、顧客から書面又は電磁的方法による承諾を得て、書面に記載すべき事項について電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法により提供することができる。",e:"契約締結時交付書面（レジュメP72、問12参照）は原則書面交付だが、顧客の事前承諾があれば電子的な方法での提供も認められる。"},
{c:3,s:"売買の受託",n:14,d:"B",a:0,q:"東京証券所取引における上場株式の普通取引について、金曜日に約定が成立した場合には、原則として翌週の月曜日に決済を行うこととされている。",e:"普通取引による上場株式の受渡しは、約定日（売買成立日）から起算して3営業日目の日。金曜日が約定日であれば、受渡日は翌週の火曜日（カウントは土曜・日曜・祝日を含まない）"},
{c:3,s:"売買の受託",n:15,d:"C",a:0,q:"株式の売買に係る委託手数料は、取引所の定める受託契約準則により売買代金に応じて規定されている。",e:"委託手数料の額については自由化されている"},
{c:3,s:"金融商品取引所における株式の売買",n:16,d:"B",a:0,q:"金融商品取引所の内国株式の売買の種類は、決済日の違いによる区分として、当日決済取引、普通取引、信用取引及び発行日決済取引の4種類がある。",e:"当日決済取引、普通取引及び発行日決済取引の3種類に区分される（信用取引は含まない）"},
{c:3,s:"金融商品取引所における株式の売買",n:17,d:"A",x:1,a:1,q:"東京証券取引所における金融商品取引業者間の決済において、資金と証券の同時又は同日中の引渡しを行う決済のことをDVP決済といい、取引相手の決済不履行から生じる元本リスク（資金又は証券を交付した後、その対価を受け取れないリスク。）を排除することができる。",e:"DVP（Delivery Versus Payment）決済＝資金と証券を同時・同日中に引き渡す決済方式。片方だけ先に渡してしまい対価を受け取れなくなるリスク（元本リスク）を防ぐための仕組み。"},
{c:3,s:"金融商品取引所における株式の売買",n:18,d:"C",x:1,a:1,q:"信用取引とは、金融商品取引業者が顧客に信用を供与して行う有価証券の売買その他の取引のことをいう。",e:"レジュメP75。信用取引＝購入代金を借りて株式を買う（信用買い）、株券を借りて株式を売る（信用売り）。自己資金・保有株式で行う現物取引と対になる概念。"},
{c:3,s:"金融商品取引所における株式の売買",n:19,d:"A",a:0,q:"立会外売買の取引対象銘柄にETFやJ-REITは含まれない。",e:"立会外売買には上場株式（内国株式及び外国株式）だけでなく、新株予約権付社債、ETF、J-REIT等についても取引対象となる"},
{c:3,s:"金融商品取引所における株式の売買",n:20,d:"A",a:0,q:"東京証券取引所において株式の立会外バスケット取引が利用できるのは、15銘柄以上で構成され、かつ、売買代金5,000万円以上のポートフォリオについてである。",e:"15銘柄以上かつ売買代金1億円以上のポートフォリオから利用することができる"},
{c:3,s:"株式の店頭取引",n:21,d:"B",x:1,a:1,q:"店頭有価証券については、原則として成行注文の受託や信用取引及び未発行店頭有価証券の店頭取引が禁止されている。",e:"店頭有価証券（上場していない有価証券）は値動きの目安となる取引所価格が無く、成行注文や信用取引になじまないため原則禁止。未発行のものの店頭取引も同様に禁止。"},
{c:3,s:"株式の店頭取引",n:22,d:"B",x:1,a:1,q:"株式投資型クラウドファンディング業務とは、会員等が店頭有価証券のうち株券又は新株予約権証券について行う第一種少額電子募集取扱業務をいう。",e:"インターネットを通じて不特定多数の投資者から少額の資金を集める仕組み。対象は店頭有価証券のうち株券・新株予約権証券に限られる。"},
{c:3,s:"上場株券等の取引所金融商品市場外での売買",n:23,d:"B",a:0,q:"金融商品取引所に上場されている転換社債型新株予約権付社債券及び投資信託受益証券については、いずれも取引所外で取引を行うことはできない。",e:"いずれも取引所外での取引は可能である"},
{c:3,s:"上場株券等の取引所金融商品市場外での売買",n:24,d:"C",x:1,a:1,q:"PTSは、「私設取引システム」ともいわれる電子取引の場であり、開設できるのは、金融商品取引業者である。",e:"取引所外取引の一形態であるPTSは、原則として内閣総理大臣の認可を受けた金融商品取引業者の開設する「電子取引の場」であり、投資家や金融商品取引業者がここに注文を出して取引が行われる。"},
{c:3,s:"上場株券等の取引所金融商品市場外での売買",n:25,d:"B",a:0,q:"PTSは上場株式しか取り扱えない。",e:"PTSでは上場株式だけでなく、店頭売買有価証券も売買される"},
{c:3,s:"上場株券等の取引所金融商品市場外での売買",n:26,d:"B",a:0,q:"PTSでの価格決定は、取引所市場における売買価格を用いる方法のほか、競売買（オークション）の方法についても認められているが、顧客の間の交渉に基づく価格を用いる方法では価格を決定することができない。",e:"顧客の間の交渉に基づく価格を用いる方法（顧客間交渉方式）でも価格を決定することができる"},
{c:3,s:"外国株式の取引",n:27,d:"B",x:1,a:1,q:"金融商品取引業者が顧客から外国証券の売買を受託するときには、あらかじめ各金融商品取引業者が定める様式の「外国証券取引口座に関する約款」を交付するとともに、「外国証券取引口座設定に関する申込書」を徴収しなければならない。",e:"レジュメP80。国内の取引口座とは別に、外国証券取引口座を開設する必要がある。注文を受ける前に「約款」を交付し、「申込書」を徴収する、の順番。"},
{c:3,s:"外国株式の取引",n:28,d:"B",a:0,q:"一般投資家が行う外国証券取引は、国内委託取引のみである。",e:"一般投資家が行う外国証券取引は、その取引形態により、国内委託取引、外国取引及び国内店頭取引に区分される"},
{c:3,s:"外国株式の取引",n:29,d:"B",a:0,q:"顧客から外国証券の委託注文を受け、外国の金融商品市場に取次ぐ取引を、国内委託取引という。",e:"問題文の記述は外国取引のもの"},
{c:3,s:"外国株式の取引",n:30,d:"A",x:1,a:1,q:"外国取引において、金融商品取引業者が顧客に対し、勧誘を行うことができる銘柄は、適格外国金融商品取引市場で取引が行われている外国証券又は取引が予定されている外国証券で一定の要件を満たすものとされている。",e:"レジュメP80。外国取引＝顧客の委託注文を海外市場（NYSE、NASDAQ等）に取り次ぐ形態。勧誘できる銘柄は適格外国金融商品取引市場で取引される（予定される）ものに限定される。決済日は国内と同じ約定日から3営業日目。"},
{c:3,s:"株式ミニ投資",n:31,d:"B",a:0,q:"株式ミニ投資とは、投資者から少額の資金を預かり、その金銭を対価として、毎月一定日に特定の銘柄の株式等を買い付ける制度をいう。",e:"問題文は株式累積投資のもの。株式ミニ投資とは、金融商品取引業者と顧客との間で行う取引所の定める1売買単位に満たない株式を、株式等振替制度を利用して定型的な方法で行う売買取引"},
{c:3,s:"株式ミニ投資",n:32,d:"B",x:1,a:1,q:"株式ミニ投資は、任意の時に単元未満株のまま機動的に任意の銘柄の買付けを行い、また、買付けた単元未満株を単元未満株のまま売り付けることができる制度である。",e:"レジュメP82「覚」。株式ミニ投資＝1売買単位の10分の1単位（1取引単位の9倍まで）で任意のときに売買できる制度。議決権はないが配当は1株から受けられる。株式累積投資（毎月一定日・一定金額）との違いが最頻出。"},
{c:3,s:"株式ミニ投資",n:33,d:"B",a:0,q:"顧客の株式ミニ投資による買付けは、1売買単位の10分の1単位の株式の持分を取引単位とする一定金額分の株式を毎月一定日に買い付ける方法により行われる。",e:"株式ミニ投資は任意のときに単元未満株のまま、機動的に任意の銘柄の買付け（売付け）を行うことができる制度で、一定金額分の株式を毎月一定日に買い付けるものではない（それは株式累積投資）"},
{c:3,s:"株式ミニ投資",n:34,d:"B",x:1,a:1,q:"株式ミニ投資の取扱対象は、金融商品取引所に上場されている株券のみである。",e:"レジュメP82「取扱対象銘柄：取引所に上場されている株券」「※全ての銘柄×」と明示。非上場の株券は対象外。"},
{c:3,s:"株式ミニ投資",n:35,d:"C",x:1,a:1,q:"株式ミニ投資に係る取引において、約定日は金融商品取引業者が顧客から注文を受託した日の翌営業日とされている。",e:"レジュメP82「覚」。約定日＝金融業者が注文を受託した日（注文日）の翌営業日。受渡日は約定日から3営業日。指値注文は不可（成行注文のみ）。"},
{c:3,s:"株式の上場",n:36,d:"C",x:1,a:1,q:"一般的に、株式公開のメリットとして期待されるものに、公開会社の社会的信用の向上や資金調達力の拡大等がある。",e:"問題文のメリットのほか、企業のPR、財産保全機能の拡大、経営管理体制の確立なども挙げられる。"},
{c:3,s:"株式の上場",n:37,d:"C",x:1,a:1,q:"株券の新規上場における公開価格の決定方式には、ブックビルディング方式と競争入札による公募等の2種類がある。",e:"レジュメP84。ブックビルディング方式＝新規上場予定会社と幹事証券会社が公開価格の仮条件を決定する方式（現在の主流、IPO）。競争入札方式＝上場前の公開株式数の50％以上を一般投資家の入札にかけて決定する方式。問38はこの2つを入れ替えたひっかけ。"},
{c:3,s:"株式の上場",n:38,d:"B",a:0,q:"ブックビルディング方式では、上場前の公開株式数の50%以上の株式を一般投資家の参加する入札に付し、これにより公開価格が決定される。",e:"問題文は競争入札方式のこと。ブックビルディング方式とは、市場に新規上場する際の上場前の株式の公募価格を決める際に、投資家の需要状況に応じて公募価格を決定する方式"},
{c:3,s:"売買の受託",n:46,d:"B",o:["顧客の氏名又は名称", "受注日時", "約定日時", "売付け又は買付けの別", "手数料の金額"],a:[5],q:"次のうち、「注文伝票」の記載事項に該当しないものの番号を1つ選びなさい。",e:"1〜4はいずれも注文伝票の記載事項。手数料の金額は契約締結時交付書面の記載事項である。"},
{c:3,s:"売買の受託",n:47,d:"B",o:["売付け又は買付けの別", "営業所の名称", "受注日時", "指値又は成行の別", "委託注文の有効期間"],a:[1, 2],q:"次のうち、「契約締結時交付書面」の記載事項に該当するものの番号を2つ選びなさい。",e:"3・4は注文伝票の記載事項。5（委託注文の有効期間）は、顧客が委託注文を出す際に金融商品取引業者に指示すべき事項として受託契約準則に定められている。「注文伝票」と「契約締結時交付書面」の記載事項は頻繁に出題される。"},
{c:3,s:"金融商品取引所における株式の売買・計算",n:48,d:"A",o:["40円", "60円", "80円", "100円", "120円"],a:[2],q:"1：1.5の株式分割を行う上場銘柄A社株式の権利付相場は900円であった。権利落後の値段が560円になったとすれば、権利付相場の900円に対していくら値下がりしたことになるか。正しいものの番号を1つ選びなさい。（注）答は円単位未満を切り捨ててある。 ` 権利落相場 ＝ 権利付相場 ÷ 分割比率 ∴ 権利付相場 ＝ 権利落相場 × 分割比率 ＝ 560円 × 1.5 ＝ 840円 ` 権利落価格560円は、1：1.5の分割比率であれば権利付価格は840円の計算になる。 ∴ 840円 － 900円 ＝ －60円",e:"実際の権利落後の値段から算出される権利付相場を求め、その値段と元々の権利付相場の値段（この場合900円）との比較をする。"},
{c:12,s:"経済",n:1,d:"B",a:0,q:"国民経済計算では「国内総生産＝雇用者報酬＋営業余剰・混合所得＋固定資本減耗＋（間接税＋補助金）」の式が成立する。",e:"正しくは（間接税 − 補助金）"},
{c:12,s:"経済",n:2,d:"B",x:1,a:1,q:"GDPは一国の経済活動の様子を全体的にとらえる代表的な指標といえ、これは生産（付加価値）、分配（所得）、支出（需要）の3つの側面を持っており、3つのどの面から見ても金額が等しいという意味で「三面等価の原則」が成り立っているという。",e:"レジュメP290。生産＝分配＝支出。同じパイを3つの角度から見ているだけなので、必ず一致する。"},
{c:12,s:"経済",n:3,d:"B",a:0,q:"物価関連統計のうち「GDPデフレーター」は、実質GDPを名目GDPで除して求められる。",e:"名目GDPを実質GDPで除して求める"},
{c:12,s:"経済",n:4,d:"B",a:0,q:"内閣府は、景気動向指数と呼ばれる指標を作成し、3か月に1度公表している。",e:"内閣府が 毎月 公表"},
{c:12,s:"経済",n:5,d:"B",a:0,q:"景気動向指数は、先行指数、一致指数及び遅行指数からなるが、東証株価指数は一致指数の1つである。",e:"東証株価指数は 先行指数"},
{c:12,s:"経済",n:6,d:"B",a:0,q:"景気動向指数の先行指数の1つに有効求人倍率がある。",e:"有効求人倍率は 一致指数"},
{c:12,s:"経済",n:7,d:"C",a:1,q:"DIによる景気動向指数においては、50％を上回れば景気は拡張し、逆に下回れば景気は後退しているとされている。",e:"DIは採用系列のうち拡張した系列の割合。50％を超えるか否かだけが問題で、数値の水準には意味がなく景気の方向感しかわからない"},
{c:12,s:"経済",n:8,d:"B",a:0,q:"「全国企業短期経済観測調査（日銀短観）」は、日本銀行が2か月に1度公表している。",e:"日本銀行が 3か月ごと に公表"},
{c:12,s:"経済",n:9,d:"B",a:1,q:"消費関連統計において、所得には、雇用者報酬、財産所得、混合所得・営業余剰、社会保障給付等がある。",e:"所得＝雇用者報酬＋財産所得＋混合所得・営業余剰＋社会保障給付 等"},
{c:12,s:"経済",n:10,d:"C",a:0,q:"消費関連統計において、可処分所得とは、所得から所得税を差し引いたものである。",e:"所得税だけでなく 社会保険料等（健康保険料・年金保険料・雇用保険料等）も差し引く"},
{c:12,s:"経済",n:11,d:"B",x:1,a:1,q:"平均消費性向が一定であっても、可処分所得が増加すれば消費支出は増加する。",e:"消費性向＝消費支出 ÷ 可処分所得。この比率が一定のまま可処分所得が増えれば、消費支出も比例して増える。"},
{c:12,s:"経済",n:12,d:"C",a:0,q:"消費関連統計において、「家計貯蓄」は、所得から可処分所得を差し引いて求められる。",e:"家計貯蓄＝可処分所得 − 消費支出"},
{c:12,s:"経済",n:13,d:"B",a:0,q:"消費関連統計のうち「家計貯蓄率」は、家計貯蓄を財産所得で除して求められる。",e:"家計貯蓄率＝家計貯蓄 ÷ 可処分所得"},
{c:12,s:"経済",n:14,d:"B",x:1,a:1,q:"住宅関連統計のうち新設住宅着工は工事着工ベースであるため、新設住宅着工の戸数は景気の変動に先行して動く傾向があり、景気先行指標として利用されている。",e:"レジュメP294。新設住宅着工は「工事着工ベース」なので景気より先に動く＝先行指数。GDP統計の民間住宅投資は「工事進捗ベース」で別物。"},
{c:12,s:"経済",n:15,d:"B",a:1,q:"完全失業率は、完全失業者数を労働力人口で除して求められる。",e:"完全失業者＝求職活動はしたが仕事をしなかった人。労働力人口＝15歳以上で働く意思を持つ者の人口（学生は含まない）"},
{c:12,s:"経済",n:16,d:"B",a:0,q:"労働力人口は、就業者数と完全失業者数との合計であり、労働力人口比率はこの労働力人口に占める15歳以上人口の割合である。",e:"労働力人口比率は 15歳以上人口に占める労働力人口 の割合（分子分母が逆）"},
{c:12,s:"経済",n:17,d:"B",a:0,q:"雇用関連統計のうち「有効求人倍率」は、有効求職者数を有効求人数で除して求められる。",e:"有効求人倍率＝有効求人数 ÷ 有効求職者数（分子分母が逆）"},
{c:12,s:"経済",n:18,d:"C",x:1,a:1,q:"有効求人倍率は、一般に好況期に上昇し、不況期に低下し、景気の動きにほぼ一致して変動する。",e:"景気の動きに「ほぼ一致して」変動するから一致指数。問6の「先行指数」というひっかけと対で覚える。"},
{c:12,s:"経済",n:19,d:"B",x:1,a:1,q:"有効求人倍率が1を上回るということは、「仕事を探している人の数」より「企業が募集している働く人の数」が相対的に多く、逆に1を下回るとその反対の状況であることを意味している。",e:"有効求人倍率＝求人数 ÷ 求職者数。1を超える＝求人が求職者より多い＝好景気。レジュメでは「好景気1倍以上／不景気1倍以下」。"},
{c:12,s:"経済",n:20,d:"B",x:1,a:1,q:"有効求人倍率は、公共職業安定所等に登録した人のみを対象とするので、実態よりも高く表れる傾向がある。",e:"ハローワーク等に登録した人だけが分母になる。実際に職を探している人はもっと多いので、実態より高めに出る。"},
{c:12,s:"経済",n:21,d:"B",a:1,q:"労働生産性とは、労働投入量1単位当たりの生産量であり、生産量を就業者数と年間総労働時間の積で除したものである。",e:"労働生産性 ＝ 生産量 ÷（就業者数 × 年間総労働時間）"},
{c:12,s:"経済",n:22,d:"B",x:1,a:1,q:"労働投入量とは、就業者数と年間総労働時間の積で表される。",e:"労働投入量＝就業者数 × 年間総労働時間。労働生産性＝生産量 ÷ 労働投入量、の分母にあたる部分。"},
{c:12,s:"経済",n:23,d:"B",x:1,a:1,q:"企業物価指数（CGPI）は企業間で取引される財の価格の水準を指数で示したものであり、国内企業物価指数、輸出物価指数、輸入物価指数の3つの基本分類指数と、この他に基本分類指数を組み替えたり、調整を加えた参考指数があり、日本銀行から発表される。",e:"レジュメP296。CGPIは日本銀行が発表。企業間で取引される財の価格で、短期的な変動が大きく為替の影響を受ける。CPI（総務省）と作成主体を入れ替えるひっかけに注意。"},
{c:12,s:"経済",n:24,d:"C",a:1,q:"消費者物価指数（CPI）は総務省から発表される。",e:"CPIは家計（消費者）が購入する各種の消費財やサービスの 小売価格 の水準を指数値で示したもの"},
{c:12,s:"経済",n:25,d:"B",a:0,q:"消費者物価指数（CPI）は、家計が購入する約600品目の価格を各品目の平均消費額で加重平均した数値であり、その算出にあたっては、土地や住宅等の価格は含まれ、直接税や社会保険料等の非消費支出は含まれない。",e:"CPIの算出にあたっては 土地や住宅等の価格も含まれない"},
{c:12,s:"経済",n:26,d:"B",x:1,a:1,q:"GDPデフレーターはGDPに計上されるすべての財・サービスを含むのでCPIよりも包括的な物価指標である。",e:"GDPデフレーターはGDPに計上される全ての財・サービスが対象。CPIは家計が買うものだけなので、範囲が広いのはGDPデフレーターのほう。"},
{c:12,s:"経済",n:27,d:"B",x:1,a:1,q:"国際収支統計は、一定期間における一国のあらゆる対外取引を体系的に記録した統計である。",e:"一定期間における一国のあらゆる対外取引を、体系的に記録した統計。"},
{c:12,s:"経済",n:28,d:"B",a:0,q:"国際収支統計において、金融収支は、貿易・サービス収支、第一次所得収支及び第二次所得収支を合計して求められる。",e:"その合計は 経常収支"},
{c:12,s:"経済",n:29,d:"A",x:1,a:1,q:"国際収支統計は、「経常収支＋資本移転等収支−金融収支＋誤差脱漏＝0」になるように統計が作成されている。",e:"レジュメP297。経常収支＋資本移転等収支−金融収支＋誤差脱漏＝0。誤差脱漏は帳尻合わせの項目で、必ず0になるように作られている。"},
{c:12,s:"経済",n:30,d:"A",x:1,a:1,q:"国際収支統計においては、経常収支が黒字の国は金融収支が黒字となるのに対し、経常収支が赤字の国は金融収支が赤字となるのが一般的である。",e:"経常収支で稼いだ分は、対外資産の増加（＝金融収支の黒字）として現れる。問29の恒等式から導ける。"},
{c:12,s:"経済",n:31,d:"C",x:1,a:1,q:"為替レートとは外国為替市場において異なる通貨が交換（売買）される際の交換比率のことであり、例えば、「1ドル130円」といった表示方法を邦貨建ての為替レートという。",e:"レジュメP302。「1ドル＝130円」のように自国通貨で表すのが邦貨建て。「1円＝0.0066ドル」なら外貨建て。"},
{c:12,s:"経済",n:32,d:"B",a:0,q:"ドルの需要が発生するのは、外国が日本から製品を輸入する場合や日本の債券・株式を購入する場合であり、ドルの供給が発生するのは、日本が外国から原材料や製品を輸入する場合や外国の債券・株式を購入する場合である。",e:"逆。ドルの需要＝日本が外国から輸入する場合や外国の債券・株式を購入する場合。ドルの供給＝外国が日本から輸入する場合や日本の債券・株式を購入する場合"},
{c:12,s:"経済",n:33,d:"B",a:1,q:"貿易依存度は、自国の貿易額（輸出＋輸入）を名目GDPで除して求められる。",e:"貿易依存度は、世界貿易の動向に自分の国の経済がどの程度影響を受けるかを表したもの"},
{c:12,s:"金融",n:34,d:"C",x:1,a:1,q:"通貨の基本的機能には、価値尺度としての機能、交換手段としての機能、価値の貯蔵手段としての機能がある。",e:"レジュメP299。価値尺度（物価）・交換手段（支払、決済）・価値の貯蔵手段（貯蓄）の3つ。インフレになると、この3つがそれぞれ低下する。"},
{c:12,s:"金融",n:35,d:"B",x:1,a:1,q:"マネーストックとは、国内の民間非金融機関が保有する通貨量（一般の法人、個人及び地方公共団体等が保有する通貨の量。）のことであり、国や金融機関が保有する預金等は含まれない。",e:"レジュメP299で「覚」が付いた箇所。世の中に出回っているお金の量。国と金融機関が保有する分は含まない。有価証券（株式）も含まない。"},
{c:12,s:"金融",n:36,d:"B",x:1,a:1,q:"現金通貨と預金通貨の合計をM1と呼び、M1に準通貨である定期性預金及びCDを加えたものをM3と呼ぶ。",e:"M1＝現金通貨＋預金通貨。M3＝M1＋準通貨（定期性預金）＋CD。積み上がる順で覚える。M2はM3のうち預け先が国内銀行等に限定されたもの。"},
{c:12,s:"金融",n:37,d:"B",x:1,a:1,q:"マネーストック統計において、要求払預金はM1に計上される。",e:"要求払預金＝いつでも引き出せる預金（普通預金、当座預金）。これが預金通貨にあたるのでM1に入る。定期性預金は準通貨なのでM3。"},
{c:12,s:"金融",n:38,d:"B",a:0,q:"インフレが起こると通貨の価値がその分上がることになる。",e:"通貨の価値はその分 下がる"},
{c:12,s:"金融",n:39,d:"C",a:0,q:"実質金利から物価上昇率を差し引いたものが、名目金利である。",e:"名目金利は、実質金利に物価上昇率（インフレ率）を加えた もの"},
{c:12,s:"金融",n:40,d:"C",a:0,q:"物価上昇率年0.5％の状況で年1.5％の金利で資金を借り入れた場合、実質金利は年2％となる。",e:"実質金利＝名目金利−期待インフレ率＝1.5％−0.5％＝1.0％"},
{c:12,s:"金融",n:41,d:"B",a:1,q:"マーシャルのkとは、貨幣の量であるマネーストックを実際の経済活動の程度を表す名目GDPで除したものである。",e:"マーシャルのk ＝ マネーストック ÷ 名目GDP"},
{c:12,s:"金融",n:42,d:"C",a:0,q:"ドルが1ドル80円から160円になったなら、円の価値は倍になったことになる。",e:"円の価値は 半分 になった"},
{c:12,s:"金融",n:43,d:"C",a:0,q:"直接金融とは、金融機関自身が資金余剰主体から資金を調達し、その資金を資金不足主体に貸し付ける金融手法である。",e:"問題文は 間接金融。直接金融は証券市場で企業や政府が株式や債券を発行し資金調達する方法（資金不足主体が発行した証券を資金余剰主体が購入する方法）"},
{c:12,s:"金融",n:44,d:"B",x:1,a:1,q:"日本銀行は、銀行券の独占的発行権を有する「発券銀行」としての機能のほか、市中金融機関を対象に取引を行う「銀行の銀行」及び政府の出納業務を行う「政府の銀行」としての機能も有している。",e:"発券銀行（銀行券の独占的発行）・銀行の銀行（市中金融機関と取引）・政府の銀行（政府の出納業務）の3つの機能。"},
{c:12,s:"金融",n:45,d:"B",a:0,q:"証券金融会社は、短期金融市場における金融機関相互の資金取引の仲介業務を行っている。",e:"問題文は 短資会社 のこと"},
{c:12,s:"金融",n:46,d:"B",a:0,q:"短資会社は、金融商品取引法に基づき免許を受けて、信用取引の決済に必要な資金や有価証券を証券会社に貸し付ける業務を行っている。",e:"問題文は 証券金融会社 のこと"},
{c:12,s:"金融",n:47,d:"C",x:1,a:1,q:"消費者金融会社やリース会社等のいわゆるノンバンクは、社債発行を通じて調達した資金を使って貸付業務を行うことができる。",e:"レジュメP303。ノンバンクは預金業務は×、貸付業務は○。預金を集められないので、社債発行などで資金を調達する。"},
{c:12,s:"金融",n:48,d:"C",a:0,q:"短期金融市場のうち、オープン市場は、金融機関相互の資金運用・調達の場として利用されており、非金融機関は参加できない市場である。",e:"問題文は インターバンク市場。オープン市場とは広く一般の事業法人等が参加できる市場"},
{c:12,s:"金融",n:49,d:"B",x:1,a:1,q:"短期金融市場のうち、インターバンク市場は、コール市場と手形市場からなり、日本銀行の金融調整や金利水準誘導の場としての機能を果たしている。",e:"レジュメP304。インターバンク市場＝金融機関同士（プロのみ）で、コール市場と手形市場からなる。一般企業も入れるオープン市場と対で覚える。"},
{c:12,s:"金融",n:50,d:"B",x:1,a:1,q:"コール市場における資金の最大の貸し手は信託銀行である。",e:"レジュメP304。コール市場の資金の出し手は信託銀行、仲介するのは短資会社。この役割を入れ替えたひっかけが出る。"},
{c:12,s:"金融",n:51,d:"B",a:0,q:"インターバンク市場のうちコール市場で取引されているのは、翌日物（オーバーナイト物）のみである。",e:"翌日物（オーバーナイト物）と 各種期日物 がある"},
{c:12,s:"金融",n:52,d:"B",a:1,q:"CDの流通市場において、事業法人等はCD現先の買い手として参加している。",e:"CD（Negotiable Certificate of Deposit）＝譲渡性預金の略称。第三者に譲渡可能な大口預金"},
{c:12,s:"金融",n:53,d:"C",x:1,a:1,q:"国庫短期証券は、日銀の公開市場操作の対象である。",e:"公開市場操作の対象は手形に限られず、国債や国庫短期証券などの債券も含まれる。問60の「手形に限られている」というひっかけと対。"},
{c:12,s:"金融",n:54,d:"B",x:1,a:1,q:"CPの流通市場においては、短期の現先取引が最大の割合を占めている。",e:"CP＝優良企業が発行する約束手形（3か月物が中心）。流通市場では短期の現先取引が最大の割合を占める。"},
{c:12,s:"金融",n:55,d:"B",a:0,q:"短期プライムレートとは、日本銀行の民間金融機関に対する貸出金について適用される基準金利のことをいう。",e:"問題文は 基準割引率及び基準貸付利率。短期プライムレートは最も信用力がある企業に対する短期最優遇貸出金利"},
{c:12,s:"金融",n:56,d:"B",x:1,a:1,q:"基準割引率及び基準貸付利率とは、日銀の民間金融機関に対する貸出金について適用される基準金利のことであり、一般的に商業手形割引歩合で代表される。",e:"旧公定歩合のこと。日銀が民間金融機関に貸すときの基準金利。短期プライムレート（最も信用力のある企業への最優遇貸出金利）と入れ替えるひっかけが定番。"},
{c:12,s:"金融",n:57,d:"C",a:1,q:"日本銀行の代表的な金融政策手段は公開市場操作である。",e:"日銀が金利を調整する主な方法は公開市場操作（オペレーション）と預金準備率操作。公開市場操作が中心"},
{c:12,s:"金融",n:58,d:"B",x:1,a:1,q:"日銀の日々の金融調節は、日本銀行政策委員会が金融政策決定会合で決定した金融市場調節方針に従って、オペレーションによって行われている。",e:"金融政策決定会合で金融市場調節方針を決め、それに従って日々オペレーションを行う。決めるのは日本銀行政策委員会。"},
{c:12,s:"金融",n:59,d:"C",x:1,a:1,q:"公開市場操作とは、日本銀行が貸付利率を入札に付して行う貸付けあるいは市場で債券や手形の売買を行って、民間金融機関が日銀に保有する当座預金残高を増減させ、短期金利に影響を与える政策である。",e:"レジュメP307。市場で債券や手形を売買して、民間金融機関が日銀に持つ当座預金残高を増減させ、短期金利を動かす。日銀の代表的な金融政策手段。"},
{c:12,s:"金融",n:60,d:"C",a:0,q:"日本銀行の行う公開市場操作の対象は、手形に限られている。",e:"手形に限らず 国債などの債券も含まれる"},
{c:12,s:"金融",n:61,d:"B",x:1,a:1,q:"日本銀行の行う公開市場操作の対象に、国債証券は含まれるが株券は含まれない。",e:"公開市場操作の対象は国債証券などの債券で、株券は対象外。問60と合わせて、対象の範囲を整理しておく。"},
{c:12,s:"金融",n:62,d:"B",a:1,q:"日本銀行が市場で債券などを買い入れて資金供給する場合を「買いオペ」、逆に売却して資金吸収する場合を「売りオペ」という。",e:"買いオペ→民間の資金量が増加し金利が低下。売りオペ→民間の資金量が減少し金利が上昇"},
{c:12,s:"金融",n:63,d:"B",a:0,q:"「買いオペ」とは、日本銀行が預金準備率を変更することによって金融機関の支払準備を増減させ、金融市場に影響を与えることをいう。",e:"問題文の記述は「買いオペ」ではなく 預金準備率操作"},
{c:12,s:"金融",n:64,d:"B",a:0,q:"日本銀行が行う預金準備率操作において、預金準備率を上げる目的は、民間金融機関の貸出金利を低下させることである。",e:"預金準備率を上げる目的は貸出金利を 上昇 させること"},
{c:12,s:"金融",n:65,d:"C",x:1,a:1,q:"BIS（Bank for International Settlements）とは、世界の主要国中央銀行の出資によって設立された国際決済銀行のことであり、中央銀行間の決済や国際金融問題に関する協議・調査を行っている。",e:"レジュメP308。BIS＝国際決済銀行。主要国の中央銀行が出資して設立。BIS規制では自己資本比率8％以上が求められる。"},
{c:12,s:"金融",n:66,d:"B",a:0,q:"ペイオフ制度とは、金融機関が破綻した場合、そこに預けてある預金などを、1名義当たり合算して元本と利息をあわせて1,000万円を限度に預金保険機構が払い戻す制度である。",e:"保護されるのは 元本1,000万円までと、その利息。利息は1,000万円の枠の外に上乗せされる。「元本と利息をあわせて1,000万円まで」ではない"},
{c:12,s:"財政",n:67,d:"B",a:0,q:"予算の作成、国会への提出は財務大臣が行い、実際に予算案の編成を行うのは内閣である。",e:"予算の作成、国会への提出は 内閣 が行い、実際に予算案の編成を行うのは 財務大臣"},
{c:12,s:"財政",n:68,d:"C",a:0,q:"国会における予算審議はまず参議院で行われ、可決後に衆議院に送られる。",e:"国会における予算審議はまず 衆議院 で行われ、可決後に 参議院 に送られる"},
{c:12,s:"財政",n:69,d:"C",a:0,q:"参議院が衆議院の可決した予算案を受け取ってから60日以内に議決しない場合、予算は自然成立する。",e:"60日以内ではなく 30日以内"},
{c:12,s:"財政",n:70,d:"B",a:1,q:"参議院が衆議院の可決した予算案を否決した場合は、両院協議会を開くことになっている。",e:"さらに、両院協議会においても意見が一致しない場合には、衆議院の議決が国会の議決 となり、予算が成立する"},
{c:12,s:"財政",n:71,d:"C",a:0,q:"「補正予算」とは、予算成立までの期間の必要経費だけを計上した予算である。",e:"問題文は 暫定予算 のこと。補正予算 は、予算成立後に新たに追加される予算"},
{c:12,s:"財政",n:72,d:"B",x:1,a:1,q:"公共部門とは、一般政府（中央政府、地方政府と社会保障基金の各部門を合わせ、その相互の重複関係を調整したもの。）に公的企業を合わせたものである。",e:"公共部門 ＝ 一般政府 ＋ 公的企業。一般政府は「中央政府・地方政府・社会保障基金」の3つ。ここに公的企業を足したものが公共部門。"},
{c:12,s:"財政",n:73,d:"C",a:0,q:"国民負担率とは、国民所得に対する租税負担の比率である。",e:"国民負担率 とは、国民所得 に対する 租税及び社会保障負担 の比率。社会保障負担が抜けている"},
{c:12,s:"財政",n:74,d:"B",x:1,a:1,q:"基礎的財政収支対象経費とは、一般会計の歳出から国債費の一部を除いたものをいう。",e:"一般会計の歳出から国債費の一部を除いた残り。国の政策そのものに使う経費で、問80のプライマリー・バランスを見るための土台になる。"},
{c:12,s:"財政",n:75,d:"C",a:0,q:"日本の一般会計における基礎的財政収支対象経費の中で最も金額の大きな経費は、公共事業関係費である。",e:"最も金額の大きな経費は 社会保障関係費"},
{c:12,s:"財政",n:76,d:"B",x:1,a:1,q:"国債費とは一般会計で社会保障関係費に次ぐ大きい支出で、過去に発行した国債の元利払いのための支出である。",e:"一般会計全体では 社会保障関係費 ＞ 国債費 ＞ 地方交付税交付金等 の順。国債費は基礎的財政収支対象経費の外側にあるので、問84の順位とは別の話。"},
{c:12,s:"財政",n:77,d:"C",a:0,q:"いわゆる赤字国債は、財政法第4条1項但書に基づいて発行され、4条国債とも呼ばれている。",e:"いわゆる 赤字国債 は、特例公債法 に基づいて発行され、特例国債 とも呼ばれる。財政法第4条にもとづく建設国債が4条国債"},
{c:12,s:"財政",n:78,d:"B",x:1,a:1,q:"公共財とは、防衛、警察、司法などの特殊な財・サービスであり、社会的な必要性が認められるものの、市場メカニズムによる適切な供給が難しいので、政府が供給する必要がある。",e:"市場に任せても適切に供給されないから政府が出る、というのが公共財の考え方。防衛・警察・司法が代表例。"},
{c:12,s:"財政",n:79,d:"B",x:1,a:1,q:"財政の役割として、資源の効率的配分、所得再分配、経済安定化効果の3つがある。",e:"財政の3つの役割は「資源の効率的配分」「所得再分配」「経済の安定化」。3つセットで覚える。数を増やしたり減らしたりして出される。"},
{c:12,s:"財政",n:80,d:"B",a:0,q:"プライマリー・バランスとは、公債金収入を含む収入と利払費及び債務償還費を含めた支出との収支のことである。",e:"プライマリー・バランス とは、公債金収入以外の収入 と、利払費及び債務償還費を除いた支出 との収支のこと。「含む／含めた」と「以外／除いた」が正反対"},
{c:12,s:"財政",n:81,d:"C",a:0,q:"「地方税」とは、納税者が地方公共団体を通じて国に納める税金のことである。",e:"「地方税」とは、納税者が 地方公共団体に 納める税金のこと。国には納めない"},
{c:12,s:"財政",n:82,d:"C",x:1,a:1,q:"国及び地方公共団体の予算は、ともに一般会計予算と特別会計予算から構成されている。",e:"国も地方公共団体も、予算は「一般会計」と「特別会計」の2本立て。どちらか一方だけ、と書かれていたら×。"},
{c:12,s:"金融",n:83,d:"B",o:["当座預金", "定期積金", "投資信託", "国債", "普通預金"],a:[1, 5],q:"次のうち、マネーストック統計において、M1に計上されるものとして正しいものの番号を2つ選びなさい。",e:"M1＝現金通貨＋預金通貨（普通預金・当座預金等の要求払預金）。当座預金と普通預金が要求払預金にあたる。定期積金は準通貨なのでM3、投資信託と国債は広義流動性に入る。"},
{c:12,s:"財政",n:84,d:"B",o:["地方交付税交付金 ＞ 社会保障関係費 ＞ 防衛関係費", "社会保障関係費 ＞ 防衛関係費 ＞ 地方交付税交付金", "防衛関係費 ＞ 公共事業関係費 ＞ 社会保障関係費", "社会保障関係費 ＞ 地方交付税交付金 ＞ 防衛関係費", "地方交付税交付金 ＞ 社会保障関係費 ＞ 公共事業関係費"],a:[4],q:"日本の2024年度の一般会計歳出の内訳について、以下の歳出額の比較として正しいものの番号を1つ選びなさい。",e:"基礎的財政収支対象経費の中の順位は ①社会保障関係費 ②地方交付税交付金等 ③防衛関係費 ④公共事業関係費 ⑤文教及び科学振興費。社会保障関係費は、基礎的財政収支対象経費で見ても一般会計全体で見ても最も大きい。"},
{c:13,s:"金融システムと証券市場",n:1,d:"B",a:0,q:"家計部門、企業部門、政府・公共部門といった経済主体間の資金需要額と供給額は、部門間でも全体としても一致する。",e:"経済主体間の資金需要額と供給額は、全体としてみれば一致するが、部門別では過不足が生じるため必ずしも一致しない"},
{c:13,s:"金融システムと証券市場",n:2,d:"C",a:0,q:"証券市場のうち、株式市場は「直接金融」に分類され、債券市場は「間接金融」に分類される。",e:"株式市場、債券市場ともに「直接金融」に分類される"},
{c:13,s:"金融システムと証券市場",n:3,d:"C",a:0,q:"直接金融では金融仲介機関が資金回収にかかわるリスクを負い、間接金融では資金の最終的貸し手（投資家）がリスクを負う。",e:"「直接金融」と「間接金融」が逆。間接金融では金融仲介機関が資金回収にかかわるリスクを負うのに対して、直接金融では資金の最終的貸し手（投資家）がリスクを負う"},
{c:13,s:"金融システムと証券市場",n:4,d:"C",x:1,a:1,q:"市場型間接金融とは、銀行などの金融機関が資金供給者から預かった資金を、直接企業に貸付けるのではなく、企業が発行する社債やCPなどの有価証券に投資することをいう。",e:"直接金融（証券市場）と間接金融（銀行貸付）の中間形態。金融機関が仲介する点は間接金融と同じだが、貸付ではなく企業の発行する有価証券に投資する点が異なる。"},
{c:13,s:"金融システムと証券市場",n:5,d:"B",a:0,q:"金融商品取引法上の投資者保護は、投資対象となる有価証券の価格を保証したり、株式の配当を約束するものである。",e:"投資の勧誘にあたって、損益をあらかじめ約束したり保証するものではない。ルールを整備して証券投資に関する情報を正確・迅速に投資者が入手できるようにする（ディスクロージャー）こと、また不公正取引から投資者を回避させることが基本"},
{c:13,s:"証券市場",n:6,d:"C",a:0,q:"有価証券が発行者から直接にあるいは証券会社や金融機関等の仲介者を介して、投資者に第一次取得される市場を「流通市場」という。",e:"「流通市場」ではなく 「発行市場」"},
{c:13,s:"証券市場",n:7,d:"C",a:0,q:"既発行となった証券が、第一次投資者から、第二次、第三次投資者に転々流通する市場を「発行市場」という。",e:"「発行市場」ではなく 「流通市場」。問6と対で、発行市場・流通市場の定義を入れ替えて出される"},
{c:13,s:"証券市場",n:8,d:"C",a:0,q:"流通市場は、取引所金融商品市場と債券市場に、大きく分類される。",e:"流通市場は、大きく分けて、（取引所）金融商品市場と金融商品市場以外の市場（店頭市場）に分類される"},
{c:13,s:"証券市場",n:9,d:"B",a:0,q:"金融商品取引業者が店頭デリバティブ業務を行うにはリスクが高いので内閣総理大臣の認可が必要である。",e:"「認可」ではなく 内閣総理大臣の登録 が必要"},
{c:13,s:"証券市場",n:10,d:"B",a:1,q:"金融商品取引業の規制方式には、監督官庁（金融庁）による公的規制のほか、自主規制機関を通じて行われる規制がある。",e:"金融商品取引法により、各金融商品取引所・日本証券業協会・投資信託協会の3団体が自主規制機関としての資格を付与され、監督官庁の公的規制と並んで金融商品取引業規制の柱となっている"},
{c:13,s:"証券市場",n:11,d:"B",x:1,a:1,q:"日本証券業協会は、自主規制機関の1つである。",e:"問10の3団体（各金融商品取引所・日本証券業協会・投資信託協会）の1つ。"},
{c:13,s:"証券市場",n:12,d:"B",a:1,q:"証券取引等監視委員会には、インサイダー取引や金融商品取引業者等による損失保証や損失補填等の市場や取引の公正を損なう行為についての強制調査権が付与されている。",e:"金融商品取引業者・金融機関等の定期検査、捜査当局への告発、金融庁長官への行政処分勧告なども行う"},
{c:13,s:"証券市場",n:13,d:"B",a:0,q:"証券取引等監視委員会は、証券業界の自主規制機関である。",e:"証券取引等監視委員会は証券業界の 監督官庁 であり、自主規制機関ではない。問10・11の自主規制機関（取引所・証券業協会・投資信託協会）と混同させるひっかけ"},
{c:13,s:"証券市場",n:14,d:"B",a:0,q:"証券保管振替機構は、国債の決済及び管理業務を集中的に行う証券決済機関である。",e:"証券保管振替機構は、国債以外の有価証券の決済及び管理業務を集中的に行う証券決済機関。国債の決済は日銀で行う"},
{c:13,s:"証券市場",n:15,d:"B",x:1,a:1,q:"日本証券金融は、金融商品取引法に基づき内閣総理大臣の免許を受けた証券金融専門の株式会社である。",e:"レジュメP319。日本証券金融は内閣総理大臣の免許（登録・認可ではない）を受けた証券金融専門の会社で、信用取引の決済に必要な資金・証券の貸付けに関わる。証券金融会社は「免許」、証券会社は「登録」、PTS業務は「認可」と、手続きの種類を混同させるひっかけに注意。"},
{c:13,s:"サステナブルファイナンス",n:16,d:"B",a:0,q:"サステナブルファイナンスは、特定の金融商品や運用スタイルを指す言葉である。",e:"特定の金融商品や運用スタイルを指す言葉ではない。持続可能な社会を支える金融の制度や仕組み、行動規範、評価手法等の全体像を指す"},
{c:13,s:"サステナブルファイナンス",n:17,d:"C",x:1,a:1,q:"ESG投資において、考慮すべき要素の1つとして、気候変動が挙げられる。",e:"レジュメP320。ESG投資（環境・社会・ガバナンス）の中でも特に注目されているのが気候変動（2015年のパリ協定が契機）。"},
{c:13,s:"サステナブルファイナンス",n:18,d:"B",x:1,a:1,q:"持続可能な社会の実現に向けた投資アプローチとして「ESGインテグレーション」があるが、これはリスク調整後の収益を向上させることを目的として、投資分析及び意思決定プロセスの中でESG要因を継続的に考慮するものである。",e:"問19のスクリーニング系（ポジティブ／ネガティブ）とは別の型のESGアプローチ。「除外する」のではなく「投資判断のプロセスにESG要因を組み込む」点が特徴。"},
{c:13,s:"サステナブルファイナンス",n:19,d:"B",a:0,q:"持続可能な社会の実現に向けたスクリーニングとして「ポジティブ／ベスト・イン・クラス・スクリーニング」があるが、これは投資可能と考えられない活動に基づいて、特定のセクター、企業、国、その他の発行体を、ファンドやポートフォリオから除外するものである。",e:"記述は 「ネガティブ／除外スクリーニング」 のもの。ポジティブ／ベスト・イン・クラス・スクリーニングとは、同業他社比でESGパフォーマンスに優れており、定められた閾値以上の評価を達成したセクター・企業・プロジェクトへの投資をいう"},
{c:13,s:"サステナブルファイナンス",n:20,d:"B",x:1,a:1,q:"ESG要素を考慮した投資信託や、環境や社会課題解決に資するプロジェクトに資金が使われる債券など、サステナブルファイナンスの推進に資する金融商品も増えている。",e:"レジュメP321「ESG関連金融商品」。ESG投資を考慮した投資信託、環境・社会課題解決プロジェクトに資金が使われる債券（SDGs債）などが該当する。"},
{c:13,s:"サステナブルファイナンス",n:21,d:"B",x:1,a:1,q:"債券において、例えば環境にポジティブなインパクトを与えるプロジェクトに資金使途を限定して発行する「グリーンボンド」、社会にポジティブなインパクトを与えるプロジェクトに資金使途を限定して発行する「ソーシャルボンド」、環境にも社会にもポジティブなインパクトを与えるプロジェクトに資金使途を限定して発行する「サステナビリティボンド」の発行が増えている。",e:"レジュメP321のSDGs債の表そのまま。グリーンボンド＝環境、ソーシャルボンド＝社会、サステナビリティボンド＝環境＋社会。組み合わせを入れ替えて出される可能性が高い。"},
{c:13,s:"サステナブルファイナンス",n:22,d:"B",a:0,q:"サステナビリティ・リンク・ボンドは、脱炭素化に時間を要する、温室効果ガスを大量に排出する産業（鉄鋼、化学、電力、ガス、石油、セメント、製紙、パルプ等）の利用を想定したものである。",e:"記述は 「トランジション（移行）ボンド」 のもの。サステナビリティ・リンク・ボンドは、発行体が自らのサステナビリティ戦略に基づくKPI（重要業績評価指標）を投資家に明示し、KPI毎に1つ以上のSPT（Sustainability Performance Target）を設定したうえで、達成状況に応じて利払いや償還等の条件を変える債券"},
{c:13,s:"サステナブルファイナンス",n:23,d:"B",x:1,a:1,q:"機関投資家がESG投資を行うにあたり、企業のESGの取り組みを評価するESG評価機関の評価・格付けを用いることもある。",e:"自社で全ての企業のESGへの取り組みを調べるのは大変なので、外部のESG評価機関の評価・格付けを判断材料に使うことも認められている。"},
{c:13,s:"サステナブルファイナンス",n:24,d:"B",x:1,a:1,q:"金融商品取引業者は、ESG関連金融商品の販売にあたり、グリーンウォッシュやSDGsウォッシュなどに代表されるウォッシュ問題に注意する必要がある。",e:"グリーンウォッシュ＝実態が伴わないのに環境に配慮しているように見せかけること。SDGsウォッシュも同様の考え方。ESG関連商品の販売時に注意すべき問題として出題される。"},
{c:14,s:"セールス業務",n:1,d:"C",x:1,a:1,q:"外務員は、金融商品取引業者等に対する投資者の信頼に応えられるように、高い倫理性に立脚して最善を尽くさなければならない。",e:"レジュメP324の倫理規範(1)そのまま。外務員が守るべき4つの行動原則のうちの1つめ。"},
{c:14,s:"セールス業務",n:2,d:"C",a:0,q:"顧客の注文が相場操縦等不正な取引になることを知りながら、その注文を受託した。",e:"不正な取引になることを知りながら、その注文を受託してはならない"},
{c:14,s:"セールス業務",n:3,d:"C",a:0,q:"投資勧誘を行った銘柄について責任を持つため、顧客と損益を共にすることを約束して投資勧誘を行った。",e:"顧客と損益を共にすることを約束して投資勧誘を行ってはならない"},
{c:14,s:"セールス業務",n:4,d:"C",a:0,q:"かなりの自信をもって推奨できる銘柄であったので、断定的な判断による勧誘を行った。",e:"断定的判断の提供による勧誘は禁止行為にあたる"},
{c:14,s:"セールス業務",n:5,d:"C",a:0,q:"外務員は、投資者に対し、将来における株式の価格の騰落について、断定的にアドバイスしなければならない。",e:"断定的なアドバイスは禁止されている"},
{c:14,s:"セールス業務",n:6,d:"C",a:0,q:"投資経験があまりない顧客から、アドバイスを求められたので、外務員自身が投資の最終決定を行った。",e:"投資の最終決定者は投資者自身"},
{c:14,s:"セールス業務",n:7,d:"C",x:1,a:1,q:"顧客にとって最適であると確信してハイ・リターンの商品を勧めたが、当該顧客は確定利付商品を選択したことから、最終的に顧客の意向に従った。",e:"勧めること自体は問題ない。最後に顧客の意向に従っていて、決定権を顧客に残しているので○。押し切って外務員が決めると×になる。"},
{c:14,s:"セールス業務",n:8,d:"C",x:1,a:1,q:"投資は投資家自身が判断し、その結果は投資家自身に帰属することを顧客に理解してもらった。",e:"自己責任の原則。レジュメで「必ず覚える」と指定された箇所。投資の最終決定権者は投資家自身。"},
{c:14,s:"セールス業務",n:9,d:"C",a:0,q:"市況が大きく変動していたが、顧客と連絡が付かなかったため、同意を得ることなく当該顧客の計算により売買を行った。",e:"同意を得ることなく顧客の計算により売買を行うことは禁止されている"},
{c:14,s:"セールス業務",n:10,d:"C",a:0,q:"投資者が投資目的や資金量にふさわしくない投資を行おうとしている場合、協会員は、会社での権限や立場、利用可能な比較優位情報を利用しながら投資者に代わってその投資の決定を行う。",e:"あくまで投資の決定を行うのは、その投資者自身"},
{c:14,s:"セールス業務",n:11,d:"C",a:0,q:"投資を最終的に決定するのはあくまで投資者自身であり、市況の変動が大きい場合を除いて外務員が決定することがあってはならない。",e:"市況の変動が大きい場合であっても、投資の最終判断は投資者自身が行うもの"},
{c:14,s:"セールス業務",n:12,d:"C",a:0,q:"目論見書に予想分配率が表示されていない証券投資信託について、過去の分配率から外務員自身が予想した分配率を示し、投資勧誘を行った。",e:"外務員自身が予想した分配率を示して投資勧誘を行ってはならない"},
{c:14,s:"セールス業務",n:13,d:"C",x:1,a:1,q:"顧客に投資信託の仕組みについて十分説明し、理解させたうえで、投資勧誘を行った。",e:"「十分説明し、理解させたうえで」がポイント。説明を尽くしたうえでの勧誘なので○。"},
{c:14,s:"セールス業務",n:14,d:"C",x:1,a:1,q:"外務員は、投資家に投資アドバイスを行う際は、合理的な根拠に基づき十分な説明を行う必要がある。また、投資家の誤解を招かないためにも、その説明内容や使用する資料などは正確でなければならない。",e:"レジュメP324の倫理規範(3)「正確かつ合理的根拠に基づく営業活動」。裏返すと、断定的判断の提供は禁止。"},
{c:14,s:"セールス業務",n:15,d:"C",x:1,a:1,q:"顧客の投資目的、資金量、投資知識等を考慮し、それにあった商品、数量及び頻度の投資勧誘を行った。",e:"適合性の原則。顧客の知識・経験・財産の状況・投資目的に照らして判断する。レジュメの倫理規範(4)に対応。"},
{c:14,s:"セールス業務",n:16,d:"C",x:1,a:1,q:"顧客がその投資目的や資金量にふさわしくない投資を行おうとしたので、考え直すよう適切にアドバイスした。",e:"アドバイスは○、代わりに決定するのは×。問10・問11と対で覚える。"},
{c:14,s:"セールス業務",n:17,d:"C",x:1,a:1,q:"顧客に対し、能動的にコミュニケーションをとって、当該顧客の事情を探ったうえで、顧客の投資ニーズに合うと判断した商品の勧誘を行った。",e:"レジュメP324の倫理規範(4)「投資経験や資産など顧客属性の把握に努めること」の実践例。"},
{c:14,s:"セールス業務",n:18,d:"C",x:1,a:1,q:"外務員が適切な倫理感覚を養うには、顧客の立場に立つことが必要であり、また、第三者の目線を意識することも必要である。",e:"顧客の立場に立つことと、第三者の目線を意識すること。どちらか一方だけと書かれていたら×。"},
{c:14,s:"セールス業務",n:19,d:"B",x:1,a:1,q:"「金融サービス業におけるプリンシプル」とは、法令等個別ルールの基礎にあり、各金融機関等が業務を行う際、また、当局が行政を行うに当たって、尊重すべき主要な行動規範・行動原則と考えられるものである。",e:"レジュメP325。プリンシプル＝金融機関が満たすべき行動規範や目指すべき目的を、抽象的な原則として示したもの。証券界の「あるべき姿」。"},

const BUILT="2026/08/18";
const CHAPTER_TITLES={"12": "経済・金融・財政の常識", "13": "証券市場の基礎知識", "14": "セールス業務", "1": "株式会社法概論", "3": "株式業務①"};
/* ===== 問題データ ここまで ===== */

const KEY="gaimuin-drill-v2", OLD="gaimuin-drill-v1";
let S=load(), filt={ch:[],dif:[],only:"all",type:"all"}, size=10, order="mix", openSet=false, askReset=false;

/* 章と難易度は問題データから自動で作る。章が増えたら勝手に選択肢も増える。
   章の名前は CHAPTER_TITLES（章見出しそのもの）を使う。無ければ、節（q.s）を
   つなげた名前にフォールバックする（節が多い章だと長くなるので最後の手段）。 */
const _titles=(typeof CHAPTER_TITLES!=="undefined")?CHAPTER_TITLES:{};
const CHAPTERS=[...new Set(Q.map(q=>q.c))].sort((a,b)=>a-b).map(c=>({
  c, name:_titles[c]||[...new Set(Q.filter(q=>q.c===c).map(q=>q.s))].join("・"),
  n:Q.filter(q=>q.c===c).length}));
const DIFFS=[...new Set(Q.map(q=>q.d))].sort().map(d=>({
  d, n:Q.filter(q=>q.d===d).length}));
let sess=[],idx=0,hit=0,miss=[],cleared=[],picked=null,run=0,best=0,marks=[],states=[],picks=[];
/* 五肢選択かどうか。o（選択肢）を持っていればそう。 */
function isMC(q){return Array.isArray(q.o)}
function ansText(q){return isMC(q)?q.a.join("・"):(q.a?"○":"×")}
let view="home";
const app=document.getElementById("app");

/* 記録: {seen, wrong, last}。要復習 = last===0。正解すれば外れる。 */
function load(){
  try{
    const cur=JSON.parse(localStorage.getItem(KEY));
    if(cur)return cur;
    const old=JSON.parse(localStorage.getItem(OLD));
    if(old){ /* 旧バージョンの記録から引き継ぐ */
      const m={};
      Object.keys(old).forEach(k=>{const r=old[k];
        m[k]={seen:r.seen||0,wrong:r.wrong||0,last:(r.box>0?1:(r.seen?0:1))}});
      return m;
    }
  }catch(e){}
  return {};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function qid(q){return q.c+"-"+q.n}
function rec(q){return S[qid(q)]}
function todo(q){const r=rec(q);return !!(r&&r.last===0)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function stateOf(q){const r=rec(q);
  if(!r)return{k:"new",t:"はじめて"};
  if(r.last===0)return{k:"todo",t:r.wrong>1?"要復習 "+r.wrong+"回目":"要復習"};
  if(r.wrong>0)return{k:"clear",t:"クリア済み"};
  return{k:"ok",t:"正解ずみ"}}

/* 章・難易度・形式でしぼった範囲。ホームの数字はこれを母数にする。
   「対象」（要復習だけ等）は3つの数字のどれを引くかの指定なので、ここには含めない。
   含めると「要復習だけ」を選んだとき要復習以外が0になり、数字が意味を失う。 */
function scopePool(){return Q.filter(q=>{
  if(filt.ch.length&&filt.ch.indexOf(q.c)<0)return false;
  if(filt.dif.length&&filt.dif.indexOf(q.d)<0)return false;
  if(filt.type==="mc"&&!isMC(q))return false;
  if(filt.type==="ox"&&isMC(q))return false;
  return true;
})}
function pool(){return scopePool().filter(q=>{
  const r=rec(q);
  if(filt.only==="todo"&&!todo(q))return false;
  if(filt.only==="past"&&!(r&&r.wrong>0))return false;
  if(filt.only==="unseen"&&r)return false;
  return true;
})}
/* 範囲・難易度・形式のボタンに出す件数は、他の条件を効かせたうえで数える。
   自分自身の軸（例えば難易度ボタンなら難易度）だけは外す。
   これをしないと「1章に絞ったのに難易度の内訳が全章のまま」になる。 */
function facetPool(exclude){return Q.filter(q=>{
  if(exclude!=="ch"&&filt.ch.length&&filt.ch.indexOf(q.c)<0)return false;
  if(exclude!=="dif"&&filt.dif.length&&filt.dif.indexOf(q.d)<0)return false;
  if(exclude!=="type"){
    if(filt.type==="mc"&&!isMC(q))return false;
    if(filt.type==="ox"&&isMC(q))return false;
  }
  return true;
})}
const TY2={ox:"○×",mc:"五肢選択"};
function scopeLabel(){
  const p=[sumCh()];
  if(filt.dif.length)p.push(sumDif());
  if(filt.type!=="all")p.push(TY2[filt.type]);
  return p.join(" ・ ");
}

function tally(list){let td=0,seen=0,fresh=0,past=0,tries=0,wrongs=0;
  list.forEach(q=>{const r=rec(q);
    if(!r){fresh++;return}
    seen++;tries+=r.seen;wrongs+=r.wrong;
    if(r.wrong>0)past++;
    if(r.last===0)td++});
  return{todo:td,seen,fresh,past,tries,wrongs,total:list.length,
    rate:tries?Math.round((tries-wrongs)/tries*100):null}}

function todoList(){return scopePool().filter(todo)
  .sort((a,b)=>rec(b).wrong-rec(a).wrong||a.c-b.c||a.n-b.n)}
function clearedList(){return scopePool().filter(q=>{const r=rec(q);return r&&r.wrong>0&&r.last===1})
  .sort((a,b)=>rec(b).wrong-rec(a).wrong||a.c-b.c||a.n-b.n)}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const p=pool(), n=Math.min(size,p.length);
  if(!n){view="home";openSet=true;render();return}
  let pick;
  if(order==="rand"){
    pick=shuffle(p.slice()).slice(0,n);
  }else{
    const A=shuffle(p.filter(todo));
    const B=shuffle(p.filter(q=>!rec(q)));
    const C=shuffle(p.filter(q=>{const r=rec(q);return r&&r.last===1&&r.wrong>0}));
    const D=shuffle(p.filter(q=>{const r=rec(q);return r&&r.wrong===0}));
    const cap=Math.max(1,Math.ceil(n*0.6));
    pick=A.slice(0,cap);
    const take=a=>{if(pick.length<n)pick=pick.concat(a.slice(0,n-pick.length))};
    take(B); take(A.slice(cap)); take(C); take(D);
    pick=shuffle(pick);
  }
  sess=pick;states=sess.map(stateOf);
  idx=0;hit=0;miss=[];cleared=[];picked=null;run=0;best=0;marks=[];picks=[];
  view="quiz";render();
}
function answer(v){
  if(picked!==null)return;
  const q=sess[idx],was=states[idx]&&states[idx].k;
  const ok=isMC(q)
    ? (v.length===q.a.length&&v.every(x=>q.a.indexOf(x)>=0))
    : ((v===1)===(q.a===1));
  picked=v;marks[idx]=ok?(was==="todo"?"cl":"ok"):"ng";
  if(ok){hit++;run++;best=Math.max(best,run);if(was==="todo")cleared.push(q)}
  else{miss.push(q);run=0}
  const k=qid(q),r=S[k]||{seen:0,wrong:0,last:1};
  r.seen++;r.last=ok?1:0;if(!ok)r.wrong++;
  S[k]=r;save();render();
}
function next(){picked=null;picks=[];idx++;if(idx>=sess.length)view="done";render()}

function h(str){const t=document.createElement("template");t.innerHTML=str.trim();return t.content.firstElementChild}
/* 画面が変わったときだけ先頭へ。同じ画面の描き直し（条件のタップ、解答の判定）では
   見ている位置をそのまま保つ。 */
let lastScreen=null;
function render(){
  const screen=view==="quiz"?"quiz-"+idx:view;
  const y=window.scrollY;
  app.innerHTML="";
  view==="home"?home():view==="quiz"?quiz():view==="log"?log():result();
  if(screen!==lastScreen)window.scrollTo(0,0);
  else window.scrollTo(0,y);
  lastScreen=screen;
}
function card(q,badge,done){
  const r=rec(q);
  return h(`<div class="item${done?" done":""}">
    <div class="rowtop">
      <span class="tg">${q.c}章 ${q.s} 問${q.n} ・ ${q.d}${isMC(q)?" ・ 五肢選択":""}</span>
      ${badge||(r&&r.wrong?`<span class="cnt">${r.wrong}回まちがえた</span>`:"")}
    </div>
    <p class="qt">${esc(q.q)}</p>
    ${isMC(q)?`<p class="qt" style="color:var(--tx2)">${q.o.map((t,i)=>`${i+1}. ${esc(t)}`).join("　")}</p>`:""}
    <p class="an"><b>正しくは ${ansText(q)}</b>　${q.x?`<span class="sup">補足</span>`:""}${esc(q.e)}</p>
  </div>`)}

const ON={all:"全部から",todo:"要復習だけ",past:"つまずいた問題",unseen:"未着手だけ"};
const TY={all:"",ox:"○×だけ ・ ",mc:"五肢選択だけ ・ "};
function sumCh(){
  if(!filt.ch.length)return "すべての章";
  if(filt.ch.length<=3)return filt.ch.slice().sort((a,b)=>a-b).map(c=>c+"章").join("・");
  return filt.ch.length+"章を選択";
}
function sumDif(){
  if(!filt.dif.length)return "難易度すべて";
  return "難易度 "+filt.dif.slice().sort().join("・");
}

/* ---------- home ---------- */
function home(){
  app.appendChild(h(`<header class="top"><h1>証券外務員問題集</h1><span class="stamp">${Q.length}問</span></header>`));
  const body=h(`<div class="grow"></div>`);
  const sp=scopePool(), t=tally(sp), pc=n=>t.total?n/t.total*100:0;
  body.appendChild(h(`<div class="scope"><span>${scopeLabel()}</span><b>${t.total}問</b></div>`));
  body.appendChild(h(`<div class="tiles">
    <div class="tile bad"><b>${t.todo}</b><span>要復習</span></div>
    <div class="tile good"><b>${t.seen-t.todo}</b><span>解けた</span></div>
    <div class="tile"><b>${t.fresh}</b><span>未着手</span></div>
  </div>`));
  body.appendChild(h(`<div class="track" role="img" aria-label="要復習${t.todo}問、解けた${t.seen-t.todo}問、未着手${t.fresh}問">
    <i class="g1" style="width:${pc(t.seen-t.todo)}%"></i><i class="g2" style="width:${pc(t.todo)}%"></i></div>`));
  body.appendChild(h(`<div class="note"><span>${t.past?"苦手 "+t.past+"問":"苦手 なし"}</span>
    <span>${t.rate!==null?"この範囲で "+t.tries+"回 ・ 正答率 "+t.rate+"％":"まだ解いていません"}</span></div>`));

  const p=pool();
  const bar=h(`<button class="setbar" type="button" aria-expanded="${openSet}">
    <span class="cur"><em>出題する条件</em>${TY[filt.type]||""}${sumCh()} ・ ${sumDif()} ・ ${ON[filt.only]} ・ ${size===999?"全部":size+"問"}</span>
    <span class="arw">${openSet?"閉じる":"変える"}</span></button>`);
  bar.addEventListener("click",()=>{openSet=!openSet;render()});
  body.appendChild(bar);

  if(openSet){
    const panel=h(`<div class="panel"></div>`);
    const grp=(label,key,opts)=>{
      const g=h(`<div class="grp"><span>${label}</span><div class="opts"></div></div>`);
      const box=g.querySelector(".opts");
      opts.forEach(([v,txt,dis])=>{
        const b=h(`<button class="opt" type="button" aria-pressed="${filt[key]===v}" ${dis?"disabled":""}>${txt}</button>`);
        if(!dis)b.addEventListener("click",()=>{filt[key]=v;render()});
        box.appendChild(b);
      });
      return g;
    };
    /* 複数選べる。なにも選ばなければ「すべて」 */
    const multi=(label,key,hint,opts)=>{
      const g=h(`<div class="grp"><span>${label}<i>${hint}</i></span><div class="opts"></div></div>`);
      const box=g.querySelector(".opts");
      const all=h(`<button class="opt" type="button" aria-pressed="${!filt[key].length}">すべて</button>`);
      all.addEventListener("click",()=>{filt[key]=[];render()});
      box.appendChild(all);
      opts.forEach(([v,txt,cnt])=>{
        const on=filt[key].indexOf(v)>=0;
        const b=h(`<button class="opt" type="button" aria-pressed="${on}">${txt}<i>${cnt}</i></button>`);
        b.addEventListener("click",()=>{
          const i=filt[key].indexOf(v);
          if(i>=0)filt[key].splice(i,1);else filt[key].push(v);
          render();
        });
        box.appendChild(b);
      });
      return g;
    };
    const chPool=facetPool("ch"), difPool=facetPool("dif"), typePool=facetPool("type");
    panel.appendChild(multi("範囲","ch","複数えらべます",
      CHAPTERS.map(x=>[x.c,`${x.c}章 ${x.name}`,chPool.filter(q=>q.c===x.c).length])));
    panel.appendChild(multi("難易度","dif","複数えらべます",
      DIFFS.map(x=>[x.d,x.d,difPool.filter(q=>q.d===x.d).length])));
    if(Q.some(isMC)){
      const nMC=typePool.filter(isMC).length, nOX=typePool.length-nMC;
      panel.appendChild(grp("形式","type",[
        ["all","すべて"],["ox",`○× ${nOX}`],["mc",`五肢選択 ${nMC}`]]));
    }
    panel.appendChild(grp("対象","only",[
      ["all","全部"],["todo",`要復習${t.todo?" "+t.todo:""}`,!t.todo],
      ["past",`つまずいた${t.past?" "+t.past:""}`,!t.past],["unseen","未着手",!t.fresh]]));
    const og=h(`<div class="grp"><span>出題順</span><div class="opts"></div></div>`);
    [["mix","要復習を優先"],["rand","完全ランダム"]].forEach(([v,txt])=>{
      const b=h(`<button class="opt" type="button" aria-pressed="${order===v}">${txt}</button>`);
      b.addEventListener("click",()=>{order=v;render()});
      og.querySelector(".opts").appendChild(b);
    });
    panel.appendChild(og);
    const sg=h(`<div class="grp"><span>出題数</span><div class="opts"></div></div>`);
    [10,20,50,999].forEach(v=>{
      const b=h(`<button class="opt" type="button" aria-pressed="${size===v}">${v===999?"全部":v+"問"}</button>`);
      b.addEventListener("click",()=>{size=v;render()});
      sg.querySelector(".opts").appendChild(b);
    });
    panel.appendChild(sg);
    body.appendChild(panel);
  }
  app.appendChild(body);

  const dock=h(`<div class="dock"></div>`);
  const go=h(`<button class="cta" type="button" ${p.length?"":"disabled"}>${p.length?Math.min(size,p.length)+"問 はじめる":"該当する問題がありません"}</button>`);
  go.addEventListener("click",start);
  dock.appendChild(go);
  const lg=h(`<button class="ghost" type="button" ${t.todo||t.past?"":"disabled"}>復習リスト${t.todo?"（要復習 "+t.todo+"問）":""}</button>`);
  if(t.todo||t.past)lg.addEventListener("click",()=>{view="log";render()});
  dock.appendChild(lg);
  if(askReset){
    const g=tally(Q);  /* 消えるのは全範囲なので、絞り込みに関係なく全体の数字を出す */
    const dg=h(`<div class="danger">
      <p>いままでの記録を<b>すべて</b>消します。絞り込みに関係なく全範囲が対象です。<br>
      要復習 ${g.todo}問、つまずいた記録 ${g.past}問、${g.tries}回ぶんの解答履歴が消えて、最初の状態に戻ります。</p>
      <div class="row"></div></div>`);
    const yes=h(`<button class="yes" type="button">消す</button>`);
    yes.addEventListener("click",()=>{S={};save();askReset=false;render()});
    const no=h(`<button class="no" type="button">やめる</button>`);
    no.addEventListener("click",()=>{askReset=false;render()});
    dg.querySelector(".row").appendChild(yes);dg.querySelector(".row").appendChild(no);
    dock.appendChild(dg);
  }else{
    const tip=h(`<div class="tip"><span>間違えた問題は要復習に入り、次に正解すると外れます。<br>
      <em>${Q.length}問 ・ ${typeof BUILT!=="undefined"?BUILT:""} 更新</em></span></div>`);
    const rs=h(`<button class="linky" type="button" ${t.seen?"":"disabled"}>記録を消す</button>`);
    if(t.seen)rs.addEventListener("click",()=>{askReset=true;render()});
    tip.appendChild(rs);
    dock.appendChild(tip);
  }
  app.appendChild(dock);
}

/* ---------- 復習リスト ---------- */
function log(){
  const td=todoList(),cl=clearedList();
  app.appendChild(h(`<header class="top"><h1>復習リスト</h1><span class="stamp">要復習 ${td.length}問</span></header>`));
  const body=h(`<div class="grow"></div>`);
  body.appendChild(h(`<div class="scope"><span>${scopeLabel()}</span><b>${scopePool().length}問から</b></div>`));
  if(td.length){
    const box=h(`<div class="list"><h2>要復習 ${td.length}問 ・ 次に正解すれば外れます</h2></div>`);
    td.forEach(q=>box.appendChild(card(q)));
    body.appendChild(box);
  }else{
    body.appendChild(h(`<p class="empty">要復習はゼロ。いま解けない問題はありません。</p>`));
  }
  if(cl.length){
    const box=h(`<div class="list"><h2 class="win">クリア済み ${cl.length}問 ・ つまずいて解き直した</h2></div>`);
    cl.forEach(q=>box.appendChild(card(q,`<span class="done-badge">クリア</span>`,true)));
    body.appendChild(box);
  }
  app.appendChild(body);

  const dock=h(`<div class="dock"></div>`);
  if(td.length){
    const go=h(`<button class="cta" type="button">要復習の${td.length}問を解く</button>`);
    go.addEventListener("click",()=>{filt={ch:[],dif:[],only:"todo",type:"all"};size=999;order="mix";start()});
    dock.appendChild(go);
  }
  const back=h(`<button class="ghost" type="button">戻る</button>`);
  back.addEventListener("click",()=>{view="home";render()});
  dock.appendChild(back);
  app.appendChild(dock);
}

/* ---------- quiz ---------- */
function quiz(){
  const q=sess[idx],st=states[idx]||{k:"new",t:"はじめて"};
  const head=h(`<header class="top"><h1>${idx+1} / ${sess.length}</h1></header>`);
  const quit=h(`<button class="quit" type="button">やめる</button>`);
  quit.addEventListener("click",()=>{view="home";picked=null;render()});
  head.appendChild(quit);
  app.appendChild(head);

  const segs=h(`<div class="segs"></div>`);
  for(let i=0;i<sess.length;i++)segs.appendChild(h(`<i class="${marks[i]||(i===idx?"at":"")}"></i>`));
  app.appendChild(segs);

  const tags=h(`<div class="tags"></div>`);
  tags.appendChild(h(`<span class="tg">${q.c}章 ${q.s} 問${q.n}</span>`));
  tags.appendChild(h(`<span class="tg">難易度 ${q.d}</span>`));
  if(isMC(q))tags.appendChild(h(`<span class="tg good">五肢選択</span>`));
  if(st.k==="todo")tags.appendChild(h(`<span class="tg hot">${st.t}</span>`));
  else if(st.k==="clear")tags.appendChild(h(`<span class="tg good">クリア済み</span>`));
  if(run>=3)tags.appendChild(h(`<span class="tg run">連続 ${run}</span>`));
  app.appendChild(tags);

  const body=h(`<div class="grow"></div>`);
  body.appendChild(h(`<div class="qcard">${esc(q.q)}</div>`));

  if(isMC(q)){
    const need=q.a.length;
    const list=h(`<div class="opts5"></div>`);
    q.o.forEach((txt,i)=>{
      const no=i+1, on=picks.indexOf(no)>=0;
      let cls="op", mk="";
      if(picked!==null){
        const right=q.a.indexOf(no)>=0, chose=picked.indexOf(no)>=0;
        if(right){cls+=" hit";mk=`<span class="mk">正</span>`}
        else if(chose){cls+=" miss";mk=`<span class="mk">誤</span>`}
      }
      const b=h(`<button class="${cls}" type="button" aria-pressed="${on}"${picked!==null?" disabled":""}><span class="no">${no}</span><span>${esc(txt)}</span>${mk}</button>`);
      if(picked===null)b.addEventListener("click",()=>{
        const k=picks.indexOf(no);
        if(k>=0)picks.splice(k,1);else picks.push(no);
        render();
      });
      list.appendChild(b);
    });
    body.appendChild(list);
    if(picked===null)body.appendChild(h(`<div class="pickinfo"><span>${need}つ選んでください</span><span>選択中 <b>${picks.length}</b> / ${need}</span></div>`));
  }
  app.appendChild(body);

  const dock=h(`<div class="dock"></div>`);
  if(picked===null){
    if(isMC(q)){
      const need=q.a.length, ready=picks.length===need;
      const go=h(`<button class="cta" type="button"${ready?"":" disabled"}>${ready?"決定":"あと"+(need-picks.length)+"つ選ぶ"}</button>`);
      if(ready)go.addEventListener("click",()=>answer(picks.slice().sort((a,b)=>a-b)));
      dock.appendChild(go);
    }else{
      const m=h(`<div class="btns"></div>`);
      [[1,"○","正しい"],[0,"×","誤り"]].forEach(([v,g,l])=>{
        const b=h(`<button class="b" type="button" aria-label="${l}"><span class="g">${g}</span><span class="l">${l}</span></button>`);
        b.addEventListener("click",()=>answer(v));
        m.appendChild(b);
      });
      dock.appendChild(m);
    }
  }else{
    const ok=isMC(q)
      ? (picked.length===q.a.length&&picked.every(x=>q.a.indexOf(x)>=0))
      : ((picked===1)===(q.a===1));
    const win=ok&&st.k==="todo";
    const said=win?"クリア！":ok?"正解":"不正解";
    const mine=isMC(q)?(picked.length?picked.join("・"):"なし"):(picked?"○":"×");
    const sub=win?"要復習から外しました　残り "+tally(Q).todo+"問"
      :ok?`答えは ${ansText(q)}`
      :`あなたの答え ${mine} ／ 正しくは ${ansText(q)} ・ 要復習に入れました`;
    dock.appendChild(h(`<div class="fb ${ok?"ok":"ng"}${win?" win":""}">
      <div class="head"><span class="glyph">${ok?"○":"×"}</span>
        <span><span class="said">${said}</span><span class="truth">${sub}</span></span></div>
      <p class="exp">${q.x?`<span class="sup">補足</span>`:""}${esc(q.e)}</p>
    </div>`));
    const c=h(`<button class="cta${win?"":" plain"}" type="button">${idx+1<sess.length?"つづける":"結果を見る"}</button>`);
    c.addEventListener("click",next);
    dock.appendChild(c);
  }
  app.appendChild(dock);
}

/* ---------- result ---------- */
function result(){
  const pct=Math.round(hit/sess.length*100);
  app.appendChild(h(`<header class="top"><h1>結果</h1><span class="stamp">${sess.length}問</span></header>`));
  const body=h(`<div class="grow"></div>`);
  body.appendChild(h(`<div class="score"><b>${hit}<i> / ${sess.length}</i></b>
    <span>正答率 ${pct}％ ・ 最大連続 ${best}問</span></div>`));

  if(cleared.length){
    const box=h(`<div class="list"><h2 class="win">クリア ${cleared.length}問 ・ 要復習から外れました</h2></div>`);
    cleared.forEach(q=>box.appendChild(card(q,`<span class="done-badge">クリア</span>`,true)));
    body.appendChild(box);
  }
  if(miss.length){
    const box=h(`<div class="list"><h2>要復習に入れた ${miss.length}問</h2></div>`);
    miss.forEach(q=>box.appendChild(card(q)));
    body.appendChild(box);
  }
  if(!cleared.length&&!miss.length)body.appendChild(h(`<p class="empty">全問正解。要復習はそのままです。</p>`));
  app.appendChild(body);

  const dock=h(`<div class="dock"></div>`);
  const t=tally(Q);
  dock.appendChild(h(`<div class="note"><span>要復習 ${t.todo}問</span><span>通算正答率 ${t.rate}％</span></div>`));
  const pair=h(`<div class="pair"></div>`);
  const again=h(`<button class="cta" type="button">もう一度</button>`);
  again.addEventListener("click",start);
  const back=h(`<button class="ghost" type="button">ホームへ</button>`);
  back.addEventListener("click",()=>{view="home";render()});
  pair.appendChild(again);pair.appendChild(back);
  dock.appendChild(pair);
  app.appendChild(dock);
}

render();
</script>
</body>
</html>
